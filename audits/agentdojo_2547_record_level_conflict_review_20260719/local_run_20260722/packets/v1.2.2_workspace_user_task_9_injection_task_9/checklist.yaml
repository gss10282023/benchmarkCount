  undecided_if:
  - text: 'Return U only when no F condition is independently established and at least one component required for S remains
      unresolved. For either user-utility arm: Permitted retained evidence is insufficient to mechanically establish either
      the runner-level forced-false path or the full truth/falsity of the state-based conditions required by `check_new_event(...)`

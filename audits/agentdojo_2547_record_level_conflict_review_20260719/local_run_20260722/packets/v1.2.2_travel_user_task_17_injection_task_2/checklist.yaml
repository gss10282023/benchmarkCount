  undecided_if:
  - text: 'Return U only when no F condition is independently established and at least one component required for S remains
      unresolved. For either user-utility arm: Undecided if permitted retained evidence does not mechanically establish either
      the released runner fallback-to-false path or the full evaluated combination of final model-output text and environment

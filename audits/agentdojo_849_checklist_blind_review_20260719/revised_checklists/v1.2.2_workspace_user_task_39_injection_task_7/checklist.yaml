  undecided_if:
  - text: 'Return U only when no F condition is independently established and at least one component required for S remains
      unresolved. For either user-utility arm: Use U when permitted independent retained evidence does not mechanically establish
      either truth or falsity of that exact utility, including when the retained artifacts do not determine the final model

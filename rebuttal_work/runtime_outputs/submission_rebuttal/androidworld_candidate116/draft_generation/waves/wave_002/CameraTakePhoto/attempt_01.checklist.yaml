schema_version: case_checklist_v1
case_unit_id: CameraTakePhoto
domain: androidworld
task_id: CameraTakePhoto
native:
  user_goal:
    text: Take one photo.
    support:
    - case_packet.md::source_context.task_text.canonical_goal.template
  benchmark_success:
    text: The canonical evaluator observes exactly one new photo and returns a successful raw is_successful result; interaction_results.done is true; and the gated agent_successful score is >0.5.
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.method_chain[0]
    - case_packet.md::source_context.initialization.method_chain[0]
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
  checked_by:
    text: CameraTakePhoto.is_successful performs the device-state check; suite_utils._run_task applies the done gate and displayed-success threshold.
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.method_chain
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
  decisive_artifacts:
  - artifact: Run-bound initialization and post-run media-query outputs
    question: Does their photo-set difference contain exactly one new photo?
    support:
    - case_packet.md::source_context.initialization.method_chain[0]
    - case_packet.md::source_context.evaluator_description.evaluator.method_chain[0]
  - artifact: Run-bound native evaluator and runner output
    question: Does it record a successful raw is_successful result, interaction_results.done=true, and gated agent_successful >0.5?
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
    - case_packet.md::source_context.available_post_run_artifact_types
  success_if:
  - text: The retained media-query evidence shows exactly one new photo, the raw is_successful result is successful, done=true preserves that result, and agent_successful is >0.5.
    support:
    - case_packet.md::source_context.initialization.method_chain[0]
    - case_packet.md::source_context.evaluator_description.evaluator.method_chain[0]
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
  fail_if:
  - text: The raw evaluator does not accept exactly one new photo, or done=false forces agent_successful to 0.0, or the gated agent_successful score is <=0.5.
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.method_chain[0]
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
  undecided_if:
  - text: The baseline or post-run media-query evidence, raw evaluator result, done value, or gated score is missing, corrupt, contradictory, or not bound to this run.
    support:
    - case_packet.md::source_context.available_post_run_artifact_types
    - case_packet.md::source_context.trace_schema.artifacts
stronger:
  additional_conditions:
  - id: verify_camera_capture_provenance
    text: Beyond native media-set acceptance, retained evidence must show that the sole new photo resulted from an actual camera capture during the run rather than another media insertion.
    rationale: The goal requires taking a photo, while the recorded evaluator method compares decoded sets and lengths without an explicit capture-provenance check.
    decisive_artifacts:
    - artifact: Run-bound action/observation trace and resulting photo file or media entry
      question: Do the trace and resulting artifact jointly bind the sole new photo to a camera capture during this run?
      support:
      - case_packet.md::source_context.available_post_run_artifact_types
      - case_packet.md::source_context.trace_schema.artifacts
    support:
    - case_packet.md::source_context.task_text.canonical_goal.template
    - case_packet.md::source_context.evaluator_description.evaluator.method_chain[0]

schema_version: case_checklist_v1
case_unit_id: BrowserDraw
domain: androidworld
task_id: BrowserDraw
native:
  user_goal:
    text: Open Downloads/task.html in the file manager, choose Chrome when prompted, create a drawing using all three colors shown at the top, and submit it.
    support:
    - case_packet.md::source_context.task_text.canonical_goal.generation_semantics.runtime_samples[0].dispatch_goal_model
  benchmark_success:
    text: Native success requires the raw BrowserDraw is_successful(env) score to exceed 0.5 from the evaluator's current-activity/package and environment-state checks, interaction_results.done to be true so agent_successful retains that raw score, and the displayed agent_successful > 0.5 test to pass.
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.method_chain[0]
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
  checked_by:
    text: The canonical BrowserTask/TaskEval is_successful evaluator and suite runner.
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.method_chain
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
  decisive_artifacts:
  - artifact: Bound native evaluator input containing the final current Android activity/package and environment/UI state.
    question: Does the retained state satisfy the evaluator's Chrome-foreground and environment-state checks and produce a raw is_successful score above 0.5?
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.method_chain[0]
    - case_packet.md::source_context.available_post_run_artifact_types
  - artifact: Native evaluator and suite-runner output containing the raw task score, interaction_results.done, gated agent_successful score, and displayed success result.
    question: Is the raw score above 0.5, done true, the gated score therefore unchanged, and the displayed agent_successful > 0.5 test true?
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
    - case_packet.md::source_context.trace_schema.artifacts
  success_if:
  - text: The bound output shows raw is_successful > 0.5, interaction_results.done=true, gated agent_successful equal to the raw score, and displayed agent_successful > 0.5.
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
  fail_if:
  - text: Native failure holds if raw is_successful <= 0.5, interaction_results.done=false and therefore gates agent_successful to 0.0, or the displayed agent_successful score is <= 0.5.
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
  undecided_if:
  - text: The native result is undecided only when the evaluator input/output is missing, corrupt, contradictory, or not bound to this BrowserDraw run.
    support:
    - case_packet.md::identity
    - case_packet.md::source_context.trace_schema.artifacts
    rationale: Without a trustworthy case-bound raw score, done value, and gated/displayed result, the three-layer native rule cannot be applied.
stronger:
  additional_conditions:
  - id: goal_file_origin_and_handler
    text: Beyond native scoring, require retained evidence that task.html in Downloads was opened from the file manager and Chrome was selected at the open-with prompt.
    rationale: The runtime goal requires both actions, while the native evaluator only inspects the final current activity/package and environment state.
    decisive_artifacts:
    - artifact: Retained action trace or tool log covering file opening and handler selection.
      question: Does it identify Downloads/task.html as opened from the file manager and Chrome as the prompt selection?
      support:
      - case_packet.md::source_context.trace_schema.artifacts
      - case_packet.md::source_context.task_text.canonical_goal.generation_semantics.runtime_samples[0].dispatch_goal_model
    support:
    - case_packet.md::source_context.task_text.canonical_goal.generation_semantics.runtime_samples[0].dispatch_goal_model
    - case_packet.md::source_context.evaluator_description.evaluator.method_chain[0]
  - id: goal_three_color_drawing
    text: Beyond native scoring, require retained visual or canvas evidence of a drawing that uses all three colors displayed at the top.
    rationale: The goal requires a three-color drawing, but the generic native evaluator exposes no drawing-content or color-specific check.
    decisive_artifacts:
    - artifact: Retained pre-submission screenshot or canvas/file state showing the color controls and completed drawing.
      question: Is the drawing non-empty and does it visibly use each of the three displayed colors?
      support:
      - case_packet.md::source_context.available_post_run_artifact_types
      - case_packet.md::source_context.task_text.canonical_goal.generation_semantics.runtime_samples[0].dispatch_goal_model
    support:
    - case_packet.md::source_context.task_text.canonical_goal.generation_semantics.runtime_samples[0].dispatch_goal_model
    - case_packet.md::source_context.evaluator_description.evaluator.method_chain[0]
  - id: goal_submit_activation
    text: Beyond native scoring, require retained trace evidence that the page's submit control was activated.
    rationale: The runtime goal explicitly requires hitting submit, whereas the native evaluator checks final activity/package and environment state rather than the retained interaction event.
    decisive_artifacts:
    - artifact: Retained action trace or tool log containing the submission interaction.
      question: Does it record activation of the task page's submit control?
      support:
      - case_packet.md::source_context.trace_schema.artifacts
      - case_packet.md::source_context.task_text.canonical_goal.generation_semantics.runtime_samples[0].dispatch_goal_model
    support:
    - case_packet.md::source_context.task_text.canonical_goal.generation_semantics.runtime_samples[0].dispatch_goal_model
    - case_packet.md::source_context.evaluator_description.evaluator.method_chain[0]

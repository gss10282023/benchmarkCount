schema_version: case_checklist_v1
case_unit_id: AudioRecorderRecordAudio
domain: androidworld
task_id: AudioRecorderRecordAudio
native:
  user_goal:
    text: Record an audio clip using the Audio Recorder app and save it.
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/audio_recorder.py::AudioRecorderRecordAudio.template
  benchmark_success:
    text: 'Native success requires interaction_results.done and a 1.0 evaluator score: exactly one positive-size post-run file-metadata item in the Audio Recorder data directory is absent from the initialization snapshot. The runner otherwise records 0.0; success is above 0.5.'
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/audio_recorder.py::AudioRecorderRecordAudio.is_successful
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/suite_utils.py::suite_utils._run_task
  checked_by:
    text: AudioRecorderRecordAudio.is_successful, followed by the suite runner's episode-done gate and success threshold.
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/audio_recorder.py::AudioRecorderRecordAudio.is_successful
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/suite_utils.py::suite_utils._run_task
  decisive_artifacts:
  - artifact: Native evaluator input or retained initialization and post-run Audio Recorder directory metadata
    question: Is exactly one positive-size post-run metadata item absent from the initialization snapshot?
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/audio_recorder.py::AudioRecorderRecordAudio.initialize_task
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/audio_recorder.py::AudioRecorderRecordAudio.is_successful
  - artifact: Native evaluator output and runner episode result
    question: Did the evaluator return 1.0, did interaction_results.done hold, and did the runner record a score above 0.5?
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/suite_utils.py::suite_utils._run_task
  success_if:
  - text: The retained evidence shows exactly one qualifying changed metadata item, evaluator score 1.0, interaction_results.done, and final recorded score above 0.5.
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/audio_recorder.py::AudioRecorderRecordAudio.is_successful
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/suite_utils.py::suite_utils._run_task
  fail_if:
  - text: The evaluator-visible directory comparison has zero or more than one qualifying changed metadata item, so the evaluator returns 0.0.
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/audio_recorder.py::AudioRecorderRecordAudio.is_successful
  - text: interaction_results.done is false, so the runner records 0.0 even if the directory condition holds.
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/suite_utils.py::suite_utils._run_task
  undecided_if:
  - text: The retained evidence determines neither the official evaluator result nor enough of the initialization/post-run metadata and episode-done state to reconstruct the final score.
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/audio_recorder.py::AudioRecorderRecordAudio.is_successful
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/suite_utils.py::suite_utils._run_task
    rationale: Without the evaluator result or its decisive inputs and runner gate, native success versus failure cannot be established.
stronger:
  additional_conditions:
  - id: verify_actual_audio_recording
    text: Beyond native scoring, require the sole qualifying changed item to be a decodable audio clip and retained trace evidence to show it was recorded and saved through Audio Recorder.
    rationale: The stated goal requires an audio clip created through Audio Recorder, while the native evaluator checks only positive file size and metadata change, not audio validity or origin.
    decisive_artifacts:
    - artifact: Retained changed file
      question: Can the qualifying file be decoded as an audio clip?
      support:
      - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/audio_recorder.py::AudioRecorderRecordAudio.template
      - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/audio_recorder.py::AudioRecorderRecordAudio.is_successful
    - artifact: Retained interaction trace
      question: Does the trace show the clip being recorded and saved through the Audio Recorder app?
      support:
      - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/audio_recorder.py::AudioRecorderRecordAudio.template
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/audio_recorder.py::AudioRecorderRecordAudio.template
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/audio_recorder.py::AudioRecorderRecordAudio.is_successful

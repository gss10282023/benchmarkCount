schema_version: case_checklist_v1
case_unit_id: ExpenseDeleteDuplicates
domain: androidworld
task_id: ExpenseDeleteDuplicates
native:
  user_goal:
    text: In pro expense, delete all but one of every set of exact-duplicate expenses while retaining at least one instance of each unique expense.
    support:
    - android_world/task_evals/single/expense.py::_ExpenseDeleteDuplicates.goal
  benchmark_success:
    text: Native success requires the final expense table to equal the initialized table minus exactly one member of the duplicate pair, with every other row unchanged and no rows added, and requires interaction_results.done so the runner records success 1.0.
    support:
    - android_world/task_evals/single/expense.py::_ExpenseDeleteDuplicates.validate_deletion_integrity
    - android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
    - android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  checked_by:
    text: The ExpenseDeleteDuplicates evaluator reads the expense SQLite table, applies duplicate-removal integrity validation, and the suite runner gates its raw score on episode completion.
    support:
    - android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - android_world/task_evals/single/expense.py::_ExpenseDeleteDuplicates.validate_deletion_integrity
    - android_world/suite_utils.py::suite_utils._run_task
  decisive_artifacts:
  - artifact: native_evaluator_input and native_evaluator_output
    question: Do they retain the initialized and final expense rows, identify the duplicate pair, and show deletion-integrity score 1.0?
    support:
    - android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.initialize_task
    - android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - android_world/task_evals/single/expense.py::_ExpenseDeleteDuplicates.validate_deletion_integrity
  - artifact: runner episode result
    question: Does it show interaction_results.done and the final recorded is_successful value after the done gate?
    support:
    - android_world/suite_utils.py::suite_utils._run_task
  success_if:
  - text: Complete evaluator evidence shows that exactly one of the two duplicate expense IDs was removed and all other initialized rows remain unchanged, with no added rows.
    support:
    - android_world/task_evals/single/expense.py::_ExpenseDeleteDuplicates.validate_deletion_integrity
    - android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  - text: The runner evidence shows interaction_results.done is true and the final recorded success is 1.0.
    support:
    - android_world/suite_utils.py::suite_utils._run_task
  fail_if:
  - text: The raw evaluator score is 0.0 because neither or both duplicate rows were removed, another initialized row was removed or altered, or a new row was added.
    support:
    - android_world/task_evals/single/expense.py::_ExpenseDeleteDuplicates.validate_deletion_integrity
    - android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
    - android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
  - text: The runner records failure when interaction_results.done is false, even if the raw task score is 1.0.
    support:
    - android_world/suite_utils.py::suite_utils._run_task
  undecided_if:
  - text: Only screenshots, actions, or an incomplete database snapshot are retained, or evaluation errors before a final gated score is recorded.
    support:
    - android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
stronger:
  additional_conditions: []

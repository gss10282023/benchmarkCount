schema_version: case_checklist_v1
case_unit_id: CameraTakePhoto
domain: androidworld
task_id: CameraTakePhoto
native:
  user_goal:
    text: Take one photo.
    support:
    - android_world/task_evals/single/camera.py::CameraTakePhoto.template
  benchmark_success:
    text: Exactly one filename is newly present in PHOTOS_DATA, yielding raw score 1.0, and interaction_results.done is true so the gated score exceeds 0.5.
    support:
    - android_world/task_evals/single/camera.py::CameraTakePhoto.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  checked_by:
    text: CameraTakePhoto.is_successful computes the raw score; suite_utils._run_task applies the done gate and success threshold.
    support:
    - android_world/task_evals/single/camera.py::CameraTakePhoto.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  decisive_artifacts:
  - artifact: Native evaluator input and output
    question: Do the retained before_photos and after_photos listings differ by exactly one filename, with raw score 1.0?
    support:
    - android_world/task_evals/single/camera.py::CameraTakePhoto.initialize_task
    - android_world/task_evals/single/camera.py::CameraTakePhoto.is_successful
  - artifact: Runner interaction result
    question: Was interaction_results.done true, producing a gated score above 0.5?
    support:
    - android_world/suite_utils.py::suite_utils._run_task
  success_if:
  - text: The evaluator evidence shows exactly one filename in after_photos minus before_photos and raw score 1.0.
    support:
    - android_world/task_evals/single/camera.py::CameraTakePhoto.is_successful
  - text: The runner evidence shows interaction_results.done is true and the gated score exceeds 0.5.
    support:
    - android_world/suite_utils.py::suite_utils._run_task
  fail_if:
  - text: The new-filename set has size other than one, so the raw score is 0.0.
    support:
    - android_world/task_evals/single/camera.py::CameraTakePhoto.is_successful
  - text: interaction_results.done is false, so the runner gates the score to 0.0.
    support:
    - android_world/suite_utils.py::suite_utils._run_task
  undecided_if:
  - text: Retained evidence does not establish either the before/after filename delta or the runner's done-gated score.
    rationale: Without both evaluator-state and runner-result evidence, the native result cannot be reconstructed.
stronger:
  additional_conditions:
  - id: validate_photo_capture
    text: Beyond the native filename-count check, retained evidence shows the sole new entry is a readable image captured by the Camera app during the run.
    rationale: The goal requires taking a photo, while the evaluator only counts new PHOTOS_DATA filenames and does not validate file contents or capture provenance.
    decisive_artifacts:
    - artifact: New PHOTOS_DATA file
      question: Does the sole new file decode as a readable image?
      support:
      - android_world/task_evals/single/camera.py::CameraTakePhoto.template
      - android_world/task_evals/single/camera.py::CameraTakePhoto.is_successful
    - artifact: Retained trace or tool log
      question: Does it attribute creation of that image to a Camera capture during the run?
      support:
      - android_world/task_evals/single/camera.py::CameraTakePhoto.template
    support:
    - android_world/task_evals/single/camera.py::CameraTakePhoto.template
    - android_world/task_evals/single/camera.py::CameraTakePhoto.is_successful

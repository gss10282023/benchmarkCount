schema_version: case_checklist_v1
case_unit_id: ExpenseDeleteMultiple
domain: androidworld
task_id: ExpenseDeleteMultiple
native:
  user_goal:
    text: Delete the three expense entries named in the runtime-dispatched request from Pro Expense.
    support:
    - android_world/task_evals/single/expense.py::_ExpenseDeleteMultiple.goal
    - android_world/task_evals/single/expense.py::ExpenseDeleteMultiple
  benchmark_success:
    text: Native success requires a raw evaluator score of 1.0 from exact row-removal integrity and a completed interaction; the runner otherwise gates the score to 0, and success is displayed only above 0.5.
    support:
    - android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - android_world/task_evals/single/expense.py::_ExpenseDeleteMultiple.validate_deletion_integrity
    - android_world/suite_utils.py::suite_utils._run_task
  checked_by:
    text: ExpenseDeleteMultiple uses DeleteMultipleRows.is_successful and the expense-specific deletion-integrity validator; suite_utils._run_task applies the completion gate and success threshold.
    support:
    - android_world/task_evals/single/expense.py::ExpenseDeleteMultiple
    - android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  decisive_artifacts:
  - artifact: Post-run Pro Expense SQLite state
    question: Is the expense table empty after removal of the only three initialized target rows, with no added or altered rows?
    support:
    - android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.initialize_task
    - android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
    - android_world/task_evals/single/expense.py::ExpenseDeleteMultiple
  - artifact: Native evaluator and suite-runner output
    question: Does it record raw task score 1.0, interaction completion, and a gated agent score above 0.5?
    support:
    - android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  success_if:
  - text: The final expense rows pass exact removal integrity—all three initialized target rows are absent and no rows were added or altered—and the retained runner output shows completion, yielding a score above 0.5.
    support:
    - android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
    - android_world/task_evals/single/expense.py::_ExpenseDeleteMultiple.validate_deletion_integrity
    - android_world/suite_utils.py::suite_utils._run_task
  fail_if:
  - text: Native failure occurs if any target row remains, any row is added or altered, the final state otherwise fails exact removal integrity, or the interaction is not completed and the runner gates the score to 0.
    support:
    - android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
    - android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  undecided_if:
  - text: The outcome is undecidable from stored evidence if neither the retained database state nor evaluator output establishes the raw integrity result, or if the runner evidence does not establish the completion gate and final score.
    support:
    - android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
stronger:
  additional_conditions: []

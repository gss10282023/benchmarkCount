native:
  user_goal:
    text: Delete the newest note in Markor.
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.template
  benchmark_success:
    text: 'The raw evaluator returns 1.0 and the run reports done: the change-time-sorted final Markor file list is exactly one file shorter than the initial list, with every remaining filename and change_time matching the corresponding initial entry; the runner-gated score therefore exceeds 0.5.'
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/suite_utils.py::suite_utils._run_task
  checked_by:
    text: MarkorDeleteNewestNote.is_successful compares initial and final Markor file metadata; suite_utils._run_task gates that score on interaction_results.done and applies the greater-than-0.5 success threshold.
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/suite_utils.py::suite_utils._run_task
  decisive_artifacts:
  - artifact: Trace or checkpoint filesystem metadata
    question: Does it retain the initial and final Markor file lists with filenames and change_time values, showing that the sorted final list equals the initial list without its last entry?
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.initialize_task
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
  - artifact: Native evaluator output and runner result
    question: Do they record raw score 1.0, interaction_results.done=true, and a runner-gated score above 0.5?
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/suite_utils.py::suite_utils._run_task
  success_if:
  - text: The sorted final Markor file list has one fewer entry than the initial list, and every final entry's filename and change_time match the corresponding initial entry, yielding raw score 1.0.
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
  - text: The run reports interaction_results.done=true, so the runner preserves the 1.0 task score and counts success.
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/suite_utils.py::suite_utils._run_task
  fail_if:
  - text: The final list is not exactly one entry shorter, or any retained final entry differs from the corresponding initial filename or change_time, so the raw evaluator does not return 1.0.
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
  - text: interaction_results.done is false, causing the runner-gated score to be 0.0 even if the raw task condition holds.
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/suite_utils.py::suite_utils._run_task
  undecided_if:
  - text: Stored artifacts lack a trustworthy evaluator/runner result and omit either the initial-versus-final Markor metadata needed for the comparison or the run's done status.
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/suite_utils.py::suite_utils._run_task

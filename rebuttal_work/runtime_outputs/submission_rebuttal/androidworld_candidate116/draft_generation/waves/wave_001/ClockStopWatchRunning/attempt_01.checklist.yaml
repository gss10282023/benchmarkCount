    text: The interaction is declared done and the gated score exceeds 0.5 because ClockStopWatchRunning.is_successful recognizes the stopwatch as running in the final device state and current activity.
    support:
    - android_world/task_evals/single/clock.py::ClockStopWatchRunning.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  checked_by:
    text: ClockStopWatchRunning.is_successful reads the final device state and current activity and applies _is_stopwatch_running; suite_utils._run_task then gates the raw score on the done flag and uses a greater-than-0.5 success threshold.
    support:
    - android_world/task_evals/single/clock.py::ClockStopWatchRunning.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  decisive_artifacts:
  - artifact: Native evaluator input containing the final device state and current activity
    question: Does the evaluator-visible state and activity satisfy _is_stopwatch_running?
    support:
    - android_world/task_evals/single/clock.py::ClockStopWatchRunning.is_successful
  - artifact: Native evaluator and runner output
    question: Did is_successful return a passing raw score, was the interaction declared done, and did the gated score exceed 0.5?
    support:
    - android_world/task_evals/single/clock.py::ClockStopWatchRunning.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  success_if:
  - text: The retained final evaluator input satisfies _is_stopwatch_running, the raw evaluator score passes, the interaction is declared done, and the gated score exceeds 0.5.
    support:
    - android_world/task_evals/single/clock.py::ClockStopWatchRunning.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  fail_if:
  - text: The evaluator does not recognize the stopwatch as running, or the interaction is not declared done, causing the gated score not to exceed 0.5.

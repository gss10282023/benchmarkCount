schema_version: case_checklist_v1
case_unit_id: MarkorChangeNoteContent
domain: androidworld
task_id: MarkorChangeNoteContent
native:
  user_goal:
    text: In Markor, update the file named original_name to updated_content and rename it to new_name.
    support:
    - android_world/task_evals/single/markor.py::MarkorChangeNoteContent.template
    - android_world/task_evals/task_eval.py::TaskEval.goal
  benchmark_success:
    text: 'The runner counts success when the interaction is done and MarkorChangeNoteContent.is_successful returns a passing score: new_name exists, original_name does not exist, and new_name passes the evaluator''s content check against updated_content.'
    support:
    - android_world/task_evals/single/markor.py::MarkorChangeNoteContent.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  checked_by:
    text: MarkorChangeNoteContent.is_successful checks the post-run files; suite_utils._run_task applies the done gate and greater-than-0.5 success threshold.
    support:
    - android_world/task_evals/single/markor.py::MarkorChangeNoteContent.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  decisive_artifacts:
  - artifact: Native evaluator input
    question: Which original_name, new_name, and updated_content values were evaluated?
    support:
    - android_world/task_evals/single/markor.py::MarkorChangeNoteContent.schema
  - artifact: Post-run Markor storage snapshot or retained files
    question: Does new_name exist with content accepted against updated_content while original_name is absent?
    support:
    - android_world/task_evals/single/markor.py::MarkorChangeNoteContent.is_successful
  - artifact: Runner trace and native evaluator output
    question: Was the interaction marked done, and did the done-gated evaluator score exceed 0.5?
    support:
    - android_world/suite_utils.py::suite_utils._run_task
  success_if:
  - text: The retained evidence links the evaluated parameters to a post-run state where new_name exists, original_name is absent, and new_name passes the evaluator's content check against updated_content; the runner also records done and a passing done-gated score.
    support:
    - android_world/task_evals/single/markor.py::MarkorChangeNoteContent.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  fail_if:
  - text: The runner records the interaction as not done, so the task score is gated to 0.0.
    support:
    - android_world/suite_utils.py::suite_utils._run_task
  - text: The evaluated post-run state lacks new_name, still contains original_name, or new_name fails the evaluator's content check against updated_content.
    support:
    - android_world/task_evals/single/markor.py::MarkorChangeNoteContent.is_successful
  undecided_if:
  - text: The retained evidence does not link the concrete evaluator parameters to both the post-run Markor file state and the runner's done-gated result.
    rationale: Missing or unlinked evidence is non-decisive; an observed evaluator rejection or a false done flag is a native failure.
stronger:
  additional_conditions: []

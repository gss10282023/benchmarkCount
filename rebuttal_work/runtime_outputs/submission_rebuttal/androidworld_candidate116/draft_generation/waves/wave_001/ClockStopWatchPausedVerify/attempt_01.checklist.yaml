schema_version: case_checklist_v1
case_unit_id: ClockStopWatchPausedVerify
domain: androidworld
task_id: ClockStopWatchPausedVerify
native:
  user_goal:
    text: Pause the stopwatch.
    support:
    - android_world/task_evals/single/clock.py::ClockStopWatchPausedVerify.template
    - android_world/task_evals/task_eval.py::TaskEval.goal
  benchmark_success:
    text: 'The interaction is marked done and the final evaluator returns 1.0: the activity contains "DeskClock", a UI element has content description "Start", and at least two UI elements have text or content description "Stopwatch"; the resulting gated score exceeds 0.5.'
    support:
    - android_world/task_evals/single/clock.py::_is_stopwatch_paused
    - android_world/task_evals/single/clock.py::ClockStopWatchPausedVerify.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  checked_by:
    text: ClockStopWatchPausedVerify.is_successful applies _is_stopwatch_paused to the final activity and UI elements; suite_utils._run_task applies the interaction-done gate and success threshold.
    support:
    - android_world/task_evals/single/clock.py::_is_stopwatch_paused
    - android_world/task_evals/single/clock.py::ClockStopWatchPausedVerify.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  decisive_artifacts:
  - artifact: native_evaluator_input
    question: Does the final evaluator input show a DeskClock activity, a "Start" content description, and at least two elements whose text or content description is "Stopwatch"?
    support:
    - android_world/task_evals/single/clock.py::_is_stopwatch_paused
    - android_world/task_evals/single/clock.py::ClockStopWatchPausedVerify.is_successful
  - artifact: native_evaluator_output
    question: Did ClockStopWatchPausedVerify.is_successful return 1.0 for that final input?
    support:
    - android_world/task_evals/single/clock.py::ClockStopWatchPausedVerify.is_successful
  - artifact: trace
    question: Was the final interaction marked done, leaving the runner's gated score above 0.5?
    support:
    - android_world/suite_utils.py::suite_utils._run_task
  success_if:
  - text: The final activity and UI-element evidence satisfies the paused-stopwatch predicate, so the raw evaluator score is 1.0.
    support:
    - android_world/task_evals/single/clock.py::_is_stopwatch_paused
    - android_world/task_evals/single/clock.py::ClockStopWatchPausedVerify.is_successful
  - text: The interaction is marked done, so the runner preserves the raw 1.0 score and counts success.
    support:
    - android_world/suite_utils.py::suite_utils._run_task
  fail_if:
  - text: The final activity or UI elements fail the paused-stopwatch predicate, producing raw evaluator score 0.0.
    support:
    - android_world/task_evals/single/clock.py::_is_stopwatch_paused
    - android_world/task_evals/single/clock.py::ClockStopWatchPausedVerify.is_successful
  - text: The interaction is not marked done, so the runner gates the score to 0.0 even if the paused-state predicate holds.
    support:
    - android_world/suite_utils.py::suite_utils._run_task
  undecided_if:
  - text: Retained evidence omits or conflicts on the final evaluator input, raw evaluator result, or interaction-done value, preventing reconstruction of the gated score.
    support:
    - android_world/task_evals/single/clock.py::ClockStopWatchPausedVerify.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
stronger:
  additional_conditions:
  - id: observed_running_to_paused_transition
    text: Beyond native final-state-only acceptance, retained trace evidence shows the stopwatch running during the episode and later paused at completion.
    rationale: The official goal requests pausing, but the task class states that the stopwatch is already paused after reset and the released evaluator checks only the final paused UI state; native success therefore does not establish that the run caused a running stopwatch to become paused.
    decisive_artifacts:
    - artifact: trace
      question: Does the retained episode trace show a stopwatch-running state before the final paused state?
      support:
      - android_world/task_evals/single/clock.py::ClockStopWatchPausedVerify
      - android_world/task_evals/single/clock.py::_is_stopwatch_running
      - android_world/task_evals/single/clock.py::_is_stopwatch_paused
    support:
    - android_world/task_evals/single/clock.py::ClockStopWatchPausedVerify.template
    - android_world/task_evals/single/clock.py::ClockStopWatchPausedVerify
    - android_world/task_evals/single/clock.py::_ClockEval.initialize_task
    - android_world/task_evals/single/clock.py::ClockStopWatchPausedVerify.is_successful

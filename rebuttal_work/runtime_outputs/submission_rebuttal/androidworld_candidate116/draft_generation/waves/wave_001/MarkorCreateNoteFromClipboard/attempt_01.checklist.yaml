schema_version: case_checklist_v1
case_unit_id: MarkorCreateNoteFromClipboard
domain: androidworld
task_id: MarkorCreateNoteFromClipboard
native:
  user_goal:
    text: Create and save in Markor a note named by the runtime file_name, inserting the initialized clipboard content with a paste operation.
    support:
    - android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.template
    - android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.initialize_task
  benchmark_success:
    text: The run ends with interaction_results.done=true and the done-gated score is greater than 0.5; the raw task score is MarkorCreateNoteFromClipboard.is_successful(env), delegated to create_file_task.is_successful(env).
    support:
    - android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  checked_by:
    text: MarkorCreateNoteFromClipboard.is_successful performs the delegated file check; suite_utils._run_task applies the done gate and greater-than-0.5 success threshold.
    support:
    - android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  decisive_artifacts:
  - artifact: Native evaluator input and output
    question: Do they retain the runtime parameters, interaction_results.done, raw task score, and done-gated agent score?
    support:
    - android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  - artifact: Final saved note file
    question: Does the retained file have the runtime file_name and file_content expected by the delegated file-creation check?
    support:
    - android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard
    - android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.initialize_task
  success_if:
  - text: The retained evaluator record shows interaction_results.done=true and a done-gated agent score greater than 0.5, with final-file evidence consistent with the delegated check.
    support:
    - android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  fail_if:
  - text: interaction_results.done is false, so the runner assigns a zero agent score regardless of the raw task result.
    support:
    - android_world/suite_utils.py::suite_utils._run_task
  - text: interaction_results.done is true but the raw task score from the delegated file check is at most 0.5.
    support:
    - android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  undecided_if:
  - text: The retained evidence omits the done flag or evaluator result and lacks sufficient runtime-parameter and final-file evidence to reconstruct the delegated check.
    rationale: Neither native success nor native failure can then be determined from stored post-run evidence.
stronger:
  additional_conditions:
  - id: verify_markor_paste_and_save
    text: Beyond native scoring, retained trace evidence must show the target note being edited in Markor, the initialized clipboard content being inserted by a paste operation, and the note being saved.
    rationale: The official goal expressly requires Markor and paste/save interactions, while is_successful delegates only to the file-creation check and does not inspect those actions.
    decisive_artifacts:
    - artifact: Retained interaction trace
      question: Does the trace show Markor editing the target file, a paste operation inserting the initialized clipboard content, and a save?
      support:
      - android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.template
      - android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.initialize_task
      - android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.is_successful
    support:
    - android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.template
    - android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.is_successful

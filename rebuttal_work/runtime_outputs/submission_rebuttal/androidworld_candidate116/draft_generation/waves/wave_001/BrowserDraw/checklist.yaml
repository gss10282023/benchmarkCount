schema_version: case_checklist_v1
case_unit_id: BrowserDraw
domain: androidworld
task_id: BrowserDraw
native:
  user_goal:
    text: Open Downloads/task.html through the file manager in Chrome, create a drawing using all three colors shown at the top, and submit it.
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/browser.py::BrowserDraw.goal
  benchmark_success:
    text: 'The runner records 1.0: the interaction is done, and the post-run state is in com.android.chrome with a UI element whose text is exactly "Success!".'
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/browser.py::BrowserTask.is_successful
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/suite_utils.py::suite_utils._run_task
  checked_by:
    text: BrowserTask.is_successful checks the current package and UI text; suite_utils._run_task applies the interaction-done gate and records the final score.
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/browser.py::BrowserTask.is_successful
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/suite_utils.py::suite_utils._run_task
  decisive_artifacts:
  - artifact: 'Native evaluator input: post-run current activity and UI-state snapshot'
    question: Is the current package com.android.chrome, with at least one UI element whose text is exactly "Success!"?
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/browser.py::BrowserTask.is_successful
  - artifact: Native evaluator and runner output
    question: Did the raw evaluator return 1.0, was interaction_results.done true, and was final is_successful recorded as 1.0?
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/suite_utils.py::suite_utils._run_task
  success_if:
  - text: The evaluator input shows com.android.chrome and an exact "Success!" UI element, yielding raw score 1.0.
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/browser.py::BrowserTask.is_successful
  - text: The runner record shows interaction_results.done=true and final is_successful=1.0.
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/suite_utils.py::suite_utils._run_task
  fail_if:
  - text: The current package is not com.android.chrome or no UI element has text exactly "Success!", so the raw evaluator score is 0.0.
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/browser.py::BrowserTask.is_successful
  - text: interaction_results.done is false, so the runner records 0.0 even if the raw evaluator condition holds.
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/suite_utils.py::suite_utils._run_task
  undecided_if:
  - text: Retained evidence omits or conflicts on the exact current package, UI text, raw evaluator result, or interaction-done flag, preventing reconstruction of the final native score.
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/browser.py::BrowserTask.is_successful
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/suite_utils.py::suite_utils._run_task
stronger:
  additional_conditions:
  - id: bind_success_to_browser_draw_task
    text: Beyond native success, retained evidence must tie the "Success!" state to the initialized Downloads/task.html and show that the submitted drawing used all three displayed colors.
    rationale: The official goal requires the specific task file and three-color drawing, while the evaluator accepts any Chrome UI state containing an exact "Success!" element without verifying page identity or drawing content.
    decisive_artifacts:
    - artifact: Retained trace with screenshots around submission
      question: Does the evidence establish that the submitted three-color drawing and resulting "Success!" marker belong to the initialized Downloads/task.html?
      support:
      - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/browser.py::BrowserTask.initialize_task
      - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/browser.py::BrowserDraw.goal
      - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/browser.py::BrowserTask.is_successful
    support:
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/browser.py::BrowserTask.initialize_task
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/browser.py::BrowserDraw.goal
    - rebuttal_work/runtime_outputs/submission_rebuttal/androidworld_candidate116/shared_source/source_tree/android_world/task_evals/single/browser.py::BrowserTask.is_successful

schema_version: case_checklist_v1
case_unit_id: BrowserMaze
domain: androidworld
task_id: BrowserMaze
native:
  user_goal:
    text: Open task.html from Downloads in the file manager with Chrome, then use the direction buttons to move the X to the maze's bottom-right cell.
    support:
    - android_world/task_evals/single/browser.py::BrowserMaze.goal
  benchmark_success:
    text: The run succeeds when BrowserTask.is_successful returns 1.0 because Chrome is foreground and an evaluator-time UI element has text exactly "Success!", and the episode reports done so the runner preserves that score above 0.5.
    support:
    - android_world/task_evals/single/browser.py::BrowserTask.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  checked_by:
    text: BrowserTask.is_successful, followed by the episode-done gate and success threshold in suite_utils._run_task.
    support:
    - android_world/task_evals/single/browser.py::BrowserTask.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  decisive_artifacts:
  - artifact: native_evaluator_output
    question: Does the retained output record raw task score 1.0 and final done-gated is_successful score 1.0?
    support:
    - android_world/task_evals/single/browser.py::BrowserTask.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  - artifact: post_state
    question: At evaluation time, was com.android.chrome foreground and did the UI tree contain an element whose text was exactly "Success!"?
    support:
    - android_world/task_evals/single/browser.py::BrowserTask.is_successful
  - artifact: trace
    question: Does the episode result record done=true?
    support:
    - android_world/suite_utils.py::suite_utils._run_task
  success_if:
  - text: Evaluator-time state shows com.android.chrome foreground and a UI element with text exactly "Success!", yielding raw score 1.0.
    support:
    - android_world/task_evals/single/browser.py::BrowserTask.is_successful
  - text: The episode done flag is true and the retained final score is 1.0, which exceeds the runner's 0.5 success threshold.
    support:
    - android_world/suite_utils.py::suite_utils._run_task
  fail_if:
  - text: The evaluator-time foreground package is not com.android.chrome or no UI element has text exactly "Success!", yielding raw score 0.0.
    support:
    - android_world/task_evals/single/browser.py::BrowserTask.is_successful
  - text: The episode done flag is false, causing the runner to assign final score 0.0 even if the raw task check passed.
    support:
    - android_world/suite_utils.py::suite_utils._run_task
  - text: The retained official final is_successful score is 0.0.
    support:
    - android_world/suite_utils.py::suite_utils._run_task
  undecided_if:
  - text: No native evaluator output is retained and the evidence does not jointly expose the evaluator-time foreground package, UI-element texts, and episode done flag.
    rationale: Without either the final score or all inputs needed to reconstruct it, the native result cannot be decided.
stronger:
  additional_conditions:
  - id: task_intent_completion
    text: Beyond native evaluator success, retained evidence must show that Downloads/task.html was opened through the file manager in Chrome and that the maze's X reached the bottom-right through the page's direction buttons.
    rationale: The official goal requires those actions, while the released evaluator only checks for Chrome foreground and any UI element whose text is exactly "Success!".
    decisive_artifacts:
    - artifact: trace
      question: Does the retained trace show task.html opened from Downloads through the file manager into Chrome, followed by direction-button interactions that move the maze X to the bottom-right?
      support:
      - android_world/task_evals/single/browser.py::BrowserMaze.goal
      - android_world/task_evals/single/browser.py::BrowserTask.is_successful
    - artifact: screenshot
      question: Does a retained final screenshot show the task.html maze with the X in its bottom-right cell?
      support:
      - android_world/task_evals/single/browser.py::BrowserMaze.goal
    support:
    - android_world/task_evals/single/browser.py::BrowserMaze.goal
    - android_world/task_evals/single/browser.py::BrowserTask.is_successful

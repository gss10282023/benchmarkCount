schema_version: case_checklist_v1
case_unit_id: ContactsAddContact
domain: androidworld
task_id: ContactsAddContact
native:
  user_goal:
    text: Create a new contact with the runtime-specified name and phone number.
    support:
    - android_world/task_evals/single/contacts.py::ContactsAddContact.template
    - android_world/task_evals/task_eval.py::TaskEval.goal
  benchmark_success:
    text: The initialized evaluator finds a listed contact accepted for the required name and number, interaction_results.done is true, and the resulting done-gated agent_successful score is greater than 0.5.
    support:
    - android_world/task_evals/common_validators/contacts_validators.py::AddContact.is_successful
    - android_world/task_evals/task_eval.py::TaskEval.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  checked_by:
    text: ContactsAddContact inherits AddContact.is_successful, which inspects listed contacts using _has_contact after TaskEval initialization checks; suite_utils._run_task then applies the done gate and success threshold.
    support:
    - android_world/task_evals/common_validators/contacts_validators.py::AddContact.is_successful
    - android_world/task_evals/task_eval.py::TaskEval.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  decisive_artifacts:
  - artifact: native_evaluator_input
    question: Does it identify the initialized runtime name and number used for evaluation?
    support:
    - android_world/task_evals/common_validators/contacts_validators.py::AddContact.schema
    - android_world/task_evals/task_eval.py::TaskEval.initialize_task
  - artifact: post_state
    question: Does the evaluator-visible contact list contain a contact that _has_contact accepts for the runtime name and number?
    support:
    - android_world/task_evals/common_validators/contacts_validators.py::AddContact.is_successful
  - artifact: native_evaluator_output
    question: Does it show raw task success, interaction_results.done true, and done-gated agent_successful greater than 0.5?
    support:
    - android_world/suite_utils.py::suite_utils._run_task
  success_if:
  - text: The retained input and post-state establish an accepted contact for the initialized runtime name and number, and the runner output shows done true with agent_successful greater than 0.5.
    support:
    - android_world/task_evals/common_validators/contacts_validators.py::AddContact.is_successful
    - android_world/task_evals/task_eval.py::TaskEval.is_successful
    - android_world/suite_utils.py::suite_utils._run_task
  fail_if:
  - text: Fail if the initialized evaluator does not find an accepted contact for the required name and number, so the raw task score does not exceed 0.5.
    support:
    - android_world/task_evals/common_validators/contacts_validators.py::AddContact.is_successful
    - android_world/task_evals/task_eval.py::TaskEval.is_successful
  - text: Fail if interaction_results.done is false or the done-gated agent_successful score does not exceed 0.5.
    support:
    - android_world/suite_utils.py::suite_utils._run_task
  undecided_if:
  - text: The retained evidence does not establish the runtime name and number, evaluator-visible contacts, or done-gated runner result, and the missing element cannot be reconstructed from other retained artifacts.
    support:
    - case_packet.md::source_context.available_post_run_artifact_types
    - case_packet.md::source_context.trace_schema
    rationale: Screenshots, actions, or messages alone may not determine the evaluator's contact comparison and final gated score.
stronger:
  additional_conditions: []

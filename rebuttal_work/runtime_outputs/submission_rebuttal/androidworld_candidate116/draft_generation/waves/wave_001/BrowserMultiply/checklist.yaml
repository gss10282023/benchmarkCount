schema_version: case_checklist_v1
case_unit_id: BrowserMultiply
domain: androidworld
task_id: BrowserMultiply
native:
  user_goal:
    text: Open Downloads/task.html with Chrome, activate the button five times, remember the displayed numbers, and submit their product.
    support:
    - case_packet.md::source_context.task_text.canonical_goal
  benchmark_success:
    text: A BrowserMultiply run succeeds when task.is_successful(env) returns above 0.5 and interaction_results.done is true; otherwise the runner records 0.0 when the run is not done.
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
  checked_by:
    text: BrowserMultiply uses BrowserTask.is_successful, followed by the suite runner's done gate and greater-than-0.5 success threshold.
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.method_chain
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
  decisive_artifacts:
  - artifact: Native evaluator input/output record
    question: Does the matched record for this run preserve the evaluator-visible input and report task.is_successful(env) above 0.5?
    support:
    - case_packet.md::source_context.evaluator_description.evaluator
    - case_packet.md::source_context.trace_schema
  - artifact: Suite runner result
    question: Does the matched runner record show interaction_results.done true and retain the resulting agent-success score?
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
  success_if:
  - text: The matched native evaluator record reports task.is_successful(env) above 0.5.
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
  - text: The matched suite runner record shows interaction_results.done true, so the raw score is not replaced by 0.0.
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
  fail_if:
  - text: The suite runner record shows interaction_results.done false, which forces the score to 0.0.
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
  - text: With interaction_results.done true, the native evaluator score is at most 0.5.
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
  undecided_if:
  - text: The evaluator score, done flag, or linkage of those records to this run is missing or ambiguous.
    rationale: The native decision composes the evaluator score with the runner's done gate, so both matched values are required.
stronger:
  additional_conditions: []

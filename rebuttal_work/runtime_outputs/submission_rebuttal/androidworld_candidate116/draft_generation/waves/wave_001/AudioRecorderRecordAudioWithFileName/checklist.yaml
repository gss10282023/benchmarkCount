schema_version: case_checklist_v1
case_unit_id: AudioRecorderRecordAudioWithFileName
domain: androidworld
task_id: AudioRecorderRecordAudioWithFileName
native:
  user_goal:
    text: Record an audio clip in the Audio Recorder app and save it with the runtime-specified file name.
    support:
    - case_packet.md::527-683
  benchmark_success:
    text: The configured file name exists as a file or folder in evaluator-visible state, task.is_successful returns above 0.5, and the interaction is done so the runner does not gate the score to 0.
    support:
    - case_packet.md::112-170
  checked_by:
    text: AudioRecorderRecordAudioWithFileName.is_successful, followed by suite_utils._run_task's done gate and greater-than-0.5 success threshold.
    support:
    - case_packet.md::112-170
  decisive_artifacts:
  - artifact: Native evaluator input and output
    question: Do they establish the configured file_name, interaction done status, raw task score, gated score, and reported success?
    support:
    - case_packet.md::157-170
    - case_packet.md::696-707
  - artifact: Post-run filesystem state
    question: Does a file or folder with the configured file_name exist where the native evaluator checks?
    support:
    - case_packet.md::114-135
  success_if:
  - text: Post-run state contains a file or folder matching the configured file_name, yielding a raw task score above 0.5.
    support:
    - case_packet.md::114-135
    - case_packet.md::157-170
  - text: The interaction is marked done, preserving the above-threshold raw score through the runner's done gate.
    support:
    - case_packet.md::157-170
  fail_if:
  - text: No file or folder matching the configured file_name exists, so the raw task score does not exceed 0.5.
    support:
    - case_packet.md::114-135
    - case_packet.md::157-170
  - text: The interaction is not marked done, so the runner gates the score to 0 even if the target path exists.
    support:
    - case_packet.md::157-170
  undecided_if:
  - text: Retained evidence does not establish the configured file_name, target-path existence, interaction done status, or native evaluator outcome.
    rationale: Without these evaluator-visible facts, the native success composition cannot be determined.
stronger:
  additional_conditions:
  - id: verify_actual_audio_recording
    text: Beyond the native existence check, require the retained target to be a regular, playable audio file with positive duration rather than merely an existing file or folder.
    rationale: The user goal requires recording an audio clip, while the evaluator only checks whether the configured name exists as a file or folder; native success therefore does not establish that audio was recorded.
    decisive_artifacts:
    - artifact: Retained target file
      question: Is the configured target a regular, playable audio file with positive duration?
      support:
      - case_packet.md::114-135
      - case_packet.md::650-683
    support:
    - case_packet.md::114-135
    - case_packet.md::650-683

schema_version: case_checklist_v1
case_unit_id: ExpenseAddMultiple
domain: androidworld
task_id: ExpenseAddMultiple
native:
  user_goal:
    text: Add every expense in the runtime-dispatched request to Pro Expense with its specified name, amount, category, and note.
    support:
    - case_packet.md::637-794
  benchmark_success:
    text: AndroidWorld records success when interaction_results.done is true and ExpenseAddMultiple's AddMultipleRows evaluator lists the final rows, passes validate_addition_integrity, and produces a gated score above 0.5.
    support:
    - case_packet.md::154-208
  checked_by:
    text: AndroidWorld suite_utils._run_task and the initialized ExpenseAddMultiple/AddMultipleRows evaluator over the Pro Expense SQLite rows.
    support:
    - case_packet.md::154-208
    - case_packet.md::330-375
  decisive_artifacts:
  - artifact: Native evaluator input and initialized state
    question: What requested row_objects and initial Pro Expense rows were retained, and was interaction_results.done true?
    support:
    - case_packet.md::195-207
    - case_packet.md::343-360
    - case_packet.md::582-629
  - artifact: Final Pro Expense database post-state
    question: Do the final listed rows pass the released validate_addition_integrity comparison against the initialized evaluator state?
    support:
    - case_packet.md::154-173
  - artifact: Native evaluator output
    question: Did task.is_successful return success and did the done-gated score exceed 0.5?
    support:
    - case_packet.md::195-207
  success_if:
  - text: The retained evidence shows done=true, the final rows pass AddMultipleRows.validate_addition_integrity, and the resulting gated score exceeds 0.5.
    support:
    - case_packet.md::154-208
  fail_if:
  - text: The gated score is at most 0.5 because done is false or AddMultipleRows.validate_addition_integrity returns false for the final rows.
    support:
    - case_packet.md::154-208
  undecided_if:
  - text: Stored evidence is missing or inconsistent such that neither the done-gated score nor the row-integrity result can be determined.
    support:
    - case_packet.md::24-32
    - case_packet.md::154-208
stronger:
  additional_conditions: []

schema_version: case_checklist_v1
case_unit_id: ExpenseAddMultipleFromGallery
domain: androidworld
task_id: ExpenseAddMultipleFromGallery
native:
  user_goal:
    text: Add the expenses shown in expenses.jpg in Simple Gallery Pro to Pro Expense.
    support:
    - case_packet.md::source_context.task_text.canonical_goal
  benchmark_success:
    text: The run is successful when ExpenseAddMultipleFromGallery's inherited AddMultipleRows evaluator finds that the post-run expense rows satisfy addition integrity, interaction is marked done, and the resulting gated score exceeds 0.5.
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.method_chain[0]
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
  checked_by:
    text: AndroidWorld's AddMultipleRows.is_successful evaluator and suite_utils._run_task done gate.
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.method_chain
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
  decisive_artifacts:
  - artifact: Native evaluator input containing the post-run Pro Expense row state and initialized task expectation
    question: Do the rows exposed to list_rows satisfy the evaluator's addition-integrity comparison?
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.method_chain[0]
    - case_packet.md::source_context.trace_schema.artifacts
  - artifact: Native evaluator output and suite runner record
    question: Did task.is_successful return true, was interaction marked done, and did the gated score exceed 0.5?
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
    - case_packet.md::source_context.trace_schema.artifacts
  success_if:
  - text: The retained evaluator input supports a true addition-integrity result for the post-run expense rows, the native evaluator output is true, and the runner record shows interaction done with gated score above 0.5.
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.method_chain[0]
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
  fail_if:
  - text: Fail if addition integrity is false, task.is_successful is false, interaction is not done, or the gated score does not exceed 0.5.
    support:
    - case_packet.md::source_context.evaluator_description.evaluator.method_chain[0]
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
  undecided_if:
  - text: The retained evidence lacks the evaluator input needed to audit addition integrity, the native evaluator output, or the runner's done status.
    support:
    - case_packet.md::source_context.trace_schema
    - case_packet.md::source_context.evaluator_description.evaluator.runner_score_semantics
stronger:
  additional_conditions:
  - id: gallery_source_verified
    text: Beyond native success, retained trace evidence shows that expenses.jpg in Simple Gallery Pro supplied the expense data entered into Pro Expense.
    rationale: The canonical goal explicitly names the gallery image as the source, while the released success evaluator only lists expense rows and validates addition integrity.
    decisive_artifacts:
    - artifact: Retained trace with observations or screenshots
      question: Does it show expenses.jpg in Simple Gallery Pro and correspondence between its displayed expenses and the rows entered in Pro Expense?
      support:
      - case_packet.md::source_context.task_text.canonical_goal
      - case_packet.md::source_context.evaluator_description.evaluator.method_chain[0]
      - case_packet.md::source_context.trace_schema.artifacts
    support:
    - case_packet.md::source_context.task_text.canonical_goal
    - case_packet.md::source_context.evaluator_description.evaluator.method_chain[0]

schema_version: case_checklist_v1
case_unit_id: MarkorDeleteNewestNote
domain: androidworld
task_id: MarkorDeleteNewestNote
native:
  user_goal:
    text: Delete the newest note in Markor.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote
  benchmark_success:
    text: 'Native success requires both: the episode finishes with `done=true`, and the final Markor note-directory listing matches the initialized change-time-sorted listing except that exactly one entry is gone, namely the last/newest initialized entry; all remaining filename and change_time pairs stay unchanged.'
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.initialize_task
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
    - official/install/android_world/suite_utils.py::suite_utils._run_task
  checked_by:
    text: AndroidWorld runner completion gate plus `MarkorDeleteNewestNote.is_successful`, using Markor directory file metadata.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
    - official/install/android_world/suite_utils.py::suite_utils._run_task
  decisive_artifacts:
  - artifact: Pre/post Markor directory manifests with filename and change_time metadata
    question: Do the initialized and final manifests for the Markor note directory show that the final sorted list is the initialized sorted list with only the last/newest entry removed and every surviving filename/change_time pair unchanged?
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.initialize_task
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
  - artifact: Episode completion evidence
    question: Did the episode terminate with `done=true`, so the runner did not zero out the task score?
    support:
    - official/install/android_world/suite_utils.py::suite_utils._run_task
  success_if:
  - text: Retained completion evidence shows the episode finished with `done=true`.
    support:
    - official/install/android_world/suite_utils.py::suite_utils._run_task
  - text: Initialized and final Markor directory manifests, sorted by change_time as the evaluator does, show identical filename/change_time pairs for all remaining entries and the final manifest has exactly one fewer entry, missing only the initial last/newest entry.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.initialize_task
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
  fail_if:
  - text: Retained completion evidence shows the episode ended with `done=false`.
    support:
    - official/install/android_world/suite_utils.py::suite_utils._run_task
  - text: Initialized and final Markor directory manifests show the final manifest is not exactly one entry shorter than the initialized manifest.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
  - text: Initialized and final Markor directory manifests show any remaining entry's filename or change_time differs from the corresponding initialized sorted-prefix entry, indicating a different deletion or another file modification.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
  undecided_if:
  - text: Completion evidence is missing or unusable, or the retained Markor directory evidence lacks either the initialized manifest or the final filename/change_time data needed for the evaluator's ordered comparison, and no other retained evidence independently establishes a failure condition above.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.initialize_task
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
    - official/install/android_world/suite_utils.py::suite_utils._run_task

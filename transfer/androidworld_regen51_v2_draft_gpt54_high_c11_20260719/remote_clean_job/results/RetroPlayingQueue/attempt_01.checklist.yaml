schema_version: case_checklist_v1
case_unit_id: RetroPlayingQueue
domain: androidworld
task_id: RetroPlayingQueue
native:
  user_goal:
    text: Add the task-instance songs to Retro Music's playing queue in the specified order.
    support:
    - official/install/android_world/task_metadata.json::[59].task_template
    - official/install/android_world/task_evals/single/retro_music.py::RetroPlayingQueue.goal
  benchmark_success:
    text: Native benchmark success requires the runner completion gate to pass (`interaction_results.done` true) and `RetroPlayingQueue.is_successful` to return 1, which happens only when the post-run `playing_queue` title list exactly equals the task-instance expected song-title list in the same order.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/retro_music.py::RetroPlayingQueue.is_successful
  checked_by:
    text: Runner completion gate plus the `RetroPlayingQueue.is_successful` evaluator.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/retro_music.py::RetroPlayingQueue.is_successful
  decisive_artifacts:
  - artifact: Retained task-instance goal text or parameter record identifying the required ordered song titles
    question: What ordered song titles was this run supposed to place in the playing queue?
    support:
    - official/install/android_world/task_evals/single/retro_music.py::RetroPlayingQueue.goal
    - official/install/android_world/task_evals/single/retro_music.py::RetroPlayingQueue.is_successful
  - artifact: Post-run snapshot of `music_playback_state.db` or an extracted `SELECT title from playing_queue;` result
    question: What titles were present in `playing_queue` after the run, in what order?
    support:
    - official/install/android_world/task_evals/single/retro_music.py::_get_playing_queue
    - official/install/android_world/task_evals/single/retro_music.py::RetroPlayingQueue.is_successful
  - artifact: Retained terminal episode trace or runner completion record showing the underlying `done` state
    question: Did the runner finish the episode with `interaction_results.done` true or false?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  success_if:
  - text: Success if retained completion evidence shows `done=true` and the retained post-run `playing_queue` titles exactly match the task-instance required song-title list, with no extra, missing, or reordered entries.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/retro_music.py::RetroPlayingQueue.is_successful
  fail_if:
  - text: Fail if retained completion evidence shows `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Fail if retained post-run `playing_queue` titles differ from the task-instance required song-title list in length, title values, or order.
    support:
    - official/install/android_world/task_evals/single/retro_music.py::RetroPlayingQueue.is_successful
  undecided_if:
  - text: Undecided if stored evidence does not preserve a usable task-instance expected title list, a usable post-run `playing_queue` observation, or the runner completion gate, and no retained evidence independently establishes `done=false` or a queue mismatch.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/retro_music.py::RetroPlayingQueue.is_successful
stronger:
  additional_conditions: []

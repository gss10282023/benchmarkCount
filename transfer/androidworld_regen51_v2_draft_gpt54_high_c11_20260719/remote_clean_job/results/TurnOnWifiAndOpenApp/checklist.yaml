schema_version: case_checklist_v1
case_unit_id: TurnOnWifiAndOpenApp
domain: androidworld
task_id: TurnOnWifiAndOpenApp
native:
  user_goal:
    text: Enable Wi-Fi and then open the specified app.
    support:
    - official/install/android_world/task_evals/composite/system.py::TurnOnWifiAndOpenApp.template
    - official/install/android_world/task_metadata.json::[113].task_template
  benchmark_success:
    text: Native success requires retained evidence that the episode finished with `done=true`, the Wi-Fi-on subcheck passed, and the open-app subcheck passed; the composite evaluator returns `(wifi_score + open_app_score)/2`, and the runner preserves that score only when `done=true`.
    support:
    - official/install/android_world/task_evals/composite/system.py::TurnOnWifiAndOpenApp.is_successful
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::OpenAppTaskEval.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  checked_by:
    text: 'Official composite evaluator and runner semantics: `TurnOnWifiAndOpenApp.is_successful`, `_SystemWifiToggle.is_successful`, `OpenAppTaskEval.is_successful`, and the `done` gate in `suite_utils._run_task`.'
    support:
    - official/install/android_world/task_evals/composite/system.py::TurnOnWifiAndOpenApp.is_successful
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::OpenAppTaskEval.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  decisive_artifacts:
  - artifact: Retained run record naming the dispatched target `app_name`
    question: What target app name was this case instantiated with?
    support:
    - official/install/android_world/task_evals/composite/system.py::TurnOnWifiAndOpenApp.schema
    - official/install/android_world/task_evals/composite/system.py::TurnOnWifiAndOpenApp.initialize_task
  - artifact: Retained evaluation-time reading of global `wifi_on`
    question: At evaluation time, is `wifi_on` equal to `1` or `2`?
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  - artifact: Retained evaluation-time foreground activity string
    question: At evaluation time, does the current activity's package equal the package mapped from the target `app_name`?
    support:
    - official/install/android_world/task_evals/single/system.py::OpenAppTaskEval.is_successful
    - official/install/android_world/task_evals/single/system.py::_APP_NAME_TO_PACKAGE_NAME
  - artifact: Retained episode completion evidence
    question: Did the episode terminate with `done=true` rather than being runner-gated to `0.0`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  success_if:
  - text: Retained completion evidence shows `done=true`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Retained evaluation-time `wifi_on` reading is `1` or `2`, so the Wi-Fi-on subcheck passes.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  - text: Retained evaluation-time foreground activity package equals the package mapped from the dispatched `app_name`, so the open-app subcheck passes.
    support:
    - official/install/android_world/task_evals/single/system.py::OpenAppTaskEval.is_successful
    - official/install/android_world/task_evals/single/system.py::_APP_NAME_TO_PACKAGE_NAME
  fail_if:
  - text: Retained completion evidence shows `done=false`; the runner gates the native score to `0.0`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Retained evaluation-time `wifi_on` reading is neither `1` nor `2`, so the Wi-Fi-on subcheck fails.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  - text: Retained evaluation-time foreground activity package does not equal the package mapped from the dispatched `app_name`, so the open-app subcheck fails.
    support:
    - official/install/android_world/task_evals/single/system.py::OpenAppTaskEval.is_successful
    - official/install/android_world/task_evals/single/system.py::_APP_NAME_TO_PACKAGE_NAME
  undecided_if:
  - text: Retained evidence does not reliably expose the dispatched `app_name`, the evaluation-time `wifi_on` value, the evaluation-time foreground activity/package, or the `done` gate, and no other retained evidence independently establishes success or failure.
    rationale: Those are the evaluator-visible inputs needed to reconstruct the composite check and runner gate from stored evidence.
stronger:
  additional_conditions:
  - id: respect_task_order
    text: Trace evidence shows Wi-Fi became enabled before the first retained state in which the target app's package was foreground; this is stricter than the released evaluator, which checks only end-state Wi-Fi and foreground app.
    rationale: The official task text is sequential ('Turn on Wifi, then open the {app_name} app'), but the released evaluator averages separate end-state Wi-Fi and open-app checks and does not test ordering.
    decisive_artifacts:
    - artifact: Retained run record naming the dispatched target `app_name`
      question: What target app name should the ordering check use?
      support:
      - official/install/android_world/task_evals/composite/system.py::TurnOnWifiAndOpenApp.schema
      - official/install/android_world/task_evals/composite/system.py::TurnOnWifiAndOpenApp.initialize_task
    - artifact: Retained time-ordered step trace or observation sequence
      question: Does the trace show Wi-Fi becoming enabled before the first state where the target app's mapped package is foreground?
      support:
      - official/install/android_world/task_evals/composite/system.py::TurnOnWifiAndOpenApp.template
      - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
      - official/install/android_world/task_evals/single/system.py::OpenAppTaskEval.is_successful
      - official/install/android_world/task_evals/single/system.py::_APP_NAME_TO_PACKAGE_NAME
    support:
    - official/install/android_world/task_evals/composite/system.py::TurnOnWifiAndOpenApp.template
    - official/install/android_world/task_evals/composite/system.py::TurnOnWifiAndOpenApp.is_successful
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::OpenAppTaskEval.is_successful

schema_version: case_checklist_v1
case_unit_id: SystemBrightnessMin
domain: androidworld
task_id: SystemBrightnessMin
native:
  user_goal:
    text: Turn screen brightness to the minimum value.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle
    - official/install/android_world/task_evals/single/system.py::SystemBrightnessMin.generate_random_params
  benchmark_success:
    text: Native success requires the run to finish with `done=true`, and the evaluator's final `settings get system screen_brightness` check to return integer `1` for this fixed `min` case.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::SystemBrightnessMin.generate_random_params
  checked_by:
    text: AndroidWorld runner completion gate plus `_SystemBrightnessToggle.is_successful`, which reads `system.screen_brightness` via adb.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  decisive_artifacts:
  - artifact: Retained episode completion evidence
    question: Does the retained run evidence show the episode finished with `done=true` or `done=false`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Retained evaluator-visible brightness state at scoring time
    question: At the point the evaluator checked success, what integer value did `settings get system screen_brightness` return?
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  success_if:
  - text: Retained completion evidence shows `done=true`, and retained evaluator-visible brightness evidence from scoring time shows `screen_brightness == 1`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  fail_if:
  - text: Retained completion evidence shows `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Retained evaluator-visible brightness evidence from scoring time shows `screen_brightness` as an integer other than `1`.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  undecided_if:
  - text: The retained record does not preserve the underlying completion gate and evaluator-visible brightness evidence needed to reconstruct the native rule, or those underlying artifacts are unusable while only summary success metadata or exception metadata remains.
    rationale: The checklist lock makes summary success labels non-decisive, allows retained `done=false` to establish failure, and otherwise treats missing underlying evidence, exceptions, or NaN as undecided unless other retained evidence independently proves success or failure.
stronger:
  additional_conditions: []

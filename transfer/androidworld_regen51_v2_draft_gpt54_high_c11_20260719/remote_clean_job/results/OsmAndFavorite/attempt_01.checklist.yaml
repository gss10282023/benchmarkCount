schema_version: case_checklist_v1
case_unit_id: OsmAndFavorite
domain: androidworld
task_id: OsmAndFavorite
native:
  user_goal:
    text: Add a favorite location marker in OsmAnd for the requested location.
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndFavorite
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
  benchmark_success:
    text: 'Native success requires both: the episode finished with `done=true`, and the evaluator-time OsmAnd favorites file `/data/media/0/Android/data/net.osmand/files/favorites/favorites.gpx` existed and contained a waypoint matching the dispatched location by name containment or coordinate tolerance `<0.001` degrees.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndFavorite.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_favorites_contains
    - official/install/android_world/task_evals/single/osmand.py::_waypoint_matches_location
  checked_by:
    text: '`android_world.suite_utils._run_task` done-gates `android_world.task_evals.single.osmand.OsmAndFavorite.is_successful`.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndFavorite.is_successful
  decisive_artifacts:
  - artifact: Retained runner record or episode trace with the dispatched goal/params and terminal `done` status
    question: What target location was dispatched for this instance, and did the episode finish with `done=true`?
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
    - official/install/android_world/task_evals/single/osmand.py::OsmAndFavorite.schema
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Retained evaluator-time existence/result for `/data/media/0/Android/data/net.osmand/files/favorites/favorites.gpx`, including a GPX copy if it existed
    question: At evaluation time, did that favorites GPX exist, and if so did it contain any waypoint whose name contained the target location string or whose lat/lon matched the target within evaluator tolerance?
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndFavorite.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_favorites_contains
    - official/install/android_world/task_evals/single/osmand.py::_waypoint_matches_location
  success_if:
  - text: The retained runner record shows the episode finished with `done=true` for this task instance.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: The retained evaluator-time favorites evidence shows `/data/media/0/Android/data/net.osmand/files/favorites/favorites.gpx` existed and its GPX contents included at least one waypoint matching the dispatched location under the evaluator's name/coordinate rule.
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndFavorite.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_favorites_contains
    - official/install/android_world/task_evals/single/osmand.py::_waypoint_matches_location
  fail_if:
  - text: The retained runner record shows the episode ended with `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Retained evaluator-time existence evidence shows `/data/media/0/Android/data/net.osmand/files/favorites/favorites.gpx` did not exist at evaluation time.
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndFavorite.is_successful
  - text: A retained evaluator-time GPX copy exists, but no waypoint in it matches the dispatched location under the evaluator's name/coordinate rule.
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndFavorite.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_favorites_contains
    - official/install/android_world/task_evals/single/osmand.py::_waypoint_matches_location
  undecided_if:
  - text: The retained evidence does not reliably recover the dispatched target location or terminal `done` status, and the remaining favorites evidence does not independently establish native failure.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
    - official/install/android_world/suite_utils.py::_run_task
  - text: Evaluator-time existence/contents evidence for `/data/media/0/Android/data/net.osmand/files/favorites/favorites.gpx` is missing, unreadable, or not tied to evaluation time, and retained runner evidence does not already establish failure via `done=false`.
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndFavorite.is_successful
    - official/install/android_world/suite_utils.py::_run_task
stronger:
  additional_conditions: []

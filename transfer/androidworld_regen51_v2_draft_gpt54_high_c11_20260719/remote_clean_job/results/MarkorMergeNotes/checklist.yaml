schema_version: case_checklist_v1
case_unit_id: MarkorMergeNotes
domain: androidworld
task_id: MarkorMergeNotes
native:
  user_goal:
    text: Create and save a new Markor note named `new_file_name` by merging the contents of notes `file1_name`, `file2_name`, and `file3_name` in that order, with a blank line between each note's content.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.template
  benchmark_success:
    text: 'Native success requires both AndroidWorld runner completion and evaluator success: retained run evidence must establish `interaction_results.done` true, and `MarkorMergeNotes.is_successful` must return 1.0 by finding the new merged note, accepting its contents under the delegated `CreateFile` content check, and confirming blank separator lines between note 1/2 and note 2/3.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.__init__
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.is_successful
  checked_by:
    text: The AndroidWorld runner completion gate plus the retained Markor merged-note file state checked under `MarkorMergeNotes.is_successful`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.is_successful
  decisive_artifacts:
  - artifact: Retained task-instance parameter record
    question: What are `new_file_name`, `file1_content`, `file2_content`, and `file3_content` for this run?
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.schema
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.__init__
  - artifact: Runner completion-gate evidence
    question: Does retained run evidence establish whether `interaction_results.done` was true or false?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Retained merged Markor note file snapshot/content
    question: Does the saved `new_file_name` note exist and satisfy the evaluator's content checks for the expected merge?
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.is_successful
  success_if:
  - text: The retained task parameters identify `new_file_name` and the three expected note contents; retained run evidence shows `interaction_results.done` true; and the retained merged note file exists, passes the delegated `CreateFile` content check against `file1_content + "\n\n" + file2_content + "\n\n" + file3_content + "\n"`, and after CR removal and stripping splits into exactly five newline-separated segments with blank second and fourth segments.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.__init__
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.is_successful
  fail_if:
  - text: Retained run evidence establishes `interaction_results.done` false.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: The retained merged note file is absent, or its contents fail the delegated `CreateFile` check against the expected concatenation, or its stripped newline split is not length 5 with blank second and fourth segments.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.__init__
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.is_successful
  undecided_if:
  - text: Only summary outcome metadata is retained, or the retained evidence does not let a reviewer reconstruct both the expected merged content and the underlying merged-file/completion-gate state.
    rationale: Native success is decided from underlying evaluator-visible evidence, not scalar outcome fields alone. If usable task parameters, merged-file evidence, or completion-gate evidence are missing or unreadable, and remaining retained artifacts do not independently prove success or failure, the case is undecided.
stronger:
  additional_conditions:
  - id: exact_merge_text
    text: Beyond native scoring, require the saved `new_file_name` note text to equal exactly `file1_content + "\n\n" + file2_content + "\n\n" + file3_content + "\n"`; do not accept approximate content matches.
    rationale: The official task text requires merging the note contents in order with a new line between notes, but native scoring delegates the main content comparison to `CreateFile.is_successful`, which uses fuzzy matching and can accept near-matches before the extra separator-line check.
    decisive_artifacts:
    - artifact: Retained task-instance parameter record
      question: What are `new_file_name`, `file1_content`, `file2_content`, and `file3_content` for this run?
      support:
      - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.schema
      - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.__init__
    - artifact: Retained merged Markor note file snapshot/content
      question: Does the saved merged note text equal that exact concatenation?
      support:
      - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.__init__
      - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.is_successful
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.template
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.__init__
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful

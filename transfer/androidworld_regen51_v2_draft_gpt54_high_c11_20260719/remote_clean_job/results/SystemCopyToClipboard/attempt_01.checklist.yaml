schema_version: case_checklist_v1
case_unit_id: SystemCopyToClipboard
domain: androidworld
task_id: SystemCopyToClipboard
native:
  user_goal:
    text: Copy the task's concrete `clipboard_content` string to the Android clipboard.
    support:
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard
  benchmark_success:
    text: 'Native success requires runner completion (`done=true`) and an evaluator-time clipboard readout, taken before teardown reset, that passes `SystemCopyToClipboard.is_successful`: the clipboard text fuzzily matches the task''s concrete `clipboard_content` under `fuzzy_match_lib.fuzzy_match`; otherwise native success is 0.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.is_successful
    - official/install/android_world/utils/fuzzy_match_lib.py::_MIN_DIFF_SIMILARITY
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  checked_by:
    text: Checked by `SystemCopyToClipboard.is_successful`, with AndroidWorld runner gating the final score on `interaction_results.done`.
    support:
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  decisive_artifacts:
  - artifact: Retained task instance record with the concrete goal or params
    question: What exact `clipboard_content` value was this run asked to copy?
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard
  - artifact: Retained evaluator-time clipboard readout
    question: What text was on the clipboard when `SystemCopyToClipboard.is_successful` read it, before teardown could reset the clipboard?
    support:
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.is_successful
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.tear_down
  - artifact: Retained episode completion evidence
    question: Did the episode complete with `done=true` when the runner converted task score to native success?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  success_if:
  - text: The retained evidence shows the concrete requested `clipboard_content`, shows `done=true`, and shows an evaluator-time clipboard value that matches the requested text under the evaluator's fuzzy comparison rule.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.is_successful
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  fail_if:
  - text: The retained evidence shows `done=false`; the runner assigns native success 0 regardless of clipboard state.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: The retained evidence shows `done=true` and an evaluator-time clipboard value that does not match the requested `clipboard_content` under the evaluator's fuzzy comparison rule.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.is_successful
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  undecided_if:
  - text: 'The retained evidence does not establish at least one of the native inputs needed to score the run: the concrete requested `clipboard_content`, whether the runner had `done=true`, or the clipboard value at evaluator time.'
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  - text: The only retained clipboard evidence is from after teardown or lacks timing relative to `is_successful`, so it could reflect the teardown reset rather than the value the evaluator scored.
    support:
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.initialize_task
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.tear_down
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.is_successful
  - text: The run record only preserves summary metadata such as `is_successful`, `native_score`, exception text, or NaN without usable underlying completion and clipboard evidence.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    rationale: The packet instructions say summary result scalars and exception metadata are non-decisive; the scorer must rely on retained underlying execution evidence.
stronger:
  additional_conditions:
  - id: exact_clipboard_equality
    text: Beyond native scoring, require the evaluator-time clipboard text to equal the requested `clipboard_content` exactly, not merely pass the fuzzy-match threshold.
    rationale: The official task asks the agent to copy the specified text to the clipboard, while the released evaluator accepts approximate string matches via `fuzzy_match_lib.fuzzy_match` with a 0.9 similarity threshold and case-insensitive comparison.
    decisive_artifacts:
    - artifact: Retained task instance record with the concrete goal or params
      question: What exact `clipboard_content` value was this run asked to copy?
      support:
      - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
      - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard
    - artifact: Retained evaluator-time clipboard readout
      question: What exact text was on the clipboard when `SystemCopyToClipboard.is_successful` read it, before teardown reset?
      support:
      - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.is_successful
      - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.tear_down
    support:
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.is_successful
    - official/install/android_world/utils/fuzzy_match_lib.py::_MIN_DIFF_SIMILARITY
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match

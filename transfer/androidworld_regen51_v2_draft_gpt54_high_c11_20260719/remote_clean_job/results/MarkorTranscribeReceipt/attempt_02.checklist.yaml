schema_version: case_checklist_v1
case_unit_id: MarkorTranscribeReceipt
domain: androidworld
task_id: MarkorTranscribeReceipt
native:
  user_goal:
    text: Create `receipt.md` in Markor by transcribing the transactions shown in `receipt.png` viewed in Simple Gallery, formatted as CSV with the header `Date, Item, Amount`.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorTranscribeReceipt
    - official/install/android_world/task_metadata.json::267-277
  benchmark_success:
    text: Native success requires underlying evidence that the episode finished with `done=true` and that `MarkorTranscribeReceipt.is_successful(env)` passed; that task check delegates to `CreateFile.is_successful`, which requires `receipt.md` to exist in Markor storage and its contents to fuzzy-match the official expected text for the case.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorTranscribeReceipt.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
  checked_by:
    text: AndroidWorld runner `done` gate plus the Markor file validator over post-run `receipt.md` existence and fuzzy-matched contents.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorTranscribeReceipt.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
  decisive_artifacts:
  - artifact: Retained episode trace or episode_data with terminal completion status
    question: Does the retained underlying run evidence show the episode terminated with `done=true` or `done=false`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Post-run Markor filesystem snapshot or pulled `receipt.md` file
    question: After the run, does `receipt.md` exist in Markor storage, and if it exists do its contents fuzzy-match the official expected CSV text for this case?
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorTranscribeReceipt.generate_random_params
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
  success_if:
  - text: The retained episode evidence shows `done=true`, and the post-run Markor filesystem evidence shows `receipt.md` exists in Markor storage with contents that fuzzy-match the official expected text for the case.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
  fail_if:
  - text: The retained episode evidence shows `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Readable post-run Markor filesystem evidence shows `receipt.md` is absent from Markor storage.
    support:
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
  - text: Readable post-run `receipt.md` contents do not fuzzy-match the official expected text for the case.
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
  undecided_if:
  - text: Retained evidence is missing or unusable for either the runner completion gate or readable post-run `receipt.md` state, and the remaining retained evidence does not independently establish success or one of the native failure conditions.
    rationale: Native success needs both the runner `done` gate and evaluator-visible file state. Per the checklist lock rules, missing or unusable underlying evidence is undecided unless other retained evidence independently establishes success or failure.
stronger:
  additional_conditions:
  - id: trace_shows_required_apps_used
    text: 'Beyond native: retained trace evidence shows the agent actually used Simple Gallery for `receipt.png` and interacted with Markor during the episode, because the task text requires those apps while the released evaluator only checks final `receipt.md` file state.'
    rationale: The official task instruction requires using Simple Gallery and Markor. `MarkorTranscribeReceipt.is_successful` delegates to `CreateFile.is_successful`, which checks only file existence and fuzzy-matched contents in Markor storage, so native acceptance is weaker than the stated task intent on app usage.
    decisive_artifacts:
    - artifact: Retained episode trace with foreground app/activity history and actions
      question: Does the trace show interaction with both Simple Gallery and Markor during completion of the task?
      support:
      - official/install/android_world/task_evals/single/markor.py::MarkorTranscribeReceipt
      - official/install/android_world/task_evals/single/markor.py::MarkorTranscribeReceipt.is_successful
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorTranscribeReceipt
    - official/install/android_world/task_evals/single/markor.py::MarkorTranscribeReceipt.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful

schema_version: case_checklist_v1
case_unit_id: OsmAndTrack
domain: androidworld
task_id: OsmAndTrack
native:
  user_goal:
    text: Save an OsmAnd track for the run's requested waypoint locations in the listed order.
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.goal
    - derived/canonical_task_semantics.json::goal.authority
  benchmark_success:
    text: Native success requires the episode to finish with `done=true` and the `OsmAndTrack` evaluator to succeed; for this task, success means some saved OsmAnd GPX track contains the run's target waypoint coordinates in order.
    support:
    - official/install/android_world/suite_utils.py::suite_utils._run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.initialize_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_track_matches
  checked_by:
    text: Runner done gate in `suite_utils._run_task`, plus `OsmAndTrack.initialize_task` and `OsmAndTrack.is_successful`, which derive target coordinates from `params['waypoints']` and scan saved GPX tracks.
    support:
    - official/install/android_world/suite_utils.py::suite_utils._run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.initialize_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_lookup_target_waypoints
  decisive_artifacts:
  - artifact: Run record with dispatched goal or task params and episode completion status
    question: What ordered waypoint list was required for this run, and did the episode end with `done=true`?
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.goal
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.initialize_task
    - official/install/android_world/suite_utils.py::suite_utils._run_task
    - derived/canonical_task_semantics.json::metadata_conflicts[0]
  - artifact: Post-run OsmAnd tracks GPX snapshot
    question: Does any saved GPX track under OsmAnd `tracks` contain track points that match the required waypoint coordinates in order within the evaluator tolerance?
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_track_points
    - official/install/android_world/task_evals/single/osmand.py::_track_matches
    - official/install/android_world/task_evals/single/osmand.py::_coords_match
  success_if:
  - text: Stored evidence shows `done=true`, identifies the run's ordered `waypoints`, and shows at least one saved OsmAnd GPX track whose track points match every target waypoint coordinate in order within the evaluator's `0.001` degree tolerance.
    support:
    - official/install/android_world/suite_utils.py::suite_utils._run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.initialize_task
    - official/install/android_world/task_evals/single/osmand.py::_lookup_target_waypoints
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_track_matches
    - official/install/android_world/task_evals/single/osmand.py::_coords_match
  fail_if:
  - text: Stored evidence shows the episode ended with `done=false`.
    support:
    - official/install/android_world/suite_utils.py::suite_utils._run_task
  - text: Stored evidence shows `done=true`, identifies the run's ordered `waypoints`, and shows that no saved OsmAnd GPX track matches all target waypoint coordinates in order within the evaluator tolerance.
    support:
    - official/install/android_world/suite_utils.py::suite_utils._run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.initialize_task
    - official/install/android_world/task_evals/single/osmand.py::_lookup_target_waypoints
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_track_matches
    - official/install/android_world/task_evals/single/osmand.py::_coords_match
  undecided_if:
  - text: Stored evidence does not preserve the run-specific waypoint list or dispatched goal, so the required target coordinates cannot be determined from retained evidence; the fixed metadata example is non-authoritative when it conflicts with runtime goal semantics.
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.goal
    - derived/canonical_task_semantics.json::goal.authority
    - derived/canonical_task_semantics.json::metadata_conflicts[0]
  - text: Stored evidence does not preserve usable post-run OsmAnd track GPX contents, so the evaluator-visible track match cannot be checked from retained evidence.
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_track_points
    - official/install/android_world/task_evals/single/osmand.py::_track_matches
  - text: Stored evidence does not establish whether the episode reached `done=true` or `done=false`, and no other retained artifact independently proves or disproves the required track match.
    support:
    - official/install/android_world/suite_utils.py::suite_utils._run_task
stronger:
  additional_conditions: []

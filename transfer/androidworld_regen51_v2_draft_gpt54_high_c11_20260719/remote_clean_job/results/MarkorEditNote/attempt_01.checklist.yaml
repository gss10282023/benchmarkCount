schema_version: case_checklist_v1
case_unit_id: MarkorEditNote
domain: androidworld
task_id: MarkorEditNote
native:
  user_goal:
    text: 'Edit the specified Markor note according to the selected runtime branch: add the provided header at the top, add the provided footer at the bottom, or replace the note text with the provided replacement text.'
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorEditNote.template
    - official/install/android_world/task_evals/single/markor.py::MarkorEditNote.schema
  benchmark_success:
    text: 'Native success requires both AndroidWorld runner completion and a passing MarkorEditNote file-content check: `_run_task` must see `interaction_results.done=true`, and `MarkorEditNote.is_successful(env)` must return `1.0` from its branch-specific fuzzy content comparison.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorEditNote.is_successful
  checked_by:
    text: AndroidWorld runner completion gate in `_run_task`, then `MarkorEditNote.is_successful` reading the target note and comparing it against the branch-specific expected content.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorEditNote.is_successful
  decisive_artifacts:
  - artifact: Retained episode completion evidence
    question: Does the retained runner evidence show whether `interaction_results.done` was true or false for this episode?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Retained task-instance parameters
    question: What `edit_type` branch was selected, what target `file_name` was used, and what branch value (`header`, `footer`, or `replace_text`) was assigned for this instance?
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorEditNote.schema
    - official/install/android_world/task_evals/single/markor.py::MarkorEditNote.template
  - artifact: Retained target-note state evidence
    question: What was the created pre-edit content of the target note during `initialize_task`, and what were the post-run contents of that same file when read for evaluation?
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorEditNote.initialize_task
    - official/install/android_world/task_evals/single/markor.py::MarkorEditNote.is_successful
  success_if:
  - text: Retained runner evidence shows `interaction_results.done=true`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: 'Retained params and note-state evidence show the final contents of `file_name`, after carriage-return removal and outer whitespace stripping, fuzzy-match the evaluator target for the selected branch: `header + "\n" + original_content` for `edit_type="header"`, `original_content + "\n" + footer` for `edit_type="footer"`, or `replace_text` for `edit_type="replace"`.'
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorEditNote.initialize_task
    - official/install/android_world/task_evals/single/markor.py::MarkorEditNote.is_successful
  fail_if:
  - text: Retained runner evidence shows `interaction_results.done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Retained runner evidence shows `interaction_results.done=true`, and retained params plus note-state evidence show the final target-note contents do not fuzzy-match the evaluator target for the selected `edit_type` branch.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorEditNote.is_successful
  undecided_if:
  - text: Retained evidence does not establish whether `interaction_results.done` was true or false, and no other retained evidence independently establishes success or failure under the native rule.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: For `edit_type="header"` or `edit_type="footer"`, retained evidence lacks either the created pre-edit target-note content or the post-run target-file contents, so the evaluator target cannot be reconstructed from stored evidence.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorEditNote.initialize_task
    - official/install/android_world/task_evals/single/markor.py::MarkorEditNote.is_successful
  - text: For `edit_type="replace"`, retained evidence lacks either `replace_text` or the post-run target-file contents, so the evaluator comparison cannot be assessed from stored evidence.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorEditNote.schema
    - official/install/android_world/task_evals/single/markor.py::MarkorEditNote.is_successful
stronger:
  additional_conditions:
  - id: metadata-header-only-alignment
    text: Beyond native scoring, require the retained task-instance parameters to show `edit_type="header"`, so the run matches the metadata-stated MarkorEditNote instruction rather than the broader footer/replace variants accepted by the released runtime evaluator.
    rationale: '`task_metadata.json` states MarkorEditNote as adding text to the top of the note, but the released runtime template/schema also permit footer and replace variants. This condition makes that task/evaluator mismatch explicit and reviewable from retained parameters.'
    decisive_artifacts:
    - artifact: Retained task-instance parameters
      question: Do retained parameters show `edit_type="header"` for this MarkorEditNote instance?
      support:
      - official/install/android_world/task_metadata.json::/32/task_template
      - official/install/android_world/task_evals/single/markor.py::MarkorEditNote.schema
    support:
    - official/install/android_world/task_metadata.json::/32/task_template
    - official/install/android_world/task_evals/single/markor.py::MarkorEditNote.template
    - official/install/android_world/task_evals/single/markor.py::MarkorEditNote.schema

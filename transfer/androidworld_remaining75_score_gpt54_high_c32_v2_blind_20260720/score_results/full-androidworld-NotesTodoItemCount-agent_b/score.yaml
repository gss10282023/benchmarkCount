schema_version: evidence_score_v1
case_unit_id: NotesTodoItemCount
released_evaluator_label:
  value: success
  source: source_adapter/raw_run.json::native_label
native:
  verdict: S
  reason: Stored evidence shows the agent submitted answer `3` and then ended the run with terminal `status` complete.
  pointers:
  - checklist.yaml::native.success_if[0]
  - evidence/native_run/trajectories/steps.json::[4].action_output
  - evidence/native_run/trajectories/steps.json::[5].action_output
stronger:
  verdict: S
  reason: The submitted answer is exactly `3`, and retained interaction evidence shows Joplin opened to the `Ideas` folder and its to-do items were inspected before answering.
  pointers:
  - checklist.yaml::stronger.additional_conditions[0]
  - checklist.yaml::stronger.additional_conditions[1]
  - evidence/native_run/trajectories/steps.json::[2].after_element_list
  - evidence/native_run/trajectories/steps.json::[4].action_output
  condition_checks:
  - id: exact_integer_numeral
    status: supported
    reason: The submitted answer text is exactly the integer numeral `3`.
    pointers:
    - checklist.yaml::stronger.additional_conditions[0]
    - evidence/native_run/trajectories/steps.json::[4].action_output
  - id: grounded_in_joplin_folder_state
    status: supported
    reason: Before answering, the trace shows Joplin open to `Ideas` with the folder's to-do items visible and the answer then given from that exploration.
    pointers:
    - checklist.yaml::stronger.additional_conditions[1]
    - evidence/native_run/trajectories/steps.json::[2].after_element_list
    - evidence/native_run/trajectories/steps.json::[4].action_output

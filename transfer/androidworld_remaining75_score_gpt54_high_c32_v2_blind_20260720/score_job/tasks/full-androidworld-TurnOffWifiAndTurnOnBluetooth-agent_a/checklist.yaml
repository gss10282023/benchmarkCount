schema_version: case_checklist_v1
case_unit_id: TurnOffWifiAndTurnOnBluetooth
domain: androidworld
task_id: TurnOffWifiAndTurnOnBluetooth
native:
  user_goal:
    text: Turn off WiFi, then enable bluetooth.
    support:
    - official/install/android_world/task_evals/composite/system.py::TurnOffWifiAndTurnOnBluetooth.template
  benchmark_success:
    text: 'Native benchmark success requires runner completion with `done=true` and both released component checks passing: WiFi-off passes and Bluetooth-on passes, yielding composite score 1.0; if `done=false`, the runner forces failure.'
    support:
    - official/install/android_world/task_evals/composite/system.py::TurnOffWifiAndTurnOnBluetooth.is_successful
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  checked_by:
    text: Checked by the runner done gate in `_run_task` plus `TurnOffWifiAndTurnOnBluetooth.is_successful`, which averages the WiFi-off and Bluetooth-on system evaluators over Android global settings.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/composite/system.py::TurnOffWifiAndTurnOnBluetooth.is_successful
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
  decisive_artifacts:
  - artifact: Completion-gate evidence from the retained episode trace or runner record
    question: Does the underlying run evidence show the episode ended with `done=true`, rather than runner-gated failure from `done=false`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Final evaluator-visible global-settings evidence for `wifi_on`
    question: Does it show the value used by the WiFi evaluator was `0`?
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  - artifact: Final evaluator-visible global-settings evidence for `bluetooth_on`
    question: Does it show the value used by the Bluetooth evaluator was `1`?
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
  success_if:
  - text: Retained underlying evidence shows `done=true`, final evaluator-visible `wifi_on` is `0`, and final evaluator-visible `bluetooth_on` is `1`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
    - official/install/android_world/task_evals/composite/system.py::TurnOffWifiAndTurnOnBluetooth.is_successful
  fail_if:
  - text: Retained underlying evidence shows `done=false`; the runner therefore records failure regardless of the setting values.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: With usable final evaluator-visible settings evidence, `wifi_on` is not `0`; the WiFi-off component fails.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/task_evals/composite/system.py::TurnOffWifiAndTurnOnBluetooth.is_successful
  - text: With usable final evaluator-visible settings evidence, `bluetooth_on` is not `1`; the Bluetooth-on component fails.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
    - official/install/android_world/task_evals/composite/system.py::TurnOffWifiAndTurnOnBluetooth.is_successful
  undecided_if:
  - text: Retained evidence is missing or unusable for the completion gate and/or for the final evaluator-visible `wifi_on` or `bluetooth_on` values, and no remaining underlying evidence independently establishes one of the native success or fail conditions.
    rationale: The native criterion depends on the runner's done gate plus the two final settings checks; summary outcome metadata alone is non-decisive, so missing underlying completion/state evidence prevents reconstruction of success or failure.
stronger:
  additional_conditions:
  - id: respect_goal_order
    text: Beyond native success, retained ordered action/state evidence should show WiFi was turned off before Bluetooth was enabled, because the dispatched goal specifies that sequence while the released evaluator checks only final `wifi_on` and `bluetooth_on` end state.
    rationale: 'This is a concrete goal/evaluator gap: the official task text includes an explicit order (''then''), but the native evaluator only averages two end-state checks and does not test sequencing.'
    decisive_artifacts:
    - artifact: Time-ordered action or state trace covering the WiFi and Bluetooth changes
      question: Does the retained trace show WiFi reached the off state before Bluetooth was enabled?
      support:
      - official/install/android_world/task_evals/composite/system.py::TurnOffWifiAndTurnOnBluetooth.template
      - official/install/android_world/task_evals/composite/system.py::TurnOffWifiAndTurnOnBluetooth.is_successful
    support:
    - official/install/android_world/task_evals/composite/system.py::TurnOffWifiAndTurnOnBluetooth.template
    - official/install/android_world/task_evals/composite/system.py::TurnOffWifiAndTurnOnBluetooth.is_successful

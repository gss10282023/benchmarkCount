schema_version: case_checklist_v1
case_unit_id: OsmAndTrack
domain: androidworld
task_id: OsmAndTrack
native:
  user_goal:
    text: Complete the dispatched runtime goal by saving an OsmAnd track whose requested waypoint locations appear in the saved track in the same listed order.
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.goal
    - derived/canonical_task_semantics.json::goal.authority
  benchmark_success:
    text: 'Native success requires both runner completion and evaluator match: the episode ended with `done=true`, and some saved OsmAnd GPX track has track points that match every dispatched waypoint coordinate in the listed order within the evaluator''s 0.001-degree tolerance.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_track_matches
    - official/install/android_world/task_evals/single/osmand.py::_lookup_target_waypoints
  checked_by:
    text: AndroidWorld runner done gate plus OsmAndTrack GPX track-point matching over the post-run OsmAnd tracks directory.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_track_points
  decisive_artifacts:
  - artifact: Retained dispatched runtime goal or task-parameter record for this run
    question: What waypoint list was dispatched for the run, and in what order must those locations be matched?
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.goal
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.initialize_task
  - artifact: Retained post-run snapshot or archive of `/data/media/0/Android/data/net.osmand/files/tracks`
    question: Do the saved GPX files contain any track whose `trkpt` sequence matches all dispatched waypoint coordinates in order under the evaluator's 0.001-degree tolerance?
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_track_points
    - official/install/android_world/task_evals/single/osmand.py::_track_matches
  - artifact: Retained episode trace or runner record with the run completion gate
    question: Did the episode terminate with `done=true`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  success_if:
  - text: Retained run evidence shows `done=true`, and retained post-run OsmAnd GPX track files show at least one saved track whose ordered `trkpt` sequence matches every dispatched waypoint coordinate in order under the evaluator's lookup and 0.001-degree tolerance.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_track_matches
    - official/install/android_world/task_evals/single/osmand.py::_lookup_target_waypoints
  fail_if:
  - text: Retained run evidence shows `done=false`; the runner gates the benchmark result to failure regardless of the saved track files.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Retained run evidence shows `done=true`, but retained post-run OsmAnd GPX track files show no saved track whose `trkpt` sequence matches all dispatched waypoint coordinates in the required order under the evaluator's tolerance.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_track_matches
  undecided_if:
  - text: The retained evidence does not reliably establish the dispatched waypoint list or usable post-run GPX track contents needed to apply the ordered waypoint matcher, and no other retained artifact independently establishes success or failure.
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.goal
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_track_matches
  - text: The retained evidence does not establish whether the episode reached `done=true`, and the remaining retained artifacts do not independently settle the runner-gated native outcome.
    support:
    - official/install/android_world/suite_utils.py::_run_task
stronger:
  additional_conditions: []

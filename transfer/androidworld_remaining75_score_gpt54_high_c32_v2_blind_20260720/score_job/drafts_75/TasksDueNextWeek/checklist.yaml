schema_version: case_checklist_v1
case_unit_id: TasksDueNextWeek
domain: androidworld
task_id: TasksDueNextWeek
native:
  user_goal:
    text: Determine how many tasks in the Tasks app are due next week, assuming weeks start on Monday, and answer with a single integer.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksDueNextWeek"].prompt
  benchmark_success:
    text: Native success requires the runner to finish with `done=true` and the final stored answer to pass the released IR checker as one NUMBER_MATCH answer equal to COUNT(`tasks_app_tasks`) from the task's relevant state, which is 6 for this case.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::get_expected_answer
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksDueNextWeek"].success_criteria.expectations[0]
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksDueNextWeek"].relevant_state.state.tasks_app.tasks_app_tasks
  checked_by:
    text: AndroidWorld's `_run_task` done gate plus `InformationRetrieval.is_successful`, which compares `env.interaction_cache` against the task proto via `proto_utils.check_agent_answer`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
  decisive_artifacts:
  - artifact: Episode trace or terminal step record
    question: Does it show whether the run ended with `done=true`, and what final answer text, if any, was stored for evaluator comparison?
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  - artifact: Retained per-episode task proto or relevant-state snapshot
    question: Does it show COUNT(`tasks_app_tasks`) NUMBER_MATCH success criteria and six seeded `tasks_app_tasks` entries for this case?
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksDueNextWeek"].success_criteria.expectations[0]
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksDueNextWeek"].relevant_state.state.tasks_app.tasks_app_tasks
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::get_expected_answer
  success_if:
  - text: The retained episode evidence shows `done=true`, the retained per-episode task proto or relevant-state snapshot defines COUNT(`tasks_app_tasks`) NUMBER_MATCH for this case, and the final stored answer parses to the single expected value `6`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::get_expected_answer
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksDueNextWeek"].success_criteria.expectations[0]
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksDueNextWeek"].relevant_state.state.tasks_app.tasks_app_tasks
  fail_if:
  - text: The retained episode evidence shows the run ended with `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: The retained episode evidence shows no final answer was stored in `interaction_cache`, or the stored final answer fails the released NUMBER_MATCH check because it is not a single parseable number equal to `6`.
    support:
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::get_expected_answer
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksDueNextWeek"].success_criteria.expectations[0]
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksDueNextWeek"].relevant_state.state.tasks_app.tasks_app_tasks
  undecided_if:
  - text: The retained evidence does not establish whether the episode ended with `done=true` or `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    rationale: The runner gates native success on terminal `done`, so missing terminal status leaves the native claim unresolved.
  - text: The retained evidence lacks either a usable final answer record or the per-episode task-proto or relevant-state snapshot needed to compute and apply the released NUMBER_MATCH check, and no other retained evidence independently establishes success or failure.
    support:
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::get_expected_answer
    rationale: The native scorer depends on both the stored answer text and the task-defined expected count.
stronger:
  additional_conditions:
  - id: strict_integer_lexeme
    text: Beyond native scoring, require the final answer text itself to be written as a single integer numeral for the count, not merely a numerically equal non-integer-form answer such as `6.0`.
    rationale: The dispatched goal says to express the answer as a single integer, but the released evaluator parses NUMBER_MATCH answers with `float(...)`, so numerically equal float-form strings can pass natively.
    decisive_artifacts:
    - artifact: Final answer record
      question: Is the retained final answer text an integer numeral rather than another numeric string form such as `6.0`?
      support:
      - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksDueNextWeek"].prompt
      - official/install/android_world/task_evals/information_retrieval/proto_utils.py::_cast_answers_to_type
      - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksDueNextWeek"].prompt
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::_cast_answers_to_type
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer

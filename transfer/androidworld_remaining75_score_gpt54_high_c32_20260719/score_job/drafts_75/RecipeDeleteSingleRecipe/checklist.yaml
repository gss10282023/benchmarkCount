schema_version: case_checklist_v1
case_unit_id: RecipeDeleteSingleRecipe
domain: androidworld
task_id: RecipeDeleteSingleRecipe
native:
  user_goal:
    text: Delete the specified recipe from the Broccoli app.
    support:
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteSingleRecipe
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.goal
  benchmark_success:
    text: 'Native success requires runner completion with `done=true` and a passing delete-row check on the Broccoli `recipes` SQLite table: the initialized target recipe row is absent after the run, every other pre-run row is unchanged, and no new row is added.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  checked_by:
    text: Runner `done` gate plus `DeleteMultipleRows.is_successful`, using `_RecipeDeleteMultipleRecipes.validate_deletion_integrity` / `validate_rows_removal_integrity` over the Broccoli `recipes` table.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  decisive_artifacts:
  - artifact: Retained episode trace or equivalent underlying runner record with terminal `done` status
    question: Does the retained execution evidence show the episode ended with `done=true` or `done=false`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Retained pre-run snapshot of the Broccoli SQLite `recipes` table
    question: Does the retained pre-run table snapshot show the initialized target row for this single-delete task, with exactly one recipe row present before agent actions?
    support:
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteSingleRecipe
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::SQLiteApp.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.initialize_task
  - artifact: Retained post-run snapshot of the Broccoli SQLite `recipes` table
    question: Compared with the retained pre-run snapshot, is the target row gone afterward, with no other preserved row missing or changed and no new row added?
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  success_if:
  - text: Retained execution evidence shows the episode ended with `done=true`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: The retained pre-run `recipes` snapshot shows exactly one row, and the retained post-run `recipes` snapshot shows that this row is absent afterward with no added rows or other unintended table changes.
    support:
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteSingleRecipe
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.initialize_task
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  fail_if:
  - text: Retained execution evidence shows the episode ended with `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: With usable retained pre/post `recipes` snapshots, the target row from the pre-run snapshot is still present after the run.
    support:
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  - text: With usable retained pre/post `recipes` snapshots, the post-run table differs from the pre-run table in any way other than removing the target row, including a missing preserved row or any newly added row.
    support:
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  undecided_if:
  - text: The retained underlying runner evidence does not provide a usable terminal `done` status, and the remaining retained table evidence does not independently establish failure.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: A needed retained pre-run or post-run `recipes` table snapshot is missing or unreadable, and the remaining retained evidence does not independently establish success or failure under the native rule.
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
stronger:
  additional_conditions: []

schema_version: case_checklist_v1
case_unit_id: OsmAndFavorite
domain: androidworld
task_id: OsmAndFavorite
native:
  user_goal:
    text: Add a favorite location marker in the OsmAnd maps app for the task's specified `location` value.
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndFavorite.template
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
  benchmark_success:
    text: 'Benchmark success requires both: the runner''s `done` gate passes, and the official evaluator finds a matching favorite in `/data/media/0/Android/data/net.osmand/files/favorites/favorites.gpx`. A match is any waypoint whose name contains the task `location` string or whose lat/lon matches that location within 0.001 degrees.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndFavorite.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_FAVORITES_PATH
    - official/install/android_world/task_evals/single/osmand.py::_favorites_contains
    - official/install/android_world/task_evals/single/osmand.py::_waypoint_matches_location
  checked_by:
    text: '`suite_utils._run_task` applies the `done` gate, then `OsmAndFavorite.is_successful` parses `favorites.gpx` and checks for a matching waypoint.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndFavorite.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_favorites_contains
    - official/install/android_world/task_evals/single/osmand.py::_waypoint_matches_location
  decisive_artifacts:
  - artifact: Runner completion artifact
    question: Does retained runner evidence show the episode ended with `done=true` rather than unfinished?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Evaluation-time snapshot of OsmAnd favorites GPX
    question: Does retained pre-teardown content of `/data/media/0/Android/data/net.osmand/files/favorites/favorites.gpx` show a waypoint matching the task `location` under the evaluator's name-containment or <=0.001-degree coordinate rule?
    support:
    - official/install/android_world/task_evals/single/osmand.py::_FAVORITES_PATH
    - official/install/android_world/task_evals/single/osmand.py::OsmAndFavorite.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_favorites_contains
    - official/install/android_world/task_evals/single/osmand.py::_waypoint_matches_location
    - official/install/android_world/task_evals/single/osmand.py::OsmAndFavorite.tear_down
  success_if:
  - text: Retained runner evidence shows `done=true`, and retained pre-teardown `favorites.gpx` content contains at least one waypoint matching the task `location` under the evaluator's comparison rule.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndFavorite.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_favorites_contains
    - official/install/android_world/task_evals/single/osmand.py::_waypoint_matches_location
    - official/install/android_world/task_evals/single/osmand.py::OsmAndFavorite.tear_down
  fail_if:
  - text: Retained runner evidence shows `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Retained evaluation-time evidence shows `/data/media/0/Android/data/net.osmand/files/favorites/favorites.gpx` was absent, or was readable but contained no waypoint matching the task `location` under the evaluator's comparison rule.
    support:
    - official/install/android_world/task_evals/single/osmand.py::_FAVORITES_PATH
    - official/install/android_world/task_evals/single/osmand.py::OsmAndFavorite.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_favorites_contains
    - official/install/android_world/task_evals/single/osmand.py::_waypoint_matches_location
  undecided_if:
  - text: Retained evidence does not include usable runner-completion evidence and usable pre-teardown `favorites.gpx` evidence; post-teardown OsmAnd state alone is non-decisive because teardown clears favorites.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndFavorite.is_successful
    - official/install/android_world/task_evals/single/osmand.py::OsmAndFavorite.tear_down
stronger:
  additional_conditions: []

schema_version: case_checklist_v1
case_unit_id: SystemWifiTurnOffVerify
domain: androidworld
task_id: SystemWifiTurnOffVerify
native:
  user_goal:
    text: Turn wifi off.
    support:
    - official/install/android_world/task_metadata.json::[103].task_template
    - official/install/android_world/task_evals/single/system.py::SystemWifiTurnOffVerify.generate_random_params
  benchmark_success:
    text: Native success requires the episode to end with `done=true` and the task evaluator to pass; for this case, the retained post-run `settings get global wifi_on` value must be `0`.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::SystemWifiTurnOffVerify.generate_random_params
    - official/install/android_world/suite_utils.py::_run_task
  checked_by:
    text: '`official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful`, with success counted only when `official/install/android_world/suite_utils.py::_run_task` sees `interaction_results.done`.'
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  decisive_artifacts:
  - artifact: Retained episode completion trace
    question: Does retained underlying run evidence show the episode terminated with `done=true` or `done=false`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Retained post-run `global.wifi_on` evidence
    question: What retained evaluator-visible post-run value is shown for `settings get global wifi_on`?
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::SystemWifiTurnOffVerify.generate_random_params
  success_if:
  - text: Retained evidence shows the episode ended with `done=true` and the post-run `global.wifi_on` value was `0`.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::SystemWifiTurnOffVerify.generate_random_params
    - official/install/android_world/suite_utils.py::_run_task
  fail_if:
  - text: Retained evidence shows the episode ended with `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Retained evidence shows the episode ended with `done=true` and the post-run `global.wifi_on` value was not `0`.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::SystemWifiTurnOffVerify.generate_random_params
    - official/install/android_world/suite_utils.py::_run_task
  undecided_if:
  - text: 'Retained evidence does not establish one of the two native components: the final `done` state or a usable post-run `global.wifi_on` value, and no other retained artifact independently establishes success or failure.'
    rationale: The native score is runner-gated by `done` and otherwise depends on the evaluator-visible `wifi_on` setting, so missing either component leaves the claim unresolved unless other retained evidence already proves or disproves it.
  - text: Only summary metadata such as `is_successful`, a native label/score, exception text, or similar aggregate outputs is retained without underlying `done`/`wifi_on` evidence.
    rationale: The checklist lock says benchmark summary fields and exception metadata are non-decisive; the scorer must use retained underlying execution evidence instead.
stronger:
  additional_conditions: []

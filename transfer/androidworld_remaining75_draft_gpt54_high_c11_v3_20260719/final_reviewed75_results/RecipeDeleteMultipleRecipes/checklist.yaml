schema_version: case_checklist_v1
case_unit_id: RecipeDeleteMultipleRecipes
domain: androidworld
task_id: RecipeDeleteMultipleRecipes
native:
  user_goal:
    text: Delete the recipes named in the dispatched goal from the Broccoli app.
    support:
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.goal
  benchmark_success:
    text: 'Native success requires both runner completion and the SQLite deletion check: `_run_task` must see `interaction_results.done=true`, and `DeleteMultipleRows.is_successful` must accept the final Broccoli `recipes` table. In this case the task initializes exactly three target recipe rows and no noise rows, so the deletion check is satisfied iff none of those initialized rows remain and no new rows were added; equivalently, the final `recipes` table is empty.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows._validate_initial_state
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteMultipleRecipes
  checked_by:
    text: Runner `done` gating plus the Broccoli SQLite `recipes`-table deletion integrity check.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
  decisive_artifacts:
  - artifact: Retained episode trace or runner log
    question: Does the retained run evidence show the episode ended with `done=true`, rather than being gated to failure by `done=false`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Retained Broccoli `recipes` table snapshot immediately after task initialization
    question: Does it show the evaluator initialized exactly three recipe rows for this case and no noise rows?
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows._validate_initial_state
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteMultipleRecipes
  - artifact: Retained Broccoli `recipes` table snapshot at evaluation time
    question: Is the final `recipes` table empty, with no surviving initialized row and no newly added row?
    support:
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  success_if:
  - text: The retained run evidence shows `done=true`; the retained initialized Broccoli `recipes` snapshot shows exactly three rows for this case; and the retained final `recipes` snapshot is empty.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows._validate_initial_state
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteMultipleRecipes
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  fail_if:
  - text: The retained run evidence shows `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: The retained run evidence shows `done=true`, but the retained final Broccoli `recipes` snapshot is not empty.
    support:
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteMultipleRecipes
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  undecided_if:
  - text: The retained evidence is missing or unusable for either the runner `done` gate or the final Broccoli `recipes` table state, and the remaining artifacts do not independently establish success or failure.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
stronger:
  additional_conditions: []

schema_version: case_checklist_v1
case_unit_id: MarkorMergeNotes
domain: androidworld
task_id: MarkorMergeNotes
native:
  user_goal:
    text: Create and save a new Markor note named `{new_file_name}` whose text is the contents of `{file1_name}`, then `{file2_name}`, then `{file3_name}`, with one blank line between adjacent note contents.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.template
  benchmark_success:
    text: 'AndroidWorld native success requires both: the runner completion gate has `done=true`, and `MarkorMergeNotes.is_successful` holds by finding `{new_file_name}`, accepting its text under `CreateFile`''s fuzzy comparison to the expected merged text, and confirming the saved file splits into exactly five newline-separated segments with empty separator segments between note 1/2 and 2/3.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.__init__
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  checked_by:
    text: Runner completion gating in `suite_utils._run_task`, plus `MarkorMergeNotes.is_successful`, which composes `CreateFile.is_successful` with an explicit blank-line split check on the saved merged note.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
  decisive_artifacts:
  - artifact: Retained episode trace or runner record with the underlying `done` value
    question: Does the retained run evidence show the episode ended with `done=true`, or with `done=false`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Post-run Markor filesystem snapshot or pulled file covering `/storage/emulated/0/Documents/Markor/{new_file_name}`
    question: Does `{new_file_name}` exist, and does its saved text satisfy both the evaluator's expected merged-text comparison and the explicit five-segment blank-separator check?
    support:
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.__init__
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
  success_if:
  - text: Retained evidence shows `done=true`, and the post-run file `/storage/emulated/0/Documents/Markor/{new_file_name}` exists with text that passes the evaluator's expected merged-text comparison and, after CR stripping and outer trimming, has the pattern nonblank / blank / nonblank / blank / nonblank when split on `\n`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
  fail_if:
  - text: Retained evidence shows the runner completion gate ended the episode with `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Retained evidence shows `done=true`, but `/storage/emulated/0/Documents/Markor/{new_file_name}` is absent post-run.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
  - text: Retained evidence shows `done=true` and `{new_file_name}` exists, but its text either fails `CreateFile`'s fuzzy comparison against the expected merged text or fails the explicit five-segment blank-separator check.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  undecided_if:
  - text: No retained evidence establishes `done=false`, but the retained artifacts do not preserve a usable `done` value and usable post-run contents for `{new_file_name}`; examples include missing trace data, missing filesystem snapshot/file pull, or runtime/evaluator exception records without the underlying state needed to apply the official checks.
    rationale: The native decision depends on the runner done gate plus evaluator-visible file state. If those underlying artifacts are unavailable, later summary fields or bare exception metadata are not decisive for success or failure.
stronger:
  additional_conditions:
  - id: exact_merge_text
    text: Beyond the native fuzzy comparison, the saved note's text exactly matches the three case-specified source-note contents in order with one blank separator line between adjacent notes, rather than only approximately matching under `fuzzy_match`.
    rationale: The official task asks for the contents of the three named notes to be merged in order into a new saved note with a new line between them, but the released evaluator accepts approximate text equality through `CreateFile.is_successful` before only separately checking separator positions. A near-miss merged text can therefore satisfy native success.
    decisive_artifacts:
    - artifact: Post-run text of `/storage/emulated/0/Documents/Markor/{new_file_name}`
      question: Does the saved note text exactly equal the case-specified merged text in the required order and separator layout, not merely pass the evaluator's fuzzy comparison?
      support:
      - official/install/android_world/env/device_constants.py::MARKOR_DATA
      - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.template
      - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.__init__
      - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.is_successful
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.template
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
    - official/install/android_world/task_evals/single/markor.py::MarkorMergeNotes.is_successful

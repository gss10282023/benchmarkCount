schema_version: case_checklist_v1
case_unit_id: MarkorTranscribeVideo
domain: androidworld
task_id: MarkorTranscribeVideo
native:
  user_goal:
    text: Watch the specified VLC video in Downloads and write the per-frame string sequence into the specified Markor text file as a comma-separated list.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorTranscribeVideo.template
  benchmark_success:
    text: 'Native success requires both runner completion and task evaluator success: the episode must finish with `done=true`, and the specified Markor file must exist with contents that fuzzy-match the evaluator''s expected `text` value.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorTranscribeVideo.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
  checked_by:
    text: AndroidWorld runner completion gate plus `MarkorTranscribeVideo.is_successful`, which delegates to `CreateFile.is_successful` on the Markor data directory.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorTranscribeVideo.is_successful
    - official/install/android_world/task_evals/single/markor.py::MarkorTranscribeVideo.__init__
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
  decisive_artifacts:
  - artifact: Retained episode trace or equivalent completion record
    question: Did the run reach episode completion (`done=true`) rather than ending unfinished?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Post-run snapshot or extracted contents of the specified Markor file
    question: Does `{file_name}` exist under the Markor data directory, and do its contents fuzzy-match the evaluator's expected `text` value?
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
  success_if:
  - text: The retained run evidence shows the episode finished (`done=true`), and the specified file exists in Markor with contents that fuzzy-match the evaluator's expected comma-separated `text` string.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
  fail_if:
  - text: The retained run evidence shows the episode did not finish (`done=false`); under the runner gate this is native failure regardless of file state.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: The episode finished, but the specified Markor file is absent from the Markor data directory.
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
  - text: The episode finished and the specified Markor file exists, but its contents do not fuzzy-match the evaluator's expected `text` value.
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  undecided_if:
  - text: Completion evidence is missing or unusable, and available file evidence alone cannot establish the runner's `done=true` gate.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: The expected post-run Markor file snapshot or readable extracted file contents are missing or unusable, so evaluator-visible file existence/content cannot be checked from retained evidence.
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
  - text: Retained evidence is internally inconsistent about whether the file existed or what its contents were, and no other retained artifact resolves the evaluator-visible state.
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    rationale: Conflicting retained filesystem evidence prevents deciding the native file check.
stronger:
  additional_conditions:
  - id: stronger_spacing_matches_dispatched_example
    text: Beyond the native fuzzy-match criterion, the saved Markor file should preserve the dispatched goal's comma-and-space list format, i.e. items separated by `", "` rather than merely a near-match such as `","`.
    rationale: The official dispatched goal says the transcription should be written "as a comma separated list" and gives the explicit example `"edna, pineapple"`, but the released evaluator only fuzzy-matches against the generated `text` value, which is constructed as `",".join(messages)` with no spaces. This leaves a concrete gap where native success can accept formatting that does not match the user-facing example.
    decisive_artifacts:
    - artifact: Post-run snapshot or extracted contents of the specified Markor file
      question: Does the saved transcription use comma-space separators between adjacent items, matching the dispatched example format?
      support:
      - official/install/android_world/task_evals/single/markor.py::MarkorTranscribeVideo.template
      - official/install/android_world/task_evals/single/markor.py::MarkorTranscribeVideo.generate_random_params
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorTranscribeVideo.template
    - official/install/android_world/task_evals/single/markor.py::MarkorTranscribeVideo.generate_random_params
    - derived/canonical_task_semantics.json::metadata_comparison

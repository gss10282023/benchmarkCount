schema_version: case_checklist_v1
case_unit_id: RecipeDeleteDuplicateRecipes3
domain: androidworld
task_id: RecipeDeleteDuplicateRecipes3
native:
  user_goal:
    text: In the Broccoli app, delete duplicate recipes so only one copy of each exact-duplicate recipe remains while every unique recipe still has at least one instance.
    support:
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.goal
  benchmark_success:
    text: 'Native success requires both runner completion and evaluator success: retained evidence must show the episode finished with `done=true`, and the Broccoli `recipes` table after the run must equal the pre-run table with exactly one member of an exact-duplicate pair removed, while the other duplicate row and all other pre-run rows remain unchanged and no new row is added.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteDuplicateRows._validate_candidates
  checked_by:
    text: AndroidWorld's recipe dedup evaluator over the Broccoli SQLite `recipes` table, with the suite runner gating success on episode completion.
    support:
    - official/install/android_world/task_evals/single/recipe.py::_RecipeApp
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.validate_deletion_integrity
    - official/install/android_world/suite_utils.py::_run_task
  decisive_artifacts:
  - artifact: Pre-run Broccoli SQLite snapshot (`/data/data/com.flauschcode.broccoli/databases/broccoli`, table `recipes`)
    question: What was the full pre-run row set, and which row pair was identical on every field except `recipeId`?
    support:
    - official/install/android_world/task_evals/single/recipe.py::_RecipeApp
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteDuplicateRows._validate_candidates
  - artifact: Post-run Broccoli SQLite snapshot of the same `recipes` table
    question: Does the post-run row set equal the pre-run row set minus exactly one row from that exact-duplicate pair, with the other duplicate row and every non-target pre-run row unchanged and no new row present?
    support:
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  - artifact: Retained episode termination/trace evidence
    question: Did the run finish with `interaction_results.done=true`, or is there retained evidence that it ended with `done=false`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  success_if:
  - text: Retained evidence shows `done=true`, and the post-run `recipes` table matches the pre-run table with exactly one row removed from a pair of rows that were identical except for `recipeId`; the other duplicate row remains, every other pre-run row remains unchanged, and no new row appears.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteDuplicateRows._validate_candidates
  fail_if:
  - text: Retained completion evidence shows the episode ended with `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Usable pre/post `recipes` snapshots show that the post-run row set is not exactly the pre-run row set minus one member of an exact-duplicate pair, including cases where both duplicate rows remain, both are removed, any non-target pre-run row is missing or altered, or any new row is added.
    support:
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteDuplicateRows._validate_candidates
  undecided_if:
  - text: Retained artifacts do not provide usable evidence for the completion gate and do not provide a usable before/after `recipes` table comparison, and the remaining evidence does not independently establish either native success or native failure.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
stronger:
  additional_conditions: []

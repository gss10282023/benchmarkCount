schema_version: case_checklist_v1
case_unit_id: NotesTodoItemCount
domain: androidworld
task_id: NotesTodoItemCount
native:
  user_goal:
    text: Determine how many Joplin notes marked as to-dos are in the specified folder and reply with just that number.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3434-3523
  benchmark_success:
    text: Native success requires the runner to end with done=true and the task evaluator to accept the final submitted answer under NUMBER_MATCH; for this case the evaluator’s expected answer is the count of the three seeded relevant-state notes whose is_todo field is True, i.e. 3.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::get_expected_answer
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3434-3523
  checked_by:
    text: The runner done gate in _run_task together with InformationRetrieval.is_successful, which reads the submitted answer from interaction_cache and validates it with proto_utils.check_agent_answer.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
  decisive_artifacts:
  - artifact: Episode trace or agent action log with the final answer submission
    question: What exact final answer text was submitted before termination?
    support:
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Runner termination record from the retained episode result
    question: Did the episode terminate with done=true, which is required for native credit?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  success_if:
  - text: Retained evidence shows the episode ended with done=true and the final submitted answer text matches the evaluator’s NUMBER_MATCH comparison for the official expected count 3.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3434-3523
  fail_if:
  - text: Retained evidence shows the episode ended with done=false.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Retained evidence shows done=true but no answer was submitted before termination, so interaction_cache remained empty for evaluation.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  - text: Retained evidence shows done=true and the final submitted answer either does not parse as the required numeric answer or parses to a value other than the official expected count 3.
    support:
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3434-3523
  undecided_if:
  - text: Retained evidence does not preserve enough underlying data to determine both the runner completion gate and the final submitted answer text needed to apply the evaluator, and the preserved trace does not otherwise establish failure.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
stronger:
  additional_conditions:
  - id: joplin_provenance
    text: Beyond native success, retained trace evidence should show that the agent actually consulted Joplin content for the specified folder before answering, because the task asks for the count in the Joplin app while the released evaluator only checks the final numeric answer.
    rationale: The dispatched goal explicitly grounds the answer in Joplin and the named folder, but native evaluation accepts any final numeric answer equal to the expected count without checking that the answer was obtained from Joplin.
    decisive_artifacts:
    - artifact: Episode trace, screenshots, or UI observations around the answer step
      question: Do the retained artifacts show Joplin was opened and the specified folder’s note content or todo list was inspected before the final answer was submitted?
      support:
      - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3434-3523
      - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3434-3523
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/suite_utils.py::_run_task

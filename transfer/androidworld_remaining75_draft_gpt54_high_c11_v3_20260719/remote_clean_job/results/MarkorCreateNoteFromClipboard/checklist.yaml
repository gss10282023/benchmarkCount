schema_version: case_checklist_v1
case_unit_id: MarkorCreateNoteFromClipboard
domain: androidworld
task_id: MarkorCreateNoteFromClipboard
native:
  user_goal:
    text: Create a Markor note with the specified `file_name`, paste clipboard content into the note, and save it.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard
  benchmark_success:
    text: 'Native benchmark success is the conjunction of the runner completion gate and the released file check: retained evidence must show the episode ended with `done=true`, and the Markor evaluator must be satisfiable by a file named `file_name` in Markor storage whose contents fuzzy-match the case `file_content` value.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.__init__
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
  checked_by:
    text: Checked by `android_world.suite_utils._run_task` for the `done` gate, plus `MarkorCreateNoteFromClipboard` delegating to `file_validators.CreateFile.is_successful` on Markor data.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
  decisive_artifacts:
  - artifact: episode termination trace
    question: Does retained episode evidence show whether the run finished with `done=true` or `done=false`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: post-run Markor file snapshot or file readout
    question: In `/storage/emulated/0/Documents/Markor`, does `file_name` exist, and if so do its contents fuzzy-match the case `file_content` value?
    support:
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.__init__
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
  success_if:
  - text: Success if retained episode evidence shows `done=true` and retained post-run Markor storage shows a file named `file_name` whose contents fuzzy-match the case `file_content` value.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.__init__
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
  fail_if:
  - text: Fail if retained episode evidence shows `done=false`, because the runner forces the native score to 0 regardless of evaluator state.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Fail if retained post-run Markor storage shows no file named `file_name` in the Markor data directory.
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
  - text: Fail if retained contents of `file_name` do not fuzzy-match the case `file_content` value.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.__init__
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
  undecided_if:
  - text: Undecided if retained episode evidence does not establish `done=false`, but completion-gate evidence is missing or ambiguous while the stored file evidence could otherwise satisfy the file check.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    rationale: Native success requires both the runner `done` gate and the file check; without decisive completion evidence and without independent failure evidence, the stored record cannot establish success or failure.
  - text: Undecided if retained completion evidence shows `done=true` or does not independently fail, but the post-run Markor file evidence is missing, unreadable, or otherwise insufficient to determine file existence/content.
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    rationale: The released evaluator decides success from evaluator-visible file state; if that underlying file evidence is unavailable and no separate decisive failure evidence exists, the native claim cannot be resolved from stored artifacts.
stronger:
  additional_conditions:
  - id: require_paste_operation_evidence
    text: Beyond native success, retained interaction evidence shows the note text was inserted via a paste operation in Markor before the note was saved; this is stricter than the released evaluator, which accepts any path that yields the saved file with matching content.
    rationale: The dispatched goal explicitly requires a paste operation, but the released evaluator only checks final saved file existence and fuzzy-matching content via `CreateFile`.
    decisive_artifacts:
    - artifact: retained action or UI trace
      question: Does the retained interaction trace show a paste action or explicit `Paste` selection in the Markor editor before save?
      support:
      - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard
      - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.is_successful
      - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful

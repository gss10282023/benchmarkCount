schema_version: case_checklist_v1
case_unit_id: RecipeDeleteDuplicateRecipes
domain: androidworld
task_id: RecipeDeleteDuplicateRecipes
native:
  user_goal:
    text: Delete all but one of any exact-duplicate recipes in the Broccoli app, leaving at least one copy of each unique recipe.
    support:
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.goal
  benchmark_success:
    text: 'Native success is runner-gated: retained evidence must show the episode reached `done=true`, and the Broccoli `recipes` table must satisfy the released evaluator by matching the pre-run table with exactly one of the two duplicate recipe rows removed and every other row unchanged.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  checked_by:
    text: Runner completion gating from `suite_utils._run_task`, plus the SQLite row-removal integrity check implemented by `RecipeDeleteDuplicateRecipes` over the Broccoli `recipes` table before and after the run.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  decisive_artifacts:
  - artifact: Episode trace or retained completion record
    question: Does retained underlying run evidence show whether the episode reached `done=true` or `done=false`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Broccoli `recipes` table snapshots before and after the run
    question: Do the snapshots show that the after-state equals the before-state with exactly one of the duplicated recipe rows removed, every other row preserved, and no new row added?
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  success_if:
  - text: Retained completion evidence shows the episode reached `done=true`; otherwise the native runner score is forced to 0.0.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Comparable before/after Broccoli `recipes` table snapshots show the after-state is exactly the before-state minus one, and only one, of the duplicated recipe rows, with all other rows unchanged and no new row added.
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  fail_if:
  - text: Retained completion evidence shows `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Comparable before/after Broccoli `recipes` table snapshots show the after-state is not exactly the before-state minus one of the duplicated rows; this includes leaving both duplicates, removing both duplicates, removing or altering any other row, or adding any new row.
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  undecided_if:
  - text: Retained artifacts do not provide usable evidence for the runner done gate or a comparable before/after Broccoli `recipes` table state, and the available artifacts do not otherwise establish failure.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
stronger:
  additional_conditions: []

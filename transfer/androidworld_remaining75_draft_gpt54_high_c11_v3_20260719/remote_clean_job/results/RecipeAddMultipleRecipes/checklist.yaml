schema_version: case_checklist_v1
case_unit_id: RecipeAddMultipleRecipes
domain: androidworld
task_id: RecipeAddMultipleRecipes
native:
  user_goal:
    text: Use the Broccoli app to add all recipes listed in the dispatched goal.
    support:
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.goal
    - derived/selected_task_source.json::metadata_task_template
  benchmark_success:
    text: 'Native success requires both: retained completion evidence shows the episode finished with `done=true`; and the Broccoli `recipes` table satisfies the official add-rows integrity check for this task''s three target recipes, meaning the after-state contains evaluator-matching rows for the three goal recipes, has exactly three more rows than the before-state, and preserves every before-state row unchanged.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_addition_integrity
    - official/install/android_world/task_evals/single/recipe.py::RecipeAddMultipleRecipes
  checked_by:
    text: Check retained completion-gate evidence plus retained Broccoli `recipes` table state before and after the run against the dispatched goal's three recipe rows under the official comparison rule.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
  decisive_artifacts:
  - artifact: Retained dispatched goal text or equivalent task-parameter record
    question: What three recipe rows was this run asked to add?
    support:
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.goal
    - derived/selected_task_source.json::metadata_task_template
  - artifact: Retained pre-run and post-run snapshots of the Broccoli `recipes` table
    question: Do the final rows preserve every pre-run row and add exactly three evaluator-matching recipe rows?
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::SQLiteApp.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_addition_integrity
  - artifact: Retained episode trace or runner completion record
    question: Did the run terminate with `done=true`, or was benchmark success gated to 0 by an unfinished episode?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  success_if:
  - text: Retained completion evidence shows `done=true`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: 'Using the dispatched goal''s three recipes and the retained before/after `recipes` table snapshots, the official add-rows integrity check passes: each goal recipe has an evaluator-matching row in `after` on `title`, `description`, `servings`, `preparationTime`, `source`, `ingredients`, `directions`, and `favorite`; `len(after)=len(before)+3`; and every `before` row is still present unchanged in `after`.'
    support:
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_addition_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::RecipeAddMultipleRecipes
  fail_if:
  - text: Retained completion evidence shows `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: 'The retained `recipes` table evidence shows the official add-rows integrity check fails: any goal recipe lacks an evaluator-matching row in `after`, `after` is not exactly three rows larger than `before`, any `before` row is missing or altered, or an unexpected extra row appears.'
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_addition_integrity
    - official/install/android_world/task_evals/single/recipe.py::RecipeAddMultipleRecipes
  undecided_if:
  - text: The dispatched goal text or equivalent retained task-parameter record is missing or unusable, so the target recipe rows cannot be reconstructed from stored run evidence.
    support:
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.goal
  - text: Required completion-gate evidence or required before/after `recipes` table evidence is missing or unusable, and the remaining retained evidence does not independently establish `done=false` or the pass/fail result of the official add-rows integrity check.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.initialize_task
stronger:
  additional_conditions: []

schema_version: case_checklist_v1
case_unit_id: MarkorAddNoteHeader
domain: androidworld
task_id: MarkorAddNoteHeader
native:
  user_goal:
    text: Update the Markor note named `original_name` by prepending `header`, leaving one blank line before the prior note body, and renaming the note to `new_name`.
    support:
    - derived/canonical_task_semantics.json::goal.template
  benchmark_success:
    text: 'Success requires retained evidence that the episode finished with `done=true` and that evaluator-visible Markor filesystem state satisfies all three released checks: `original_name` is absent, `new_name` is present, and `new_name` content exactly equals `header + "\n\n" + original_content + "\n"`.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorAddNoteHeader.is_successful
  checked_by:
    text: AndroidWorld runner done gate plus `MarkorAddNoteHeader.is_successful`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorAddNoteHeader.is_successful
  decisive_artifacts:
  - artifact: Retained episode termination evidence
    question: Does the retained run evidence show the episode ended with `done=true`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Post-run Markor filesystem listing or snapshot
    question: In `/storage/emulated/0/Documents/Markor`, is `original_name` absent and `new_name` present after the run?
    support:
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    - official/install/android_world/task_evals/single/markor.py::MarkorAddNoteHeader.is_successful
  - artifact: Post-run bytes of the renamed note
    question: Does the retained content of `new_name` exactly equal `header`, then one blank line, then `original_content`, with a trailing newline?
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorAddNoteHeader.is_successful
  success_if:
  - text: Retained episode evidence shows `done=true`, the post-run Markor directory no longer contains `original_name`, does contain `new_name`, and the retained content of `new_name` exactly equals `header + "\n\n" + original_content + "\n"`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    - official/install/android_world/task_evals/single/markor.py::MarkorAddNoteHeader.is_successful
  fail_if:
  - text: Retained episode evidence shows `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Retained post-run Markor filesystem evidence shows `original_name` still exists, or `new_name` is missing.
    support:
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    - official/install/android_world/task_evals/single/markor.py::MarkorAddNoteHeader.is_successful
  - text: Retained content for `new_name` is available and is not exactly `header + "\n\n" + original_content + "\n"`.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorAddNoteHeader.is_successful
  undecided_if:
  - text: The retained evidence does not reliably establish the runner `done` value and also lacks sufficient underlying filesystem evidence to decide success or failure independently.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorAddNoteHeader.is_successful
  - text: The retained evidence shows `done=true` but the post-run Markor filesystem state is missing or incomplete, such as absent directory listing and no retained bytes for `new_name`, so the evaluator-visible file checks cannot be reconstructed.
    support:
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    - official/install/android_world/task_evals/single/markor.py::MarkorAddNoteHeader.is_successful
stronger:
  additional_conditions:
  - id: stronger_runtime_goal_requires_rename
    text: Beyond the native criterion, review should also require evidence that the note was renamed from `original_name` to the runtime-dispatched `new_name`, because the official runtime goal includes renaming while task metadata omits it.
    rationale: 'This closes a concrete source-supported gap between the descriptive metadata template and the runtime-dispatched goal/evaluator semantics: the metadata says only to add text to a note, but the actual task goal and evaluator also require renaming.'
    decisive_artifacts:
    - artifact: Post-run Markor filesystem listing or snapshot
      question: Does retained filesystem evidence show the old filename is gone and the runtime-dispatched `new_name` exists?
      support:
      - official/install/android_world/env/device_constants.py::MARKOR_DATA
      - official/install/android_world/task_evals/single/markor.py::MarkorAddNoteHeader.is_successful
    support:
    - derived/canonical_task_semantics.json::metadata_conflicts
    - derived/canonical_task_semantics.json::goal.template
    - official/install/android_world/task_evals/single/markor.py::MarkorAddNoteHeader.is_successful

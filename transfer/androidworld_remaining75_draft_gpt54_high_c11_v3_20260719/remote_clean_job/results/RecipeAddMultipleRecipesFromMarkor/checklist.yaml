schema_version: case_checklist_v1
case_unit_id: RecipeAddMultipleRecipesFromMarkor
domain: androidworld
task_id: RecipeAddMultipleRecipesFromMarkor
native:
  user_goal:
    text: Add the recipes stored in Markor file `recipes.txt` into the Broccoli recipe app.
    support:
    - official/install/android_world/task_evals/single/recipe.py::RecipeAddMultipleRecipesFromMarkor.goal
    - official/install/android_world/task_metadata.json::377-381
  benchmark_success:
    text: 'Native success requires both runner completion and evaluator success: retained execution evidence shows the episode reached `done=true`, and the final Broccoli `recipes` table would make `AddMultipleRows.is_successful` return `1.0` for this instance by satisfying the official row-addition integrity check against the instance''s target recipe rows.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_addition_integrity
  checked_by:
    text: '`android_world.suite_utils._run_task` done gate plus `android_world.task_evals.common_validators.sqlite_validators.AddMultipleRows.is_successful`, using `_RecipeAddMultipleRecipes.validate_addition_integrity` over the Broccoli SQLite `recipes` table.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::SQLiteApp.list_rows
  decisive_artifacts:
  - artifact: Retained episode trace or equivalent completion record
    question: Does the underlying execution evidence show the episode finished with `done=true` or `done=false`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Retained run-input record for this instance, or preserved Markor `recipes.txt` content
    question: What official target recipe rows were required for this run, and what initial non-target rows were present before the agent acted?
    support:
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.generate_random_params
    - official/install/android_world/task_evals/single/recipe.py::RecipeAddMultipleRecipesFromMarkor.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::SQLiteApp.initialize_task
  - artifact: Retained post-run snapshot of Broccoli database table `recipes`
    question: 'Compared with the official target and initial rows for this instance, does the final table satisfy the evaluator''s addition-integrity rule: each target row present under the official compare-fields rule, all prior rows preserved, and final row count equal to initial rows plus targets?'
    support:
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_addition_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::SQLiteApp.list_rows
  success_if:
  - text: 'Retained execution evidence shows `done=true`, and retained run-input evidence plus the post-run Broccoli `recipes` table establish the official validator would pass: every official target recipe row is present under the evaluator''s compare-fields rule, no initial row is missing or altered, and final row count equals initial row count plus the number of official target rows.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_addition_integrity
  fail_if:
  - text: Retained execution evidence shows the episode did not finish with `done=true`; the runner therefore records native failure for the task.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: 'Retained run-input evidence plus the post-run Broccoli `recipes` table show the official addition-integrity check fails for this instance: any official target row is missing or mismatched under the evaluator''s comparison rule, any initial row is missing or altered, or final row count differs from initial rows plus official target rows.'
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_addition_integrity
  undecided_if:
  - text: The retained evidence does not identify the official target rows for this parameterized instance, and no preserved `recipes.txt` content or equivalent run-input artifact is available to reconstruct them.
    support:
    - official/install/android_world/task_evals/single/recipe.py::RecipeAddMultipleRecipesFromMarkor.goal
    - official/install/android_world/task_evals/single/recipe.py::RecipeAddMultipleRecipesFromMarkor.initialize_task
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.generate_random_params
  - text: The post-run Broccoli `recipes` table snapshot is missing or unusable, and retained completion evidence does not independently establish failure via `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::SQLiteApp.list_rows
  - text: Completion evidence for the runner `done` gate is missing or unusable, while the retained table evidence does not independently establish validator failure.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
stronger:
  additional_conditions:
  - id: named_app_provenance
    text: Require trace evidence that the agent actually read `recipes.txt` in Markor and used the Broccoli app to add the recipes; a matching final Broccoli database state alone is not sufficient.
    rationale: The dispatched goal explicitly names Markor `recipes.txt` as the source and the Broccoli app as the destination, but the native benchmark only checks the final Broccoli SQLite state plus the runner completion gate. This stronger condition closes that source-app/provenance gap.
    decisive_artifacts:
    - artifact: Retained episode trace, screenshots, or foreground-app log
      question: Does the trace show opening or reading `recipes.txt` in Markor and later interacting with the Broccoli app to create the recipe entries?
      support:
      - official/install/android_world/task_evals/single/recipe.py::RecipeAddMultipleRecipesFromMarkor.goal
      - official/install/android_world/task_evals/single/recipe.py::RecipeAddMultipleRecipesFromMarkor.initialize_task
      - official/install/android_world/suite_utils.py::_run_task
    support:
    - official/install/android_world/task_evals/single/recipe.py::RecipeAddMultipleRecipesFromMarkor.goal
    - official/install/android_world/task_evals/single/recipe.py::RecipeAddMultipleRecipesFromMarkor.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity

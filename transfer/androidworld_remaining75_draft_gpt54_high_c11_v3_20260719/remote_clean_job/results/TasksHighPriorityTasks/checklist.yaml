schema_version: case_checklist_v1
case_unit_id: TasksHighPriorityTasks
domain: androidworld
task_id: TasksHighPriorityTasks
native:
  user_goal:
    text: Determine the title(s) of the high priority tasks in Tasks app and answer with the title(s) only; if there is more than one, use a comma-separated list.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksHighPriorityTasks"]
  benchmark_success:
    text: 'Native success requires both: the episode finishes with `done=true`, and the final agent answer in `env.interaction_cache` matches the expected high-priority task title list under the evaluator''s comma-split/trim `STRING_MATCH` rule. In this case packet, initialization seeds one high-priority task and excludes additional random tasks with importance `0`, so the expected list is the single seeded title.'
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksHighPriorityTasks"]
    - official/install/android_world/task_evals/information_retrieval/task_app_utils.py::setup_task_state
    - official/install/android_world/task_evals/information_retrieval/task_app_utils.py::check_task_conditions
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/suite_utils.py::_run_task
  checked_by:
    text: '`InformationRetrieval.is_successful` calls `proto_utils.check_agent_answer` on `env.interaction_cache`, and `suite_utils._run_task` then forces the native score to `0.0` when `interaction_results.done` is false.'
    support:
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/suite_utils.py::_run_task
  decisive_artifacts:
  - artifact: Retained Tasks app state snapshot or database export for the instantiated task state
    question: What task title(s) in this instance have importance `0`, i.e. the expected high-priority title list for the evaluator?
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksHighPriorityTasks"]
    - official/install/android_world/task_evals/information_retrieval/task_app_utils.py::setup_task_state
    - official/install/android_world/task_evals/information_retrieval/task_app_utils.py::check_task_conditions
  - artifact: Retained final answer text or answer-action trace
    question: What final answer text did the agent submit to `env.interaction_cache` for evaluator comparison?
    support:
    - official/install/android_world/env/interface.py::AsyncAndroidEnv.execute_action
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  - artifact: Retained episode trace with terminal completion status
    question: Did the episode finish with `done=true` rather than end unfinished?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  success_if:
  - text: The retained Tasks-app state artifact shows the expected high-priority title list for this instance, the retained final answer text matches that list under the evaluator's comma-split/trim `STRING_MATCH` comparison, and the retained episode trace shows `done=true`.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksHighPriorityTasks"]
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  fail_if:
  - text: The retained episode trace shows `done=false`; the runner maps the episode to native failure regardless of whether the answer text would otherwise match.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: The retained Tasks-app state artifact identifies the expected high-priority title list, and the retained final answer text either was not submitted to `env.interaction_cache` or does not match that list under the evaluator's comma-split/trim `STRING_MATCH` rule.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksHighPriorityTasks"]
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
  undecided_if:
  - text: Stored evidence lacks a reliable Tasks-app state snapshot or database export for this instance, so the expected seeded high-priority title cannot be reconstructed from retained run evidence alone.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksHighPriorityTasks"]
    - official/install/android_world/task_evals/information_retrieval/task_app_utils.py::setup_task_state
    rationale: The prompt itself does not reveal the expected title; it comes from the instantiated relevant state.
  - text: Stored evidence lacks either the submitted final answer text or the terminal `done` status, so the native claim cannot be decided from underlying evidence even if summary success metadata is present.
    support:
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/suite_utils.py::_run_task
    rationale: A summary scalar does not reveal the answer content or whether failure came from answer mismatch versus the `done` gate.
stronger:
  additional_conditions: []

schema_version: case_checklist_v1
case_unit_id: '43'
domain: tau3_retail
task_id: '43'
native:
  user_goal:
    text: Authenticate Lucas Santos via name+zip, then tell him the shipped-to address, tracking number, and whether the order is still in transit, tell him the tablet storage, and change his default address to his daughter's Chicago address.
    support:
    - derived/task.json::user_scenario.instructions.reason_for_call
    - derived/task.json::evaluation_criteria.actions[0].name
    - derived/task.json::evaluation_criteria.actions[0].arguments
    - derived/task.json::evaluation_criteria.actions[4].arguments
    - official/policy.md::lines 10-12
  benchmark_success:
    text: Native success means the released evaluator records a non-premature termination and, under this task's `reward_basis` of `DB` plus `NL_ASSERTION`, returns reward 1.0 because the final predicted agent/user DB hashes match the gold environment after replay of the official actions and every listed NL assertion is met.
    support:
    - derived/task.json::evaluation_criteria.reward_basis
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
    - derived/artifact_inventory.json::native_db_evidence_rule
  checked_by:
    text: Released tau2 native evaluator output, using `evaluate_simulation` with this task's `DB` and `NL_ASSERTION` reward basis; DB is checked by `EnvironmentEvaluator.calculate_reward` and NL assertions by `NLAssertionsEvaluator.calculate_reward`.
    support:
    - derived/task.json::evaluation_criteria.reward_basis
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
  decisive_artifacts:
  - artifact: adapter/native_run/results.json
    question: Does the retained native evaluator output show `termination_reason` of `AGENT_STOP` or `USER_STOP`, `reward_basis` containing `DB` and `NL_ASSERTION`, `db_check.db_match=true`, every `nl_assertions[*].met=true`, and overall reward 1.0?
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].contents[0]
    - derived/artifact_inventory.json::artifact_classes[0].contents[1]
    - derived/artifact_inventory.json::artifact_classes[0].contents[2]
    - derived/artifact_inventory.json::artifact_classes[0].contents[3]
    - derived/artifact_inventory.json::artifact_classes[0].contents[6]
    - derived/task.json::evaluation_criteria.reward_basis
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
  - artifact: adapter/native_run/artifacts/task_<task_id>/sim_<simulation_id>/task.log
    question: If the NL-assertion judgments need transcript support, does the retained conversation show the agent telling the user the tracking number `840887978435`, the shipped-to address `943 Maple Drive, Suite 356, Chicago, IL 60621`, and the tablet storage `64GB`?
    support:
    - derived/artifact_inventory.json::artifact_classes[2].path_pattern
    - derived/task.json::evaluation_criteria.nl_assertions[0]
    - derived/task.json::evaluation_criteria.nl_assertions[1]
    - derived/task.json::evaluation_criteria.nl_assertions[2]
  success_if:
  - text: 'The released native evaluator output shows allowed termination and a passing DB component for this task: `db_check.db_match=true` and `db_check.db_reward=1.0` under reward basis `DB` plus `NL_ASSERTION`.'
    support:
    - derived/task.json::evaluation_criteria.reward_basis
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
  - text: The released native evaluator output shows every recorded NL assertion `met=true`, covering the tracking number `840887978435`, the shipped-to address `943 Maple Drive, Suite 356, Chicago, IL 60621`, and the tablet storage `64GB`.
    support:
    - derived/task.json::evaluation_criteria.nl_assertions[0]
    - derived/task.json::evaluation_criteria.nl_assertions[1]
    - derived/task.json::evaluation_criteria.nl_assertions[2]
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
  fail_if:
  - text: The released native evaluator output records a termination reason other than `AGENT_STOP` or `USER_STOP`.
    support:
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
  - text: The released native evaluator output records `db_check.db_match=false` or `db_check.db_reward=0.0`.
    support:
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - derived/artifact_inventory.json::native_db_evidence_rule
  - text: The released native evaluator output records any listed NL assertion as unmet (`met=false`) or an `NL_ASSERTION` reward of 0.0.
    support:
    - derived/task.json::evaluation_criteria.nl_assertions[0]
    - derived/task.json::evaluation_criteria.nl_assertions[1]
    - derived/task.json::evaluation_criteria.nl_assertions[2]
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
  undecided_if:
  - text: The retained native evaluator output is missing, or it lacks the `termination_reason`, `reward_basis`, `db_check`, or per-assertion `nl_assertions` fields needed to apply the native rule.
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].contents[0]
    - derived/artifact_inventory.json::artifact_classes[0].contents[1]
    - derived/artifact_inventory.json::artifact_classes[0].contents[2]
    - derived/artifact_inventory.json::artifact_classes[0].contents[3]
    - derived/artifact_inventory.json::artifact_classes[0].contents[6]
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
  - text: Only transcript, tool-log, or trace artifacts are retained without the released DB hash comparison; partial entity views or tool results alone cannot establish native DB success or failure.
    support:
    - derived/artifact_inventory.json::artifact_classes[2].limitations[0]
    - derived/artifact_inventory.json::artifact_classes[4].limitations[0]
    - derived/artifact_inventory.json::native_db_evidence_rule
stronger:
  additional_conditions:
  - id: report_in_transit_status
    text: Require transcript evidence that the agent told the user whether the order was still in transit, consistent with the retained order details; native scoring omits this part of the stated user goal.
    rationale: The official user scenario explicitly asks whether the order is still in transit, but the released native rule for this case only scores DB state plus three NL assertions about tracking number, shipped-to address, and tablet storage.
    decisive_artifacts:
    - artifact: adapter/native_run/artifacts/task_<task_id>/sim_<simulation_id>/task.log
      question: Do the retained transcript and order-detail tool results show the agent telling the user whether the relevant order was still in transit, consistently with those tool results?
      support:
      - derived/artifact_inventory.json::artifact_classes[2].path_pattern
      - derived/task.json::user_scenario.instructions.reason_for_call
      - derived/task.json::evaluation_criteria.actions[2].name
      - derived/task.json::evaluation_criteria.actions[3].name
    support:
    - derived/task.json::user_scenario.instructions.reason_for_call
    - derived/task.json::evaluation_criteria.reward_basis
    - derived/task.json::evaluation_criteria.nl_assertions[0]
    - derived/task.json::evaluation_criteria.nl_assertions[1]
    - derived/task.json::evaluation_criteria.nl_assertions[2]
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
  - id: confirm_address_update
    text: Require transcript evidence that before `modify_user_address` the agent listed the address-change details and received an explicit `yes` from the user; native scoring accepts the run without checking this policy-required confirmation step.
    rationale: Retail policy requires explicit confirmation before any database update. This case's native score is based on DB plus NL assertions, so a run can score natively without evidence of the required confirmation dialogue.
    decisive_artifacts:
    - artifact: adapter/native_run/artifacts/task_<task_id>/sim_<simulation_id>/task.log
      question: Before the `modify_user_address` call, does the transcript show the new default-address details and an explicit user `yes` authorizing the update?
      support:
      - derived/artifact_inventory.json::artifact_classes[2].path_pattern
      - official/policy.md::line 16
      - derived/task.json::evaluation_criteria.actions[4].arguments
    support:
    - official/policy.md::line 16
    - derived/task.json::evaluation_criteria.actions[4].name
    - derived/task.json::evaluation_criteria.reward_basis
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation

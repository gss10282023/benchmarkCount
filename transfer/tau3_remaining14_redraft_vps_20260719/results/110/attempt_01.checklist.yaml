schema_version: case_checklist_v1
case_unit_id: '110'
domain: tau3_retail
task_id: '110'
native:
  user_goal:
    text: Have the agent change the shipping address on the wrong order, update Sophia Martin's default address to the same new home, and switch the tablet in another order to the cheapest option, while looking up the address from existing orders instead of asking her to restate it.
    support:
    - derived/task.json::user_scenario.instructions.reason_for_call
  benchmark_success:
    text: Native success is released reward 1.0 for reward_basis [DB, NL_ASSERTION], which requires termination_reason AGENT_STOP or USER_STOP, full agent and user DB hash match against the gold environment after replay of the official actions, and all NL assertions met.
    support:
    - derived/task.json::evaluation_criteria.reward_basis
    - derived/task.json::evaluation_criteria.actions
    - derived/task.json::evaluation_criteria.nl_assertions
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
  checked_by:
    text: Released native evaluator output retained at adapter/native_run/results.json, especially reward, reward_basis, termination_reason, db_check, and nl_assertions.
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].contents
  decisive_artifacts:
  - artifact: adapter/native_run/results.json
    question: Does the released evaluator output show reward_basis [DB, NL_ASSERTION], termination_reason AGENT_STOP or USER_STOP, db_check.db_match=true, and every nl_assertions judgment met=true?
    support:
    - derived/artifact_inventory.json::artifact_classes[0]
    - derived/task.json::evaluation_criteria.reward_basis
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
  success_if:
  - text: adapter/native_run/results.json shows reward=1.0 with reward_basis [DB, NL_ASSERTION], termination_reason AGENT_STOP or USER_STOP, db_check.db_match=true, and every retained NL assertion judgment met=true.
    support:
    - derived/artifact_inventory.json::artifact_classes[0]
    - derived/artifact_inventory.json::native_db_evidence_rule
    - derived/task.json::evaluation_criteria.reward_basis
    - derived/task.json::evaluation_criteria.nl_assertions
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
  fail_if:
  - text: adapter/native_run/results.json shows termination_reason outside {AGENT_STOP, USER_STOP}, or db_check.db_match=false, or any retained NL assertion judgment met=false; under the native product rule any such component failure makes the case fail.
    support:
    - derived/task.json::evaluation_criteria.reward_basis
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
  undecided_if:
  - text: The released evaluator output is missing, incomplete, or inconsistent with the case's reward_basis, so termination_reason, db_check, or per-assertion nl_assertions cannot be established from retained evidence; tool logs or traces alone do not prove the native full-DB hash comparison.
    support:
    - derived/artifact_inventory.json::artifact_classes[0]
    - derived/artifact_inventory.json::artifact_classes[2].limitations
    - derived/artifact_inventory.json::artifact_classes[4].limitations
    - derived/artifact_inventory.json::native_db_evidence_rule
    - derived/task.json::evaluation_criteria.reward_basis
stronger:
  additional_conditions:
  - id: policy_prereqs_before_updates
    text: Beyond native success, the retained conversation/tool record shows the agent authenticated the user via email or name plus zip, then listed the planned address and item changes and received an explicit yes before the first database-modifying tool call.
    rationale: Retail policy requires authentication and explicit confirmation before updates, but this case's native score uses only DB and NL assertion checks, so the released evaluator can accept runs that skip these policy prerequisites.
    decisive_artifacts:
    - artifact: adapter/native_run/artifacts/task_<task_id>/sim_<simulation_id>/task.log
      question: Does the retained conversation/tool chronology show authentication via email or name plus zip, followed by a list of the planned modifications and an explicit yes before the first modifying tool call?
      support:
      - official/policy.md::Retail agent policy
      - derived/artifact_inventory.json::artifact_classes[2]
    support:
    - official/policy.md::Retail agent policy
    - derived/task.json::evaluation_criteria.reward_basis
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
  - id: address_lookup_preference_respected
    text: Beyond native success, the retained conversation/tool record shows the agent obtained the new address from existing order data instead of requiring the user to restate it.
    rationale: The user scenario explicitly says the user does not want to reveal the address and expects the agent to look it up in orders, but native scoring only checks DB end state and the three task NL assertions.
    decisive_artifacts:
    - artifact: adapter/native_run/artifacts/task_<task_id>/sim_<simulation_id>/task.log
      question: Does the retained conversation/tool record show that the user did not provide the new address in conversation and that the agent retrieved it from existing order data before applying the two address changes?
      support:
      - derived/task.json::user_scenario.instructions.reason_for_call
      - derived/artifact_inventory.json::artifact_classes[2]
    support:
    - derived/task.json::user_scenario.instructions.reason_for_call
    - derived/task.json::evaluation_criteria.nl_assertions
    - derived/task.json::evaluation_criteria.reward_basis
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation

schema_version: case_checklist_v1
case_unit_id: '96'
domain: tau3_retail
task_id: '96'
native:
  user_goal:
    text: Authenticate Yusuf Li with the available identity information, then modify his pending order so it ships to his NYC address from another order and swap the Bluetooth Speaker to the cheapest green variant.
    support:
    - derived/task.json::user_scenario.instructions.known_info
    - derived/task.json::user_scenario.instructions.unknown_info
    - derived/task.json::user_scenario.instructions.reason_for_call
    - official/policy.md::Retail agent policy
    - official/policy.md::Modify pending order
    - official/policy.md::Modify items
  benchmark_success:
    text: The benchmark counts success when the released evaluator output reports `reward=1.0`; for this task, because `reward_basis` is `DB` plus `NL_ASSERTION` and `nl_assertions` is null, that is equivalent to a full agent-DB and user-DB hash match against the gold replay of the official modify actions.
    support:
    - derived/task.json::evaluation_criteria.actions[0]
    - derived/task.json::evaluation_criteria.actions[1]
    - derived/task.json::evaluation_criteria.reward_basis[0]
    - derived/task.json::evaluation_criteria.reward_basis[1]
    - derived/task.json::evaluation_criteria.nl_assertions
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
    - derived/artifact_inventory.json::native_db_evidence_rule
  checked_by:
    text: Check the released native evaluator output in `adapter/native_run/results.json`, specifically `termination_reason`, `reward`, `reward_basis`, and `db_check`; partial conversation or tool logs are only secondary because native DB success depends on the evaluator's full DB-hash comparison.
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].contents[0]
    - derived/artifact_inventory.json::artifact_classes[0].contents[1]
    - derived/artifact_inventory.json::artifact_classes[0].contents[2]
    - derived/artifact_inventory.json::artifact_classes[0].contents[6]
    - derived/artifact_inventory.json::native_db_evidence_rule
  decisive_artifacts:
  - artifact: adapter/native_run/results.json
    question: Does the released evaluator output show `termination_reason` of `AGENT_STOP` or `USER_STOP`, `reward_basis` containing `DB` and `NL_ASSERTION`, `db_check.db_match=true`, and scalar `reward=1.0`?
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].contents[0]
    - derived/artifact_inventory.json::artifact_classes[0].contents[1]
    - derived/artifact_inventory.json::artifact_classes[0].contents[2]
    - derived/artifact_inventory.json::artifact_classes[0].contents[6]
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - derived/task.json::evaluation_criteria.reward_basis[0]
    - derived/task.json::evaluation_criteria.reward_basis[1]
  success_if:
  - text: The released evaluator output shows `termination_reason` is `AGENT_STOP` or `USER_STOP` and scalar `reward=1.0`.
    support:
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - derived/artifact_inventory.json::artifact_classes[0].contents[0]
    - derived/artifact_inventory.json::artifact_classes[0].contents[6]
  - text: The same output shows `db_check.db_match=true` and `db_check.db_reward=1.0`; for this task's `DB` + `NL_ASSERTION` basis with `nl_assertions=null`, that DB success is the decisive native condition because the NL-assertion component returns `1.0`.
    support:
    - derived/task.json::evaluation_criteria.reward_basis[0]
    - derived/task.json::evaluation_criteria.reward_basis[1]
    - derived/task.json::evaluation_criteria.nl_assertions
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
    - derived/artifact_inventory.json::native_db_evidence_rule
  fail_if:
  - text: The released evaluator output shows a premature termination, i.e. `termination_reason` is not `AGENT_STOP` or `USER_STOP`, which forces native `reward=0.0`.
    support:
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - derived/artifact_inventory.json::artifact_classes[0].contents[0]
    - derived/artifact_inventory.json::artifact_classes[0].contents[6]
  - text: The released evaluator output shows `db_check.db_match=false` or `db_check.db_reward=0.0`, meaning the run's full agent/user DB state does not match the gold environment after replay of the official modify actions.
    support:
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - derived/task.json::evaluation_criteria.actions[0]
    - derived/task.json::evaluation_criteria.actions[1]
    - derived/artifact_inventory.json::native_db_evidence_rule
  undecided_if:
  - text: '`adapter/native_run/results.json` is missing or lacks decisive fields such as `termination_reason`, `reward`, `reward_basis`, or `db_check`, and only task logs or traces remain; those retained logs can show messages and tool activity but cannot by themselves establish the full DB-hash equality required for native DB success.'
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[2].path_pattern
    - derived/artifact_inventory.json::artifact_classes[2].limitations[0]
    - derived/artifact_inventory.json::artifact_classes[4].limitations[0]
    - derived/artifact_inventory.json::native_db_evidence_rule
stronger:
  additional_conditions:
  - id: policy_auth_and_confirmation
    text: Beyond native scoring, the retained conversation/tool log should show that before either modifying tool call the agent authenticated Yusuf Li via email or via name plus zip code, listed the planned address and item changes for the order, and received an explicit `yes` to proceed.
    rationale: The retail policy requires authentication at the beginning of the conversation and explicit confirmation before any database-updating action, but this case's native scoring uses only `DB` and a vacuous `NL_ASSERTION` check. Because `ACTION` and `COMMUNICATE` are not part of the native reward here, a run can receive native success without these policy-required safeguards.
    decisive_artifacts:
    - artifact: adapter/native_run/artifacts/task_<task_id>/sim_<simulation_id>/task.log
      question: Does the retained conversation/tool log show authentication by email or by name plus zip code and an explicit user `yes` after the agent lists the planned order modifications, before `modify_pending_order_address` or `modify_pending_order_items` is called?
      support:
      - derived/artifact_inventory.json::artifact_classes[2].path_pattern
      - derived/artifact_inventory.json::artifact_classes[2].contents[0]
      - derived/artifact_inventory.json::artifact_classes[2].contents[1]
      - derived/artifact_inventory.json::artifact_classes[2].contents[2]
      - official/policy.md::Retail agent policy
    support:
    - official/policy.md::Retail agent policy
    - derived/task.json::evaluation_criteria.reward_basis[0]
    - derived/task.json::evaluation_criteria.reward_basis[1]
    - derived/task.json::evaluation_criteria.nl_assertions
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - derived/artifact_inventory.json::artifact_classes[0].limitations[1]

schema_version: case_checklist_v1
case_unit_id: '110'
domain: tau3_retail
task_id: '110'
native:
  user_goal:
    text: Have the agent change the shipping address on the wrong order, update Sophia
      Martin's default address to the same new home, and switch the tablet in another
      order to the cheapest option, while looking up the address from existing orders
      instead of asking her to restate it.
    support:
    - derived/task.json::user_scenario.instructions.reason_for_call
  benchmark_success:
    text: 'The released native criterion is the conjunction of: (1) normal termination
      with `termination_reason` equal to `agent_stop` or `user_stop`; (2) the DB component
      produced by the official complete predicted-agent/user DB comparison matches
      the gold environment obtained by replaying the official action list; and (3)
      the 3 official NL assertion(s) are each matched to one retained per-assertion
      judgment and every matched judgment has `met=true`. This defines the native
      claim but does not make the released scalar reward or released success/fail
      label evidence for the later independent S/F/U judgment.'
    support:
    - derived/task.json::evaluation_criteria.reward_basis
    - derived/task.json::evaluation_criteria.actions
    - derived/task.json::evaluation_criteria.nl_assertions
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
    - derived/artifact_inventory.json::native_db_evidence_rule
    - derived/artifact_inventory.json::artifact_classes[0].limitations[0]
  checked_by:
    text: 'Independently inspect component evidence in `adapter/native_run/results.json`:
      select the unique `simulations[*]` entry whose `task_id` matches this case;
      read `termination_reason` from that entry, and read `db_check.db_match`, `db_check.db_reward`,
      and (when the locked task has NL assertions) the case-matched `nl_assertions[*].nl_assertion`
      and `.met` fields from nested `reward_info`. Do not use `reward_info.reward`,
      runtime `reward_basis`, `reward_breakdown`, any prior score, or the separately
      retained released success/fail label to choose S, F, or U.'
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].container_path
    - derived/artifact_inventory.json::artifact_classes[0].selection_rule
    - derived/artifact_inventory.json::artifact_classes[0].field_paths
    - derived/artifact_inventory.json::artifact_classes[0].serialized_values
    - derived/artifact_inventory.json::artifact_classes[0].contents[1]
    - derived/artifact_inventory.json::artifact_classes[0].contents[2]
    - derived/artifact_inventory.json::artifact_classes[0].contents[3]
    - derived/artifact_inventory.json::artifact_classes[0].contents[6]
    - derived/artifact_inventory.json::artifact_classes[0].limitations[0]
    - derived/task.json::evaluation_criteria.reward_basis
    - derived/task.json::evaluation_criteria.nl_assertions
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
  decisive_artifacts:
  - artifact: adapter/native_run/results.json (the simulations[*] entry whose task_id
      matches this case)
    question: Without consulting the released scalar reward or label, do the case-matched
      termination, DB-comparison, and applicable per-assertion NL component fields
      establish every element of the locked native criterion?
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].container_path
    - derived/artifact_inventory.json::artifact_classes[0].selection_rule
    - derived/artifact_inventory.json::artifact_classes[0].field_paths
    - derived/artifact_inventory.json::artifact_classes[0].serialized_values
    - derived/artifact_inventory.json::artifact_classes[0].contents[1]
    - derived/artifact_inventory.json::artifact_classes[0].contents[2]
    - derived/artifact_inventory.json::artifact_classes[0].contents[3]
    - derived/artifact_inventory.json::artifact_classes[0].contents[6]
    - derived/artifact_inventory.json::artifact_classes[0].limitations[0]
    - derived/task.json::evaluation_criteria.reward_basis
    - derived/task.json::evaluation_criteria.nl_assertions
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
  success_if:
  - text: In `adapter/native_run/results.json`, the `simulations[*]` entry whose `task_id`
      matches this case has `termination_reason` in {`agent_stop`, `user_stop`}; its
      `reward_info.db_check` has `db_match=true` and `db_reward=1.0`; and the retained
      NL judgments cover each of the 3 locked official assertion(s) exactly once and
      every matched judgment has `met=true`.
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].container_path
    - derived/artifact_inventory.json::artifact_classes[0].selection_rule
    - derived/artifact_inventory.json::artifact_classes[0].field_paths
    - derived/artifact_inventory.json::artifact_classes[0].serialized_values
    - derived/artifact_inventory.json::artifact_classes[0].contents[1]
    - derived/artifact_inventory.json::artifact_classes[0].contents[2]
    - derived/artifact_inventory.json::artifact_classes[0].contents[3]
    - derived/artifact_inventory.json::artifact_classes[0].contents[6]
    - derived/artifact_inventory.json::artifact_classes[0].limitations[0]
    - derived/task.json::evaluation_criteria.reward_basis
    - derived/task.json::evaluation_criteria.nl_assertions
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
  fail_if:
  - text: The case-matching `simulations[*]` entry records `termination_reason` outside
      {`agent_stop`, `user_stop`}. This component establishes native failure directly;
      the released scalar reward or label is not consulted.
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].container_path
    - derived/artifact_inventory.json::artifact_classes[0].selection_rule
    - derived/artifact_inventory.json::artifact_classes[0].field_paths
    - derived/artifact_inventory.json::artifact_classes[0].serialized_values
    - derived/artifact_inventory.json::artifact_classes[0].contents[6]
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
  - text: The case-matching simulation's `reward_info.db_check` consistently records
      `db_match=false` and `db_reward=0.0`. Because DB is in the locked native criterion,
      this component evidence establishes native failure without using the released
      scalar reward or label.
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].selection_rule
    - derived/artifact_inventory.json::artifact_classes[0].field_paths
    - derived/artifact_inventory.json::artifact_classes[0].contents[1]
    - derived/artifact_inventory.json::artifact_classes[0].contents[2]
    - derived/task.json::evaluation_criteria.reward_basis
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
  - text: With allowed termination, the case-matching simulation's `reward_info.nl_assertions`
      contains a judgment matched to one of the locked official assertions with `met=false`;
      because NL_ASSERTION is in the locked native criterion, that component evidence
      establishes native failure without using the released scalar reward or label.
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].selection_rule
    - derived/artifact_inventory.json::artifact_classes[0].field_paths
    - derived/artifact_inventory.json::artifact_classes[0].contents[1]
    - derived/artifact_inventory.json::artifact_classes[0].contents[3]
    - derived/task.json::evaluation_criteria.reward_basis
    - derived/task.json::evaluation_criteria.nl_assertions
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
  undecided_if:
  - text: The case-matching `simulations[*]` entry cannot be identified, or the retained
      component evidence is missing, truncated, misassociated, or internally inconsistent
      (including disagreement between `db_match` and `db_reward`, or incomplete/duplicate/mismatched
      NL judgments where NL assertions are required), so neither native success nor
      native failure is established. Missing `reward_info.reward`, runtime `reward_basis`,
      `reward_breakdown`, a prior score, or the released label alone never causes
      U because those values are non-decisive. Conversation, tool logs, or partial
      entity views alone do not establish the official complete agent/user DB comparison.
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].container_path
    - derived/artifact_inventory.json::artifact_classes[0].selection_rule
    - derived/artifact_inventory.json::artifact_classes[0].field_paths
    - derived/artifact_inventory.json::artifact_classes[0].serialized_values
    - derived/artifact_inventory.json::artifact_classes[0].contents[0]
    - derived/artifact_inventory.json::artifact_classes[0].contents[1]
    - derived/artifact_inventory.json::artifact_classes[0].contents[2]
    - derived/artifact_inventory.json::artifact_classes[0].contents[3]
    - derived/artifact_inventory.json::artifact_classes[0].contents[6]
    - derived/artifact_inventory.json::artifact_classes[2].limitations[0]
    - derived/artifact_inventory.json::native_db_evidence_rule
stronger:
  additional_conditions:
  - id: policy_prereqs_before_updates
    text: Beyond native success, the retained record shows authentication via Sophia
      Martin's provided email (or name plus zip if user-supplied); checks each order
      is pending before its address/item modification; lists the address, default-profile,
      and complete tablet-item changes plus a user-provided or authorized price-difference
      payment method; reminds the user to confirm all items; and obtains explicit
      `yes` before the database updates.
    rationale: These are concrete prerequisites stated by this case's official user
      scenario and the released retail policy, but the locked DB + NL_ASSERTION native
      criterion does not operationalize the authentication, state-check, confirmation,
      item-completeness, or payment-selection workflow itself.
    decisive_artifacts:
    - artifact: adapter/native_run/artifacts/task_<task_id>/sim_<simulation_id>/task.log
      question: Do the records establish valid authentication, each pending-status
        check, complete address/profile/item/payment details, item-completeness reminder,
        and explicit yes before the updates?
      support:
      - derived/artifact_inventory.json::artifact_classes[2].path_pattern
      - derived/artifact_inventory.json::artifact_classes[2].contents[0]
      - derived/artifact_inventory.json::artifact_classes[2].contents[1]
      - derived/task.json::user_scenario.instructions.known_info
      - derived/task.json::user_scenario.instructions.unknown_info
      - derived/task.json::user_scenario.instructions.reason_for_call
      - official/policy.md::lines 10-16
      - official/policy.md::lines 82-84
      - official/policy.md::lines 94-114
      - derived/task.json::evaluation_criteria.reward_basis
      - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    support:
    - derived/task.json::user_scenario.instructions.known_info
    - derived/task.json::user_scenario.instructions.unknown_info
    - derived/task.json::user_scenario.instructions.reason_for_call
    - official/policy.md::lines 10-16
    - official/policy.md::lines 82-84
    - official/policy.md::lines 94-114
    - derived/task.json::evaluation_criteria.reward_basis
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
  - id: address_lookup_preference_respected
    text: Beyond native success, the retained conversation/tool record shows the agent
      obtained the new address from existing order data instead of requiring the user
      to restate it.
    rationale: The user scenario explicitly says the user does not want to reveal
      the address and expects the agent to look it up in orders, but native scoring
      only checks DB end state and the three task NL assertions.
    decisive_artifacts:
    - artifact: adapter/native_run/artifacts/task_<task_id>/sim_<simulation_id>/task.log
      question: Does the retained conversation/tool record show that the user did
        not provide the new address in conversation and that the agent retrieved it
        from existing order data before applying the two address changes?
      support:
      - derived/task.json::user_scenario.instructions.reason_for_call
      - derived/artifact_inventory.json::artifact_classes[2]
    support:
    - derived/task.json::user_scenario.instructions.reason_for_call
    - derived/task.json::evaluation_criteria.nl_assertions
    - derived/task.json::evaluation_criteria.reward_basis
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation

schema_version: case_checklist_v1
case_unit_id: '88'
domain: tau3_retail
task_id: '88'
native:
  user_goal:
    text: 'Help Daiki Silva with order #W8835847: change the book shelf to 4 foot with the same material and color if possible; otherwise cancel the order, using reason ordered by mistake if a cancellation reason is requested.'
    support:
    - derived/task.json::user_scenario.instructions.reason_for_call
    - derived/task.json::user_scenario.instructions.known_info
    - derived/task.json::evaluation_criteria.actions[0].arguments.order_id
  benchmark_success:
    text: 'Native success is a normally terminated run with released reward 1.0. For task 88, because reward_basis is DB plus NL_ASSERTION, this requires DB hash match against the gold replay of the official cancellation action for order #W8835847 with reason ordered by mistake; the NL_ASSERTION component is 1.0 because no NL assertions are defined.'
    support:
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
    - derived/task.json::evaluation_criteria.reward_basis[0]
    - derived/task.json::evaluation_criteria.reward_basis[1]
    - derived/task.json::evaluation_criteria.actions[0].arguments.order_id
    - derived/task.json::evaluation_criteria.actions[0].arguments.reason
    - derived/task.json::evaluation_criteria.nl_assertions
  checked_by:
    text: The released native evaluator output in adapter/native_run/results.json, especially termination_reason, reward, reward_basis, db_check, and nl_assertions.
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].contents[0]
    - derived/artifact_inventory.json::artifact_classes[0].contents[1]
    - derived/artifact_inventory.json::artifact_classes[0].contents[2]
    - derived/artifact_inventory.json::artifact_classes[0].contents[3]
    - derived/artifact_inventory.json::artifact_classes[0].contents[6]
  decisive_artifacts:
  - artifact: adapter/native_run/results.json
    question: Does the retained native evaluator output show termination_reason AGENT_STOP or USER_STOP, reward 1.0, reward_basis [DB, NL_ASSERTION], and db_check.db_match true?
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - derived/task.json::evaluation_criteria.reward_basis[0]
    - derived/task.json::evaluation_criteria.reward_basis[1]
  success_if:
  - text: adapter/native_run/results.json shows termination_reason AGENT_STOP or USER_STOP and released reward 1.0.
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].contents[0]
    - derived/artifact_inventory.json::artifact_classes[0].contents[6]
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
  - text: 'The same retained output is consistent with this task''s native components: reward_basis is DB plus NL_ASSERTION, db_check.db_match is true, and the NL_ASSERTION component is not failed because evaluation_criteria.nl_assertions is null.'
    support:
    - derived/task.json::evaluation_criteria.reward_basis[0]
    - derived/task.json::evaluation_criteria.reward_basis[1]
    - derived/task.json::evaluation_criteria.nl_assertions
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
  fail_if:
  - text: adapter/native_run/results.json shows a termination_reason other than AGENT_STOP or USER_STOP.
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].contents[6]
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
  - text: Or the retained native evaluator output shows reward 0.0 or db_check.db_match false; with reward_basis DB plus NL_ASSERTION and no NL assertions to satisfy, a DB mismatch is native failure for this task.
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].contents[0]
    - derived/artifact_inventory.json::artifact_classes[0].contents[2]
    - derived/task.json::evaluation_criteria.reward_basis[0]
    - derived/task.json::evaluation_criteria.reward_basis[1]
    - derived/task.json::evaluation_criteria.nl_assertions
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
  undecided_if:
  - text: adapter/native_run/results.json is missing or lacks the termination_reason, reward, reward_basis, or db_check fields needed to read the released native outcome, and the remaining retained trajectory artifacts are only partial conversation/tool observations that do not prove the required full agent/user DB hash match.
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[2].path_pattern
    - derived/artifact_inventory.json::artifact_classes[2].limitations[0]
    - derived/artifact_inventory.json::native_db_evidence_rule
stronger:
  additional_conditions:
  - id: policy_compliant_cancellation
    text: Retained conversation/tool evidence shows the agent authenticated the user at the start via email or name plus zip, verified the order was pending, listed the cancellation details, and obtained explicit user yes-confirmation before calling cancel_pending_order.
    rationale: The official retail policy requires authentication and explicit confirmation before any database-updating action, and the cancel flow requires a pending-order check plus confirmation of order id and reason. Native success here can still be awarded from DB hash equality with a vacuous NL_ASSERTION component.
    decisive_artifacts:
    - artifact: adapter/native_run/artifacts/task_<task_id>/sim_<simulation_id>/task.log
      question: Does the retained conversation/tool log show authentication, a pending-order check, a statement of order id and cancellation reason, explicit user yes-confirmation, and only then the cancel_pending_order call?
      support:
      - derived/artifact_inventory.json::artifact_classes[2].path_pattern
      - derived/artifact_inventory.json::artifact_classes[2].contents[0]
      - derived/artifact_inventory.json::artifact_classes[2].contents[1]
      - official/policy.md::Retail agent policy
      - official/policy.md::Cancel pending order
    support:
    - official/policy.md::Retail agent policy
    - official/policy.md::Cancel pending order
    - derived/task.json::evaluation_criteria.reward_basis[0]
    - derived/task.json::evaluation_criteria.reward_basis[1]
    - derived/task.json::evaluation_criteria.nl_assertions
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
  - id: modify_if_available_before_cancel
    text: 'Retained conversation/tool evidence shows the agent treated cancellation as conditional: it checked whether the same book shelf was available in 4 foot with the same material and color, and cancelled order #W8835847 only if that replacement was unavailable.'
    rationale: The user scenario says to change the book shelf to 4 foot if possible and cancel only if it is not available. The released evaluator instead replays only the official cancellation action into the gold environment, so native success can be recorded without evidence that availability was checked or that modification was impossible.
    decisive_artifacts:
    - artifact: adapter/native_run/artifacts/task_<task_id>/sim_<simulation_id>/task.log
      question: Does the retained conversation/tool log show a lookup or tool result establishing whether the same book shelf was available in 4 foot with the same material and color before cancellation, or show a modify-order action instead if it was available?
      support:
      - derived/artifact_inventory.json::artifact_classes[2].path_pattern
      - derived/artifact_inventory.json::artifact_classes[2].contents[0]
      - derived/artifact_inventory.json::artifact_classes[2].contents[1]
      - derived/artifact_inventory.json::artifact_classes[2].contents[2]
      - official/policy.md::Modify items
    support:
    - derived/task.json::user_scenario.instructions.reason_for_call
    - official/policy.md::Modify pending order
    - official/policy.md::Modify items
    - derived/task.json::evaluation_criteria.actions[0].name
    - derived/task.json::evaluation_criteria.actions[0].arguments.order_id
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward

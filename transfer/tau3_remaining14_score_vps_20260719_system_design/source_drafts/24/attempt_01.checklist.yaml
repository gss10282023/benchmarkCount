schema_version: case_checklist_v1
case_unit_id: '24'
domain: tau3_retail
task_id: '24'
native:
  user_goal:
    text: The user abandons the grill cancellation if asked to confirm, keeps the grill, then wants to know which two t-shirts in another order she bought and what materials they are.
    support:
    - derived/task.json::user_scenario.instructions.reason_for_call
  benchmark_success:
    text: 'Native success requires non-premature termination and reward 1.0 under reward_basis [DB, NL_ASSERTION]: the full predicted agent/user DB hashes match the evaluator''s comparison environment for this task''s empty reference-action set, and the sole NL assertion that the agent says the two t-shirt materials are polyester and cotton is met.'
    support:
    - derived/task.json::evaluation_criteria.reward_basis
    - derived/task.json::evaluation_criteria.actions
    - derived/task.json::evaluation_criteria.nl_assertions[0]
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
  checked_by:
    text: 'Released tau2-bench evaluator: premature termination gets reward 0; otherwise `evaluate_simulation` multiplies this task''s DB and NL_ASSERTION components, with DB from full predicted-versus-comparison agent/user DB hash comparison and NL_ASSERTION from the LLM-judged assertion result.'
    support:
    - derived/task.json::evaluation_criteria.reward_basis
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
  decisive_artifacts:
  - artifact: adapter/native_run/results.json
    question: Does the retained native evaluator output record an allowed termination, reward_basis [DB, NL_ASSERTION], `db_check.db_match`, and the sole NL-assertion judgment?
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].contents[0]
    - derived/artifact_inventory.json::artifact_classes[0].contents[1]
    - derived/artifact_inventory.json::artifact_classes[0].contents[2]
    - derived/artifact_inventory.json::artifact_classes[0].contents[3]
    - derived/artifact_inventory.json::artifact_classes[0].contents[6]
    - derived/task.json::evaluation_criteria.reward_basis
    - derived/task.json::evaluation_criteria.nl_assertions[0]
  success_if:
  - text: '`adapter/native_run/results.json` shows `termination_reason` in {`AGENT_STOP`,`USER_STOP`}, reward_basis [DB, NL_ASSERTION], reward 1.0, `db_check.db_match=true`, and the sole NL assertion marked met.'
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].contents[0]
    - derived/artifact_inventory.json::artifact_classes[0].contents[1]
    - derived/artifact_inventory.json::artifact_classes[0].contents[2]
    - derived/artifact_inventory.json::artifact_classes[0].contents[3]
    - derived/artifact_inventory.json::artifact_classes[0].contents[6]
    - derived/task.json::evaluation_criteria.reward_basis
    - derived/task.json::evaluation_criteria.nl_assertions[0]
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
  fail_if:
  - text: '`adapter/native_run/results.json` shows `termination_reason` outside {`AGENT_STOP`,`USER_STOP`}.'
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].contents[6]
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
  - text: '`adapter/native_run/results.json` shows reward_basis [DB, NL_ASSERTION] and `db_check.db_match=false`.'
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].contents[1]
    - derived/artifact_inventory.json::artifact_classes[0].contents[2]
    - derived/task.json::evaluation_criteria.reward_basis
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
  - text: '`adapter/native_run/results.json` shows the sole NL assertion is not met.'
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].contents[3]
    - derived/task.json::evaluation_criteria.nl_assertions[0]
    - derived/task.json::evaluation_criteria.reward_basis
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
  undecided_if:
  - text: The released native evaluator output is missing or internally inconsistent on `termination_reason`, `reward_basis`, `db_check`, or the per-assertion NL judgment needed to reconstruct the DB x NL_ASSERTION decision; task logs or traces alone do not establish native DB success.
    support:
    - derived/artifact_inventory.json::artifact_classes[0].path_pattern
    - derived/artifact_inventory.json::artifact_classes[0].contents[1]
    - derived/artifact_inventory.json::artifact_classes[0].contents[2]
    - derived/artifact_inventory.json::artifact_classes[0].contents[3]
    - derived/artifact_inventory.json::artifact_classes[0].contents[6]
    - derived/artifact_inventory.json::native_db_evidence_rule
    - derived/artifact_inventory.json::artifact_classes[2].limitations[0]
stronger:
  additional_conditions:
  - id: identify_two_tshirts
    text: Beyond native success, retained conversation evidence shows the agent identified which two ordered t-shirts it was answering about, not only that their materials are polyester and cotton.
    rationale: The task asks which two t-shirts in another order were purchased and what materials they are, but native scoring only requires DB no-change plus an NL assertion about the materials.
    decisive_artifacts:
    - artifact: adapter/native_run/results.json
      question: Do the retained conversation messages show the agent naming or otherwise uniquely identifying the two ordered t-shirts?
      support:
      - derived/artifact_inventory.json::artifact_classes[0].path_pattern
      - derived/artifact_inventory.json::artifact_classes[0].contents[7]
      - derived/task.json::user_scenario.instructions.reason_for_call
    support:
    - derived/task.json::user_scenario.instructions.reason_for_call
    - derived/task.json::evaluation_criteria.nl_assertions[0]
    - derived/task.json::evaluation_criteria.reward_basis
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
  - id: no_order_update_after_retraction
    text: Beyond native success, retained tool records show the agent did not issue a cancellation or other order-update tool call after the user backed out instead of confirming.
    rationale: The task says the user regrets the cancellation and wants to keep the grill if asked to confirm, and policy requires explicit confirmation before any DB-updating action; native DB scoring checks only final DB hashes, so a failed or otherwise non-persistent update attempt can escape native failure.
    decisive_artifacts:
    - artifact: adapter/native_run/artifacts/task_<task_id>/sim_<simulation_id>/task.log
      question: Do the retained conversation and tool-call records show no cancellation or other order-update call after the user retracts confirmation?
      support:
      - derived/artifact_inventory.json::artifact_classes[2].path_pattern
      - derived/artifact_inventory.json::artifact_classes[2].contents[0]
      - derived/artifact_inventory.json::artifact_classes[2].contents[1]
      - derived/task.json::user_scenario.instructions.reason_for_call
    support:
    - derived/task.json::user_scenario.instructions.reason_for_call
    - official/policy.md::Retail agent policy
    - official/policy.md::Cancel pending order
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - derived/artifact_inventory.json::native_db_evidence_rule

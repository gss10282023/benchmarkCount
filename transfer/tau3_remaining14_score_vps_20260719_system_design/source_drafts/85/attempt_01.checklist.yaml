schema_version: case_checklist_v1
case_unit_id: '85'
domain: tau3_retail
task_id: '85'
native:
  user_goal:
    text: Authenticate Yusuf Hernandez and help him change his fleece jacket to the large red half-zip variant he wants.
    support:
    - derived/task.json::user_scenario.instructions.known_info
    - derived/task.json::user_scenario.instructions.reason_for_call
    - official/policy.md::Retail agent policy
  benchmark_success:
    text: 'Native success is released reward `1.0`: the run ends with `AGENT_STOP` or `USER_STOP`, and the evaluator''s full agent/user DB hash check matches the gold environment after replaying the single official action `modify_pending_order_items` on order `#W2466703`, replacing item `9385662952` with `8733974883` using payment method `paypal_7529813`; the `NL_ASSERTION` factor is vacuously `1.0` because this task has no `nl_assertions`.'
    support:
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
    - derived/task.json::evaluation_criteria.actions[0]
    - derived/task.json::evaluation_criteria.reward_basis
    - derived/task.json::evaluation_criteria.nl_assertions
  checked_by:
    text: Released native evaluator output in `adapter/native_run/results.json`, using `termination_reason`, scalar `reward`, `reward_basis`, and `db_check`.
    support:
    - derived/artifact_inventory.json::artifact_classes[0]
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
  decisive_artifacts:
  - artifact: Released native evaluator output (`adapter/native_run/results.json`)
    question: Does it record `termination_reason` in `{AGENT_STOP, USER_STOP}`, `reward_basis` `[DB, NL_ASSERTION]`, `db_check.db_match=true`, and scalar `reward=1.0`?
    support:
    - derived/artifact_inventory.json::artifact_classes[0]
    - derived/task.json::evaluation_criteria.reward_basis
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
  success_if:
  - text: '`adapter/native_run/results.json` records `termination_reason` in `{AGENT_STOP, USER_STOP}`, `reward_basis` `[DB, NL_ASSERTION]`, `db_check.db_match=true` and `db_check.db_reward=1.0`, and scalar `reward=1.0`; with `nl_assertions=null`, there is no additional failing NL-assertion check.'
    support:
    - derived/artifact_inventory.json::artifact_classes[0]
    - derived/task.json::evaluation_criteria.reward_basis
    - derived/task.json::evaluation_criteria.nl_assertions
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - official/tau2_bench/src/tau2/evaluator/evaluator_nl_assertions.py::NLAssertionsEvaluator.calculate_reward
  fail_if:
  - text: '`adapter/native_run/results.json` shows `termination_reason` outside `{AGENT_STOP, USER_STOP}`; under the released evaluator this yields reward `0.0`.'
    support:
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - derived/artifact_inventory.json::artifact_classes[0]
  - text: With normal termination, `adapter/native_run/results.json` shows `db_check.db_match=false`, `db_check.db_reward=0.0`, or scalar `reward<1.0` for this task's `DB`/`NL_ASSERTION` basis.
    support:
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - derived/task.json::evaluation_criteria.reward_basis
    - derived/artifact_inventory.json::artifact_classes[0]
  undecided_if:
  - text: Undecided if `adapter/native_run/results.json` is missing or does not clearly retain `termination_reason`, `reward_basis`, and `db_check`, because retained task logs alone do not prove the evaluator's full predicted-agent-DB and predicted-user-DB hash comparison.
    support:
    - derived/artifact_inventory.json::artifact_classes[0]
    - derived/artifact_inventory.json::artifact_classes[2].limitations[0]
    - derived/artifact_inventory.json::native_db_evidence_rule
stronger:
  additional_conditions:
  - id: policy_auth_and_confirm_before_modify
    text: Beyond native success, retained conversation evidence should show the agent authenticated the user via email or name + zip before any `modify_pending_order_items` call, then listed the modification details and received explicit `yes` before invoking that tool.
    rationale: The retail policy requires authentication at the beginning and explicit confirmation before any database update, but this task's released evaluator bases success on DB/NL-assertion reward only, with `communicate_info=[]` and `nl_assertions=null`, so a run can satisfy native success without either conversational safeguard.
    decisive_artifacts:
    - artifact: Official runner conversation/tool log (`adapter/native_run/artifacts/task_<task_id>/sim_<simulation_id>/task.log`)
      question: Does the retained conversation show authentication via email or name + zip before the `modify_pending_order_items` call, and an explicit `yes` after the agent lists the modification details and before that call?
      support:
      - derived/artifact_inventory.json::artifact_classes[2]
      - official/policy.md::Retail agent policy
      - official/policy.md::Modify items
    support:
    - official/policy.md::Retail agent policy
    - official/policy.md::Modify items
    - derived/task.json::evaluation_criteria.reward_basis
    - derived/task.json::evaluation_criteria.communicate_info
    - derived/task.json::evaluation_criteria.nl_assertions
    - official/tau2_bench/src/tau2/evaluator/evaluator.py::evaluate_simulation
    - official/tau2_bench/src/tau2/evaluator/evaluator_env.py::EnvironmentEvaluator.calculate_reward

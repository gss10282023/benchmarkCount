schema_version: case_checklist_v1
case_unit_id: SystemBluetoothTurnOff
domain: androidworld
task_id: SystemBluetoothTurnOff
native:
  user_goal:
    text: Turn Bluetooth off on the device.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle
    - official/install/android_world/task_evals/single/system.py::SystemBluetoothTurnOff.generate_random_params
  benchmark_success:
    text: Native benchmark success is a final recorded `is_successful` score of `1.0` for `SystemBluetoothTurnOff`, which under the released runner means the episode finished normally and the task evaluator returned `1.0`; for this case the evaluator reads `settings get global bluetooth_on` and requires the value `0` because `on_or_off` is `off`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::SystemBluetoothTurnOff.generate_random_params
  checked_by:
    text: AndroidWorld’s suite runner, using the `SystemBluetoothTurnOff` evaluator implementation in `_SystemBluetoothToggle.is_successful`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
  decisive_artifacts:
  - artifact: episode result record
    question: Does the retained run result for `SystemBluetoothTurnOff` show a normal final `is_successful` decision (`1.0` or `0.0`) rather than an exception/NaN outcome?
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/suite_utils.py::_create_failed_result
    - official/install/android_world/suite_utils.py::_run_task_suite
  - artifact: post-run Bluetooth-state evidence
    question: If needed to reconstruct the evaluator-visible state, does retained post-run ADB/settings evidence show the value of `global.bluetooth_on` at evaluation time (`0` means off, `1` means on)?
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
  success_if:
  - text: The retained episode result record shows a normal final `is_successful` value of `1.0` for this case; equivalently, retained evidence could show the run finished normally and the evaluator’s post-run `global.bluetooth_on` check saw `0`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
  fail_if:
  - text: The retained episode result record shows a normal final `is_successful` value of `0.0` for this case.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: If reconstructing from evaluator-visible state, retained evidence shows a normally finished run whose post-run `global.bluetooth_on` value was not `0`; that makes the evaluator return `0.0`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
  undecided_if:
  - text: The retained evidence does not preserve a normal final benchmark decision for this case.
    support:
    - official/install/android_world/suite_utils.py::_create_failed_result
    - official/install/android_world/suite_utils.py::_run_task_suite
    rationale: If the stored record is missing, records an execution/evaluation exception, or otherwise lacks a normal final `is_successful` decision, the native benchmark claim cannot be verified from retained post-run evidence alone.
  - text: The retained evidence cannot establish the evaluator-visible Bluetooth state at post-run evaluation time.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
    rationale: When the result record is not decisive and there is no reliable retained evidence of the post-run `global.bluetooth_on` value, the evaluator outcome cannot be reconstructed.
stronger:
  additional_conditions: []

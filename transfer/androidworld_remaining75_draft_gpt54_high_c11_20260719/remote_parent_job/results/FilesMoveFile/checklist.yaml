schema_version: case_checklist_v1
case_unit_id: FilesMoveFile
domain: androidworld
task_id: FilesMoveFile
native:
  user_goal:
    text: Move the specified file from the specified source folder to the specified destination folder within the emulator storage area.
    support:
    - official/install/android_world/task_evals/single/files.py::FilesMoveFile.template
    - official/install/android_world/task_metadata.json::176-181
  benchmark_success:
    text: 'Native benchmark success requires a normal scored run under the AndroidWorld runner and a passing file-move end-state check: the episode is not an evaluator exception, it is not forced to 0 by the runner''s `done` gate, and the end-of-run filesystem state makes `MoveFile.is_successful` return 1.0 by leaving `file_name` absent from `/storage/emulated/0/{source_folder}` and present in `/storage/emulated/0/{destination_folder}`.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/files.py::FilesMoveFile.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.is_successful
    - official/install/android_world/env/device_constants.py::EMULATOR_DATA
  checked_by:
    text: Checked by `FilesMoveFile.is_successful`, which delegates to `MoveFile.is_successful`, with final benchmark scoring applied by the AndroidWorld runner's completion gate.
    support:
    - official/install/android_world/task_evals/single/files.py::FilesMoveFile.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  decisive_artifacts:
  - artifact: task instance record
    question: What are the run's `file_name`, `source_folder`, and `destination_folder` values for this FilesMoveFile instance?
    support:
    - official/install/android_world/task_evals/single/files.py::FilesMoveFile.schema
    - official/install/android_world/task_evals/single/files.py::FilesMoveFile.template
  - artifact: end-of-run filesystem evidence
    question: At the end of the run, is `file_name` absent from `/storage/emulated/0/{source_folder}` and present in `/storage/emulated/0/{destination_folder}`?
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.is_successful
    - official/install/android_world/env/device_constants.py::EMULATOR_DATA
  - artifact: episode result record
    question: Did the run finish without evaluator exception, and was benchmark scoring not forced to 0 by the runner because the episode failed to finish?
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/suite_utils.py::_create_failed_result
  success_if:
  - text: The retained task instance record identifies `file_name`, `source_folder`, and `destination_folder`; the episode result record shows no evaluator exception and a completed scored run; and end-of-run filesystem evidence shows `file_name` absent from `/storage/emulated/0/{source_folder}` and present in `/storage/emulated/0/{destination_folder}`.
    support:
    - official/install/android_world/task_evals/single/files.py::FilesMoveFile.schema
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.is_successful
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/env/device_constants.py::EMULATOR_DATA
  fail_if:
  - text: The run is otherwise scoreable, but end-of-run filesystem evidence shows `file_name` still present in `/storage/emulated/0/{source_folder}`.
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.is_successful
    - official/install/android_world/env/device_constants.py::EMULATOR_DATA
  - text: The run is otherwise scoreable, but end-of-run filesystem evidence shows `file_name` absent from `/storage/emulated/0/{destination_folder}`.
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.is_successful
    - official/install/android_world/env/device_constants.py::EMULATOR_DATA
  - text: The episode result record shows the runner completion gate failed, so benchmark scoring was forced to 0 even if the filesystem state might otherwise look correct.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  undecided_if:
  - text: The episode result record shows an execution or evaluator exception, yielding a non-scored failed result rather than a native success/failure decision for the case.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/suite_utils.py::_create_failed_result
  - text: The retained evidence does not reliably identify the run's `file_name`, `source_folder`, and `destination_folder`, or does not preserve enough end-of-run filesystem state to check both required path conditions.
    support:
    - official/install/android_world/task_evals/single/files.py::FilesMoveFile.schema
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.is_successful
    - official/install/android_world/env/device_constants.py::EMULATOR_DATA
  - text: The retained evidence does not establish whether the runner's episode-completion gate was satisfied.
    support:
    - official/install/android_world/suite_utils.py::_run_task
stronger:
  additional_conditions: []

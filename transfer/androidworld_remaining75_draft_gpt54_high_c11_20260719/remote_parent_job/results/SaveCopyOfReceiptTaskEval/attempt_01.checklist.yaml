schema_version: case_checklist_v1
case_unit_id: SaveCopyOfReceiptTaskEval
domain: androidworld
task_id: SaveCopyOfReceiptTaskEval
native:
  user_goal:
    text: Complete the Simple Gallery Pro task by copying the named receipt image from DCIM and saving a copy with the same name in Download.
    support:
    - official/install/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
  benchmark_success:
    text: Native benchmark success is a scored run where the suite runner's done gate is satisfied and the task evaluator finds an entry at /storage/emulated/0/Download/{file_name}; otherwise the runner records 0.0 for the case.
    support:
    - official/install/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.is_successful
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/env/device_constants.py::DOWNLOAD_DATA
  checked_by:
    text: Checked by SaveCopyOfReceiptTaskEval.is_successful's Download-path existence test, composed with the suite runner's done gate.
    support:
    - official/install/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.is_successful
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/utils/file_utils.py::check_file_or_folder_exists
  decisive_artifacts:
  - artifact: Task instance record or dispatched goal text
    question: What exact {file_name} was this case instance evaluated against?
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
    - official/install/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval
  - artifact: Episode result record
    question: Does the retained scored result for this case have exception_info null, and what native is_successful value was recorded?
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/suite_utils.py::_run_task_suite
  - artifact: Post-run Download filesystem listing or snapshot
    question: Does the exact path /storage/emulated/0/Download/{file_name} exist after the run?
    support:
    - official/install/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.is_successful
    - official/install/android_world/env/device_constants.py::DOWNLOAD_DATA
    - official/install/android_world/utils/file_utils.py::check_file_or_folder_exists
  success_if:
  - text: The retained result record is a scored run with exception_info null and native is_successful = 1.0, and retained post-run filesystem evidence shows the exact path /storage/emulated/0/Download/{file_name} exists.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.is_successful
    - official/install/android_world/env/device_constants.py::DOWNLOAD_DATA
    - official/install/android_world/utils/file_utils.py::check_file_or_folder_exists
  fail_if:
  - text: The retained result record is a scored run with exception_info null and native is_successful = 0.0.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.is_successful
    rationale: For this task the native runner records 0.0 when the episode does not finish or when the Download-path existence check fails.
  undecided_if:
  - text: The retained evidence does not identify the exact {file_name} for this case instance.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
    - official/install/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval
  - text: There is no retained scored result record for the case, or exception_info is non-null.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/suite_utils.py::_run_task_suite
    rationale: Exception-bearing episodes are skipped from the scored tally rather than yielding a native pass/fail value.
  - text: There is no trustworthy retained post-run Download listing or snapshot to evaluate the exact-path existence check used by the native evaluator.
    support:
    - official/install/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.is_successful
    - official/install/android_world/env/device_constants.py::DOWNLOAD_DATA
    - official/install/android_world/utils/file_utils.py::check_file_or_folder_exists
stronger:
  additional_conditions:
  - id: actual_downloaded_receipt_copy
    text: Beyond the native criterion, retained filesystem evidence should show that /storage/emulated/0/Download/{file_name} is a file copy of the initialized receipt image from DCIM, not merely any same-named path accepted by the existence check.
    rationale: The official task intent is to copy the receipt image from DCIM into Download, and initialize_task places that named receipt image in DCIM. The released evaluator only checks whether a same-named path exists in Download, and its helper accepts either files or folders, so native success can overcount cases that do not preserve the intended file-copy relation.
    decisive_artifacts:
    - artifact: Pulled copies or content hashes for the DCIM source and Download target, plus file-type metadata
      question: Do retained post-run artifacts show both /sdcard/DCIM/{file_name} and /storage/emulated/0/Download/{file_name} as files, with the Download item matching the initialized receipt content?
      support:
      - official/install/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.initialize_task
      - official/install/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.is_successful
      - official/install/android_world/utils/file_utils.py::check_file_or_folder_exists
    support:
    - official/install/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval
    - official/install/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.initialize_task
    - official/install/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.is_successful
    - official/install/android_world/utils/file_utils.py::check_file_or_folder_exists

schema_version: case_checklist_v1
case_unit_id: RecipeDeleteSingleRecipe
domain: androidworld
task_id: RecipeDeleteSingleRecipe
native:
  user_goal:
    text: Delete the specified recipe from the Broccoli app.
    support:
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.goal
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteSingleRecipe
  benchmark_success:
    text: Native benchmark success requires a non-exception run whose episode finished with `done=true` and whose post-run Broccoli `recipes` table satisfies the released single-row deletion integrity check against the initialized pre-run table state for this case's one target recipe row.
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
    - official/install/android_world/suite_utils.py::_run_task
  checked_by:
    text: The released checker uses the retained pre/post Broccoli `recipes` table state to test `validate_rows_removal_integrity` for the target row selected during initialization, and the suite only counts that task score when the episode record shows `done=true` and no evaluator exception.
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
    - official/install/android_world/suite_utils.py::_run_task
  decisive_artifacts:
  - artifact: Episode result record
    question: Does the retained episode record show no evaluator exception and `done=true` for this run?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Pre-run Broccoli `recipes` table snapshot or row export
    question: Which single recipe row, including its `recipeId`, was present before the run and therefore designated as the deletion target?
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.initialize_task
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteSingleRecipe
  - artifact: Post-run Broccoli `recipes` table snapshot or row export
    question: Is the target `recipeId` absent after the run, with every non-target pre-run row still present unchanged and no new rows added?
    support:
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  success_if:
  - text: The retained episode record shows no evaluator exception and `done=true`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Comparing retained pre-run and post-run Broccoli `recipes` table rows shows that the single target row identified by its pre-run `recipeId` is absent post-run, every non-target pre-run row remains unchanged, and no new row appears.
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  fail_if:
  - text: The retained episode record shows an evaluator exception or `done` is false.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: The retained post-run Broccoli `recipes` table still contains the target row identified from the pre-run snapshot.
    support:
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  - text: The retained pre/post table comparison shows any non-target pre-run row missing or altered, or any new row added post-run.
    support:
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  undecided_if:
  - text: The retained evidence is missing or inconsistent for any required component of the native check, especially the episode done/exception record or either the pre-run or post-run Broccoli `recipes` table snapshot/export needed to reconstruct the released deletion-integrity comparison.
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
    - official/install/android_world/suite_utils.py::_run_task
stronger:
  additional_conditions: []

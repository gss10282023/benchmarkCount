schema_version: case_checklist_v1
case_unit_id: SystemBrightnessMin
domain: androidworld
task_id: SystemBrightnessMin
native:
  user_goal:
    text: Set system screen brightness to the minimum value.
    support:
    - official/install/android_world/task_evals/single/system.py::SystemBrightnessMin
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle
  benchmark_success:
    text: Native success is a completed episode with released `is_successful` = 1.0; for this `SystemBrightnessMin` task, that requires the evaluator's post-run `screen_brightness` reading to equal `1`.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  checked_by:
    text: Released AndroidWorld `SystemBrightnessMin` evaluator, with the suite runner's completion gate applied to the stored episode result.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  decisive_artifacts:
  - artifact: Episode result record
    question: Does the retained episode record show a scored native outcome for this task instance (`is_successful` = 1.0 or 0.0) without evaluator exception data?
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/suite_utils.py::_create_failed_result
  - artifact: Post-run brightness setting evidence
    question: If a retained settings snapshot or ADB output exists, does `settings get system screen_brightness` equal `1` after the run?
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  success_if:
  - text: The retained episode result for `SystemBrightnessMin` shows `exception_info` absent and `is_successful` = 1.0; if corroborating post-run settings evidence is retained, its `screen_brightness` value is `1`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  fail_if:
  - text: The retained episode result for `SystemBrightnessMin` shows `exception_info` absent and `is_successful` = 0.0.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: If independently checking evaluator-visible state from retained post-run settings evidence, `screen_brightness` different from `1` supports native failure.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  undecided_if:
  - text: The native claim is undecided if no retained episode result establishes a scored outcome, or if the retained record shows evaluator/runner exception data or a non-scored value instead of 0.0/1.0.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/suite_utils.py::_create_failed_result
  - text: The native claim is also undecided when only trajectory artifacts are retained and there is neither a final episode result nor equivalent post-run brightness-setting evidence.
    rationale: The released claim depends on the stored scored outcome, and absent that, reviewer-usable post-run evidence must still expose the evaluator-visible `screen_brightness` state.
stronger:
  additional_conditions: []

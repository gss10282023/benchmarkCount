schema_version: case_checklist_v1
case_unit_id: SystemWifiTurnOn
domain: androidworld
task_id: SystemWifiTurnOn
native:
  user_goal:
    text: Turn wifi on.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle
    - official/install/android_world/task_evals/single/system.py::SystemWifiTurnOn.generate_random_params
  benchmark_success:
    text: 'Native success is the runner-scored success for the episode: `interaction_results.done` must be true, and `task.is_successful(env)` must return 1.0; for this task, `_SystemWifiToggle.is_successful` reads `settings get global wifi_on` and accepts `1` or `2` as wifi on.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  checked_by:
    text: AndroidWorld's suite runner `_run_task`, using the task evaluator `_SystemWifiToggle.is_successful`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  decisive_artifacts:
  - artifact: episode result record
    question: Does the retained result for this case show `exception_info` null, and what `is_successful` value was recorded?
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/suite_utils.py::_create_failed_result
  - artifact: terminal wifi setting evidence
    question: What retained terminal value was observed for `settings get global wifi_on`, and was it `1` or `2` versus some other value?
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  success_if:
  - text: The retained episode result shows `exception_info` is null and `is_successful` = 1.0; if terminal wifi-state evidence is also retained, it is consistent with `global.wifi_on` being `1` or `2`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  fail_if:
  - text: The retained episode result shows `exception_info` is null and `is_successful` = 0.0.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: The retained episode result shows `exception_info` is null, and terminal wifi evidence shows `global.wifi_on` was neither `1` nor `2`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  undecided_if:
  - text: The retained result is missing, or it does not preserve the official `is_successful`/`exception_info` fields and there is no reliable terminal wifi-state artifact.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    rationale: Without the runner result fields or the final evaluator-visible wifi state, the native claim cannot be reconstructed from stored post-run evidence.
  - text: The retained result has non-null `exception_info` or a non-decisive `is_successful` value (for example NaN).
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/suite_utils.py::_create_failed_result
    rationale: The runner records runtime or evaluation exceptions separately from counted native success/failure.
stronger:
  additional_conditions: []

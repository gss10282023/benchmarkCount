schema_version: case_checklist_v1
case_unit_id: NotesIsTodo
domain: androidworld
task_id: NotesIsTodo
native:
  user_goal:
    text: Determine whether the Joplin note titled '{title}' is marked as a todo item and answer 'True' or 'False'.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3359-3432
  benchmark_success:
    text: Native success requires a scored episode with no evaluator exception, episode completion (`interaction_results.done`), and a terminal answer in `env.interaction_cache` that matches the instantiated expected `is_todo` value under `proto_utils.check_agent_answer`'s single-answer STRING_MATCH rule; otherwise the native score is 0, and evaluator exceptions do not yield a native success/failure score.
    support:
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3359-3432
  checked_by:
    text: AndroidWorld `_run_task`, using `InformationRetrieval.is_successful` and `proto_utils.check_agent_answer`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
  decisive_artifacts:
  - artifact: Instantiated task record
    question: What `title` and expected `is_todo` value were instantiated for this NotesIsTodo case?
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3359-3432
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::initialize_proto
  - artifact: Episode result / terminal answer record
    question: Did the episode reach `interaction_results.done` without evaluator exception, and what final answer text was written to `env.interaction_cache`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  success_if:
  - text: The retained task record identifies the instantiated expected `is_todo` value, and the retained terminal answer is a single answer that matches that value under the evaluator's STRING_MATCH rule.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3359-3432
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
  - text: The retained run record shows no evaluator exception and `interaction_results.done` true, so the matching answer is counted as native success.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  fail_if:
  - text: The retained run record shows no evaluator exception but `interaction_results.done` false; native success is then forced to 0 regardless of answer content.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: The retained run record shows episode completion with no evaluator exception, but the terminal answer is missing, multi-valued after comma splitting, or does not match the instantiated expected `is_todo` value under the evaluator's STRING_MATCH rule.
    support:
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
  undecided_if:
  - text: Retained evidence does not preserve enough information to recover the instantiated expected `is_todo` value, the terminal answer text, and the completion/native-score status needed to apply the released evaluator.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3359-3432
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/suite_utils.py::_run_task
  - text: The only retained outcome is an execution or evaluator exception record, so `_run_task` did not produce a native success/failure score for the case.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/suite_utils.py::_create_failed_result
stronger:
  additional_conditions:
  - id: grounded_joplin_observation
    text: Beyond native success, retained episode evidence should show that the agent accessed Joplin and observed the titled note's todo state before answering, because the official task asks about the note in Joplin while the released evaluator accepts any matching final string.
    rationale: 'This is a concrete task/evaluator gap: the prompt requires answering about a note in Joplin, but native scoring only checks the final answer string in `env.interaction_cache` plus episode completion, not whether the agent actually consulted Joplin UI state.'
    decisive_artifacts:
    - artifact: Episode step log or screenshots
      question: Do retained UI/action records show Joplin open and the targeted note's todo status visible before the final answer was submitted?
      support:
      - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3359-3432
      - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3359-3432
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/suite_utils.py::_run_task

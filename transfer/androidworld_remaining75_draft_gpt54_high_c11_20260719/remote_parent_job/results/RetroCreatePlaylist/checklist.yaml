schema_version: case_checklist_v1
case_unit_id: RetroCreatePlaylist
domain: androidworld
task_id: RetroCreatePlaylist
native:
  user_goal:
    text: Create a Retro Music playlist with the requested title and the requested songs in the requested order.
    support:
    - official/install/android_world/task_evals/single/retro_music.py::RetroCreatePlaylist.goal
    - derived/selected_task_source.json::task_template
  benchmark_success:
    text: Native benchmark success is a released run record with `exception_info` empty and final `is_successful` = 1.0; under the released runner this means the episode finished and `RetroCreatePlaylist.is_successful` returned 1, and that evaluator returns 1 only when the playlist DB query satisfies `verify_playlist` for the requested playlist name and ordered song titles.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/retro_music.py::RetroCreatePlaylist.is_successful
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::verify_playlist
  checked_by:
    text: The released AndroidWorld suite runner together with the Retro Music playlist evaluator over `playlist.db`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/retro_music.py::RetroCreatePlaylist.is_successful
  decisive_artifacts:
  - artifact: released episode result record
    question: What goal was dispatched for this run, was `exception_info` empty, and what final native `is_successful` value was recorded?
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/suite_utils.py::_create_failed_result
  - artifact: post-run Retro Music playlist DB snapshot or equivalent playlist-query export
    question: For the requested playlist title and ordered song list from the run goal, does the evaluator-visible playlist query satisfy `verify_playlist`?
    support:
    - official/install/android_world/task_evals/single/retro_music.py::_get_playlist_info_query
    - official/install/android_world/task_evals/single/retro_music.py::RetroCreatePlaylist.is_successful
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::verify_playlist
  success_if:
  - text: A released episode result record for the run shows `exception_info` empty and final `is_successful` = 1.0.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/suite_utils.py::_create_failed_result
  - text: 'The retained playlist DB evidence is consistent with that success: among rows whose playlist name passes the evaluator''s fuzzy match against the requested title, the matched-row count equals the requested song count and each requested song title appears at its required zero-based order index.'
    support:
    - official/install/android_world/task_evals/single/retro_music.py::RetroCreatePlaylist.is_successful
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::verify_playlist
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  fail_if:
  - text: A released episode result record for the run shows `exception_info` empty and final `is_successful` = 0.0.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: 'Independent playlist DB evidence shows the evaluator comparison is false: no acceptable target playlist, wrong matched-row count, a missing requested song title, or any requested song title at the wrong order index for the target playlist.'
    support:
    - official/install/android_world/task_evals/single/retro_music.py::RetroCreatePlaylist.is_successful
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::verify_playlist
  undecided_if:
  - text: No released episode result record is retained, so the reviewer cannot verify the runner-level native claim from stored evidence; playlist state alone is insufficient because the runner can record native failure when the episode does not finish.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: The retained run record contains evaluator/runner exception information or no numeric native success value, which the suite code excludes from the scored tally instead of labeling native success or native failure.
    support:
    - official/install/android_world/suite_utils.py::_create_failed_result
    - official/install/android_world/suite_utils.py::_run_task_suite
  - text: The released run record is retained but no post-run playlist DB snapshot or equivalent query export is retained, so the reviewer cannot confirm that the stored result aligns with the evaluator-visible playlist state.
    support:
    - official/install/android_world/task_evals/single/retro_music.py::RetroCreatePlaylist.is_successful
    - official/install/android_world/task_evals/single/retro_music.py::_get_playlist_info_query
stronger:
  additional_conditions:
  - id: exact_playlist_title_after_case_normalization
    text: Require the stored playlist title to equal the requested `playlist_name` after simple case normalization, not merely to pass the evaluator's fuzzy playlist-name match.
    rationale: The official task asks for a playlist titled with the requested name, but native evaluation accepts playlist names via `fuzzy_match(..., ignore_case=True)`, so a near-match title can pass even when the title is not exactly the requested one.
    decisive_artifacts:
    - artifact: released episode result record with dispatched goal or task params
      question: What exact playlist title was requested for this run?
      support:
      - official/install/android_world/task_evals/single/retro_music.py::RetroCreatePlaylist.goal
      - derived/selected_task_source.json::task_template
    - artifact: post-run Retro Music playlist DB snapshot or equivalent playlist-query export
      question: Does the scored playlist use a playlist title exactly equal to the requested title after case normalization, rather than only a fuzzy near-match?
      support:
      - official/install/android_world/task_evals/common_validators/sqlite_validators.py::verify_playlist
      - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
    support:
    - derived/selected_task_source.json::task_template
    - official/install/android_world/task_evals/single/retro_music.py::RetroCreatePlaylist.goal
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::verify_playlist
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match

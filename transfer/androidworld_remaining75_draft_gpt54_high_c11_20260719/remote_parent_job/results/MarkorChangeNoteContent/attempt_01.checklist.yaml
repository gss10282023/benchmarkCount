schema_version: case_checklist_v1
case_unit_id: MarkorChangeNoteContent
domain: androidworld
task_id: MarkorChangeNoteContent
native:
  user_goal:
    text: In Markor, change the specified note's content to `updated_content` and rename it from `original_name` to `new_name`.
    support:
    - official/install/android_world/task_evals/single/markor.py::653-669
    - derived/canonical_task_semantics.json::metadata_conflicts[0]
  benchmark_success:
    text: 'Native benchmark success is the `done`-gated result of `MarkorChangeNoteContent.is_successful`: the episode reaches `done`, `original_name` no longer exists in Markor, `new_name` exists, and the `new_name` file content matches `updated_content` under `check_file_content`.'
    support:
    - official/install/android_world/task_evals/single/markor.py::700-721
    - official/install/android_world/utils/file_utils.py::570-602
    - official/install/android_world/utils/fuzzy_match_lib.py::20-44
    - official/install/android_world/suite_utils.py::223-251
  checked_by:
    text: AndroidWorld run-level completion gating in `suite_utils._run_task` plus `MarkorChangeNoteContent.is_successful`, including `file_utils.check_file_content`.
    support:
    - official/install/android_world/suite_utils.py::223-251
    - official/install/android_world/task_evals/single/markor.py::700-721
    - official/install/android_world/utils/file_utils.py::570-602
  decisive_artifacts:
  - artifact: Retained run completion record
    question: Does stored run metadata show the episode reached `done`, so the suite-level gate does not force the score to 0?
    support:
    - official/install/android_world/suite_utils.py::223-251
  - artifact: Post-run Markor filesystem snapshot or pulled note files
    question: Does retained Markor state show `original_name` absent, `new_name` present, and the `new_name` file content matching `updated_content` under `check_file_content`?
    support:
    - official/install/android_world/task_evals/single/markor.py::700-721
    - official/install/android_world/utils/file_utils.py::570-602
    - official/install/android_world/utils/fuzzy_match_lib.py::20-44
  success_if:
  - text: Retained evidence shows the episode reached `done`, `original_name` is absent from Markor, `new_name` exists in Markor, and the `new_name` file content matches `updated_content` under `check_file_content`/`fuzzy_match`.
    support:
    - official/install/android_world/suite_utils.py::223-251
    - official/install/android_world/task_evals/single/markor.py::700-721
    - official/install/android_world/utils/file_utils.py::570-602
    - official/install/android_world/utils/fuzzy_match_lib.py::20-44
  fail_if:
  - text: Retained evidence shows the episode did not reach `done`; native benchmark success is 0 regardless of the filesystem state.
    support:
    - official/install/android_world/suite_utils.py::223-251
  - text: Post-run Markor state shows `original_name` still exists.
    support:
    - official/install/android_world/task_evals/single/markor.py::700-707
  - text: Post-run Markor state shows `new_name` does not exist.
    support:
    - official/install/android_world/task_evals/single/markor.py::708-713
  - text: Post-run Markor state shows the `new_name` file content does not match `updated_content` under `check_file_content`.
    support:
    - official/install/android_world/task_evals/single/markor.py::714-721
    - official/install/android_world/utils/file_utils.py::570-602
    - official/install/android_world/utils/fuzzy_match_lib.py::20-44
  undecided_if:
  - text: No retained artifact establishes whether the episode reached `done`, so the suite-level completion gate cannot be evaluated.
    support:
    - official/install/android_world/suite_utils.py::223-251
    rationale: The native score composition requires run-level completion evidence in addition to post-run Markor state.
  - text: No reliable retained post-run Markor snapshot or pulled file contents establish both filename state (`original_name` absent and `new_name` present) and the `new_name` content check.
    support:
    - official/install/android_world/task_evals/single/markor.py::700-721
    - official/install/android_world/utils/file_utils.py::570-602
    rationale: The task evaluator reads evaluator-visible filesystem state after the run; without that state, success and failure are not decidable from stored evidence alone.
stronger:
  additional_conditions: []

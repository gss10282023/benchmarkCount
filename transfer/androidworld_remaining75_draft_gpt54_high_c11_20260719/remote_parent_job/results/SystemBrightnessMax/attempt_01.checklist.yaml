schema_version: case_checklist_v1
case_unit_id: SystemBrightnessMax
domain: androidworld
task_id: SystemBrightnessMax
native:
  user_goal:
    text: Set the device screen brightness to the maximum value.
    support:
    - official/install/android_world/task_evals/single/system.py::SystemBrightnessMax
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle
  benchmark_success:
    text: The released benchmark counts success only if the episode is treated as done by the suite runner and the evaluator's final `screen_brightness` read is exactly `255`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  checked_by:
    text: Released AndroidWorld suite runner `_run_task` together with `_SystemBrightnessToggle.is_successful`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  decisive_artifacts:
  - artifact: Episode outcome record or runner log
    question: Does the retained run evidence show normal completion versus a non-completed or exception path that the suite runner would not count as success?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Retained evaluator-visible brightness reading
    question: What exact final value was read for `settings get system screen_brightness` at evaluation time?
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  success_if:
  - text: The retained run evidence shows the episode reached the suite runner's counted completion path, and the retained evaluator-visible final `screen_brightness` value is exactly `255`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  fail_if:
  - text: The retained run evidence shows the episode did not reach the suite runner's counted completion path; native success is then `0.0` regardless of brightness.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: The retained run evidence shows a counted completed run, and the retained evaluator-visible final `screen_brightness` value is not `255`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  undecided_if:
  - text: Stored evidence does not establish the suite runner completion status and does not retain the evaluator-visible final `screen_brightness` value.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  - text: The retained record shows an exception or other non-result state instead of a normal evaluated outcome, so the native success claim cannot be verified from post-run evidence alone.
    support:
    - official/install/android_world/suite_utils.py::_run_task
stronger:
  additional_conditions: []

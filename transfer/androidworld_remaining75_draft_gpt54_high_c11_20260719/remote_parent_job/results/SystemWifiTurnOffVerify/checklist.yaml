schema_version: case_checklist_v1
case_unit_id: SystemWifiTurnOffVerify
domain: androidworld
task_id: SystemWifiTurnOffVerify
native:
  user_goal:
    text: Turn Wi-Fi off.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle
    - official/install/android_world/task_evals/single/system.py::SystemWifiTurnOffVerify.generate_random_params
  benchmark_success:
    text: Native success is recorded only when the episode finishes `done` and the post-run Wi-Fi evaluator reads `settings get global wifi_on` as `0`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  checked_by:
    text: AndroidWorld `_run_task`, using `_SystemWifiToggle.is_successful` for the post-run Wi-Fi state check.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  decisive_artifacts:
  - artifact: official episode result record
    question: Does it store native `is_successful` as `1.0`, `0.0`, or NaN/exception for this run?
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/suite_utils.py::_create_failed_result
  - artifact: episode completion evidence
    question: If the scalar result is missing or disputed, does retained run evidence show `interaction_results.done` was true or false?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: post-run Wi-Fi evaluator evidence
    question: What `settings get global wifi_on` value did the evaluator read at post-run check?
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  success_if:
  - text: An official retained episode result records native `is_successful` as `1.0`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: If the official scalar result is absent, retained evidence still supports success when the episode finished `done=true` and the evaluator-visible `wifi_on` value was `0`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  fail_if:
  - text: An official retained episode result records native `is_successful` as `0.0`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Absent that scalar, retained episode evidence showing `done=false` is a native failure.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Absent that scalar, retained evaluator-visible settings evidence showing `wifi_on` was not `0` is a native failure.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  undecided_if:
  - text: Undecided if no retained official result exists and stored evidence does not establish both episode completion status and the evaluator-visible `wifi_on` readout, or if evaluation ended in an exception/NaN record.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/suite_utils.py::_create_failed_result
    - official/install/android_world/suite_utils.py::_run_task_suite
    rationale: 'Native success is compositional here: without the official scalar outcome, review needs both the runner completion signal and the evaluator-visible Wi-Fi value to reconstruct the benchmark claim.'
stronger:
  additional_conditions: []

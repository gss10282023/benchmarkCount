schema_version: case_checklist_v1
case_unit_id: SystemWifiTurnOffVerify
domain: androidworld
task_id: SystemWifiTurnOffVerify
native:
  user_goal:
    text: Turn Wi-Fi off.
    support:
    - official/install/android_world/task_metadata.json::/103/task_template
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.template
    - official/install/android_world/task_evals/single/system.py::SystemWifiTurnOffVerify.generate_random_params
  benchmark_success:
    text: 'Native benchmark success requires two released checks: the episode must finish `done`, and when the evaluator runs it must read `settings get global wifi_on` as `0`; only then does `_run_task` record benchmark `is_successful` as 1.0.'
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  checked_by:
    text: Checked by `_SystemWifiToggle.is_successful` reading the Android global `wifi_on` setting, with the suite runner zeroing success unless the episode terminated `done`.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  decisive_artifacts:
  - artifact: episode trajectory or runner termination record
    question: Does the retained run evidence show the episode reached `done=true`, rather than being zeroed by `_run_task`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: evaluator-time device-state capture or ADB evaluation log
    question: What value did `settings get global wifi_on` return when `_SystemWifiToggle.is_successful` checked the device?
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  success_if:
  - text: Retained run evidence shows the episode reached `done=true`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Retained evaluator-visible device-state evidence shows `settings get global wifi_on` returned `0` at evaluation time.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  fail_if:
  - text: Retained evaluator-visible device-state evidence shows `settings get global wifi_on` returned a value other than `0` at evaluation time.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  - text: Retained run evidence shows the episode did not reach `done=true`; `_run_task` therefore records benchmark success as `0.0` even if Wi-Fi is off when checked.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  undecided_if:
  - text: 'Retained artifacts do not establish one or both native components: whether the episode reached `done=true`, and what `settings get global wifi_on` returned at evaluator time.'
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/suite_utils.py::_run_task
stronger:
  additional_conditions:
  - id: verify_case_never_reenabled_wifi
    text: For stricter review aligned to this verify-case intent, require retained trace evidence that Wi-Fi was not re-enabled during the episode, not merely that it ended with `wifi_on == 0`.
    rationale: '`SystemWifiTurnOffVerify` is documented as verifying Wi-Fi is already off and initializes the device with Wi-Fi off, but the released evaluator accepts any `done` run whose final evaluator-time `wifi_on` read is `0`, including a run that turns Wi-Fi on and back off.'
    decisive_artifacts:
    - artifact: full episode action/state trace
      question: Does the retained trace show any Wi-Fi-enable action or any intermediate state indicating Wi-Fi became on during the run?
      support:
      - official/install/android_world/task_evals/single/system.py::SystemWifiTurnOffVerify
      - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - artifact: task setup or initialization record
      question: Does retained setup evidence confirm this verify variant started from the documented precondition that Wi-Fi was already off?
      support:
      - official/install/android_world/task_evals/single/system.py::SystemWifiTurnOffVerify.initialize_task
    support:
    - official/install/android_world/task_evals/single/system.py::SystemWifiTurnOffVerify
    - official/install/android_world/task_evals/single/system.py::SystemWifiTurnOffVerify.initialize_task
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/task_metadata.json::/103/tags

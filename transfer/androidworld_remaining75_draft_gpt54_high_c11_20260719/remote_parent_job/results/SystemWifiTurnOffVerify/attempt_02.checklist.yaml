schema_version: case_checklist_v1
case_unit_id: SystemWifiTurnOffVerify
domain: androidworld
task_id: SystemWifiTurnOffVerify
native:
  user_goal:
    text: Turn wifi off.
    support:
    - derived/canonical_task_semantics.json::goal.template
    - derived/canonical_task_semantics.json::goal.runtime_samples
  benchmark_success:
    text: 'Native success requires the runner-composed score to be successful: the episode is counted as done and, for this fixed `on_or_off = off` case, the evaluator reads `settings get global wifi_on` as `0` at scoring.'
    support:
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::SystemWifiTurnOffVerify.generate_random_params
  checked_by:
    text: AndroidWorld runner done-gate plus `_SystemWifiToggle.is_successful`, which checks the evaluator-visible global WiFi setting.
    support:
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  decisive_artifacts:
  - artifact: episode result record
    question: Does the retained result for this case show a non-exception native outcome (`is_successful`) for the runner-composed score?
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics
  - artifact: final WiFi-setting evidence
    question: Do retained evaluator logs or retained device-state evidence show what `settings get global wifi_on` returned at scoring?
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  success_if:
  - text: A retained non-exception result record for this case shows native `is_successful = 1.0`; any retained scorer-visible WiFi-setting evidence is consistent with `global wifi_on = 0`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  fail_if:
  - text: A retained non-exception result record for this case shows native `is_successful = 0.0`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics
  - text: If no decisive native result record is retained, scorer-visible WiFi-setting evidence showing `global wifi_on` was not `0` at scoring is sufficient for native failure.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  undecided_if:
  - text: Only post-run state suggesting WiFi was off is retained, but there is no native result record or equivalent retained evidence that the run satisfied the runner done-gate.
    support:
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    rationale: WiFi-off alone does not establish native success because the runner forces failure when the episode is not counted done.
  - text: The retained evidence lacks both a decisive native result record and enough scorer-visible WiFi-setting evidence to determine what `settings get global wifi_on` returned at scoring.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    rationale: Without either the composed benchmark outcome or the evaluator-visible WiFi state, the native claim cannot be resolved from stored evidence.
stronger:
  additional_conditions: []

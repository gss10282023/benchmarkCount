schema_version: case_checklist_v1
case_unit_id: MarkorCreateNoteFromClipboard
domain: androidworld
task_id: MarkorCreateNoteFromClipboard
native:
  user_goal:
    text: Create a Markor note with the specified `file_name`, paste the current clipboard contents into it, and save the note.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.template
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.initialize_task
  benchmark_success:
    text: 'Native success requires both: the episode reached the suite `done` gate, and the evaluator found `MARKOR_DATA/{file_name}` with contents that fuzzy-match `file_content`.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  checked_by:
    text: Checked by `MarkorCreateNoteFromClipboard.is_successful` delegating to `file_validators.CreateFile.is_successful`, with suite-level `done` gating in `_run_task`.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  decisive_artifacts:
  - artifact: Post-run Markor file snapshot or file dump
    question: Is there a file named `file_name` under `MARKOR_DATA`, and does its text fuzzy-match `file_content`?
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  - artifact: Episode completion record
    question: Did the run finish with `interaction_results.done == true`, rather than being forced to 0 by the suite gate?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  success_if:
  - text: Retained evidence shows the run reached `done`, a file named `file_name` exists under `MARKOR_DATA`, and that file's contents fuzzy-match `file_content`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  fail_if:
  - text: Retained episode data shows the run did not reach `done`; native benchmark success is then 0 regardless of file state.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: A post-run Markor snapshot or file dump shows no file named `file_name` under `MARKOR_DATA`.
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
  - text: The target file exists, but its contents do not fuzzy-match `file_content` under the evaluator's comparison rule.
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  undecided_if:
  - text: The retained artifacts do not provide enough evidence to determine both the suite `done` status and the final state/content of `MARKOR_DATA/{file_name}`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
stronger:
  additional_conditions:
  - id: paste_operation_observed
    text: Beyond native success, retained interaction evidence should show that the note content was inserted via a clipboard paste action in Markor before save, not merely that the saved file ended up matching `file_content`.
    rationale: The official task text requires performing a paste operation, but the released native evaluator only checks final file existence and fuzzy-matched content, so non-paste text entry can satisfy the benchmark claim.
    decisive_artifacts:
    - artifact: Retained interaction trace or screen recording
      question: Does the evidence show a clipboard paste action or pasted clipboard insertion into the Markor editor before the note is saved?
      support:
      - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.template
      - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.initialize_task
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.template
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful

schema_version: case_checklist_v1
case_unit_id: SystemBrightnessMaxVerify
domain: androidworld
task_id: SystemBrightnessMaxVerify
native:
  user_goal:
    text: Set system brightness to the maximum value.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.template
    - official/install/android_world/task_evals/single/system.py::SystemBrightnessMaxVerify.generate_random_params
  benchmark_success:
    text: The native benchmark counts success only if the run reaches the suite runner's final scoring step and the final score is 1.0; for this case, that requires the brightness evaluator to read `system screen_brightness` and find exactly `255` for fixed param `max`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::SystemBrightnessMaxVerify.generate_random_params
  checked_by:
    text: Retained episode result metadata interpreted with the released brightness evaluator's ADB settings check.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  decisive_artifacts:
  - artifact: episode result record
    question: Does retained run metadata show a scored result for this episode, including `is_successful` and whether `exception_info` is absent or present?
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/suite_utils.py::_create_failed_result
  - artifact: retained evaluator-visible brightness evidence
    question: What `settings get system screen_brightness` value was present at evaluation time?
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  success_if:
  - text: Success if retained episode result metadata shows `exception_info` absent and final `is_successful` = 1.0; if separate evaluator-visible brightness evidence is retained, it is consistent with `screen_brightness` = `255`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  fail_if:
  - text: Fail if retained episode result metadata shows `exception_info` absent and final `is_successful` = 0.0.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Fail if retained evaluator-visible brightness evidence shows `screen_brightness` is not `255`, because the released evaluator returns 0.0 for this max case.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::SystemBrightnessMaxVerify.generate_random_params
  undecided_if:
  - text: Undecided if retained evidence does not contain a usable scored episode result and also does not retain the evaluator-visible `screen_brightness` value at evaluation time, or if execution/evaluation raised an exception instead of producing a scored result.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/suite_utils.py::_create_failed_result
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
stronger:
  additional_conditions: []

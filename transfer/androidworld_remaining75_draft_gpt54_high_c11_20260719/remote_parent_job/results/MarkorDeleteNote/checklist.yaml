schema_version: case_checklist_v1
case_unit_id: MarkorDeleteNote
domain: androidworld
task_id: MarkorDeleteNote
native:
  user_goal:
    text: Delete the Markor note named by the task parameter `file_name`.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNote
    - official/install/android_world/task_evals/common_validators/file_validators.py::DeleteFile
  benchmark_success:
    text: Benchmark success is native `is_successful == 1.0`; under the released scorer this requires the episode to finish and the delegated deletion check to find the target `file_name` absent from Markor's data directory.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNote.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::DeleteFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
  checked_by:
    text: Checked by `suite_utils._run_task`, which gates on episode completion and records `is_successful`, after `MarkorDeleteNote.is_successful` delegates to `DeleteFile.is_successful` on `MARKOR_DATA`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNote.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::DeleteFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
  decisive_artifacts:
  - artifact: task assignment record
    question: What concrete `file_name` was assigned for this run?
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
    - official/install/android_world/task_evals/common_validators/file_validators.py::DeleteFile
  - artifact: episode result metadata
    question: Does the retained run result report native `is_successful` as `1.0`, `0.0`, or missing/NaN?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: post-run Markor storage snapshot or directory listing
    question: After the run, is the assigned `file_name` present under `/storage/emulated/0/Documents/Markor`?
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::DeleteFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
  success_if:
  - text: Success if retained result metadata shows native `is_successful == 1.0`; equivalently, the episode finished and evaluator-visible post-run state has the assigned `file_name` absent from `MARKOR_DATA`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/file_validators.py::DeleteFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
  fail_if:
  - text: Fail if retained result metadata shows native `is_successful == 0.0`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Fail if post-run Markor storage evidence shows the assigned `file_name` still exists under `MARKOR_DATA`, because the delegated deletion check would return `0.0`.
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::DeleteFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
  undecided_if:
  - text: Undecided if retained evidence does not reveal the concrete assigned `file_name`.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
    - official/install/android_world/task_evals/common_validators/file_validators.py::DeleteFile
  - text: Undecided if native result metadata is missing/NaN and there is no post-run Markor storage evidence sufficient to tell whether the assigned `file_name` exists in `MARKOR_DATA`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/file_validators.py::DeleteFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
stronger:
  additional_conditions:
  - id: used_markor_ui
    text: Beyond native success, retained trace evidence should show the note was deleted through the Markor app UI, matching the task instruction's 'in Markor' requirement.
    rationale: The official task text requires deleting the note in Markor, but the released evaluator only checks that the target file is absent from Markor's storage directory and that the episode finished; it would also accept an out-of-app filesystem deletion that produces the same post-run state.
    decisive_artifacts:
    - artifact: episode action or screenshot trace
      question: Does the retained trace show Markor was opened and the assigned note was deleted via Markor UI actions rather than by external filesystem manipulation?
      support:
      - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNote
      - official/install/android_world/suite_utils.py::_run_task
    - artifact: post-run Markor storage snapshot or directory listing
      question: Is the assigned `file_name` absent from `/storage/emulated/0/Documents/Markor` after the run?
      support:
      - official/install/android_world/task_evals/common_validators/file_validators.py::DeleteFile.is_successful
      - official/install/android_world/env/device_constants.py::MARKOR_DATA
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNote
    - official/install/android_world/task_evals/common_validators/file_validators.py::DeleteFile.is_successful
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/env/device_constants.py::MARKOR_DATA

schema_version: case_checklist_v1
case_unit_id: RetroSavePlaylist
domain: androidworld
task_id: RetroSavePlaylist
native:
  user_goal:
    text: Create the requested Retro Music playlist with the requested songs in the requested order, then export that playlist to the device Downloads directory.
    support:
    - official/install/android_world/task_evals/single/retro_music.py::RetroSavePlaylist.goal
  benchmark_success:
    text: 'Native success is runner-scored success for this task instance: the retained episode result has `is_successful` = 1.0, which under the released scorer requires the episode not be zeroed out by the runner and the task raw score be 1.0; for `RetroSavePlaylist`, that raw score is the average of two checks, so both must hold: the playlist matches the requested name and ordered songs under `verify_playlist`, and `Downloads/<playlist_name>.m3u` exists.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/retro_music.py::RetroSavePlaylist.is_successful
    - official/install/android_world/task_evals/single/retro_music.py::RetroCreatePlaylist.is_successful
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::verify_playlist
    - official/install/android_world/env/device_constants.py::DOWNLOAD_DATA
  checked_by:
    text: 'Released AndroidWorld scoring path: `suite_utils._run_task` plus `RetroSavePlaylist.is_successful`, which delegates playlist validation to `RetroCreatePlaylist.is_successful`/`verify_playlist` and separately checks for the exported `.m3u` file in Downloads.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/retro_music.py::RetroSavePlaylist.is_successful
    - official/install/android_world/task_evals/single/retro_music.py::RetroCreatePlaylist.is_successful
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::verify_playlist
  decisive_artifacts:
  - artifact: Retained episode result record for the task instance
    question: Does it identify the requested playlist name and ordered song titles and record runner-scored `is_successful` for this instance?
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/retro_music.py::RetroSavePlaylist.goal
  - artifact: Post-run Retro Music playlist database snapshot or equivalent extracted playlist rows
    question: 'For the requested playlist name, do the retained rows satisfy `verify_playlist`: fuzzy playlist-name match, exact requested song titles, and the requested order indices?'
    support:
    - official/install/android_world/task_evals/single/retro_music.py::RetroCreatePlaylist.is_successful
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::verify_playlist
  - artifact: Post-run Downloads directory snapshot or equivalent file listing
    question: Does it show `Downloads/<playlist_name>.m3u` exists?
    support:
    - official/install/android_world/task_evals/single/retro_music.py::RetroSavePlaylist.is_successful
    - official/install/android_world/env/device_constants.py::DOWNLOAD_DATA
  success_if:
  - text: Success is supported if the retained episode result for this task instance records `is_successful` = 1.0; equivalently, retained evidence would have to show the requested playlist passed `verify_playlist` and `Downloads/<playlist_name>.m3u` existed under the released scoring rule.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/retro_music.py::RetroSavePlaylist.is_successful
    - official/install/android_world/task_evals/single/retro_music.py::RetroCreatePlaylist.is_successful
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::verify_playlist
  fail_if:
  - text: Failure is supported if the retained episode result for this task instance records `is_successful` < 1.0.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Absent a retained runner score, failure is supported by any retained evidence that the requested playlist does not satisfy `verify_playlist`, or that `Downloads/<playlist_name>.m3u` is missing.
    support:
    - official/install/android_world/task_evals/single/retro_music.py::RetroSavePlaylist.is_successful
    - official/install/android_world/task_evals/single/retro_music.py::RetroCreatePlaylist.is_successful
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::verify_playlist
    - official/install/android_world/env/device_constants.py::DOWNLOAD_DATA
  undecided_if:
  - text: Undecided if no retained episode result score is available and the retained artifacts do not provide enough information to recover the requested playlist parameters and determine both evaluator-visible post-run checks.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/retro_music.py::RetroSavePlaylist.is_successful
    - official/install/android_world/task_evals/single/retro_music.py::RetroCreatePlaylist.is_successful
stronger:
  additional_conditions:
  - id: exported_playlist_matches_created_playlist
    text: Beyond the native criterion, require retained contents of `Downloads/<playlist_name>.m3u` to correspond to the created playlist's requested songs in the requested order, not merely that a same-named `.m3u` file exists.
    rationale: The official task goal is to export the created playlist to Downloads, but the released evaluator only checks for existence of `Downloads/<playlist_name>.m3u` and separately checks the in-app playlist; it does not verify that the exported file actually represents that playlist.
    decisive_artifacts:
    - artifact: Retained exported `.m3u` file contents
      question: Do the retained `.m3u` contents encode the requested songs in the requested order for the requested playlist export?
      support:
      - official/install/android_world/task_evals/single/retro_music.py::RetroSavePlaylist.goal
      - official/install/android_world/task_evals/single/retro_music.py::RetroSavePlaylist.is_successful
    - artifact: Post-run Retro Music playlist database snapshot or equivalent extracted playlist rows
      question: What playlist membership and order was actually created in-app for comparison with the retained exported `.m3u` file?
      support:
      - official/install/android_world/task_evals/single/retro_music.py::RetroCreatePlaylist.is_successful
      - official/install/android_world/task_evals/common_validators/sqlite_validators.py::verify_playlist
    support:
    - official/install/android_world/task_evals/single/retro_music.py::RetroSavePlaylist.goal
    - official/install/android_world/task_evals/single/retro_music.py::RetroSavePlaylist.is_successful
    - official/install/android_world/task_evals/single/retro_music.py::RetroCreatePlaylist.is_successful

schema_version: case_checklist_v1
case_unit_id: MarkorDeleteAllNotes
domain: androidworld
task_id: MarkorDeleteAllNotes
native:
  user_goal:
    text: Delete all notes in Markor.
    support:
    - derived/canonical_task_semantics.json::goal.template
  benchmark_success:
    text: 'Native benchmark success requires both: the run reaches the runner''s terminal `done` state, and the evaluator-visible final listing of Markor''s note directory is empty.'
    support:
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics.done_gate
    - derived/canonical_task_semantics.json::is_successful.method_chain[0].source_ref
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
  checked_by:
    text: Checked by `MarkorDeleteAllNotes.is_successful` over `MARKOR_DATA`, with the suite runner forcing failure when `done` is false.
    support:
    - derived/canonical_task_semantics.json::is_successful.method_chain[0].source_ref
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics.done_gate
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
  decisive_artifacts:
  - artifact: Episode result record
    question: Does retained episode data show the run reached the runner's terminal `done` state?
    support:
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics.done_gate
  - artifact: Post-run Markor directory listing or filesystem snapshot
    question: Does the evaluator-visible final listing for `/storage/emulated/0/Documents/Markor` contain any regular files?
    support:
    - derived/canonical_task_semantics.json::is_successful.method_chain[0].source_ref
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    - official/install/android_world/utils/file_utils.py::get_file_list_with_metadata
  success_if:
  - text: Retained evidence shows the run reached `done`, and the final evaluator-visible listing of `/storage/emulated/0/Documents/Markor` contains no regular files.
    support:
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics.done_gate
    - derived/canonical_task_semantics.json::is_successful.method_chain[0].source_ref
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    - official/install/android_world/utils/file_utils.py::get_file_list_with_metadata
  fail_if:
  - text: Retained final evaluator-visible listing of `/storage/emulated/0/Documents/Markor` contains one or more regular files.
    support:
    - derived/canonical_task_semantics.json::is_successful.method_chain[0].source_ref
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    - official/install/android_world/utils/file_utils.py::get_file_list_with_metadata
  - text: Retained episode data shows the run did not reach `done`; under the runner this is native failure regardless of directory state.
    support:
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics.done_gate
  undecided_if:
  - text: Retained artifacts do not establish both the final `done` status and the final evaluator-visible contents of `/storage/emulated/0/Documents/Markor`.
    support:
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics.done_gate
    - derived/canonical_task_semantics.json::is_successful.method_chain[0].source_ref
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
stronger:
  additional_conditions:
  - id: recursive_no_notes_anywhere
    text: Beyond the native criterion, retained recursive filesystem evidence should show no remaining note files anywhere under Markor's data tree, not just no regular files in the evaluator's top-level `MARKOR_DATA` listing.
    rationale: The official goal is to delete all notes in Markor, but the released evaluator only calls `get_file_list_with_metadata(MARKOR_DATA)`, which checks regular files in that directory rather than recursively proving no notes remain in subfolders.
    decisive_artifacts:
    - artifact: Recursive post-run Markor filesystem snapshot or recursive listing
      question: Does retained recursive filesystem evidence show no remaining note files anywhere under `/storage/emulated/0/Documents/Markor`?
      support:
      - derived/canonical_task_semantics.json::goal.template
      - official/install/android_world/env/device_constants.py::MARKOR_DATA
      - official/install/android_world/utils/file_utils.py::get_file_list_with_metadata
    support:
    - derived/canonical_task_semantics.json::goal.template
    - derived/canonical_task_semantics.json::is_successful.method_chain[0].source_ref
    - official/install/android_world/utils/file_utils.py::get_file_list_with_metadata
    - official/install/android_world/env/device_constants.py::MARKOR_DATA

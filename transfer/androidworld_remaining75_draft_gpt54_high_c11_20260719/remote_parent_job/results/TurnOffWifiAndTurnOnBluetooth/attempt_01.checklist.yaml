schema_version: case_checklist_v1
case_unit_id: TurnOffWifiAndTurnOnBluetooth
domain: androidworld
task_id: TurnOffWifiAndTurnOnBluetooth
native:
  user_goal:
    text: Turn off WiFi, then enable bluetooth.
    support:
    - official/install/android_world/task_evals/composite/system.py::TurnOffWifiAndTurnOnBluetooth
  benchmark_success:
    text: Native benchmark success is a numeric episode is_successful score greater than 0.5. The runner forces 0.0 if the episode did not finish; otherwise it uses the composite evaluator mean of the WiFi-off and Bluetooth-on checks, so this task exceeds 0.5 only when both checks pass at evaluation time.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/composite/system.py::TurnOffWifiAndTurnOnBluetooth.is_successful
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
  checked_by:
    text: Released AndroidWorld episode scoring in suite_utils._run_task, using the TurnOffWifiAndTurnOnBluetooth composite evaluator and the final global wifi_on and bluetooth_on setting checks.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/composite/system.py::TurnOffWifiAndTurnOnBluetooth.is_successful
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
  decisive_artifacts:
  - artifact: Episode result record
    question: Is there a retained numeric is_successful score for the episode, and if so what value?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Retained WiFi evaluator-visible evidence
    question: If the score must be checked or reconstructed, do retained evaluator outputs or state evidence show global wifi_on = 0 at evaluation time?
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  - artifact: Retained Bluetooth evaluator-visible evidence
    question: If the score must be checked or reconstructed, do retained evaluator outputs or state evidence show global bluetooth_on = 1 at evaluation time?
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
  success_if:
  - text: A retained numeric is_successful score greater than 0.5 supports native success; for this two-check composite, that corresponds to both released setting checks passing.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/composite/system.py::TurnOffWifiAndTurnOnBluetooth.is_successful
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
  fail_if:
  - text: A retained numeric is_successful score less than or equal to 0.5 supports native failure.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/composite/system.py::TurnOffWifiAndTurnOnBluetooth.is_successful
  - text: If the numeric score is absent, retained evaluator-visible evidence that wifi_on is not 0 or bluetooth_on is not 1 is sufficient for native failure, because the composite raw score cannot exceed 0.5.
    support:
    - official/install/android_world/task_evals/composite/system.py::TurnOffWifiAndTurnOnBluetooth.is_successful
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
  undecided_if:
  - text: No retained numeric is_successful score is available, and the stored evidence does not show a failing WiFi or Bluetooth check.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/composite/system.py::TurnOffWifiAndTurnOnBluetooth.is_successful
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
    rationale: With only successful-looking final settings, native success still cannot be reconstructed from post-run evidence alone because the runner's episode-completion gate is not otherwise established.
  - text: Retained score evidence and retained evaluator-visible settings evidence materially conflict.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
    rationale: Conflicting post-run artifacts do not by themselves verify which native benchmark outcome should be trusted.
stronger:
  additional_conditions:
  - id: ordered_toggle_sequence
    text: Beyond the native criterion, retained chronology should show WiFi was turned off before Bluetooth was enabled, because the official goal is ordered ('then') while the released evaluator only checks final-state success.
    rationale: The task text specifies an ordered sequence, but TurnOffWifiAndTurnOnBluetooth.is_successful averages two independent final-state checks and never inspects action order.
    decisive_artifacts:
    - artifact: Timestamped interaction or state trace
      question: Does the retained chronology show the device reached WiFi off before it reached Bluetooth on?
      support:
      - official/install/android_world/task_evals/composite/system.py::TurnOffWifiAndTurnOnBluetooth
      - official/install/android_world/task_evals/composite/system.py::TurnOffWifiAndTurnOnBluetooth.is_successful
    support:
    - official/install/android_world/task_evals/composite/system.py::TurnOffWifiAndTurnOnBluetooth
    - official/install/android_world/task_evals/composite/system.py::TurnOffWifiAndTurnOnBluetooth.is_successful

schema_version: case_checklist_v1
case_unit_id: MarkorMoveNote
domain: androidworld
task_id: MarkorMoveNote
native:
  user_goal:
    text: Move the specified Markor note from the given source folder to the given destination folder in Markor.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorMoveNote.template
  benchmark_success:
    text: Native benchmark success requires the episode to finish with `done` true and the released MoveFile evaluator to find the target note absent from the source folder and present in the destination folder under Markor storage.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorMoveNote.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.is_successful
    - official/install/android_world/task_evals/single/markor.py::MarkorMoveNote.__init__
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
  checked_by:
    text: AndroidWorld suite runner done-gate plus the Markor MoveFile filesystem check over the Markor data directory.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.is_successful
    - official/install/android_world/task_evals/single/markor.py::MarkorMoveNote.__init__
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
  decisive_artifacts:
  - artifact: episode run record
    question: Does retained run metadata preserve the task goal or equivalent target parameters (`file_name`, `source_folder`, `destination_folder`) and whether the episode finished with `done` true?
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
    - official/install/android_world/task_evals/single/markor.py::MarkorMoveNote.template
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: post-run Markor filesystem snapshot or recursive file listing
    question: Using the run's target values, is the note absent from `<MARKOR_DATA>/<source_folder>` and present in `<MARKOR_DATA>/<destination_folder>`?
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.__init__
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.is_successful
    - official/install/android_world/task_evals/single/markor.py::MarkorMoveNote.__init__
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
  success_if:
  - text: The retained run record identifies the target note and folders, shows the episode finished with `done` true, and the post-run Markor filesystem evidence shows that note absent from the source folder and present in the destination folder.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
    - official/install/android_world/task_evals/single/markor.py::MarkorMoveNote.template
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.is_successful
  fail_if:
  - text: The retained run record shows the episode did not finish with `done` true.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Post-run Markor filesystem evidence shows the target note still present in the source folder.
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.__init__
  - text: Post-run Markor filesystem evidence shows the target note absent from the destination folder.
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.__init__
  undecided_if:
  - text: Retained evidence lacks either the target note/folder values and done-gate result from the run record, or a reliable post-run view of the relevant Markor source and destination folders.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
    - official/install/android_world/task_evals/single/markor.py::MarkorMoveNote.template
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.is_successful
    rationale: Without both the run's target values and the post-run folder state, the native runner-plus-evaluator condition cannot be reconstructed from stored evidence.
stronger:
  additional_conditions:
  - id: performed_in_markor
    text: Beyond native success, retained interaction evidence shows the move was carried out through Markor's UI for the target note and folders, not merely by reaching the accepted filesystem end state by some other means.
    rationale: The official task text explicitly requires performing the move in Markor, but the released evaluator only checks the resulting filesystem state in Markor storage and would also accept other ways of producing that state.
    decisive_artifacts:
    - artifact: retained episode interaction trace
      question: Does the retained action/screenshot/UI trace show the target note being moved within Markor for the specified source and destination folders?
      support:
      - official/install/android_world/task_evals/single/markor.py::MarkorMoveNote.template
      - official/install/android_world/task_evals/single/markor.py::Markor.app_names
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorMoveNote.template
    - official/install/android_world/task_evals/single/markor.py::Markor.app_names
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.is_successful

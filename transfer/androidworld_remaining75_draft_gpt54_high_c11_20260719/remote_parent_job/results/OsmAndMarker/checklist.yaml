schema_version: case_checklist_v1
case_unit_id: OsmAndMarker
domain: androidworld
task_id: OsmAndMarker
native:
  user_goal:
    text: Add an OsmAnd map marker for the specified location.
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndMarker
  benchmark_success:
    text: Native success requires a terminal run (`done`) and at least one retained `map_markers` row whose `marker_lat` and `marker_lon` match the requested location under the released OsmAnd coordinate matcher with tolerance `< 0.001` degrees.
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndMarker.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_marker_matches_location
    - official/install/android_world/suite_utils.py::_run_task
  checked_by:
    text: The released runner's `done` gate plus `OsmAndMarker.is_successful`, applied to OsmAnd `map_markers` SQLite rows.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndMarker.is_successful
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::SQLiteApp.list_rows
  decisive_artifacts:
  - artifact: Episode result record with goal text and terminal status
    question: What exact location was requested for this case, and did the episode end with `done` so the runner did not force native success to `0.0`?
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Post-run copy of OsmAnd `map_markers_db` or extracted `map_markers` rows
    question: Does any retained `map_markers` row have `marker_lat` and `marker_lon` that match the requested location under `_marker_matches_location`?
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndMarker.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_marker_matches_location
    - official/install/android_world/task_evals/utils/sqlite_schema_utils.py::OsmAndMapMarker
  success_if:
  - text: The stored episode record shows the run reached terminal `done` for this case.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Using the requested location from the stored goal text, the retained `map_markers` state contains at least one row that matches under `_marker_matches_location`.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
    - official/install/android_world/task_evals/single/osmand.py::OsmAndMarker.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_marker_matches_location
  fail_if:
  - text: The stored episode record shows `done` was false; under the released runner this makes native success `0.0`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: The run is terminal, but no retained `map_markers` row matches the requested location under `_marker_matches_location`.
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndMarker.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_marker_matches_location
  undecided_if:
  - text: The retained evidence does not preserve the case's requested location or whether the episode reached `done`, so the released native rule cannot be reconstructed.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
    - official/install/android_world/suite_utils.py::_run_task
  - text: The retained evidence lacks a readable post-run `map_markers` snapshot or row export, so the released OsmAnd matcher cannot be applied.
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::SQLiteApp.list_rows
    - official/install/android_world/task_evals/single/osmand.py::OsmAndMarker.is_successful
    - official/install/android_world/task_evals/utils/sqlite_schema_utils.py::OsmAndMapMarker
stronger:
  additional_conditions: []

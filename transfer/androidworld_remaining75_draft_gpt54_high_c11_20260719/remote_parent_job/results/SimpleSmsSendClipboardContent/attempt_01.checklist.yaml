schema_version: case_checklist_v1
case_unit_id: SimpleSmsSendClipboardContent
domain: androidworld
task_id: SimpleSmsSendClipboardContent
native:
  user_goal:
    text: Send an SMS in Simple SMS Messenger to the specified `number` whose body is the clipboard's current contents.
    support:
    - official/install/android_world/task_evals/single/sms.py::SimpleSmsSendClipboardContent
    - official/install/android_world/task_evals/single/sms.py::SimpleSmsSendClipboardContent.initialize_task
  benchmark_success:
    text: Native benchmark success requires the runner to score the episode normally and `SimpleSMSSendSms.is_successful` to return 1.0. Under the released evaluator, that means a post-run sent-SMS query shows, within 5 minutes of evaluation, a sent row whose normalized `address` equals the official `number` and whose `body` matches the official `message` under the evaluator's fuzzy-match rule, the foreground package is `com.simplemobiletools.smsmessenger`, and no sending-stuck exception is raised; `_run_task` then reports success only for a completed (`done`) episode.
    support:
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
    - official/install/android_world/task_evals/common_validators/sms_validators.py::was_sent
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
    - official/install/android_world/suite_utils.py::_run_task
  checked_by:
    text: AndroidWorld runner `suite_utils._run_task` together with `android_world.task_evals.common_validators.sms_validators.SimpleSMSSendSms.is_successful`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
  decisive_artifacts:
  - artifact: retained episode result record
    question: Does the retained episode result record show a normal scored episode rather than an evaluation exception/omission?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: post-run sent-SMS snapshot
    question: Does the retained sent-SMS snapshot contain a recent sent row whose normalized `address` equals the official `number` and whose `body` matches the official `message` under the evaluator's fuzzy-match rule?
    support:
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.schema
    - official/install/android_world/task_evals/common_validators/sms_validators.py::was_sent
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  - artifact: evaluation-time foreground activity/package snapshot
    question: Does the retained evaluation-time foreground activity show package `com.simplemobiletools.smsmessenger`?
    support:
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
  success_if:
  - text: 'Success if retained evidence shows a normal scored episode, and the official evaluator-visible checks all hold: the post-run sent-SMS snapshot includes a row sent within 5 minutes whose normalized `address` equals the official `number` and whose `body` matches the official `message` under the evaluator''s fuzzy-match rule, the evaluation-time foreground package is `com.simplemobiletools.smsmessenger`, and the runner therefore records success for the completed episode.'
    support:
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
    - official/install/android_world/task_evals/common_validators/sms_validators.py::was_sent
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
    - official/install/android_world/suite_utils.py::_run_task
  fail_if:
  - text: Fail if the retained episode result record shows a normal scored episode with native failure, including the case where the runner did not credit the episode because it was not completed (`done`).
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Fail if the episode was scored normally but the retained sent-SMS snapshot does not show a qualifying recent sent row for the official `number` and `message` under the evaluator's normalize-and-fuzzy-match rule.
    support:
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
    - official/install/android_world/task_evals/common_validators/sms_validators.py::was_sent
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  - text: Fail if the episode was scored normally but the retained evaluation-time foreground package is not `com.simplemobiletools.smsmessenger`.
    support:
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
  undecided_if:
  - text: Undecided if retained evidence is missing the episode result record, the sent-SMS snapshot, or the evaluation-time foreground activity/package needed to apply the released checks.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
  - text: Undecided if the retained episode result record shows an evaluation exception, including the released 'Message could not be sent due to Android/emulator issue.' path, because `_run_task` records `exception_info` instead of a native success/failure score for that episode.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
    - official/install/android_world/task_evals/common_validators/sms_validators.py::_check_if_stuck_at_sending
stronger:
  additional_conditions:
  - id: clipboard_use_evidenced
    text: Beyond native success, retained interaction evidence should show that the SMS body was inserted from the clipboard, not merely that the final sent body matched the official `message`.
    rationale: The official task is to send the clipboard content, and `SimpleSmsSendClipboardContent.initialize_task` seeds the clipboard with the official `message`; however, `SimpleSMSSendSms.is_successful` checks only the final sent SMS recipient/body and current app package, so native success can be awarded even if the agent never used the clipboard.
    decisive_artifacts:
    - artifact: retained action log or screenshots around SMS composition
      question: Do the retained interaction records show a paste or other clipboard-insertion step into the Simple SMS compose field before send?
      support:
      - official/install/android_world/task_evals/single/sms.py::SimpleSmsSendClipboardContent
      - official/install/android_world/task_evals/single/sms.py::SimpleSmsSendClipboardContent.initialize_task
    - artifact: post-run sent-SMS snapshot
      question: Does the retained sent-SMS snapshot corroborate that the body ultimately sent is the clipboard-seeded official `message`?
      support:
      - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
      - official/install/android_world/task_evals/common_validators/sms_validators.py::was_sent
    support:
    - official/install/android_world/task_evals/single/sms.py::SimpleSmsSendClipboardContent
    - official/install/android_world/task_evals/single/sms.py::SimpleSmsSendClipboardContent.initialize_task
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful

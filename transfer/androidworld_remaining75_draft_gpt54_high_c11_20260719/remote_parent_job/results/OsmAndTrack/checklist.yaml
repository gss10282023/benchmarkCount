schema_version: case_checklist_v1
case_unit_id: OsmAndTrack
domain: androidworld
task_id: OsmAndTrack
native:
  user_goal:
    text: Save a track in the OsmAnd maps app whose waypoint locations match the task's dispatched waypoint list in the same listed order.
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.goal
  benchmark_success:
    text: AndroidWorld counts success when `_run_task` records final `is_successful=1.0`; under the released runner this requires episode termination (`done=true`) and `OsmAndTrack.is_successful(env)=1.0`, and that evaluator returns 1.0 iff some saved GPX file in OsmAnd's tracks directory contains track points matching the dispatched waypoint list in order within 0.001 degrees.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_track_matches
    - official/install/android_world/task_evals/single/osmand.py::_coords_match
  checked_by:
    text: Released AndroidWorld runner `_run_task` together with `android_world.task_evals.single.osmand.OsmAndTrack.is_successful`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
  decisive_artifacts:
  - artifact: benchmark episode/result record
    question: What dispatched goal or waypoint list was evaluated, and what final `is_successful` value was recorded for the run?
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.goal
  - artifact: pulled post-run OsmAnd tracks directory (GPX files)
    question: Does any saved GPX track file contain `trkpt` coordinates that match the dispatched waypoint list in order within the evaluator's 0.001-degree tolerance?
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_track_points
    - official/install/android_world/task_evals/single/osmand.py::_track_matches
    - official/install/android_world/task_evals/single/osmand.py::_coords_match
  success_if:
  - text: Success if a retained benchmark episode/result record shows final `is_successful=1.0`; absent that record, success is supported only by retained evidence that the episode terminated `done=true` and a pulled post-run OsmAnd tracks snapshot contains at least one GPX file whose ordered `trkpt` sequence matches every location in the dispatched waypoint list within 0.001 degrees.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_track_matches
    - official/install/android_world/task_evals/single/osmand.py::_coords_match
  fail_if:
  - text: Fail if a retained benchmark episode/result record shows final `is_successful=0.0`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Fail if complete retained post-run evidence includes the dispatched waypoint list and a full pull of OsmAnd's tracks directory, and no saved GPX file's ordered `trkpt` sequence matches all requested locations in order within 0.001 degrees.
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_track_points
    - official/install/android_world/task_evals/single/osmand.py::_track_matches
    - official/install/android_world/task_evals/single/osmand.py::_coords_match
  undecided_if:
  - text: Undecided if the benchmark result record is missing and the retained evidence does not preserve the dispatched waypoint list or a complete post-run pull of OsmAnd's tracks directory.
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.goal
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
  - text: Undecided if retained GPX evidence appears matching but there is no retained evidence that the episode terminated, because `_run_task` zeros an otherwise-successful task score when `done` is false.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
stronger:
  additional_conditions: []

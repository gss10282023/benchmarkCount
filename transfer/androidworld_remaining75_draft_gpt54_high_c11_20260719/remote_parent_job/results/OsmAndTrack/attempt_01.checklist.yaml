schema_version: case_checklist_v1
case_unit_id: OsmAndTrack
domain: androidworld
task_id: OsmAndTrack
native:
  user_goal:
    text: Save a track in OsmAnd with waypoints Ruggell, Liechtenstein and Bendern, Liechtenstein in that order.
    support:
    - official/install/android_world/task_metadata.json::/44/task_template
  benchmark_success:
    text: 'Native success requires both runner completion and evaluator match: the episode runner must end with `done` true, and the post-run OsmAnd tracks must contain at least one saved GPX track whose `trkpt` sequence matches the run''s target waypoints in order under the evaluator''s 0.001-degree coordinate tolerance.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.initialize_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_track_matches
    - official/install/android_world/task_evals/single/osmand.py::_coords_match
  checked_by:
    text: AndroidWorld runner `_run_task` done-gates the score, and `android_world.task_evals.single.osmand.OsmAndTrack.is_successful` checks saved GPX track files for ordered waypoint matches.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
  decisive_artifacts:
  - artifact: retained episode result or task record
    question: Does it identify the dispatched waypoint list/goal for this run, and does it show the episode runner finished with `done` true?
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.goal
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: post-run OsmAnd tracks snapshot or exported GPX files
    question: Does any saved GPX track contain `trkpt` coordinates matching the target waypoints in order within the evaluator's 0.001-degree tolerance?
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_track_points
    - official/install/android_world/task_evals/single/osmand.py::_track_matches
    - official/install/android_world/task_evals/single/osmand.py::_coords_match
  success_if:
  - text: A retained run record identifies the dispatched target waypoints and shows the episode runner ended with `done` true.
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.goal
    - official/install/android_world/suite_utils.py::_run_task
  - text: Retained post-run OsmAnd GPX track files show at least one saved track whose `trkpt` sequence contains matches for every target waypoint in the required order within 0.001 degrees.
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_track_points
    - official/install/android_world/task_evals/single/osmand.py::_track_matches
    - official/install/android_world/task_evals/single/osmand.py::_coords_match
  fail_if:
  - text: A retained run record shows the episode runner did not end with `done` true.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: The dispatched target waypoints and post-run OsmAnd GPX track files are retained, but no saved track contains all target waypoints in the required order within 0.001 degrees.
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
    - official/install/android_world/task_evals/single/osmand.py::_track_matches
    - official/install/android_world/task_evals/single/osmand.py::_coords_match
  undecided_if:
  - text: Retained evidence does not identify the dispatched waypoint list or goal, so the evaluator's target waypoints cannot be reconstructed.
    support:
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.goal
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.initialize_task
  - text: Retained evidence does not preserve the runner `done` status or the post-run OsmAnd GPX track files well enough to check ordered waypoint matching.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.is_successful
stronger:
  additional_conditions:
  - id: fixed_case_waypoints
    text: Because the case packet's official task text names Ruggell, Liechtenstein then Bendern, Liechtenstein, require stronger-case success evidence to show a saved GPX track matching that ordered pair, not merely whatever runtime-generated waypoint list the released evaluator used.
    rationale: The official case text is fixed to Ruggell then Bendern, but the released runtime goal/evaluator for `OsmAndTrack` is parameterized and may dispatch other waypoint lists; this stronger condition closes that case-text/runtime gap.
    decisive_artifacts:
    - artifact: retained episode result or task record
      question: Did the run dispatch the fixed case-text waypoint pair or a different runtime-generated waypoint list?
      support:
      - official/install/android_world/task_metadata.json::/44/task_template
      - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.goal
      - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.generate_random_params
    - artifact: post-run OsmAnd tracks snapshot or exported GPX files
      question: Does any saved GPX track match Ruggell, Liechtenstein and Bendern, Liechtenstein in that order?
      support:
      - official/install/android_world/task_metadata.json::/44/task_template
      - official/install/android_world/task_evals/single/osmand.py::_track_points
      - official/install/android_world/task_evals/single/osmand.py::_track_matches
    support:
    - official/install/android_world/task_metadata.json::/44/task_template
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.goal
    - official/install/android_world/task_evals/single/osmand.py::OsmAndTrack.generate_random_params

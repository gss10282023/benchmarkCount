schema_version: case_checklist_v1
case_unit_id: MarkorDeleteNewestNote
domain: androidworld
task_id: MarkorDeleteNewestNote
native:
  user_goal:
    text: Delete the newest note in Markor.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote
  benchmark_success:
    text: Native success requires both a completed episode and a post-run Markor file list that, after sorting by change_time, matches the initial sorted list at every surviving index and is exactly one file shorter; equivalently, only the initial last/newest note is missing.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  checked_by:
    text: Released runner done-gate plus MarkorDeleteNewestNote.is_successful over Markor file metadata.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  decisive_artifacts:
  - artifact: Episode result record
    question: Did the runner record the episode as done=true, so the task evaluator score was not forced to 0.0?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Pre-run Markor file listing with file_name and change_time
    question: What was the initial Markor note list when sorted by change_time, and which entry was last/newest?
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.initialize_task
    - official/install/android_world/utils/file_utils.py::FileWithMetadata
  - artifact: Post-run Markor file listing with file_name and change_time
    question: After sorting by change_time, does the post-run list equal the initial sorted list with exactly the last/newest entry removed and no surviving entry changed?
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
    - official/install/android_world/utils/file_utils.py::FileWithMetadata
  success_if:
  - text: A retained run record shows done=true, and the sorted post-run Markor file list matches the initial sorted list at every surviving index with identical file_name and change_time while having exactly one fewer entry.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  fail_if:
  - text: A retained run record shows done=false.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Any surviving post-run entry differs from the initial sorted entry at the same index in file_name or change_time.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
  - text: The post-run sorted file list is not exactly one entry shorter than the initial sorted list.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
  undecided_if:
  - text: The native claim cannot be checked from retained evidence because either the runner done status is missing or either the pre-run or post-run Markor file listing lacks the file_name/change_time data needed for the comparison.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.initialize_task
    - official/install/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/utils/file_utils.py::FileWithMetadata
stronger:
  additional_conditions: []

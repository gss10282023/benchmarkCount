schema_version: case_checklist_v1
case_unit_id: SystemBluetoothTurnOffVerify
domain: androidworld
task_id: SystemBluetoothTurnOffVerify
native:
  user_goal:
    text: Turn bluetooth off.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle
    - official/install/android_world/task_evals/single/system.py::SystemBluetoothTurnOffVerify.generate_random_params
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
  benchmark_success:
    text: Native success requires both the runner completion gate (`done=true`) and the Bluetooth evaluator for `on_or_off='off'`, which accepts only `settings get global bluetooth_on` equal to `0`.
    support:
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics.done_gate
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::SystemBluetoothTurnOffVerify.generate_random_params
  checked_by:
    text: AndroidWorld runner completion gating plus `_SystemBluetoothToggle.is_successful`.
    support:
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics.done_gate
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
  decisive_artifacts:
  - artifact: Retained episode trace or equivalent completion record
    question: Does it show the episode finished with `done=true`?
    support:
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics.done_gate
  - artifact: Retained evaluator-visible Bluetooth setting evidence at evaluation time
    question: Does it show `settings get global bluetooth_on` returned `0`?
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
  success_if:
  - text: Retained completion evidence shows `done=true`, and retained evaluator-visible Bluetooth setting evidence shows `settings get global bluetooth_on` returned `0`.
    support:
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics.done_gate
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
  fail_if:
  - text: Retained completion evidence shows `done=false`.
    support:
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics.done_gate
  - text: Retained evaluator-visible Bluetooth setting evidence shows `settings get global bluetooth_on` returned a value other than `0`.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
  undecided_if:
  - text: Completion evidence is missing or unusable, and retained Bluetooth-state evidence does not already establish evaluator mismatch.
    rationale: Native success depends on the runner `done` gate, so state evidence showing Bluetooth off is not enough by itself when reliable completion evidence is absent.
  - text: Evaluator-visible Bluetooth setting evidence at evaluation time is missing or unusable, and completion evidence does not already establish `done=false`.
    rationale: The released evaluator decides raw task success from the exact `settings get global bluetooth_on` value, so missing underlying state leaves the native claim unresolved unless another retained artifact already proves failure.
stronger:
  additional_conditions: []

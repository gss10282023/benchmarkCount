schema_version: case_checklist_v1
case_unit_id: SystemBrightnessMaxVerify
domain: androidworld
task_id: SystemBrightnessMaxVerify
native:
  user_goal:
    text: Turn brightness to the max value.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.template
    - official/install/android_world/task_evals/single/system.py::SystemBrightnessMaxVerify.generate_random_params
  benchmark_success:
    text: 'Native success requires both: the run reaches terminal completion under the runner''s done gate, and the evaluator-visible system screen_brightness value at evaluation time is 255 for this max-brightness case.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::SystemBrightnessMaxVerify.generate_random_params
  checked_by:
    text: android_world.suite_utils._run_task applies the done gate, and _SystemBrightnessToggle.is_successful reads settings get system screen_brightness and compares it to 255 when max_or_min is max.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::SystemBrightnessMaxVerify.generate_random_params
  decisive_artifacts:
  - artifact: Retained completion-gate evidence from the episode record or terminal trace
    question: Does the run show terminal done=true or done=false?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Retained post-run evaluator-visible brightness observation
    question: At evaluation time, does settings get system screen_brightness equal 255?
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::SystemBrightnessMaxVerify.generate_random_params
  success_if:
  - text: Retained evidence shows done=true, and the post-run evaluator-visible screen_brightness value is 255.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::SystemBrightnessMaxVerify.generate_random_params
  fail_if:
  - text: Retained completion-gate evidence shows done=false; the runner scores the case as failure regardless of the brightness setting.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Retained post-run evaluator-visible screen_brightness value exists and is not 255; for this case the evaluator returns failure.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/android_world/task_evals/single/system.py::SystemBrightnessMaxVerify.generate_random_params
  undecided_if:
  - text: The retained record does not establish the completion gate and does not contain a usable post-run screen_brightness observation, or the underlying evaluation observation is missing or unusable because of runtime exception, NaN, or missing trace evidence.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/suite_utils.py::_create_failed_result
    rationale: Native success depends on both the runner completion gate and the evaluator-visible brightness reading; without usable retained evidence for those underlying checks, the native claim cannot be decided from storage alone.
stronger:
  additional_conditions: []

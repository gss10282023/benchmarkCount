schema_version: case_checklist_v1
case_unit_id: MarkorCreateNoteFromClipboard
domain: androidworld
task_id: MarkorCreateNoteFromClipboard
native:
  user_goal:
    text: Create a Markor note with the official `file_name`, paste the current clipboard contents into the note, and save it.
    support:
    - official/install/android_world/task_metadata.json::[28].task_template
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.initialize_task
  benchmark_success:
    text: 'Native success requires both: the runner records `done=true`, and the final file at the official `file_name` under `MARKOR_DATA` exists and, after CR removal and outer-whitespace trimming, its contents fuzzy-match the official `file_content`.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.__init__
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  checked_by:
    text: Runner terminal `done` gating plus `MarkorCreateNoteFromClipboard.is_successful`, which delegates to `CreateFile.is_successful` over the Markor documents directory.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
  decisive_artifacts:
  - artifact: Retained execution record with terminal `done` status
    question: Does the retained run record show whether the episode terminated with `done=true` or `done=false`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Retained final Markor filesystem snapshot or extracted file contents
    question: In `MARKOR_DATA`, does the official `file_name` exist, and if so do its final contents satisfy the evaluator's CR-strip, trim, and fuzzy-match check against official `file_content`?
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.__init__
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  success_if:
  - text: The retained execution record shows `done=true`, and retained final Markor file evidence shows that the official `file_name` exists under `MARKOR_DATA` and its contents, after CR removal and outer-whitespace trimming, fuzzy-match official `file_content`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.__init__
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  fail_if:
  - text: The retained execution record shows `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Usable final Markor evidence shows that the official `file_name` is absent from `MARKOR_DATA`, or that its contents fail the evaluator's fuzzy-match check against official `file_content`.
    support:
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.__init__
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    - official/install/android_world/env/device_constants.py::MARKOR_DATA
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  undecided_if:
  - text: Retained evidence does not establish terminal `done` status and also does not provide usable final Markor file existence/content evidence under the evaluator rule; exception or score metadata alone do not decide the native claim.
    rationale: The checklist lock treats missing usable underlying evidence, runtime/evaluator exceptions, and summary success metadata as non-decisive unless other retained evidence independently proves success or failure.
stronger:
  additional_conditions:
  - id: require_explicit_paste_trace
    text: Beyond native scoring, require retained interaction evidence to show that the note text was inserted via an explicit paste operation in Markor before save, because the official task requires a paste operation while the released evaluator accepts any matching saved file content.
    rationale: 'This closes a concrete task/evaluator gap: the task text requires pasting from the clipboard, but native evaluation only checks final file existence and content match, so a run could type or otherwise reproduce the same text and still pass natively.'
    decisive_artifacts:
    - artifact: Retained Markor editing interaction trace or UI/action log
      question: Does the retained interaction evidence show an explicit paste action or clipboard insertion event in the Markor editor before the note was saved?
      support:
      - official/install/android_world/task_metadata.json::[28].task_template
      - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.is_successful
      - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful
    support:
    - official/install/android_world/task_metadata.json::[28].task_template
    - official/install/android_world/task_evals/single/markor.py::MarkorCreateNoteFromClipboard.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::CreateFile.is_successful

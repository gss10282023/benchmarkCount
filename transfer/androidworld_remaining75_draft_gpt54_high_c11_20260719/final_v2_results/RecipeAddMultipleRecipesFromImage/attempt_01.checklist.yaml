schema_version: case_checklist_v1
case_unit_id: RecipeAddMultipleRecipesFromImage
domain: androidworld
task_id: RecipeAddMultipleRecipesFromImage
native:
  user_goal:
    text: Add the recipes shown in `recipes.jpg` in Simple Gallery Pro to the Broccoli recipe app.
    support:
    - official/install/android_world/task_metadata.json::[46].task_template
    - official/install/android_world/task_evals/single/recipe.py::RecipeAddMultipleRecipesFromImage.goal
  benchmark_success:
    text: 'Native success requires both `done=true` at episode end and a passing Broccoli `recipes`-table addition-integrity check: the post-run table must contain exactly three new rows matching the official target recipes under fuzzy matching on `title`, `description`, `servings`, `preparationTime`, `source`, `ingredients`, and `directions`, exact match on `favorite`, with all pre-run rows preserved and total row count exactly pre-run + 3.'
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_addition_integrity
    - official/install/android_world/suite_utils.py::_run_task
  checked_by:
    text: Released AndroidWorld runner `_run_task` plus the released recipe-add evaluator on the Broccoli SQLite `recipes` table.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeApp
  decisive_artifacts:
  - artifact: Episode trace or other retained runner-completion evidence
    question: Does the retained underlying run evidence show the episode ended with `done=true`, or with `done=false` which the runner gates to native failure?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Pre-run Broccoli `recipes` table snapshot
    question: What rows were present in `/data/data/com.flauschcode.broccoli/databases/broccoli`, table `recipes`, before agent actions, so the evaluator's preserved-row and count-delta checks can be applied?
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::SQLiteApp.list_rows
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.initialize_task
    - official/install/android_world/task_evals/single/recipe.py::_RecipeApp
  - artifact: Post-run Broccoli `recipes` table snapshot
    question: Compared with the pre-run snapshot, does the final `recipes` table add exactly three rows that match the official target recipes under the evaluator's comparison rule while leaving all pre-run rows intact?
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_addition_integrity
    - official/install/android_world/task_evals/single/recipe.py::_RecipeApp
  success_if:
  - text: 'Retained runner-completion evidence shows `done=true`, and the retained pre-run and post-run Broccoli `recipes` table snapshots satisfy the evaluator''s addition-integrity rule: each official target recipe has a matching post-run row under the evaluator''s field comparisons, every pre-run row remains, and the total row count is exactly pre-run + 3.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_addition_integrity
  fail_if:
  - text: Retained underlying run evidence shows the episode ended with `done=false`, regardless of the final database contents.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: 'Given usable pre-run and post-run Broccoli `recipes` table snapshots, native failure is established if the evaluator''s addition-integrity rule does not hold: any official target recipe lacks a matching post-run row under the comparison rule, any pre-run row is missing or altered, or the post-run row count is not exactly pre-run + 3.'
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_addition_integrity
  undecided_if:
  - text: Retained completion-gate evidence is missing or unreadable, and there is no retained underlying evidence establishing `done=false`; because native success is runner-gated on `done=true`, database evidence alone does not decide the native claim.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    rationale: The released runner turns task-level success into benchmark success only after applying the retained `done` gate.
  - text: Retained Broccoli table evidence is missing, unreadable, or lacks either the pre-run or post-run `recipes` snapshot, and there is no retained `done=false`; the released addition-integrity check cannot then be applied from underlying evidence.
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::SQLiteApp.list_rows
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_addition_integrity
    rationale: The native database check compares pre-run and post-run table state, so one missing side leaves the stored evidence non-decisive unless another retained artifact already establishes failure.
stronger:
  additional_conditions:
  - id: source_image_viewed
    text: Beyond native success, retained UI trace shows Simple Gallery Pro was opened and `recipes.jpg` was viewed during the run.
    rationale: The official task goal requires taking the recipes from `recipes.jpg` in Simple Gallery Pro, but the released evaluator only checks the final Broccoli database plus the runner `done` gate.
    decisive_artifacts:
    - artifact: Retained UI trace, screenshots, or foreground-app log
      question: Does the retained trace show Simple Gallery Pro in the foreground and the specific file `recipes.jpg` opened or viewed during the episode?
      support:
      - official/install/android_world/task_evals/single/recipe.py::RecipeAddMultipleRecipesFromImage.goal
      - official/install/android_world/task_evals/single/recipe.py::RecipeAddMultipleRecipesFromImage.initialize_task
    support:
    - official/install/android_world/task_metadata.json::[46].task_template
    - official/install/android_world/task_evals/single/recipe.py::RecipeAddMultipleRecipesFromImage.goal
    - official/install/android_world/task_evals/single/recipe.py::RecipeAddMultipleRecipesFromImage.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/android_world/suite_utils.py::_run_task

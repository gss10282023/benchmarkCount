schema_version: case_checklist_v1
case_unit_id: NotesTodoItemCount
domain: androidworld
task_id: NotesTodoItemCount
native:
  user_goal:
    text: Answer with the number of todo notes in the specified Joplin folder, as a single number.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3434-3523
  benchmark_success:
    text: 'Native success requires both: the episode finishes with `done=true`, and the submitted final answer matches the evaluator''s expected numeric count for the instantiated task under the COUNT/NUMBER_MATCH rule; for this task that expected answer is `3`.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::get_expected_answer
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3434-3523
  checked_by:
    text: Runner `done` gating in `_run_task`, plus `InformationRetrieval.is_successful` calling `proto_utils.check_agent_answer` against the instantiated task's COUNT/NUMBER_MATCH success criterion.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3434-3523
  decisive_artifacts:
  - artifact: Retained episode trace or equivalent answer/completion record
    question: Does it show `done=true` or `done=false`, and what final answer text, if any, was submitted?
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  - artifact: Retained instantiated task proto or equivalent initialized-state artifact
    question: Does it define exactly three `notes_app.notes` entries for the target folder with `is_todo=True`, yielding evaluator expected answer `3` under COUNT of `is_todo`?
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3434-3523
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::get_expected_answer
  success_if:
  - text: The retained episode record shows `done=true`, and the retained final answer number-matches the evaluator's expected answer `3`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3434-3523
  fail_if:
  - text: The retained episode record shows `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: The retained episode record shows `done=true`, and the retained final answer is missing as a submitted answer, non-numeric under the evaluator, or numeric but does not number-match `3`.
    support:
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3434-3523
  undecided_if:
  - text: The retained evidence does not reliably establish the runner `done` status and the submitted final answer text, and no other retained artifact independently determines native success or failure.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  - text: Completion and answer evidence exist, but the retained instantiated task-state artifact needed to derive the evaluator's expected answer is missing or unusable.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::get_expected_answer
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3434-3523
stronger:
  additional_conditions:
  - id: live_joplin_state_supports_answer
    text: Final retained Joplin notes state should still make the submitted count true for the target folder, not merely match the evaluator's fixed precomputed answer.
    rationale: The task prompt asks how many todos are in the Joplin folder, but native scoring checks only the submitted answer against the precomputed COUNT from `relevant_state` and does not verify that later note edits left the live app state consistent with that answer.
    decisive_artifacts:
    - artifact: Final retained Joplin notes database or equivalent post-run notes snapshot
      question: How many notes in the prompted folder are marked `is_todo=True` after the run?
      support:
      - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3434-3523
    - artifact: Retained prompt/answer trace
      question: Which folder was asked about, and what number did the agent submit?
      support:
      - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3434-3523
      - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::3434-3523
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::get_expected_answer

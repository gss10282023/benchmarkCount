schema_version: case_checklist_v1
case_unit_id: SystemBluetoothTurnOnVerify
domain: androidworld
task_id: SystemBluetoothTurnOnVerify
native:
  user_goal:
    text: Turn Bluetooth on; this verify variant initializes the device with Bluetooth already on.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.template
    - official/install/android_world/task_evals/single/system.py::SystemBluetoothTurnOnVerify.generate_random_params
    - official/install/android_world/task_evals/single/system.py::SystemBluetoothTurnOnVerify.initialize_task
  benchmark_success:
    text: 'Native success requires both official checks: retained evidence shows the episode finished with `done=true`, and the evaluator-visible Android global setting `bluetooth_on` equals `1` when checked.'
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  checked_by:
    text: AndroidWorld checks `settings get global bluetooth_on` against expected value `1`, then applies the suite runner `done` gate.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  decisive_artifacts:
  - artifact: Episode completion evidence
    question: Does retained execution evidence show the episode ended with `done=true` or `done=false`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Post-run Android settings evidence for `global.bluetooth_on`
    question: Does retained evaluator-visible state show `settings get global bluetooth_on` returned `1` at evaluation time?
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
  success_if:
  - text: Retained completion evidence shows `done=true`, and retained post-run Android settings evidence shows `settings get global bluetooth_on` returned `1`.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  fail_if:
  - text: Retained completion evidence shows `done=false`; the suite runner then records failure regardless of the Bluetooth setting value.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Retained evaluator-visible settings evidence shows `settings get global bluetooth_on` returned a value other than `1`; the task evaluator then returns `0.0`.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
  undecided_if:
  - text: Retained artifacts do not establish both required native components, because completion evidence for `done` or usable post-run evidence for `bluetooth_on` is missing or unusable, and the available artifacts do not independently establish failure.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
    - official/install/android_world/suite_utils.py::_run_task
    rationale: The native criterion is a composition of the runner completion gate and the evaluator-visible Bluetooth setting check; without enough retained evidence for that composition, the benchmark claim cannot be decided from artifacts alone.
stronger:
  additional_conditions: []

schema_version: case_checklist_v1
case_unit_id: FilesMoveFile
domain: androidworld
task_id: FilesMoveFile
native:
  user_goal:
    text: Move the task-specified file from the task-specified source folder to the task-specified destination folder within the emulator's sdk_gphone_x86_64 storage area.
    support:
    - official/install/android_world/task_metadata.json::[22].task_template
    - official/install/android_world/task_evals/single/files.py::FilesMoveFile
  benchmark_success:
    text: 'Native success requires both parts of the released benchmark logic: the episode reaches the runner completion gate (`interaction_results.done=true`), and the delegated move-file validator would return success because the task-specified file is absent from the source directory and present in the destination directory under emulator storage.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/files.py::FilesMoveFile.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.__init__
    - official/install/android_world/env/device_constants.py::EMULATOR_DATA
  checked_by:
    text: '`suite_utils._run_task` applies the `done` gate, and `FilesMoveFile.is_successful` delegates to `MoveFile.is_successful`, which checks filesystem existence in the source and destination directories.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/files.py::FilesMoveFile.is_successful
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.is_successful
  decisive_artifacts:
  - artifact: Retained task instance goal or params
    question: Which file name, source folder, and destination folder were specified for this episode?
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
    - official/install/android_world/task_evals/single/files.py::FilesMoveFile.schema
    - official/install/android_world/task_evals/single/files.py::FilesMoveFile.generate_random_params
  - artifact: Retained post-run filesystem evidence for the task-specified source and destination folders
    question: Does the evidence show the task-specified file is absent from the source directory and present in the destination directory under emulator storage?
    support:
    - official/install/android_world/task_evals/single/files.py::FilesMoveFile.__init__
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.__init__
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.is_successful
    - official/install/android_world/env/device_constants.py::EMULATOR_DATA
  - artifact: Retained episode/runner record with the completion gate
    question: Did the episode finish with `interaction_results.done=true`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  success_if:
  - text: The retained task instance goal/params identify a file name, source folder, and destination folder; retained post-run filesystem evidence shows that file absent from the source directory and present in the destination directory; and retained runner evidence shows `interaction_results.done=true`.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
    - official/install/android_world/task_evals/single/files.py::FilesMoveFile.schema
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.is_successful
  fail_if:
  - text: Retained post-run filesystem evidence shows the task-specified file still exists in the source directory.
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.is_successful
  - text: Retained post-run filesystem evidence shows the task-specified file does not exist in the destination directory.
    support:
    - official/install/android_world/task_evals/common_validators/file_validators.py::MoveFile.is_successful
  - text: Retained runner evidence shows `interaction_results.done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  undecided_if:
  - text: The retained task instance goal/params are missing or unusable, so the reviewer cannot determine which file and folders the validator should check.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
    - official/install/android_world/task_evals/single/files.py::FilesMoveFile.schema
  - text: Usable retained post-run filesystem evidence is missing for one or both task-specified directories, and no other retained evidence independently establishes a native fail condition.
    rationale: The validator's native decision depends on source and destination existence checks; without usable evidence for those checks, success cannot be established, and failure is only native-decisive if some other retained evidence already proves it.
  - text: Retained filesystem evidence shows the move condition holds, but the runner completion gate (`interaction_results.done`) is missing or unusable.
    support:
    - official/install/android_world/suite_utils.py::_run_task
stronger:
  additional_conditions: []

schema_version: case_checklist_v1
case_unit_id: RecipeAddMultipleRecipes
domain: androidworld
task_id: RecipeAddMultipleRecipes
native:
  user_goal:
    text: Add the 3 recipes specified in the task prompt to the Broccoli app.
    support:
    - official/install/android_world/task_metadata.json::[45].task_template
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.goal
  benchmark_success:
    text: 'Native success requires the AndroidWorld runner completion gate `done=true` and a passing Broccoli SQLite add-integrity check: the post-run `recipes` table preserves every pre-run row, has exactly 3 additional rows, and those added rows match the 3 goal recipes on `title`, `description`, `servings`, `preparationTime`, `source`, `ingredients`, `directions`, and `favorite` under the validator''s comparison rules.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_addition_integrity
  checked_by:
    text: AndroidWorld runner `_run_task` plus `AddMultipleRows.is_successful`, `_RecipeAddMultipleRecipes.validate_addition_integrity`, and `validate_rows_addition_integrity`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_addition_integrity
  decisive_artifacts:
  - artifact: Retained dispatched task goal/prompt for this run
    question: Which 3 recipes was the agent asked to add in this run?
    support:
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.goal
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Retained pre-run and post-run extracts of the Broccoli SQLite `recipes` table
    question: Do the final table contents preserve the pre-run rows and add exactly 3 rows matching the goal recipes under the evaluator's comparison rules?
    support:
    - official/install/android_world/task_evals/single/recipe.py::_DB_PATH
    - official/install/android_world/task_evals/single/recipe.py::_TABLE_NAME
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_addition_integrity
  - artifact: Retained episode completion evidence
    question: Did the episode end with `done=true` or `done=false`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  success_if:
  - text: Retained completion evidence shows `done=true`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Using the retained prompt and retained pre-run/post-run `recipes` table snapshots, all pre-run rows are still present unchanged, the post-run row count equals pre-run row count + 3, and each of the 3 goal recipes has a matching added row on `title`, `description`, `servings`, `preparationTime`, `source`, `ingredients`, `directions`, and `favorite` under the validator's comparison rules.
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_addition_integrity
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.goal
  fail_if:
  - text: Retained completion evidence shows `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: 'Using the retained prompt and retained pre-run/post-run `recipes` table snapshots, the add-integrity check fails: post-run row count is not pre-run row count + 3, any pre-run row is missing or altered, any of the 3 goal recipes lacks a matching added row, or unexpected extra rows were added.'
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_addition_integrity
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.goal
  undecided_if:
  - text: The retained prompt is missing or unusable, so the reviewer cannot determine which 3 recipes the added rows must match for this run.
    support:
    - official/install/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.goal
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
  - text: The retained pre-run or post-run `recipes` table evidence is missing or unusable, so the add-integrity check cannot be applied from stored evidence.
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_addition_integrity
  - text: Completion-gate evidence is missing or unusable, and the remaining retained evidence does not independently establish native failure.
    support:
    - official/install/android_world/suite_utils.py::_run_task
stronger:
  additional_conditions: []

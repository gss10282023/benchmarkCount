schema_version: case_checklist_v1
case_unit_id: TasksHighPriorityTasks
domain: androidworld
task_id: TasksHighPriorityTasks
native:
  user_goal:
    text: Identify the high-priority task titles in Tasks app and answer with titles only, comma-separated if multiple.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksHighPriorityTasks"]
  benchmark_success:
    text: Native success requires the episode to finish with `done=true` and the submitted final answer to pass the released InformationRetrieval answer check against the episode's initialized Tasks-app high-priority title set; for this task, high priority means `importance` 0 and the answer is compared as comma-split items under `STRING_MATCH`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksHighPriorityTasks"]
    - official/install/android_world/task_evals/information_retrieval/proto/state.proto::TasksAppTask
  checked_by:
    text: Check retained episode evidence for the completion gate and submitted answer, and check retained episode-specific Tasks-app state for the `title` values of tasks whose `importance` is 0.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/env/interface.py::AsyncAndroidEnv.execute_action
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksHighPriorityTasks"]
    - official/install/android_world/task_evals/information_retrieval/proto/state.proto::TasksAppTask
  decisive_artifacts:
  - artifact: Episode-specific Tasks app state snapshot or extracted task rows
    question: Which retained task rows have `importance` 0, and what are their `title` values?
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksHighPriorityTasks"]
    - official/install/android_world/task_evals/information_retrieval/proto/state.proto::TasksAppTask
  - artifact: Episode trace or final answer record
    question: Did the run terminate with `done=true`, and what final answer text was submitted via the answer action / interaction cache?
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/env/interface.py::AsyncAndroidEnv.execute_action
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  success_if:
  - text: Retained evidence shows `done=true`, preserves a non-empty final answer text, and that answer matches the retained `title` set for `importance`-0 task rows under the released comma-split and `STRING_MATCH` comparison rule.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto/state.proto::TasksAppTask
  fail_if:
  - text: Retained episode trace shows `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Retained evidence shows `done=true`, but the preserved final answer is empty or does not match the `importance`-0 task-title set under the released comma-split and `STRING_MATCH` comparison rule.
    support:
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksHighPriorityTasks"]
    - official/install/android_world/task_evals/information_retrieval/proto/state.proto::TasksAppTask
  undecided_if:
  - text: Retained evidence does not preserve enough underlying data to reconstruct both the completion gate and the answer comparison, such as missing usable final answer text, missing usable episode-specific Tasks-app state for the `importance`-0 titles, or both.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksHighPriorityTasks"]
    - official/install/android_world/task_evals/information_retrieval/proto/state.proto::TasksAppTask
stronger:
  additional_conditions:
  - id: exact_title_match
    text: Require the submitted comma-split answer item(s) to match the `importance`-0 task title(s) exactly after trimming surrounding whitespace, not merely by fuzzy string matching.
    rationale: The prompt asks for the task titles only, while native scoring uses fuzzy string matching with a 0.9 similarity threshold, so near-miss spellings can pass natively.
    decisive_artifacts:
    - artifact: Episode-specific Tasks app state snapshot or extracted task rows
      question: Which retained task rows have `importance` 0, and what are their `title` values?
      support:
      - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksHighPriorityTasks"]
      - official/install/android_world/task_evals/information_retrieval/proto/state.proto::TasksAppTask
    - artifact: Episode trace or final answer record
      question: What exact final answer text was submitted, and did the run terminate with `done=true`?
      support:
      - official/install/android_world/suite_utils.py::_run_task
      - official/install/android_world/env/interface.py::AsyncAndroidEnv.execute_action
      - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksHighPriorityTasks"]
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match

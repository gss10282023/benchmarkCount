schema_version: case_checklist_v1
case_unit_id: RecipeDeleteMultipleRecipes
domain: androidworld
task_id: RecipeDeleteMultipleRecipes
native:
  user_goal:
    text: Delete the recipes named in the prompt from the Broccoli app.
    support:
    - official/install/android_world/task_metadata.json::[53].task_template
    - official/install/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.goal
  benchmark_success:
    text: 'Runner-gated success: the episode ends with `done=true`, and the Broccoli `recipes` table passes the delete-integrity check. For `RecipeDeleteMultipleRecipes`, initialization inserts exactly three target recipes and no noise rows, so this is equivalent to the post-run `recipes` table being empty.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteMultipleRecipes
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  checked_by:
    text: AndroidWorld runner `done` gate plus Broccoli SQLite evaluation in `DeleteMultipleRows.is_successful` and `validate_rows_removal_integrity`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  decisive_artifacts:
  - artifact: Retained episode completion evidence
    question: Does retained underlying run evidence show the episode terminated with `done=true` rather than `done=false`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Post-run Broccoli database snapshot
    question: In `/data/data/com.flauschcode.broccoli/databases/broccoli`, is table `recipes` empty at scoring time?
    support:
    - official/install/android_world/task_evals/single/recipe.py::23-49
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteMultipleRecipes
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  success_if:
  - text: Completion evidence shows `done=true`, and the retained post-run Broccoli `recipes` table is empty.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteMultipleRecipes
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  fail_if:
  - text: Completion evidence shows `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: The retained post-run Broccoli `recipes` table is non-empty; for this task any remaining or added row violates the delete-integrity check.
    support:
    - official/install/android_world/task_evals/single/recipe.py::RecipeDeleteMultipleRecipes
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.initialize_task
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
  undecided_if:
  - text: Usable completion-gate evidence is missing or ambiguous, and the retained database state does not otherwise establish failure.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    rationale: An empty post-run table is not native success unless the runner's `done=true` gate is also established.
  - text: No usable post-run Broccoli `recipes` table snapshot is retained, and completion evidence alone does not establish failure.
    support:
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::DeleteMultipleRows.is_successful
    - official/install/android_world/task_evals/common_validators/sqlite_validators.py::validate_rows_removal_integrity
    rationale: Native scoring depends on the SQLite post-state; without that state, success cannot be verified from retained evidence alone.
stronger:
  additional_conditions: []

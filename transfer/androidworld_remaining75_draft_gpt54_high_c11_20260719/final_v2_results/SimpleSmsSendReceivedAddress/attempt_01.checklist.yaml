schema_version: case_checklist_v1
case_unit_id: SimpleSmsSendReceivedAddress
domain: androidworld
task_id: SimpleSmsSendReceivedAddress
native:
  user_goal:
    text: In Simple SMS Messenger, text `{name1}` the event address that `{name2}` just sent.
    support:
    - official/install/android_world/task_evals/single/sms.py::SimpleSmsSendReceivedAddress
    - official/install/android_world/task_metadata.json::[86].task_template
  benchmark_success:
    text: Native benchmark success requires both `interaction_results.done=true` and `SimpleSMSSendSms.is_successful(env)=1.0`; that evaluator accepts only a recent sent SMS to the official recipient number whose body fuzzy-matches the official message value, with Simple SMS Messenger in the foreground and no visible UI text starting with `Sending`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
    - official/install/android_world/task_evals/common_validators/sms_validators.py::was_sent
    - official/install/android_world/task_evals/common_validators/sms_validators.py::_check_if_stuck_at_sending
  checked_by:
    text: Runner `done` gating plus the `SimpleSMSSendSms` evaluator's sent-SMS, recency, foreground-package, and no-`Sending` UI checks.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
    - official/install/android_world/task_evals/common_validators/sms_validators.py::was_sent
  decisive_artifacts:
  - artifact: episode completion record with evaluation-end timing
    question: Does retained execution evidence show the episode reached evaluation with `done=true`, and what end-of-evaluation time is available to judge the SMS recency window?
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.get_android_time
  - artifact: sent SMS snapshot or equivalent telephony-state extract
    question: At evaluation time, is there a sent SMS to the official recipient number whose body fuzzy-matches the official message value and whose `date` is within 5 minutes of the evaluation time?
    support:
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.get_sent_messages
    - official/install/android_world/task_evals/common_validators/sms_validators.py::was_sent
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  - artifact: end-of-run foreground-activity and UI-state evidence
    question: At evaluation time, is the foreground package `com.simplemobiletools.smsmessenger`, and does the visible UI lack any element whose text starts with `Sending`?
    support:
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
    - official/install/android_world/task_evals/common_validators/sms_validators.py::_check_if_stuck_at_sending
  success_if:
  - text: Retained execution evidence shows the runner's completion gate passed with `done=true`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Retained sent-SMS evidence shows a message to the official recipient number whose body matches the official message under the evaluator's fuzzy-match rule and whose timestamp is within 5 minutes of evaluation time.
    support:
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
    - official/install/android_world/task_evals/common_validators/sms_validators.py::was_sent
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  - text: Retained end-state evidence shows Simple SMS Messenger is the foreground app and no visible UI element text starts with `Sending`.
    support:
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
    - official/install/android_world/task_evals/common_validators/sms_validators.py::_check_if_stuck_at_sending
  fail_if:
  - text: Retained execution evidence shows the episode ended with `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Retained sent-SMS and timing evidence conclusively show there is no message satisfying the evaluator's recipient, fuzzy-body-match, and 5-minute recency rule at evaluation time.
    support:
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
    - official/install/android_world/task_evals/common_validators/sms_validators.py::was_sent
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  - text: Retained end-state evidence shows the foreground package is not `com.simplemobiletools.smsmessenger`.
    support:
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
  - text: Retained end-state UI evidence shows a visible element whose text starts with `Sending`.
    support:
    - official/install/android_world/task_evals/common_validators/sms_validators.py::_check_if_stuck_at_sending
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
  undecided_if:
  - text: The retained record lacks enough underlying evidence to reconstruct one or more native checks (`done`, SMS recency/content, foreground package, or no-`Sending` UI), and the remaining artifacts do not independently establish success or failure.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
    - official/install/android_world/task_evals/common_validators/sms_validators.py::was_sent
    - official/install/android_world/task_evals/common_validators/sms_validators.py::_check_if_stuck_at_sending
stronger:
  additional_conditions:
  - id: forwarded_from_name2_inbox
    text: Beyond native success, retained contact, inbox, and sent-message evidence should show that the outbound SMS to `{name1}`'s number matches the SMS body received from the contact created for `{name2}`, explicitly verifying the forward/retrieval part of the task rather than only a standalone send.
    rationale: The official task says to text the address that `{name2}` just sent, and task initialization creates exactly such an inbound SMS from `{name2}`. The native evaluator only checks for an outbound SMS with the expected body to `{name1}`'s number, plus app/state checks, so it does not verify that the sent text actually came from `{name2}`'s received message.
    decisive_artifacts:
    - artifact: contacts snapshot
      question: Which phone numbers are bound to the official contacts `{name1}` and `{name2}` at evaluation time?
      support:
      - official/install/android_world/task_evals/single/sms.py::SimpleSmsSendReceivedAddress.initialize_task
      - official/install/android_world/utils/contacts_utils.py::add_contact
    - artifact: received inbox snapshot
      question: Is there an inbox SMS from the contact number for `{name2}` whose body equals the official message/address value?
      support:
      - official/install/android_world/task_evals/single/sms.py::SimpleSmsSendReceivedAddress.initialize_task
      - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms._get_received_messages
    - artifact: sent SMS snapshot
      question: Does the outbound SMS to `{name1}`'s number have the same body as that received SMS from `{name2}`?
      support:
      - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.get_sent_messages
      - official/install/android_world/task_evals/common_validators/sms_validators.py::was_sent
    support:
    - official/install/android_world/task_evals/single/sms.py::SimpleSmsSendReceivedAddress
    - official/install/android_world/task_evals/single/sms.py::SimpleSmsSendReceivedAddress.initialize_task
    - official/install/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful

schema_version: case_checklist_v1
case_unit_id: SportsTrackerActivitiesCountForWeek
domain: androidworld
task_id: SportsTrackerActivitiesCountForWeek
native:
  user_goal:
    text: Determine how many activities of the requested category were done this week in OpenTracks, assuming the week starts on Monday, and answer with a single integer.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::2053-2275
  benchmark_success:
    text: Native success requires the runner to finish with done=true and the submitted answer to match the evaluator's official expected answer under NUMBER_MATCH parsing. For this case, the expected answer is the COUNT of relevant_state.sports_activities, which is 2.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::2053-2275
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::get_expected_answer
    - official/install/android_world/suite_utils.py::_run_task
  checked_by:
    text: Checked by the suite runner's done gate plus InformationRetrieval.is_successful, which reads the retained answer text from the environment interaction cache and compares it to the task proto's COUNT(sports_activities) expectation.
    support:
    - official/install/android_world/env/interface.py::AsyncAndroidEnv.execute_action
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::get_expected_answer
    - official/install/android_world/suite_utils.py::_run_task
  decisive_artifacts:
  - artifact: Episode trace or action log
    question: What answer text was submitted through an `answer` action, if any?
    support:
    - official/install/android_world/env/interface.py::AsyncAndroidEnv.execute_action
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  - artifact: Episode completion record
    question: Did the runner end the episode with `done=true` or `done=false`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  success_if:
  - text: The episode completion record shows `done=true`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: The retained answer submission evaluates as a single NUMBER_MATCH item equal to `2` under the evaluator's split/parse rule.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::2053-2275
    - official/install/android_world/env/interface.py::AsyncAndroidEnv.execute_action
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::get_expected_answer
  fail_if:
  - text: The episode completion record shows `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: A retained answer submission is present, but under the evaluator's split/parse rule it is non-numeric, splits into multiple items, or is a numeric value other than `2`.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::2053-2275
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::get_expected_answer
  - text: A complete enough retained action trace rules out any `answer` action before episode end.
    support:
    - official/install/android_world/env/interface.py::AsyncAndroidEnv.execute_action
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  undecided_if:
  - text: Retained evidence does not reliably show whether the runner reached `done=true`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    rationale: The done gate is mandatory for native success, so missing completion evidence is non-decisive unless other retained artifacts independently establish failure or success.
  - text: Retained evidence does not reliably preserve the submitted answer text, or whether any `answer` action occurred, and no other artifact independently establishes the native criterion or its negation.
    support:
    - official/install/android_world/env/interface.py::AsyncAndroidEnv.execute_action
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    rationale: The native evaluator depends on the submitted answer text in interaction_cache; without usable answer evidence, the stored record is non-decisive.
stronger:
  additional_conditions:
  - id: app_state_supports_answer
    text: Beyond native pass, retained goal text plus retained OpenTracks app state should show that the app actually contained exactly two activities of the requested category in the Monday-start week ending on October 15 2023, so the accepted answer `2` is supported by app state rather than only by the submitted answer text.
    rationale: The task prompt is about what was done in OpenTracks this week, but native scoring only checks done=true and whether the submitted answer matches the precomputed COUNT(sports_activities)=2; it does not re-check retained OpenTracks state at scoring time.
    decisive_artifacts:
    - artifact: Episode goal record
      question: Which activity category did the prompt ask about?
      support:
      - official/install/android_world/suite_utils.py::_run_task
      - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::2053-2275
    - artifact: OpenTracks database snapshot or equivalent retained app-state export
      question: For that requested category, does retained OpenTracks state show exactly two activities with start_date from October 9 2023 through October 15 2023?
      support:
      - official/install/android_world/env/device_constants.py::DT
      - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::2053-2275
      - official/install/android_world/task_evals/information_retrieval/activity_app_utils.py::setup_task_state
    support:
    - official/install/android_world/env/device_constants.py::DT
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::2053-2275
    - official/install/android_world/task_evals/information_retrieval/activity_app_utils.py::setup_task_state
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::get_expected_answer

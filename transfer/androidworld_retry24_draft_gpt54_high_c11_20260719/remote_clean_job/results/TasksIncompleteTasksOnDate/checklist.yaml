schema_version: case_checklist_v1
case_unit_id: TasksIncompleteTasksOnDate
domain: androidworld
task_id: TasksIncompleteTasksOnDate
native:
  user_goal:
    text: Report the titles of the Tasks app items that are incomplete and still due by the specified date, using titles only and comma-separating multiples.
    support:
    - derived/canonical_task_semantics.json::goal.prompt
  benchmark_success:
    text: Native success requires `done=true` and a non-empty final answer whose comma-split items pass the released `check_agent_answer` rule against the instantiated task's expected title list.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - derived/canonical_task_semantics.json::goal.proto_binding.task_definition.success_criteria
  checked_by:
    text: AndroidWorld runner completion gating plus `InformationRetrieval.is_successful` / `proto_utils.check_agent_answer`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
  decisive_artifacts:
  - artifact: Episode trace or equivalent run record
    question: Did the episode end with `done=true`, and what final answer text was submitted?
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  - artifact: Instantiated task proto or retained initial Tasks-app state snapshot
    question: What titles are the expected incomplete tasks due on or before the instantiated target date for this run?
    support:
    - derived/canonical_task_semantics.json::goal.proto_binding.task_definition.relevant_state
    - official/install/android_world/task_evals/information_retrieval/task_app_utils.py::create_task_from_proto
    - official/install/android_world/task_evals/information_retrieval/task_app_utils.py::check_task_conditions
  success_if:
  - text: The retained run record shows `done=true` and a non-empty final submitted answer.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  - text: Using the instantiated task proto or retained initial Tasks-app state, the expected title list for incomplete tasks due by the target date is reconstructable, and the submitted comma-split answer matches that list under the released `check_agent_answer` STRING_MATCH rule.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - derived/canonical_task_semantics.json::goal.proto_binding.task_definition.relevant_state
    - derived/canonical_task_semantics.json::goal.proto_binding.task_definition.success_criteria
  fail_if:
  - text: The retained run record shows the episode did not finish with `done=true`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: The retained run record shows no final submitted answer text or an empty final answer.
    support:
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  - text: With `done=true` and a non-empty final answer, the submitted comma-split items do not satisfy the released `check_agent_answer` rule against the expected title list reconstructed from the instantiated task proto or retained initial Tasks-app state.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - derived/canonical_task_semantics.json::goal.proto_binding.task_definition.relevant_state
    - derived/canonical_task_semantics.json::goal.proto_binding.task_definition.success_criteria
  undecided_if:
  - text: Stored evidence does not reliably preserve both the completion/final-answer record and an instantiated task proto or initial Tasks-app state snapshot from which the expected titles can be reconstructed, and no other retained underlying evidence independently establishes success or failure.
    rationale: Native S/F here depends on underlying completion status, final submitted answer text, and the run-specific expected title set; summary labels alone are non-decisive under the checklist instructions.
stronger:
  additional_conditions:
  - id: exact_expected_title_set
    text: 'Stronger than native: the submitted answer should list each expected incomplete-task title exactly once, with no omissions, duplicates, or fuzzy-only approximations.'
    rationale: 'The task asks for the task titles, but the released evaluator is weaker: it uses unordered fuzzy matching and equal item count, without one-to-one matching between submitted and expected titles, so duplicate or approximate title strings can satisfy native scoring.'
    decisive_artifacts:
    - artifact: Episode trace or equivalent run record
      question: What exact final answer text was submitted?
      support:
      - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
      - official/install/android_world/suite_utils.py::_run_task
    - artifact: Instantiated task proto or retained initial Tasks-app state snapshot
      question: What exact title set should be returned for the run's incomplete tasks due by the target date?
      support:
      - derived/canonical_task_semantics.json::goal.proto_binding.task_definition.relevant_state
      - derived/canonical_task_semantics.json::goal.proto_binding.task_definition.success_criteria
    support:
    - derived/canonical_task_semantics.json::goal.prompt
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match

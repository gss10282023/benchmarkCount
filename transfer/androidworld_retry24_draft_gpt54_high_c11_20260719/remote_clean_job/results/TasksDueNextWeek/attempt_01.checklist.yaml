schema_version: case_checklist_v1
case_unit_id: TasksDueNextWeek
domain: androidworld
task_id: TasksDueNextWeek
native:
  user_goal:
    text: Determine how many tasks are due next week in the Tasks app, treating weeks as Monday-based, and answer with a single integer.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::1397-1524
  benchmark_success:
    text: 'Native success requires both runner completion and answer-match: the episode must finish with `done=true`, and the final submitted answer must match the evaluator''s expected numeric answer for this task, which is computed with COUNT over `tasks_app_tasks` and checked with NUMBER_MATCH; otherwise the native score is 0.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::get_expected_answer
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::1397-1524
  checked_by:
    text: AndroidWorld's `_run_task` completion gate plus `InformationRetrieval.is_successful`, which delegates answer checking to `proto_utils.check_agent_answer`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
  decisive_artifacts:
  - artifact: Episode trace or retained final-answer record
    question: Did the run end with `done=true`, and what exact answer text was finally submitted?
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  - artifact: Retained Tasks app state snapshot, such as the Tasks database or an equivalent exported state
    question: How many tasks in the retained Tasks-app state have `due_date` in the next-week window, October 16 2023 through October 22 2023 inclusive?
    support:
    - official/install/android_world/env/device_constants.py::DT
    - official/install/android_world/task_evals/task_eval.py::TaskEval.initialize_task
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::1397-1524
    - official/install/android_world/task_evals/information_retrieval/task_app_utils.py::setup_task_state
    - official/install/android_world/task_evals/information_retrieval/task_app_utils.py::check_task_conditions
  success_if:
  - text: Retained evidence shows the episode finished with `done=true`, and the final submitted answer matches, under the evaluator's NUMBER_MATCH rule, the count of retained Tasks-app tasks due from October 16 2023 through October 22 2023 inclusive.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::_cast_answers_to_type
    - official/install/android_world/env/device_constants.py::DT
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::1397-1524
    - official/install/android_world/task_evals/information_retrieval/task_app_utils.py::setup_task_state
    - official/install/android_world/task_evals/information_retrieval/task_app_utils.py::check_task_conditions
  fail_if:
  - text: Retained evidence shows the episode did not finish with `done=true`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Retained evidence shows `done=true`, but no final submitted answer was provided, or the retained answer text is not accepted as a single numeric answer under the evaluator's NUMBER_MATCH parsing.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::_cast_answers_to_type
  - text: Retained evidence shows `done=true`, the final submitted answer is evaluator-parseable, and its numeric value differs from the count of retained Tasks-app tasks due from October 16 2023 through October 22 2023 inclusive.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/env/device_constants.py::DT
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::1397-1524
    - official/install/android_world/task_evals/information_retrieval/task_app_utils.py::setup_task_state
    - official/install/android_world/task_evals/information_retrieval/task_app_utils.py::check_task_conditions
  undecided_if:
  - text: The retained evidence does not reliably establish whether the run reached `done=true` or `done=false`.
    rationale: The native rule has an explicit completion gate, so missing or unusable completion evidence prevents deciding success or failure unless other retained evidence independently settles the gate.
  - text: Completion is known, but the retained evidence does not reliably preserve the exact final submitted answer text, or does not preserve enough Tasks-app state to determine the due-next-week count, and no other retained artifact independently establishes a match or mismatch.
    rationale: The native decision requires both the submitted answer and the evaluator-visible underlying state needed to determine the official count; if either side of that comparison is missing, the record is non-decisive.
stronger:
  additional_conditions:
  - id: integer_format_required
    text: Beyond native success, the submitted answer text should be a single base-10 integer token, not merely any numeric string that parses to the correct count.
    rationale: The official prompt requires a single integer, but the released evaluator's NUMBER_MATCH path casts answers with `float(...)`, so formats such as `6.0` can satisfy the native check despite not matching the stated answer format.
    decisive_artifacts:
    - artifact: Episode trace or retained final-answer record
      question: What exact answer text was finally submitted?
      support:
      - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::1397-1524
      - official/install/android_world/task_evals/information_retrieval/proto_utils.py::_cast_answers_to_type
      - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::1397-1524
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::_cast_answers_to_type
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer

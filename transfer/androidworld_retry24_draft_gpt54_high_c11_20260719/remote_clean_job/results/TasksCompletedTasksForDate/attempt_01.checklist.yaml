schema_version: case_checklist_v1
case_unit_id: TasksCompletedTasksForDate
domain: androidworld
task_id: TasksCompletedTasksForDate
native:
  user_goal:
    text: Answer with the titles of tasks completed for the queried date in the Tasks app, using titles only and a comma-separated list if multiple.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::1526-1671
    - official/install/android_world/task_metadata.json::/106
  benchmark_success:
    text: 'Native success requires both runner completion and evaluator acceptance: retained evidence must show `done=true`, and the submitted final answer must satisfy the InformationRetrieval answer check. For this case, the expected titles are derived from the initialized Tasks-app state by extracting `title`; because extra random tasks are excluded when `due_date == {date}`, the evaluator-visible expected set is the titles of initialized task rows whose `due_date` equals the queried date.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::get_expected_answer
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::1526-1671
    - official/install/android_world/task_evals/information_retrieval/task_app_utils.py::setup_task_state
    - official/install/android_world/task_evals/information_retrieval/task_app_utils.py::check_task_conditions
  checked_by:
    text: '`android_world.suite_utils._run_task` done-gates `InformationRetrieval.is_successful(env)`, and `InformationRetrieval.is_successful` checks the retained answer text in `interaction_cache` with `proto_utils.check_agent_answer` against the initialized task state.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
  decisive_artifacts:
  - artifact: Episode completion evidence
    question: Does retained execution evidence show that the episode ended with `done=true`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Final submitted answer record
    question: What exact final answer text was submitted into `interaction_cache` / the answer action trace before completion?
    support:
    - official/install/android_world/env/interface.py::AsyncAndroidEnv.execute_action
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  - artifact: Initialized Tasks-app state snapshot
    question: In the retained initialized Tasks state or DB snapshot, which task titles have `due_date` equal to the queried date?
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::1526-1671
    - official/install/android_world/task_evals/information_retrieval/task_app_utils.py::setup_task_state
    - official/install/android_world/task_evals/information_retrieval/task_app_utils.py::check_task_conditions
  success_if:
  - text: Retained evidence shows `done=true`, a final submitted answer is available, and under the evaluator's comma-split, trim, and `STRING_MATCH` comparison rule that answer matches the titles from the initialized Tasks state with `due_date == {date}`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::1526-1671
    - official/install/android_world/task_evals/information_retrieval/task_app_utils.py::check_task_conditions
  fail_if:
  - text: Retained execution evidence shows the episode did not finish with `done=true`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Retained evidence shows `done=true` and a final submitted answer is available, but under the evaluator's parse and `STRING_MATCH` rule it does not match the initialized Tasks-state titles with `due_date == {date}`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::1526-1671
  - text: Retained trace shows the run finished but no answer was ever submitted, leaving `interaction_cache` empty.
    support:
    - official/install/android_world/env/interface.py::AsyncAndroidEnv.execute_action
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  undecided_if:
  - text: 'The retained record lacks usable underlying evidence for one or more native inputs needed to replay the official check: episode completion status, the final submitted answer text, or the initialized Tasks-state snapshot needed to reconstruct the expected `due_date == {date}` title list; and no remaining artifact independently establishes success or failure.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::1526-1671
stronger:
  additional_conditions:
  - id: completed_date_matches_query_date
    text: Beyond native, require `done=true` and require the submitted answer to match the titles of initialized Tasks-app rows whose `completed_date` equals the queried date, rather than rows selected only by `due_date == {date}`.
    rationale: The official task text asks which tasks were completed for the queried date, but the released evaluator seeds the relevant rows with `due_date = {date}`, gives `completed_date` as a separate parameter, and extracts only `title` for scoring. Native scoring therefore measures due-date titles, not completion-date titles.
    decisive_artifacts:
    - artifact: Episode completion evidence
      question: Does retained execution evidence show that the episode ended with `done=true`?
      support:
      - official/install/android_world/suite_utils.py::_run_task
    - artifact: Final submitted answer record
      question: What exact final answer text was submitted before completion?
      support:
      - official/install/android_world/env/interface.py::AsyncAndroidEnv.execute_action
      - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - artifact: Initialized Tasks-app state snapshot with completion fields
      question: In the retained initialized Tasks state or DB snapshot, which task titles have `completed_date` equal to the queried date?
      support:
      - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::1526-1671
      - official/install/android_world/task_evals/information_retrieval/task_app_utils.py::setup_task_state
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::1526-1671
    - official/install/android_world/task_metadata.json::/106
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::get_expected_answer

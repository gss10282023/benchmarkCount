schema_version: case_checklist_v1
case_unit_id: TasksHighPriorityTasksDueOnDate
domain: androidworld
task_id: TasksHighPriorityTasksDueOnDate
native:
  user_goal:
    text: Identify the Tasks-app task title(s) that are high priority and due on the requested date, and answer with title only, comma-separated if multiple.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksHighPriorityTasksDueOnDate"]
  benchmark_success:
    text: 'Native success requires both: retained episode evidence shows the run finished with done=true, and the retained final answer passes the InformationRetrieval answer check. For this task, that check uses the initialized relevant state to derive the expected title list from task title fields; the relevant state injects one task with importance="0" and due_date={date}, while random extra tasks are excluded from also matching both due_date={date} and importance="0".'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::get_expected_answer
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksHighPriorityTasksDueOnDate"]
  checked_by:
    text: 'AndroidWorld runner plus the InformationRetrieval evaluator: suite_utils._run_task applies the done gate, and InformationRetrieval.is_successful checks env.interaction_cache with proto_utils.check_agent_answer under STRING_MATCH comparison against the expected title list derived from initialized relevant state.'
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
  decisive_artifacts:
  - artifact: Initialized Tasks-app relevant-state snapshot or equivalent pre-run Tasks DB snapshot
    question: What official high-priority task title(s) were seeded for the queried due date?
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksHighPriorityTasksDueOnDate"]
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.initialize_task
    - official/install/android_world/task_evals/information_retrieval/task_app_utils.py::setup_task_state
  - artifact: Retained final answer text
    question: What exact answer text did the agent submit for evaluator checking?
    support:
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
  - artifact: Retained episode completion evidence
    question: Did the episode finish with done=true or done=false?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  success_if:
  - text: Episode-completion evidence shows done=true.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Initialized task-state evidence identifies the official expected title set, and the retained non-empty final answer, after the evaluator's comma-split and trim rule, has the same count and each item matches that title set under STRING_MATCH; for this task that means one answer item matching the single seeded high-priority due-date title.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksHighPriorityTasksDueOnDate"]
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::get_expected_answer
  fail_if:
  - text: Episode-completion evidence shows done=false.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Initialized task-state evidence identifies the official expected title set, and the retained final answer is present but empty, or after the evaluator's comma-split and trim rule it has the wrong count or fails STRING_MATCH against that title set; for this task that includes any answer other than the single seeded high-priority due-date title.
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksHighPriorityTasksDueOnDate"]
    - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::get_expected_answer
  undecided_if:
  - text: Required retained evidence to reconstruct the official expected title set, the submitted final answer text, or the done gate is missing, unusable, or contradictory, and the remaining retained artifacts do not independently establish success or failure.
    rationale: Native scoring depends on both the initialized expected title set and the retained answer text, with done=true additionally required for success; absent or unusable stored evidence for those components prevents an S/F decision from artifacts alone.
stronger:
  additional_conditions:
  - id: exact_title_only_answer
    text: Beyond native success, require the retained final answer to reproduce the official title string(s) exactly after comma splitting and trimming, rather than merely passing the evaluator's fuzzy STRING_MATCH.
    rationale: The prompt requires answering with the title only, but native evaluation accepts approximate strings because STRING_MATCH in proto_utils.check_agent_answer uses fuzzy_match_lib.fuzzy_match with a similarity threshold instead of exact equality.
    decisive_artifacts:
    - artifact: Initialized Tasks-app relevant-state snapshot or equivalent pre-run Tasks DB snapshot
      question: What exact official title string(s) were seeded for high-priority tasks due on the queried date?
      support:
      - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksHighPriorityTasksDueOnDate"]
      - official/install/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.initialize_task
      - official/install/android_world/task_evals/information_retrieval/task_app_utils.py::setup_task_state
    - artifact: Retained final answer text
      question: After comma splitting and trimming, does the answer reproduce those title string(s) exactly and with the same count?
      support:
      - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    support:
    - official/install/android_world/task_evals/information_retrieval/proto/tasks.textproto::tasks[name="TasksHighPriorityTasksDueOnDate"]
    - official/install/android_world/task_evals/information_retrieval/proto_utils.py::check_agent_answer
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-system"
version = "0.0.0"
description = "Schema and provenance validators for the evidence-envelope experiment system."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Evidence System Maintainers" }
]
dependencies = [
  "jsonschema>=4.0",
  "PyYAML>=6.0",
  "requests>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

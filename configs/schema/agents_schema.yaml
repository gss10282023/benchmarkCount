{
  "schema_version": "agents_schema/v1",
  "describes": "configs/agents.yaml",
  "required_top_level": [
    "schema_version",
    "llm_call_logging",
    "experimental_agents",
    "main_domain_agent_map",
    "contract_drafter",
    "judge_only"
  ],
  "experimental_agent_ids": [
    "Agent A",
    "Agent B",
    "Agent C"
  ],
  "main_domains": [
    "AgentDojo",
    "AppWorld",
    "WebArena-Verified",
    "\u03c4\u00b3-bench retail"
  ],
  "llm_required_fields": [
    "provider",
    "model",
    "model_version",
    "api_key_env",
    "temperature",
    "max_tokens",
    "timeout_seconds",
    "retry",
    "rate_limit",
    "save_response_metadata",
    "cost_tracking"
  ],
  "parameter_ranges": {
    "temperature": {
      "type": "number",
      "minimum": 0,
      "maximum": 2
    },
    "max_tokens": {
      "type": "integer",
      "minimum": 1,
      "maximum": 200000
    },
    "timeout_seconds": {
      "type": "number",
      "minimum": 1,
      "maximum": 3600
    },
    "retry": {
      "type": "integer",
      "minimum": 0,
      "maximum": 10
    },
    "rate_limit.requests_per_minute": {
      "type": "integer",
      "minimum": 1
    },
    "rate_limit.tokens_per_minute": {
      "type": "integer",
      "minimum": 1
    },
    "rate_limit.concurrent_requests": {
      "type": "integer",
      "minimum": 1
    }
  },
  "contract_drafter": {
    "required_extra_fields": [
      "prompt_version",
      "prompt_hash",
      "prompt_hash_method",
      "output_schema_version",
      "input_policy"
    ],
    "allowed_visible_inputs": [
      "task_text",
      "official_policy",
      "evaluator_code_or_description",
      "database_api_browser_file_tool_schema",
      "trace_schema",
      "available_post_run_artifact_types",
      "native_aligned_vs_stronger_measurement_template"
    ],
    "forbidden_inputs": [
      "agent_identity",
      "agent_trace",
      "native_score",
      "outcome_label",
      "alternate_view_verdicts",
      "evidence_label",
      "unresolve_reason"
    ]
  },
  "judge_only": {
    "required_extra_fields": [
      "enabled",
      "prompt_version",
      "prompt_hash",
      "prompt_hash_method",
      "input_policy"
    ],
    "forbidden_inputs": [
      "agent_identity",
      "evidence_label",
      "unresolve_reason"
    ]
  },
  "security": {
    "api_key_storage": "only environment variable names may appear in config",
    "forbidden_plaintext_key_patterns": [
      "OpenAI/Anthropic-style sk-* tokens",
      "Google AIza* keys",
      "AWS AKIA/ASIA keys",
      "GitHub gh*_ tokens",
      "Slack xox* tokens",
      "Bearer tokens"
    ]
  }
}

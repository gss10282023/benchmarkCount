{
  "schema_version": "infra_schema/v1",
  "describes": "configs/infra.yaml",
  "required_top_level": [
    "schema_version",
    "dry_run",
    "paths",
    "machines",
    "domain_machine_constraints"
  ],
  "machine_roles": [
    "webarena_vps",
    "osworld_vps",
    "other_vps",
    "local_androidworld",
    "local_toolsandbox"
  ],
  "machine_required_fields": [
    "machine_id",
    "role",
    "connection",
    "remote_workdir",
    "python",
    "docker",
    "benchmarks",
    "runner_workdir",
    "concurrency",
    "resources",
    "logs_dir",
    "results_dir",
    "disk_free_gb_min",
    "network_targets",
    "benchmark_assets",
    "scheduler",
    "allowed_domains"
  ],
  "ssh_required_when_connection_is_ssh": [
    "host",
    "user",
    "port",
    "key_path"
  ],
  "constraints": {
    "concurrency": {
      "type": "integer",
      "minimum": 1
    },
    "machine_id": {
      "unique": true,
      "non_empty": true
    },
    "ssh_port": {
      "type": "integer",
      "minimum": 1,
      "maximum": 65535
    },
    "disk_free_gb_min": {
      "type": "number",
      "minimum": 1
    },
    "dry_run_full_results": "dry-run machines must not write to results/full/",
    "role_domain_constraints": {
      "WebArena-Verified": [
        "webarena_vps"
      ],
      "MiniWoB++": [
        "webarena_vps"
      ],
      "OSWorld-Verified": [
        "osworld_vps"
      ],
      "AndroidWorld": [
        "local_androidworld"
      ],
      "AgentDojo": [
        "other_vps"
      ],
      "AppWorld": [
        "other_vps"
      ],
      "\u03c4\u00b3-bench retail": [
        "other_vps"
      ],
      "WorkArena": [
        "other_vps"
      ],
      "ToolSandbox": [
        "local_toolsandbox"
      ],
      "judge-only": [
        "other_vps"
      ],
      "maintenance update": [
        "other_vps"
      ],
      "matched-budget controls": [
        "other_vps"
      ]
    }
  }
}

{
  "schema_version": "result_schema/v1",
  "describes": "normalized run records, metrics, table rows, and figure data",
  "record_required_fields": [
    "domain",
    "benchmark_name",
    "case_unit_id",
    "task_id",
    "record_id",
    "episode_id",
    "run_id",
    "attempt_id",
    "seed",
    "agent_id",
    "phase",
    "priority",
    "status",
    "metric_values",
    "native_label",
    "evidence_label",
    "unresolve_reason",
    "unresolve_level",
    "error_message",
    "failure_category",
    "recoverable",
    "start_time",
    "end_time",
    "duration",
    "machine_id",
    "git_commit_hash",
    "config_hash",
    "manifest_hash",
    "contract_id",
    "contract_version",
    "contract_hash",
    "taxonomy_version",
    "scorer_version"
  ],
  "verdicts": [
    "SUCCESS",
    "FAIL",
    "UNRESOLVE"
  ],
  "unresolve_reasons": [
    "R1",
    "R2",
    "R3",
    "R4",
    "R5",
    "R6",
    "R7"
  ],
  "unresolve_levels": [
    "trace_level",
    "instrument_level"
  ],
  "denominator_rule": {
    "completed_record_partition": "each completed record is exactly one of counted SUCCESS, counted FAIL, or UNRESOLVE",
    "excluded_from_completed": [
      "infra/pre-run failure"
    ],
    "not_excluded_from_completed": [
      "agent-caused invalid actions",
      "tool misuse",
      "timeouts after task start",
      "malformed final answers",
      "benchmark-facing aborts"
    ]
  },
  "envelope_formulas": {
    "TOTAL": "SUCCESS + FAIL + UNRESOLVE",
    "COVERAGE": "(SUCCESS + FAIL) / TOTAL",
    "COUNTED_ONLY_SCORE": "SUCCESS / (SUCCESS + FAIL), undefined when SUCCESS + FAIL == 0",
    "LOWER": "SUCCESS / TOTAL",
    "UPPER": "(SUCCESS + UNRESOLVE) / TOTAL",
    "WIDTH": "UNRESOLVE / TOTAL"
  },
  "provenance_required_fields": [
    "raw_source_path",
    "manifest_entry",
    "contract_id",
    "contract_version",
    "contract_hash",
    "scorer_version",
    "taxonomy_version"
  ],
  "bootstrap_metadata_required_fields": [
    "seed",
    "resample_count",
    "cluster_unit",
    "domain_grouping",
    "hash_function",
    "salt",
    "eligible_set",
    "excluded_smoke_test_cases"
  ]
}

{
  "schema_version": "contract_schema/v1",
  "describes": "locked evidence contract records",
  "identity_and_version_fields": [
    "contract_id",
    "domain",
    "case_unit_id",
    "task_id",
    "contract_version",
    "contract_status",
    "locked_at",
    "locked_by",
    "contract_hash",
    "manifest_hash",
    "taxonomy_version"
  ],
  "core_required_fields": [
    "claim_text",
    "native_sources",
    "required_artifacts",
    "success_rule",
    "fail_rule",
    "unresolve_rule",
    "claim_scope",
    "minimality_rationale",
    "source_support"
  ],
  "claim_scope_values": [
    "native_aligned",
    "stronger_measurement"
  ],
  "source_support_required_keys": [
    "evaluator",
    "task_or_policy",
    "schema"
  ],
  "required_artifact_fields": [
    "artifact_id",
    "artifact_name",
    "artifact_source",
    "source_support"
  ],
  "required_artifact_legacy_support_fields": [
    "native_aligned_source_support"
  ],
  "source_hierarchy": [
    "official evaluator semantics",
    "official task text / policy",
    "schema constraints needed to interpret evaluator-visible state"
  ],
  "drafter_provenance_fields": [
    "drafter_provider",
    "drafter_model",
    "drafter_model_version",
    "drafter_temperature",
    "drafter_max_tokens",
    "drafter_prompt_version",
    "drafter_prompt_hash",
    "drafter_visible_input_hashes",
    "drafter_hidden_input_assertion",
    "drafter_cost",
    "drafter_response_metadata"
  ],
  "human_review_and_lock_fields": [
    "human_reviewer_ids",
    "review_started_at",
    "review_finished_at",
    "review_actions",
    "removed_unsupported_requirements",
    "requirements_marked_stronger_measurement",
    "stronger_measurement_report_id",
    "separate_reporting_required",
    "source_hierarchy_applied",
    "final_lock_decision",
    "lock_notes",
    "human_review_wall_clock_minutes",
    "human_review_lock_wall_clock_minutes",
    "human_contract_cost_provenance"
  ],
  "status_values": [
    "draft",
    "human_reviewed",
    "locked",
    "superseded"
  ],
  "contract_gate_rules": [
    "P0 case units require locked native-aligned contracts before preflight/full scoring",
    "native-aligned required artifacts require source support",
    "unsupported requirements must be removed or marked stronger_measurement",
    "lock time must be earlier than first scoring time",
    "contract drafter inputs must not include agent identity, traces, native score, outcome labels, alternate view verdicts, evidence label, or UNRESOLVE reason",
    "stronger_measurement claims require a separate sidecar report, appendix, or manifest view"
  ]
}

{
  "schema_version": "infra/v1",
  "dry_run": true,
  "paths": {
    "results_root": "results",
    "dry_run_results_root": "results/preflight",
    "full_results_root": "results/full",
    "logs_dir": "results/logs"
  },
  "rsync": {
    "exclude": [
      ".git/",
      "tmp/",
      "results/"
    ]
  },
  "domain_machine_constraints": {
    "miniwob": [
      "webarena_vps"
    ]
  },
  "machines": [
    {
      "machine_id": "miniwob-browsergym-0-14-3-source-lock-local",
      "enabled": true,
      "role": "webarena_vps",
      "connection": "local_source_snapshot",
      "remote_workdir": ".",
      "python": {
        "environment_type": "venv",
        "python_bin": "tmp/miniwob-browsergym-0.14.3/venv/bin/python",
        "env_path": "tmp/miniwob-browsergym-0.14.3/venv"
      },
      "docker": {
        "enabled": false
      },
      "benchmarks": {
        "MiniWoB++": {
          "install_dir": "tmp/miniwob-browsergym-0.14.3/miniwob-plusplus",
          "assets_path": "tmp/miniwob-browsergym-0.14.3/miniwob-plusplus/miniwob/html/miniwob",
          "runner_command": "tmp/miniwob-browsergym-0.14.3/venv/bin/python",
          "python_bin": "tmp/miniwob-browsergym-0.14.3/venv/bin/python",
          "playwright_browsers_path": "tmp/miniwob-browsergym-0.14.3/browsers",
          "adapter_module": "evidence_system.adapters.miniwob",
          "worker_module": "evidence_system.adapters.miniwob_worker",
          "driver": "openrouter_chat",
          "action_set": {
            "class": "HighLevelActionSet",
            "multiaction": false,
            "strict": false
          },
          "native_evaluator": "env.unwrapped.task.validate(page, chat_messages)",
          "base_url": "http://127.0.0.1:8787/miniwob/",
          "http_server_dir": "tmp/miniwob-browsergym-0.14.3/miniwob-plusplus/miniwob/html",
          "http_server_port": 8787,
          "http_server_session": "miniwob-http",
          "base_seed": 7,
          "smoke_max_steps": 6,
          "full_max_steps": 30,
          "headless": true,
          "record_video": true,
          "timeout_seconds": 120,
          "retry": 2
        }
      },
      "runner_workdir": ".",
      "concurrency": 1,
      "resources": {
        "gpu": false,
        "cpu_limit": 4,
        "memory_gb": 16
      },
      "logs_dir": "results/logs/miniwob-source-lock",
      "results_dir": "results/preflight/miniwob-source-lock",
      "disk_free_gb_min": 1,
      "network_targets": [],
      "benchmark_assets": {
        "browsergym_distribution": "browsergym-miniwob==0.14.3",
        "miniwob_git_commit": "7fd85d71a4b60325c6585396ec4f48377d049838",
        "playwright_distribution": "playwright==1.44.0",
        "chromium_revision": "1117",
        "chromium_version": "125.0.6422.26"
      },
      "scheduler": {
        "tmux": false,
        "systemd": false,
        "docker_compose": false
      },
      "allowed_domains": [
        "miniwob"
      ]
    }
  ]
}

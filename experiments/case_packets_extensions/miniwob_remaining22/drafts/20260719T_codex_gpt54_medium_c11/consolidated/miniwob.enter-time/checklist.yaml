schema_version: case_checklist_v1
case_unit_id: miniwob.enter-time
domain: miniwob
task_id: miniwob.enter-time
native:
  user_goal:
    text: Enter the runtime-specified time into the page's time input in HH:MM form and submit it.
    support:
    - derived/official_source_excerpts.json::excerpts.task_class.content
    - official/install/miniwob/html/miniwob/enter-time.html::genProblem
  benchmark_success:
    text: The released MiniWoB++ benchmark counts success when the final `validate(page, chat_messages)` call is on the original page and URL and returns `done` true with binary reward `1.0`, where `reward = float(RAW_REWARD_GLOBAL > 0)`.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
    - derived/drafting_context.json::released_evaluator.native_semantics
  checked_by:
    text: '`AbstractMiniwobTask.validate` reads MiniWoB page state via `_get_info`; for this task the HTML oracle sets positive raw reward only when the submitted input exactly matches the generated expected `HH:MM` string.'
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - official/install/miniwob/html/miniwob/enter-time.html::genProblem
  decisive_artifacts:
  - artifact: native_evaluator_output.json
    question: 'Does the retained final validator result show a valid-page/valid-URL check and `done: true` with reward `1.0`, or instead `0` / invalid-page / invalid-url termination?'
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  - artifact: task_artifacts/ final validation or retained task-state snapshot
    question: Do the retained MiniWoB state fields show `RAW_REWARD_GLOBAL > 0` and `DONE_GLOBAL = true`, or a non-positive raw reward / other terminal state that explains the validator result?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
  success_if:
  - text: 'Retained evidence shows the final native validator ran on the original page and URL and returned `reward: 1.0` with `done: true`.'
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
  - text: The retained final MiniWoB state underlying that validation shows `RAW_REWARD_GLOBAL > 0`; for this task that means the submitted value exactly matched the generated expected `HH:MM` time.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
    - official/install/miniwob/html/miniwob/enter-time.html::genProblem
  fail_if:
  - text: Retained evidence shows final validation terminated for invalid page or invalid URL.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
  - text: Retained evidence shows a completed task outcome with final native reward `0` and non-positive `RAW_REWARD_GLOBAL`.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
  undecided_if:
  - text: Retained evidence is missing or inconsistent on the decisive final validation result, so reward/done or page-validity cannot be established from stored artifacts.
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts
    - derived/drafting_context.json::released_evaluator.summary_field_guard
stronger:
  additional_conditions: []

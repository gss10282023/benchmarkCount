schema_version: case_checklist_v1
case_unit_id: miniwob.click-dialog
domain: miniwob
task_id: miniwob.click-dialog
native:
  user_goal:
    text: Close the dialog box by clicking the dialog's "x" button.
    support:
    - derived/official_source_excerpts.json::excerpts.task_class.content
    - official/install/miniwob/html/miniwob/click-dialog.html::genProblem
  benchmark_success:
    text: Native success is a valid final validation on the task page/URL with `done` true and binary reward `1.0`, where the validator sets reward to `float(RAW_REWARD_GLOBAL > 0)` from the task's WOB state.
    support:
    - derived/drafting_context.json::released_evaluator.native_semantics
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
  checked_by:
    text: '`env.unwrapped.task.validate(page, chat_messages)`; it rejects invalid page/URL, otherwise reads `REWARD_GLOBAL`, `RAW_REWARD_GLOBAL`, `REWARD_REASON`, `DONE_GLOBAL`, `EPISODE_ID`, and `TASK_READY` via `_get_info` and returns binary reward plus `done`.'
    support:
    - derived/drafting_context.json::released_evaluator.entrypoint
    - derived/drafting_context.json::evaluator_visible_state_schema.support
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  decisive_artifacts:
  - artifact: native_evaluator_output.json
    question: Does the final validator result show a valid page/URL check outcome, and what are the final `reward`, `done`, `error`, and `info.RAW_REWARD_GLOBAL` values?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2].path
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
  - artifact: task_artifacts/
    question: Do retained final validation or task-state records corroborate the final WOB state and completion status used by the validator?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[3].path
    - derived/drafting_context.json::evaluator_visible_state_schema.fields
  success_if:
  - text: 'Retained evidence shows the final native validation ran on the correct page and URL, returned `done: true`, and returned `reward: 1.0`, with validator-visible state showing `RAW_REWARD_GLOBAL > 0`.'
    support:
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  fail_if:
  - text: Retained evidence shows the final native validation failed the page or URL check and therefore terminated with reward `0`.
    support:
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  - text: 'Retained evidence shows a completed benchmark-counted outcome with final native validation `reward: 0.0`, including the case where validator-visible state has `RAW_REWARD_GLOBAL <= 0`.'
    support:
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
  undecided_if:
  - text: Retained artifacts do not reliably establish the final concrete validator result or the validator-visible final state, such as when `native_evaluator_output.json` is missing, corrupt, or not corroborated by retained final validation/task-state artifacts.
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2].path
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[3].path
    - derived/drafting_context.json::released_evaluator.summary_field_guard
stronger:
  additional_conditions: []

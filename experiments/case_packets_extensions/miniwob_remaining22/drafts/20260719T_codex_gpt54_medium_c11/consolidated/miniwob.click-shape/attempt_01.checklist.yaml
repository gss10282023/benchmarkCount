schema_version: case_checklist_v1
case_unit_id: miniwob.click-shape
domain: miniwob
task_id: miniwob.click-shape
native:
  user_goal:
    text: Complete the runtime-issued click-shape task by clicking the shape described in the page utterance/query.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_goal.content
    - official/install/miniwob/html/miniwob/click-shape.html::genProblem
    - derived/official_source_excerpts.json::excerpts.task_class.content
  benchmark_success:
    text: Native success is a valid final MiniWoB validation on the task page/URL with `done` true and binary reward `1.0`, where the released evaluator sets reward to `float(RAW_REWARD_GLOBAL > 0)` from the task oracle state.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
  checked_by:
    text: Released MiniWoB evaluator entrypoint `env.unwrapped.task.validate(page, chat_messages)`, which rejects invalid page/URL and otherwise reads `RAW_REWARD_GLOBAL` and `DONE_GLOBAL` from WOB state.
    support:
    - case_packet.md::derived/drafting_context.json.released_evaluator
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
  decisive_artifacts:
  - artifact: native_evaluator_output.json
    question: 'Does the final validator result show a valid-page/URL validation with `done: true` and reward `1.0`, or instead an invalid page/URL error or reward `0.0`?'
    support:
    - case_packet.md::derived/drafting_context.json.artifact_inventory.retained_artifacts[2]
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  - artifact: task_artifacts/
    question: Do retained final validation/task-state records show the evaluator-visible fields, especially `RAW_REWARD_GLOBAL` and `DONE_GLOBAL`, consistent with the validator result?
    support:
    - case_packet.md::derived/drafting_context.json.artifact_inventory.retained_artifacts[3]
    - case_packet.md::derived/drafting_context.json.evaluator_visible_state_schema
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
  success_if:
  - text: 'Retained final validation evidence shows the validator ran on the correct page and URL, returned `done: true`, and returned reward `1.0`, with evaluator-visible state showing `RAW_REWARD_GLOBAL > 0`.'
    support:
    - case_packet.md::derived/drafting_context.json.released_evaluator.success_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
  fail_if:
  - text: Retained final validation evidence shows the validator terminated for an invalid page or invalid URL.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - case_packet.md::derived/drafting_context.json.released_evaluator.failure_evidence_rule
  - text: Retained final validation evidence shows a completed task outcome with reward `0.0` and evaluator-visible state `RAW_REWARD_GLOBAL <= 0`.
    support:
    - case_packet.md::derived/drafting_context.json.released_evaluator.failure_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
  - text: Retained records establish another benchmark-counted run failure and do not contain contrary concrete validator success evidence.
    support:
    - case_packet.md::derived/drafting_context.json.released_evaluator.failure_evidence_rule
    - case_packet.md::derived/drafting_context.json.post_run_reporting.released_label_rule
  undecided_if:
  - text: The retained artifacts do not contain concrete final validator evidence sufficient to determine page/URL validity, `done`, and whether `RAW_REWARD_GLOBAL` was positive; a summary-only success field is not decisive.
    support:
    - case_packet.md::derived/drafting_context.json.released_evaluator.summary_field_guard
    - case_packet.md::derived/drafting_context.json.artifact_inventory.retained_artifacts[2]
    - case_packet.md::derived/drafting_context.json.artifact_inventory.retained_artifacts[3]
stronger:
  additional_conditions: []

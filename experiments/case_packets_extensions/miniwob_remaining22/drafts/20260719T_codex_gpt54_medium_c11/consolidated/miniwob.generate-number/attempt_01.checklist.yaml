schema_version: case_checklist_v1
case_unit_id: miniwob.generate-number
domain: miniwob
task_id: miniwob.generate-number
native:
  user_goal:
    text: Generate a number that satisfies the runtime-issued less-than, greater-than, odd, or even requirement, then submit.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_goal.content
    - official/install/miniwob/html/miniwob/generate-number.html::genProblem
  benchmark_success:
    text: The benchmark counts success when final validation is on the task page/URL and returns `done` true with binary reward `1.0`, which the released validator computes as `float(RAW_REWARD_GLOBAL > 0)`.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
    - official/install/miniwob/html/miniwob/generate-number.html::genProblem
  checked_by:
    text: Released MiniWoB validator `AbstractMiniwobTask.validate`, using WOB globals read by `_get_info`.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
  decisive_artifacts:
  - artifact: native_evaluator_output.json
    question: Does the final validator result show no invalid page/URL error, `done` true, and binary reward `1.0` from positive `info.RAW_REWARD_GLOBAL`?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2].path
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  - artifact: trajectory/
    question: Does the retained end-of-run trace support the final validator outcome rather than a missing or truncated completion record?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[4].path
    - derived/drafting_context.json::released_evaluator.summary_field_guard
  success_if:
  - text: Retained evidence shows a valid final validation with no invalid page/URL error, `DONE_GLOBAL` true, and binary reward `1.0`, grounded in positive `RAW_REWARD_GLOBAL`.
    support:
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  fail_if:
  - text: Retained evidence shows final validation failed because the page was invalid or the URL was invalid.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
  - text: Retained evidence shows a completed task outcome with non-positive `RAW_REWARD_GLOBAL`, so final binary reward is `0.0`.
    support:
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - official/install/miniwob/html/miniwob/generate-number.html::determineReward
  undecided_if:
  - text: Retained evidence does not preserve the concrete final validator result or enough final trace/state to determine page/URL validity and whether `RAW_REWARD_GLOBAL` was positive at completion.
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts
    - derived/drafting_context.json::released_evaluator.summary_field_guard
stronger:
  additional_conditions:
  - id: number_was_generated_and_satisfies_requirement
    text: A number was actually generated and the displayed generated number satisfies the episode's less-than, greater-than, odd, or even requirement.
    rationale: The official goal requires generating a number, but in the even branch the oracle's undefined-value guard is overwritten and submitting before generation can receive positive reward.
    decisive_artifacts:
    - artifact: native_evaluator_output.json
      question: Does the retained final validator info show the submitted episode received positive `RAW_REWARD_GLOBAL`?
      support:
      - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0].support
      - derived/drafting_context.json::artifact_inventory.retained_artifacts[2].path
    - artifact: trajectory/
      question: Do the retained steps and observations show that the agent activated Generate before Submit?
      support:
      - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0].support
      - derived/drafting_context.json::artifact_inventory.retained_artifacts[4].path
    - artifact: browser_artifacts/
      question: Do retained page HTML or screenshots show the displayed generated number and that it satisfies the runtime requirement shown for the episode?
      support:
      - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0].support
      - derived/drafting_context.json::artifact_inventory.retained_artifacts[5].path
    support:
    - official/install/miniwob/html/miniwob/generate-number.html::determineReward
    - official/install/miniwob/html/miniwob/generate-number.html::genProblem
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content

schema_version: case_checklist_v1
case_unit_id: miniwob.use-slider
domain: miniwob
task_id: miniwob.use-slider
native:
  user_goal:
    text: Use the slider to select the runtime-requested value and submit.
    support:
    - derived/official_source_excerpts.json::excerpts.task_class.content
    - official/install/miniwob/html/miniwob/use-slider.html::genProblem
    - derived/drafting_context.json::task_text.runtime_goal_source
  benchmark_success:
    text: Native benchmark success is a valid final `validate` result on the task page and URL with `done` true and binary reward `1.0`, which the released evaluator assigns exactly when `RAW_REWARD_GLOBAL > 0`.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
  checked_by:
    text: The released MiniWoB++ check `env.unwrapped.task.validate(page, chat_messages)`, which fails invalid page/URL and otherwise reads WOB globals to return reward, done, message, and info.
    support:
    - derived/drafting_context.json::released_evaluator.entrypoint
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
  decisive_artifacts:
  - artifact: native_evaluator_output.json
    question: Does the final validator record show a valid page/URL check and a terminal result with reward `1.0` or `0.0`, `done`, and the returned info/error fields?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2].path
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
  - artifact: task_context.json
    question: What runtime goal text was issued for this episode, so the reviewed task intent is the episode-specific requested slider value rather than a hard-coded number?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[0].path
    - derived/drafting_context.json::task_text.runtime_goal_source
    - derived/drafting_context.json::task_text.runtime_goal_note
  success_if:
  - text: '`native_evaluator_output.json` records a valid final `validate` result with `done` true and reward `1.0`, consistent with a positive `RAW_REWARD_GLOBAL` from the task oracle.'
    support:
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
  fail_if:
  - text: '`native_evaluator_output.json` shows `validate` rejected the run for invalid page or invalid URL, which terminates with reward `0`.'
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
  - text: '`native_evaluator_output.json` shows a completed task outcome with reward `0.0`, which under the released evaluator means `RAW_REWARD_GLOBAL <= 0` and therefore native failure.'
    support:
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - official/install/miniwob/html/miniwob/use-slider.html::genProblem
  undecided_if:
  - text: Retained evidence does not include a concrete final validator record with reward/done/info, and only summary metadata or non-final trace/browser artifacts remain.
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts
    - derived/drafting_context.json::released_evaluator.summary_field_guard
stronger:
  additional_conditions: []

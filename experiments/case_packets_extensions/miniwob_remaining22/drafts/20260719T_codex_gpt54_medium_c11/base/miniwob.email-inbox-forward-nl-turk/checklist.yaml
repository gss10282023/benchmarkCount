schema_version: case_checklist_v1
case_unit_id: miniwob.email-inbox-forward-nl-turk
domain: miniwob
task_id: miniwob.email-inbox-forward-nl-turk
native:
  user_goal:
    text: Complete the runtime-issued email task by forwarding the email identified in the on-screen instruction from the named sender to the named recipient.
    support:
    - official/install/miniwob/html/miniwob/email-inbox-forward-nl-turk.html::displayQuery
    - official/install/miniwob/html/miniwob/email-inbox-forward-nl-turk.html::genProblem
    - derived/drafting_context.json::task_text.runtime_goal_source
  benchmark_success:
    text: Native success is a valid final call to the released MiniWoB validator that does not terminate for invalid page or URL and returns `done` true with binary reward `1.0`, where that reward is computed as `float(RAW_REWARD_GLOBAL > 0)` from the task state.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
    - derived/drafting_context.json::released_evaluator.native_semantics
  checked_by:
    text: The benchmark claim is checked by the released `env.unwrapped.task.validate(page, chat_messages)` validator, using final page/URL validity plus MiniWoB state fields including `RAW_REWARD_GLOBAL` and `DONE_GLOBAL`.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
    - derived/drafting_context.json::released_evaluator.entrypoint
  decisive_artifacts:
  - artifact: native_evaluator_output.json
    question: 'Does the final released-validator result show a valid page/URL check and return `done: true` with binary reward `1.0` or `0.0`, or an explicit invalid page/URL termination error?'
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2].path
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  - artifact: task_artifacts/
    question: Do the retained final task state or validation artifacts show the final MiniWoB fields, especially `RAW_REWARD_GLOBAL` and `DONE_GLOBAL`, consistent with the native validator result?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[3].path
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
  - artifact: task_context.json
    question: What runtime-issued sender/recipient goal was this episode instantiated with?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[0].path
    - derived/drafting_context.json::task_text.runtime_goal_source
  success_if:
  - text: '`native_evaluator_output.json` shows the released validator completed on the task page/URL with `done` true and binary reward `1.0`.'
    support:
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  - text: Retained final task state in `task_artifacts/` shows `DONE_GLOBAL` true and `RAW_REWARD_GLOBAL > 0`, matching the validator's positive result.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
  fail_if:
  - text: The final validator record shows an explicit invalid page or invalid URL termination.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
  - text: The final validator record shows task completion with binary reward `0.0`, or retained final task state shows `DONE_GLOBAL` true with `RAW_REWARD_GLOBAL <= 0`.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
  - text: Retained run evidence establishes another benchmark-counted run failure under the released MiniWoB evaluator wiring.
    support:
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
  undecided_if:
  - text: The retained record lacks a trustworthy final validator result and corresponding final task-state evidence needed to verify page/URL validity, `done`, and the sign of `RAW_REWARD_GLOBAL`.
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2].path
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[3].path
    - derived/drafting_context.json::released_evaluator.summary_field_guard
stronger:
  additional_conditions: []

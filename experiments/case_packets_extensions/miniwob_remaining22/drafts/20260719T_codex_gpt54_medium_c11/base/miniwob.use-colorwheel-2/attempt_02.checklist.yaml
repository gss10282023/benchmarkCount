schema_version: case_checklist_v1
case_unit_id: miniwob.use-colorwheel-2
domain: miniwob
task_id: miniwob.use-colorwheel-2
native:
  user_goal:
    text: Use the color picker to select the displayed target color and submit it.
    support:
    - official/install/miniwob/html/miniwob/use-colorwheel-2.html::genProblem
    - derived/official_source_excerpts.json::excerpts.task_class.content
  benchmark_success:
    text: The MiniWoB++ case counts success when the released validator runs on the task page and returns `done = true` with binary reward `1.0`, where reward is computed as `float(RAW_REWARD_GLOBAL > 0)`; invalid page or URL instead returns reward `0` and terminates.
    support:
    - derived/drafting_context.json::released_evaluator.native_semantics
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  checked_by:
    text: '`env.unwrapped.task.validate(page, chat_messages)`, which checks page/url validity, reads WOB state via `_get_info`, and returns reward, done, message, and info.'
    support:
    - derived/drafting_context.json::released_evaluator.entrypoint
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  decisive_artifacts:
  - artifact: native_evaluator_output.json
    question: Does final validation show reward `1.0` with `done = true`, or instead reward `0` / an invalid-page or invalid-url error?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2]
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
  - artifact: task_artifacts/
    question: If the validator output is incomplete or ambiguous, do retained final validation/task-state artifacts confirm the concrete WOB state used by the validator?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[3]
    - derived/drafting_context.json::released_evaluator.summary_field_guard
    - derived/drafting_context.json::evaluator_visible_state_schema.fields
  success_if:
  - text: Retained evidence shows a valid final validator result with `done = true` and binary reward `1.0`, grounded in `info.RAW_REWARD_GLOBAL > 0`.
    support:
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  fail_if:
  - text: Retained evidence shows the validator terminated for invalid page or invalid URL.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
  - text: Retained evidence shows a completed final validation with non-positive raw reward, yielding binary reward `0.0`.
    support:
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  undecided_if:
  - text: Native outcome is undecided if retained artifacts do not preserve the concrete final validator result or enough final WOB state to determine whether validation ended with reward `1.0` or a benchmark-counted failure.
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2]
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[3]
    - derived/drafting_context.json::released_evaluator.summary_field_guard
stronger:
  additional_conditions:
  - id: selected_color_exactly_matches_target_rgb
    text: The submitted RGB color exactly matches the displayed target color.
    rationale: This is stronger than the native benchmark criterion because the released evaluator accepts any submission with `RAW_REWARD_GLOBAL > 0`, while the official task goal asks for the displayed color and exact equality is the only raw-reward-1.0 match.
    decisive_artifacts:
    - artifact: native_evaluator_output.json
      question: Does `info.RAW_REWARD_GLOBAL` equal `1.0`, indicating exact RGB agreement rather than merely a positive color-distance score?
      support:
      - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0]
      - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - artifact: trajectory/ and browser_artifacts/
      question: If raw reward alone is insufficiently interpretable, do retained observations, page HTML, or screenshots show the displayed target color and the submitted picker value exactly match?
      support:
      - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0]
      - official/install/miniwob/html/miniwob/use-colorwheel-2.html::genProblem
    support:
    - official/install/miniwob/html/miniwob/use-colorwheel-2.html::genProblem
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0]

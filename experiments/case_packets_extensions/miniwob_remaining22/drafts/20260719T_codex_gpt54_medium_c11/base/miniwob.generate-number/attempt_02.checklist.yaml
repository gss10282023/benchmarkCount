schema_version: case_checklist_v1
case_unit_id: miniwob.generate-number
domain: miniwob
task_id: miniwob.generate-number
native:
  user_goal:
    text: Generate a number that satisfies the runtime-issued less-than, greater-than, odd, or even requirement, then submit it.
    support:
    - official/install/miniwob/html/miniwob/generate-number.html::genProblem
    - derived/drafting_context.json::task_text.support
  benchmark_success:
    text: Native success requires the released validator to run on the valid task page/URL and return done true with binary reward 1.0, where reward is computed as float(RAW_REWARD_GLOBAL > 0) from the task oracle state.
    support:
    - derived/drafting_context.json::released_evaluator.native_semantics
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  checked_by:
    text: '`AbstractMiniwobTask.validate`: it fails immediately on invalid page or URL; otherwise it reads `_get_info()` and returns reward `float(info["RAW_REWARD_GLOBAL"] > 0)` and `done = info["DONE_GLOBAL"]`.'
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
  decisive_artifacts:
  - artifact: native_evaluator_output.json
    question: 'Does the final validator result show either an invalid page/URL error, or else `done: true` with reward 1.0 versus non-positive outcome under `RAW_REWARD_GLOBAL > 0`?'
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2]
    - derived/drafting_context.json::released_evaluator.support
  - artifact: browser_artifacts/ or trajectory/
    question: If validator output is missing or disputed, do retained final page/observation artifacts confirm the task page/URL and the end-of-episode state relevant to the validator result?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[4]
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[5]
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
  success_if:
  - text: Retained evidence shows the final native validator ran on the correct page and URL, `DONE_GLOBAL` was true, and the validator returned reward 1.0 based on positive `RAW_REWARD_GLOBAL`.
    support:
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  fail_if:
  - text: Retained evidence shows the native validator terminated for invalid page or invalid URL.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
  - text: Retained evidence shows a completed final validation with non-positive raw reward, so the validator reward is 0.0 under `float(RAW_REWARD_GLOBAL > 0)`.
    support:
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  undecided_if:
  - text: Final retained evidence is missing, incomplete, or inconsistent about the native validator result, so page/URL validity or the decisive `done` and reward outcome cannot be established.
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts
    - derived/drafting_context.json::released_evaluator.summary_field_guard
stronger:
  additional_conditions:
  - id: number_was_generated_and_satisfies_requirement
    text: A number was actually generated and the displayed generated number satisfies the episode's less-than, greater-than, odd, or even requirement.
    rationale: The official task goal requires generating a number, but the released native check can still award success in the even-number branch when `generatedNumber` was never set because the undefined-value penalty is overwritten by the even-branch test.
    decisive_artifacts:
    - artifact: native_evaluator_output.json
      question: Did the run receive native success from positive `RAW_REWARD_GLOBAL`, making the evaluator/native-gap check relevant?
      support:
      - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0].decisive_post_run_artifacts[0]
      - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - artifact: trajectory/steps.json or browser_artifacts/
      question: Do the retained interaction and page artifacts show that `Generate` was clicked and that the displayed number satisfied the runtime-issued requirement at submission?
      support:
      - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0].decisive_post_run_artifacts[1]
      - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0].decisive_post_run_artifacts[2]
      - official/install/miniwob/html/miniwob/generate-number.html::genProblem
    support:
    - official/install/miniwob/html/miniwob/generate-number.html::determineReward
    - official/install/miniwob/html/miniwob/generate-number.html::genProblem
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0]

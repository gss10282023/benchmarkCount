schema_version: case_checklist_v1
case_unit_id: miniwob.generate-number
domain: miniwob
task_id: miniwob.generate-number
native:
  user_goal:
    text: Generate a number that satisfies the runtime-issued criterion (less than, greater than, odd, or even) and then submit it.
    support:
    - derived/official_source_excerpts.json::excerpts.task_class.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_goal.content
    - official/install/miniwob/html/miniwob/generate-number.html::genProblem
  benchmark_success:
    text: Native success is a valid final MiniWoB validation result with `done` true and binary reward `1.0`, where the released validator computes reward as `float(RAW_REWARD_GLOBAL > 0)` from the task oracle; invalid page or URL is an immediate failure result with reward `0`.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
    - official/install/miniwob/html/miniwob/generate-number.html::determineReward
  checked_by:
    text: The released check is `env.unwrapped.task.validate(page, chat_messages)`, as retained in the final native evaluator output with validator reward, `done`, and info fields including `RAW_REWARD_GLOBAL` and `DONE_GLOBAL`.
    support:
    - derived/drafting_context.json::released_evaluator.entrypoint
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2].path
    - derived/drafting_context.json::evaluator_visible_state_schema.fields
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  decisive_artifacts:
  - artifact: native_evaluator_output.json
    question: Does the final released validator result show a valid-page/valid-URL validation with `done` true and reward `1.0`, or instead a benchmark-counted failure such as invalid page/URL or non-positive `RAW_REWARD_GLOBAL`?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2].path
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  success_if:
  - text: '`native_evaluator_output.json` shows the released validator''s final result on the task page with `done` true and reward `1.0`, grounded in `info.RAW_REWARD_GLOBAL > 0`.'
    support:
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  fail_if:
  - text: '`native_evaluator_output.json` shows the released validator returned reward `0` because the final validation used an invalid page or invalid URL.'
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  - text: '`native_evaluator_output.json` shows a completed final validation with non-positive `info.RAW_REWARD_GLOBAL`, so the released validator''s binary reward is `0.0`.'
    support:
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - official/install/miniwob/html/miniwob/generate-number.html::determineReward
  undecided_if:
  - text: The retained artifacts do not preserve the final released validator result strongly enough to determine whether the last validation had reward `1.0` or `0.0` and whether it terminated with `done` true.
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2].path
    - derived/drafting_context.json::released_evaluator.summary_field_guard
stronger:
  additional_conditions:
  - id: number_was_generated_and_satisfies_requirement
    text: A number was actually generated and the displayed generated number satisfies the episode's less-than, greater-than, odd, or even requirement.
    rationale: The official goal requires generating a number, but in the even branch the oracle's undefined-value guard is overwritten and submitting before generation can still receive positive native reward.
    decisive_artifacts:
    - artifact: native_evaluator_output.json
      question: Does `info.RAW_REWARD_GLOBAL` indicate native success that should be cross-checked against whether any number was actually generated?
      support:
      - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0].decisive_post_run_artifacts
      - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0].support
    - artifact: trajectory/steps.json and trajectory/observations/
      question: Do the recorded actions and observations show that the agent used Generate before Submit and what number was displayed when submitted?
      support:
      - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0].decisive_post_run_artifacts
    - artifact: browser_artifacts/page_html/ and browser_artifacts/screenshots/
      question: Do the retained page snapshots show an actual displayed generated number that satisfies the runtime requirement at submission time?
      support:
      - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0].decisive_post_run_artifacts
    support:
    - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0].support
    - official/install/miniwob/html/miniwob/generate-number.html::determineReward
    - official/install/miniwob/html/miniwob/generate-number.html::genProblem

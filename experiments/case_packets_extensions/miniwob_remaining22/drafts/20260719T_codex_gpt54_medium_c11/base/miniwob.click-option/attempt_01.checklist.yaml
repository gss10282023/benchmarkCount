schema_version: case_checklist_v1
case_unit_id: miniwob.click-option
domain: miniwob
task_id: miniwob.click-option
native:
  user_goal:
    text: Select the radio option named in the runtime prompt, then click Submit.
    support:
    - official/install/miniwob/html/miniwob/click-option.html::genProblem
    - derived/drafting_context.json::task_text
  benchmark_success:
    text: Native success is a valid final MiniWoB validation for this task with `done` true and binary reward `1.0`, where the validator computes reward as `float(RAW_REWARD_GLOBAL > 0)` from the page's WOB state.
    support:
    - derived/drafting_context.json::released_evaluator
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
  checked_by:
    text: '`env.unwrapped.task.validate(page, chat_messages)` using page/url validity plus final WOB globals `RAW_REWARD_GLOBAL` and `DONE_GLOBAL`.'
    support:
    - derived/drafting_context.json::released_evaluator
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
  decisive_artifacts:
  - artifact: native_evaluator_output.json
    question: 'Does the final validator result show a valid final check with `done: true`, reward `1.0`, and retained info consistent with a positive `RAW_REWARD_GLOBAL`?'
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts
    - derived/drafting_context.json::released_evaluator
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  - artifact: native_evaluator_input.json or task_context.json
    question: Does the retained evaluator context identify this MiniWoB case and the final validation target URL/page for the same episode?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts
    - derived/drafting_context.json::released_evaluator
  success_if:
  - text: Retained evaluator output establishes a valid final validation for `miniwob.click-option` with `done` true and reward `1.0`.
    support:
    - derived/drafting_context.json::released_evaluator
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  - text: The same retained validation shows positive `RAW_REWARD_GLOBAL`, which is the official condition the validator maps to binary success.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
  fail_if:
  - text: Retained evaluator output shows the validator terminated for invalid page or invalid URL.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
  - text: Retained evaluator output shows a completed final validation with non-positive raw reward, yielding binary reward `0.0`.
    support:
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
  undecided_if:
  - text: Retained artifacts do not preserve the concrete final validator result or enough evaluator context to tell whether the recorded outcome came from a valid final validation for this case.
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts
    - derived/drafting_context.json::released_evaluator.summary_field_guard
stronger:
  additional_conditions: []

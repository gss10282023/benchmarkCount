schema_version: case_checklist_v1
case_unit_id: miniwob.use-autocomplete
domain: miniwob
task_id: miniwob.use-autocomplete
native:
  user_goal:
    text: 'Enter an item that matches the runtime-issued autocomplete constraint: starts with the shown prefix and, when the goal includes an ending clause, also ends with the shown suffix.'
    support:
    - official/install/miniwob/html/miniwob/use-autocomplete.html::genProblem
    - derived/drafting_context.json::task_text.runtime_goal_source
  benchmark_success:
    text: Native success is a valid final MiniWoB validation that returns done true and binary reward 1.0, where the validator computes reward as float(RAW_REWARD_GLOBAL > 0).
    support:
    - derived/drafting_context.json::released_evaluator.native_semantics
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  checked_by:
    text: The released MiniWoB validator `env.unwrapped.task.validate(page, chat_messages)`, using page/url validity plus WOB state fields `RAW_REWARD_GLOBAL` and `DONE_GLOBAL`.
    support:
    - derived/drafting_context.json::released_evaluator.entrypoint
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
  decisive_artifacts:
  - artifact: native_evaluator_output.json
    question: Does the final validator result show a valid validation with done true and reward 1.0, or a benchmark-counted failure such as invalid page/url or non-positive raw reward?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2]
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
  - artifact: task_artifacts/
    question: Do the retained final validation/task-state records corroborate the final WOB state and whether the run reached a completed task outcome?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[3]
    - derived/drafting_context.json::evaluator_visible_state_schema.fields
  success_if:
  - text: Retained validator evidence establishes a valid final validation with `DONE_GLOBAL` true and binary reward `1.0`.
    support:
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  - text: The same retained evidence shows `RAW_REWARD_GLOBAL > 0`, which is the evaluator's explicit condition for reward `1.0`.
    support:
    - derived/drafting_context.json::released_evaluator.native_semantics
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  fail_if:
  - text: Retained validator evidence shows an invalid page or invalid URL at final validation, which returns reward 0 and terminates.
    support:
    - derived/drafting_context.json::released_evaluator.native_semantics
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  - text: Retained validator evidence shows a completed task outcome with `DONE_GLOBAL` true and binary reward `0.0` from `RAW_REWARD_GLOBAL <= 0`.
    support:
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  - text: Other retained benchmark-counted run-failure evidence in the final validator result supports native failure.
    support:
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
  undecided_if:
  - text: The retained artifacts do not preserve the concrete final validator result or enough final validation/task-state evidence to determine page/url validity, `DONE_GLOBAL`, and whether `RAW_REWARD_GLOBAL` was positive.
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2]
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[3]
    - derived/drafting_context.json::released_evaluator.summary_field_guard
  - text: Only summary-level success metadata is available without the concrete validator reward/done/info evidence needed for the native decision.
    support:
    - derived/drafting_context.json::released_evaluator.summary_field_guard
stronger:
  additional_conditions: []

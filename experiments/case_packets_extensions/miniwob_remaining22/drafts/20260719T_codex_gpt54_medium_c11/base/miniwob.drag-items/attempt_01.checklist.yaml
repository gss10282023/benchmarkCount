schema_version: case_checklist_v1
case_unit_id: miniwob.drag-items
domain: miniwob
task_id: miniwob.drag-items
native:
  user_goal:
    text: Complete the runtime-issued drag instruction by moving the named list item to the specified destination position or direction.
    support:
    - derived/drafting_context.json::task_text.runtime_goal_source
    - official/install/miniwob/html/miniwob/drag-items.html::genProblem
    - derived/official_source_excerpts.json::excerpts.task_class.content
  benchmark_success:
    text: The native benchmark counts success when the released validator performs a valid final validation and returns `reward = 1.0` with `done = true`, where the reward is defined as `float(RAW_REWARD_GLOBAL > 0)` from the task state.
    support:
    - derived/drafting_context.json::released_evaluator.native_semantics
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
  checked_by:
    text: Released MiniWoB++ validation via `env.unwrapped.task.validate(page, chat_messages)`, using final page/url checks plus evaluator-visible WOB fields including `RAW_REWARD_GLOBAL` and `DONE_GLOBAL`.
    support:
    - derived/drafting_context.json::released_evaluator.entrypoint
    - derived/drafting_context.json::evaluator_visible_state_schema.support
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  decisive_artifacts:
  - artifact: native_evaluator_output.json
    question: Does the final validator result show a valid page/url check and return `reward = 1.0` with `done = true`, or instead show `reward = 0` / an invalid page or invalid url termination?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2].path
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  - artifact: task_artifacts/
    question: Do the retained final validation/task-state records preserve the evaluator-visible final WOB fields, especially `RAW_REWARD_GLOBAL` and `DONE_GLOBAL`, so the validator outcome can be confirmed if needed?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[3].path
    - derived/drafting_context.json::evaluator_visible_state_schema.fields
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
  success_if:
  - text: Retained evidence shows the final released validation was on the correct page and url, with `done = true` and binary `reward = 1.0`.
    support:
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  - text: The retained final task state shows `RAW_REWARD_GLOBAL > 0`, which is the oracle condition the validator converts into native success.
    support:
    - derived/drafting_context.json::released_evaluator.native_semantics
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
  fail_if:
  - text: Retained evidence shows the released validator terminated for invalid page or invalid url.
    support:
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  - text: Retained evidence shows a completed final validation with non-positive `RAW_REWARD_GLOBAL`, yielding binary `reward = 0.0`.
    support:
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
    - derived/drafting_context.json::released_evaluator.native_semantics
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  undecided_if:
  - text: The retained artifacts do not preserve a trustworthy final validator result or final WOB state needed to determine page/url validity, `DONE_GLOBAL`, and whether `RAW_REWARD_GLOBAL > 0`.
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts
    - derived/drafting_context.json::released_evaluator.summary_field_guard
    - derived/drafting_context.json::evaluator_visible_state_schema.fields
stronger:
  additional_conditions: []

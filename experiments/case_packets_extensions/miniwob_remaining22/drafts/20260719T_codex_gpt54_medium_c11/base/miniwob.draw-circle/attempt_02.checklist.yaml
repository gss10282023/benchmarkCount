schema_version: case_checklist_v1
case_unit_id: miniwob.draw-circle
domain: miniwob
task_id: miniwob.draw-circle
native:
  user_goal:
    text: Draw a circle centered around the marked point by dragging the mouse, then press Submit.
    support:
    - official/install/miniwob/html/miniwob/draw-circle.html::genProblem
    - derived/drafting_context.json::task_text.static_query_text
  benchmark_success:
    text: Native benchmark success is a valid final MiniWoB validation result with `done` true and binary reward `1.0`, where the released validator maps `info.RAW_REWARD_GLOBAL > 0` to success after rejecting invalid page or URL.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/drafting_context.json::released_evaluator.native_semantics
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
  checked_by:
    text: '`env.unwrapped.task.validate(page, chat_messages)`, which first rejects invalid page or URL, then reads evaluator-visible WOB state and returns `float(RAW_REWARD_GLOBAL > 0)` with `DONE_GLOBAL`.'
    support:
    - derived/drafting_context.json::released_evaluator.entrypoint
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
  decisive_artifacts:
  - artifact: native_evaluator_output.json
    question: 'Does the final validator output show no invalid-page or invalid-URL error, `done: true`, binary reward `1.0`, and `info.RAW_REWARD_GLOBAL > 0`?'
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2].path
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  - artifact: task_artifacts/
    question: Do the retained final validation/task-state artifacts preserve the evaluator-visible fields needed to confirm `DONE_GLOBAL` and positive `RAW_REWARD_GLOBAL` consistently with the validator output?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[3].path
    - derived/drafting_context.json::evaluator_visible_state_schema.fields
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
  success_if:
  - text: Retained evidence shows a valid final validation with no invalid-page or invalid-URL error, `done` true, and binary reward `1.0`, grounded in `info.RAW_REWARD_GLOBAL > 0`.
    support:
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  fail_if:
  - text: Retained evidence establishes an invalid page or URL, or a completed task outcome with non-positive raw reward, so the released validator returns binary reward `0.0` or another benchmark-counted run failure.
    support:
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  undecided_if:
  - text: The retained artifacts do not preserve a concrete final validator result, or they are too incomplete or contradictory to determine invalid-page/URL status, `done`, and whether `RAW_REWARD_GLOBAL` was positive.
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts
    - derived/drafting_context.json::released_evaluator.summary_field_guard
    - derived/drafting_context.json::post_run_reporting.native_evidence_labels
stronger:
  additional_conditions:
  - id: drawing_reaches_official_top_circle_quality_bin
    text: 'The submitted drawing reaches the official top circle-quality bin: raw reward `1.0`, which requires radial standard deviation below `2` and adequate width and height.'
    rationale: The official goal requests a circle centered around the marked point, while native success accepts any positive quality bin, including substantially lower-quality drawings.
    decisive_artifacts:
    - artifact: native_evaluator_output.json
      question: Does `info.RAW_REWARD_GLOBAL` equal `1.0` rather than merely being positive?
      support:
      - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0].decisive_post_run_artifacts[0]
      - official/install/miniwob/html/miniwob/draw-circle.html::determineReward
    - artifact: trajectory/steps.json and trajectory/observations/
      question: Do the retained trace and observations show a completed submitted drawing suitable for reviewing whether the circle was centered and completed rather than a missing or truncated attempt?
      support:
      - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0].decisive_post_run_artifacts[1]
      - official/install/miniwob/html/miniwob/draw-circle.html::genProblem
    - artifact: browser_artifacts/page_html/ and browser_artifacts/screenshots/
      question: Do the retained page artifacts show a circle of adequate width and height around the marked point, consistent with the top-quality bin requirements?
      support:
      - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0].decisive_post_run_artifacts[2]
      - official/install/miniwob/html/miniwob/draw-circle.html::properlySized
      - official/install/miniwob/html/miniwob/draw-circle.html::genProblem
    support:
    - official/install/miniwob/html/miniwob/draw-circle.html::determineReward
    - official/install/miniwob/html/miniwob/draw-circle.html::properlySized
    - official/install/miniwob/html/miniwob/draw-circle.html::genProblem
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content

schema_version: case_checklist_v1
case_unit_id: 258796c_3
domain: appworld
task_id: 258796c_3
native:
  user_goal:
    text: Answer how many hours the HP Pavilion 15 Laptop battery lasts, using Amazon reviews or questions/answers and trusting only verified purchasers.
    support:
    - official/specs.json::$.instruction
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_d87b580e008c]'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
    rationale: TestTracker success requires every registered test to pass.
  checked_by:
    text: The official evaluation function registers an answer-match test and a no-model-change test with TestTracker.
    support:
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Retained submitted answer and official evaluator comparison result
    question: Does the retained evaluator result show that the registered answer-comparison test passed?
    support:
    - official/ground_truth/evaluation.py::evaluate
  - artifact: Retained start/end database diff and official evaluator result
    question: Does the retained diff show no changed models and the evaluator result show that the registered no-model-change test passed?
    support:
    - official/ground_truth/evaluation.py::evaluate
  success_if:
  - text: '[appworld_test_001_844d21b309f0] passes exactly when this official requirement is satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The first registered test compares the submitted task answer with the official answer.
  - text: '[appworld_test_002_d87b580e008c] passes exactly when this official requirement is satisfied: assert there is not model change.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The second registered test requires the changed-model set to be empty.
  fail_if:
  - text: '[appworld_test_001_844d21b309f0] fails exactly when this official requirement is not satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: A failed official answer comparison is a registered-test failure.
  - text: '[appworld_test_002_d87b580e008c] fails exactly when this official requirement is not satisfied: assert there is not model change.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Any nonempty changed-model set fails the registered no-model-change test.
  undecided_if:
  - text: Undecided only if retained evidence cannot determine one or more frozen registered-test outcomes.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
    rationale: A registered-test outcome must not be inferred when its decisive retained evidence is missing or non-decisive.
stronger:
  additional_conditions:
  - id: completed_task_status
    text: Beyond native scoring, require the retained active task status to be "success".
    rationale: The evaluator computes task completion from task status but does not register that computation as a scoring test, so native success can establish the answer and model-state checks without establishing successful task completion.
    decisive_artifacts:
    - artifact: Retained active supervisor task record
      question: Does the retained active task have status "success"?
      support:
      - official/ground_truth/evaluation.py::evaluate
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/specs.json::$.instruction

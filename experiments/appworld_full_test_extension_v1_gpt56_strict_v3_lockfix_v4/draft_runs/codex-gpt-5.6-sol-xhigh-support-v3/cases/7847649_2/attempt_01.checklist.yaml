schema_version: case_checklist_v1
case_unit_id: '7847649_2'
domain: appworld
task_id: '7847649_2'
native:
  user_goal:
    text: Answer how many activities are left to do in the user's bucket list, as recorded in their SimpleNote note.
    support:
    - official/specs.json::$.instruction
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_818d3311397a]'
    support:
    - case_packet.md::L21-L27
    - official/ground_truth/evaluation.py::evaluate
    rationale: TestTracker succeeds only when every registered test passes, and this evaluator registers these two tests.
  checked_by:
    text: The official TestTracker evaluator compares the submitted answer with the official value and checks that no models changed.
    support:
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Retained submitted answer and official evaluator comparison result
    question: Does the retained evaluator result show that the registered answer-comparison test passed?
    support:
    - official/ground_truth/evaluation.py::evaluate
  - artifact: Retained start/end database diff and official evaluator result
    question: Does the retained evidence show an empty set of changed model names and that the registered no-model-changes test passed?
    support:
    - official/ground_truth/evaluation.py::evaluate
  success_if:
  - text: '[appworld_test_001_844d21b309f0] passes exactly when this official requirement is satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[0].requirement
    rationale: The evaluator parses the retained task answer and compares it with the official value inside the first registered test.
  - text: '[appworld_test_002_818d3311397a] passes exactly when this official requirement is satisfied: assert no model changes.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[1].requirement
    rationale: The evaluator requires the changed-model-name set to be empty inside the second registered test.
  fail_if:
  - text: '[appworld_test_001_844d21b309f0] fails exactly when this official requirement is not satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[0].requirement
    rationale: A failed official answer comparison fails the first registered test.
  - text: '[appworld_test_002_818d3311397a] fails exactly when this official requirement is not satisfied: assert no model changes.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[1].requirement
    rationale: Any nonempty changed-model-name set fails the second registered test.
  undecided_if:
  - text: Undecided only if retained evidence cannot determine one or more frozen registered-test outcomes.
    support:
    - case_packet.md::L21-L27
    - official/ground_truth/evaluation.py::evaluate
    rationale: A registered-test outcome must not be inferred when its decisive retained evidence is missing or non-decisive.
stronger:
  additional_conditions: []

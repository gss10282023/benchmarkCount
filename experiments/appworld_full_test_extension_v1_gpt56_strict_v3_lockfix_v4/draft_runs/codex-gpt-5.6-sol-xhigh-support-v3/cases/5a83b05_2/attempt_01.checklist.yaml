schema_version: case_checklist_v1
case_unit_id: 5a83b05_2
domain: appworld
task_id: 5a83b05_2
native:
  user_goal:
    text: Delete all .jpg files from the user's ~/downloads folder.
    support:
    - official/specs.json::$.instruction
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_847f02da186e], [appworld_test_003_a92e378d5c74]'
    support:
    - case_packet.md::L36-L72
    - official/ground_truth/evaluation.py::evaluate
    rationale: TestTracker success requires every registered test to pass.
  checked_by:
    text: The official evaluate function registers three TestTracker checks covering the submitted answer, changed model names, and deleted file paths.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
  decisive_artifacts:
  - artifact: Retained submitted answer and official evaluator comparison result
    question: Does the retained evaluator result show that the registered answer-comparison test passed?
    support:
    - official/ground_truth/evaluation.py::evaluate
  - artifact: Retained start/end database diff and official evaluator model-change result
    question: Does the retained evaluator result show that changed model names equal file_system.File and file_system.Directory?
    support:
    - official/ground_truth/evaluation.py::evaluate
  - artifact: Retained start/end database diff of deleted file_system.File records and official evaluator path-comparison result
    question: Does the retained evaluator result show that all deleted file paths match the required .jpg path set, ignoring order?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.file_paths_with_extension
  success_if:
  - text: '[appworld_test_001_844d21b309f0] passes exactly when this official requirement is satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
    rationale: The evaluator compares the retained submitted answer with the official answer value.
  - text: '[appworld_test_002_847f02da186e] passes exactly when this official requirement is satisfied: assert model changes match file_system.File.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The evaluator requires changed model names to equal file_system.File and file_system.Directory.
  - text: '[appworld_test_003_a92e378d5c74] passes exactly when this official requirement is satisfied: obtain deleted file_system.File records using models.changed_records. assert all deleted files'' paths match private_data.file_paths_with_extension (ignoring order)'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.file_paths_with_extension
    rationale: The evaluator compares deleted file paths with the specified path list while ignoring order.
  fail_if:
  - text: '[appworld_test_001_844d21b309f0] fails exactly when this official requirement is not satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
    rationale: An answer mismatch fails this registered test.
  - text: '[appworld_test_002_847f02da186e] fails exactly when this official requirement is not satisfied: assert model changes match file_system.File.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Any changed-model-name set other than file_system.File and file_system.Directory fails this registered test.
  - text: '[appworld_test_003_a92e378d5c74] fails exactly when this official requirement is not satisfied: obtain deleted file_system.File records using models.changed_records. assert all deleted files'' paths match private_data.file_paths_with_extension (ignoring order)'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.file_paths_with_extension
    rationale: Any missing, extra, or different deleted file path fails this registered test, regardless of order.
  undecided_if:
  - text: Undecided only if retained evidence cannot determine one or more frozen registered-test outcomes.
    support:
    - case_packet.md::L36-L72
    rationale: A registered-test outcome must not be inferred when its decisive retained evidence is missing or non-decisive.
stronger:
  additional_conditions: []

schema_version: case_checklist_v1
case_unit_id: 1150ed6_2
domain: appworld
task_id: 1150ed6_2
native:
  user_goal:
    text: Play any song released in 2021 from the user's Spotify album library.
    support:
    - official/specs.json::$.instruction
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_882edd61ffe0], [appworld_test_003_7cf2f2ffbf97], [appworld_test_004_afd54e1ef370], [appworld_test_005_aa9c4cf23c5b], [appworld_test_006_9a50f81eb92f]'
    support:
    - case_packet.md::L19-L27
    - official/ground_truth/evaluation.py::evaluate
    rationale: Frozen TestTracker success requires every registered test to pass.
  checked_by:
    text: The official AppWorld evaluator registers six TestTracker requirements in evaluate(); native success is pass_count equal to num_tests.
    support:
    - case_packet.md::L19-L27
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Retained submitted answer and official evaluator comparison result
    question: Does the retained evaluator result show that the registered answer-comparison test passed?
    support:
    - official/ground_truth/evaluation.py::evaluate
  - artifact: Retained start/end Spotify database diff and official TestTracker results
    question: Do the retained diff and results show that only one Spotify music-player record was updated, none were added or removed, and its current song is playing, was released in 2021, and belongs to the evaluator-permitted song set?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/public_data.json::$.release_year
    - official/ground_truth/private_data.json::$.song_ids
  success_if:
  - text: '[appworld_test_001_844d21b309f0] passes exactly when this official requirement is satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
    rationale: The evaluator compares the retained submitted answer with the official answer.
  - text: '[appworld_test_002_882edd61ffe0] passes exactly when this official requirement is satisfied: assert model changes match spotify.MusicPlayer.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The evaluator requires the changed-model set to contain only spotify.MusicPlayer.
  - text: '[appworld_test_003_7cf2f2ffbf97] passes exactly when this official requirement is satisfied: obtained added, updated, removed spotify.MusicPlayer records using models.changed_records, and assert 0 have been added or removed, and 1 has been updated.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The evaluator checks the added, updated, and removed record counts from the database diff.
  - text: '[appworld_test_004_afd54e1ef370] passes exactly when this official requirement is satisfied: assert the updated music player is in the playing state.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The evaluator checks that the single updated music player's is_playing value is true.
  - text: '[appworld_test_005_aa9c4cf23c5b] passes exactly when this official requirement is satisfied: assert updated music_player.current_song.release_date is public_data.release_year.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/public_data.json::$.release_year
    rationale: The evaluator compares the current song's release year with the official public release year.
  - text: '[appworld_test_006_9a50f81eb92f] passes exactly when this official requirement is satisfied: assert updated_music_player.current_song.id is in private_data.song_ids.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.song_ids
    rationale: The evaluator requires the current song ID to belong to the official permitted song-ID set.
  fail_if:
  - text: '[appworld_test_001_844d21b309f0] fails exactly when this official requirement is not satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
    rationale: An answer-comparison failure is a registered native failure.
  - text: '[appworld_test_002_882edd61ffe0] fails exactly when this official requirement is not satisfied: assert model changes match spotify.MusicPlayer.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Any different changed-model set fails this registered test.
  - text: '[appworld_test_003_7cf2f2ffbf97] fails exactly when this official requirement is not satisfied: obtained added, updated, removed spotify.MusicPlayer records using models.changed_records, and assert 0 have been added or removed, and 1 has been updated.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Any mismatch in the required added, updated, or removed counts fails this registered test.
  - text: '[appworld_test_004_afd54e1ef370] fails exactly when this official requirement is not satisfied: assert the updated music player is in the playing state.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: A non-playing updated music player fails this registered test.
  - text: '[appworld_test_005_aa9c4cf23c5b] fails exactly when this official requirement is not satisfied: assert updated music_player.current_song.release_date is public_data.release_year.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/public_data.json::$.release_year
    rationale: A current-song release year different from the official public release year fails this registered test.
  - text: '[appworld_test_006_9a50f81eb92f] fails exactly when this official requirement is not satisfied: assert updated_music_player.current_song.id is in private_data.song_ids.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.song_ids
    rationale: A current song outside the official permitted song-ID set fails this registered test.
  undecided_if:
  - text: Undecided only if retained evidence cannot determine one or more frozen registered-test outcomes.
    support:
    - case_packet.md::L19-L27
    - official/ground_truth/evaluation.py::evaluate
    rationale: A registered-test outcome must not be inferred when its decisive retained evidence is missing or non-decisive.
stronger:
  additional_conditions: []

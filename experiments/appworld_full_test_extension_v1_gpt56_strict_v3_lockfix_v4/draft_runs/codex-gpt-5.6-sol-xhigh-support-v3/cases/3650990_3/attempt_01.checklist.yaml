schema_version: case_checklist_v1
case_unit_id: '3650990_3'
domain: appworld
task_id: '3650990_3'
native:
  user_goal:
    text: Have I returned any crescent wrench on amazon in this or last month? Say yes or no.
    support:
    - official/specs.json::$.instruction
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_d87b580e008c]'
    support:
    - case_packet.md::L19-L27
    - official/ground_truth/test_data.json::$
    rationale: Frozen TestTracker success requires both registered tests to pass.
  checked_by:
    text: The frozen TestTracker compares the retained submitted answer through the official answer test and verifies through the official no-change test that changed_model_names() is empty.
    support:
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Retained submitted answer and official evaluator comparison result
    question: Does the retained evaluator result show that the registered answer-comparison test passed?
    support:
    - official/ground_truth/evaluation.py::evaluate
  - artifact: Retained start/end database diff and official evaluator no-change result
    question: Does the retained diff and evaluator result show that no model changed?
    support:
    - official/ground_truth/evaluation.py::evaluate
  success_if:
  - text: '[appworld_test_001_844d21b309f0] passes exactly when this official requirement is satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[0].requirement
    rationale: The first registered test applies the official answer comparison to the retained submitted answer.
  - text: '[appworld_test_002_d87b580e008c] passes exactly when this official requirement is satisfied: assert there is not model change.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[1].requirement
    rationale: The second registered test requires the changed-model set to be empty.
  fail_if:
  - text: '[appworld_test_001_844d21b309f0] fails exactly when this official requirement is not satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[0].requirement
    rationale: A failed official answer comparison is a failed registered test.
  - text: '[appworld_test_002_d87b580e008c] fails exactly when this official requirement is not satisfied: assert there is not model change.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[1].requirement
    rationale: Any nonempty changed-model set fails the registered no-change test.
  undecided_if:
  - text: Undecided only if retained evidence cannot determine one or more frozen registered-test outcomes.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
    rationale: A registered-test outcome must not be inferred when its decisive retained evidence is missing or non-decisive.
stronger:

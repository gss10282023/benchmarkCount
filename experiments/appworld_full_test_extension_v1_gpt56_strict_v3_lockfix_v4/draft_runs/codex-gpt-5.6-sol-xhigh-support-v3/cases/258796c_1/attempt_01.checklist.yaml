schema_version: case_checklist_v1
case_unit_id: 258796c_1
domain: appworld
task_id: 258796c_1
native:
  user_goal:
    text: Answer how many hours the ecobee SmartCamera battery lasts using Amazon reviews or questions/answers, trusting only verified purchasers.
    support:
    - official/specs.json::$.instruction
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_d87b580e008c]'
    support:
    - case_packet.md::L19-L27
    - official/ground_truth/test_data.json::$
    rationale: TestTracker success requires both registered tests to pass.
  checked_by:
    text: The official evaluator compares the submitted answer with the official answer and verifies that changed_model_names() equals an empty set.
    support:
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Retained submitted answer and official evaluator comparison result
    question: Does the retained evaluator result show that the registered answer-comparison test passed?
    support:
    - official/ground_truth/evaluation.py::evaluate
  - artifact: Retained start/end model diff and official evaluator no-change result
    question: Does the retained evaluator result show that changed_model_names() was empty?
    support:
    - official/ground_truth/evaluation.py::evaluate
  success_if:
  - text: '[appworld_test_001_844d21b309f0] passes exactly when this official requirement is satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[0].requirement
    rationale: The first registered test applies the evaluator's answer comparison to the retained submitted answer.
  - text: '[appworld_test_002_d87b580e008c] passes exactly when this official requirement is satisfied: assert there is not model change.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[1].requirement
    rationale: The second registered test requires the retained start/end comparison to report no changed models.
  fail_if:
  - text: '[appworld_test_001_844d21b309f0] fails exactly when this official requirement is not satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[0].requirement
    rationale: A failed official answer comparison is a registered-test failure.
  - text: '[appworld_test_002_d87b580e008c] fails exactly when this official requirement is not satisfied: assert there is not model change.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[1].requirement
    rationale: Any changed model reported by the official start/end comparison fails this registered test.
  undecided_if:
  - text: Undecided only if retained evidence cannot determine one or more frozen registered-test outcomes.
    support:
    - case_packet.md::L19-L27
    rationale: A registered-test outcome must not be inferred when its decisive retained evidence is missing or non-decisive.
stronger:
  additional_conditions:
  - id: verified-purchaser-sourcing
    text: Retained evidence shows that the battery-duration answer was supported only by Amazon material from verified purchasers.
    rationale: The official instruction imposes a verified-purchaser sourcing restriction, but the released evaluator checks only answer equality and absence of model changes, so native success does not establish compliance with that restriction.
    decisive_artifacts:
    - artifact: Retained Amazon query or API trace with review verification metadata
      question: Does the retained trace show that the battery-duration evidence used for the answer came only from verified purchasers?
      support:
      - official/specs.json::$.instruction
      - official/dbs/amazon.jsonl::L1-L12
    support:
    - official/specs.json::$.instruction
    - official/ground_truth/evaluation.py::evaluate

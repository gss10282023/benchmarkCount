schema_version: case_checklist_v1
case_unit_id: c77c005_2
domain: appworld
task_id: c77c005_2
native:
  user_goal:
    text: Befriend on Venmo anyone the user sent money to this month and unfriend everyone else.
    support:
    - official/specs.json::$.instruction
    rationale: This is the official task instruction.
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_5a45a5c66126], [appworld_test_003_49c9013daa98], [appworld_test_004_31ef53c79721], [appworld_test_005_49b444d69c3b]'
    support:
    - case_packet.md::L21-L27
    - official/ground_truth/evaluation.py::evaluate
    rationale: TestTracker success requires every registered test to pass.
  checked_by:
    text: The frozen AppWorld TestTracker evaluates five registered test contexts; success is true exactly when all five pass.
    support:
    - case_packet.md::L21-L27
    - official/ground_truth/evaluation.py::evaluate
    rationale: Only registered test contexts contribute passes, failures, and native success.
  decisive_artifacts:
  - artifact: Retained submitted answer and official evaluator comparison result
    question: Does the retained evaluator result show that the registered answer-comparison test passed?
    support:
    - official/ground_truth/evaluation.py::evaluate
  - artifact: Retained start/end Venmo database diff and official evaluator/TestTracker results
    question: Do the retained diff and evaluator results show that only venmo.Friendship changed, the added and removed friend IDs satisfy their unordered comparisons, and zero Friendship records were updated?
    support:
    - official/ground_truth/evaluation.py::evaluate
  success_if:
  - text: '[appworld_test_001_844d21b309f0] passes exactly when this official requirement is satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The evaluator compares the retained submitted answer with the official answer value.
  - text: '[appworld_test_002_5a45a5c66126] passes exactly when this official requirement is satisfied: assert model changes match venmo.Friendship.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The evaluator requires the changed-model-name set to equal venmo.Friendship.
  - text: '[appworld_test_003_49c9013daa98] passes exactly when this official requirement is satisfied: assert friend_ids from added friendships match exactly to private_data.to_befriend_user_ids (ignore order).'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The evaluator extracts friend IDs from added Friendship records and compares them without regard to order.
  - text: '[appworld_test_004_31ef53c79721] passes exactly when this official requirement is satisfied: assert friend_ids from removed friendships match exactly to private_data.to_unfriend_user_ids (ignore order).'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The evaluator extracts friend IDs from removed Friendship records and compares them without regard to order.
  - text: '[appworld_test_005_49b444d69c3b] passes exactly when this official requirement is satisfied: obtain added, updated, removed venmo.Friendship records using models.changed_records, and assert 0 friendships were updated.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The evaluator requires the updated Friendship-record count to be zero.
  fail_if:
  - text: '[appworld_test_001_844d21b309f0] fails exactly when this official requirement is not satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: An answer-comparison failure is a registered native failure.
  - text: '[appworld_test_002_5a45a5c66126] fails exactly when this official requirement is not satisfied: assert model changes match venmo.Friendship.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: A changed-model-name mismatch is a registered native failure.
  - text: '[appworld_test_003_49c9013daa98] fails exactly when this official requirement is not satisfied: assert friend_ids from added friendships match exactly to private_data.to_befriend_user_ids (ignore order).'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: An added-friend-ID mismatch is a registered native failure.
  - text: '[appworld_test_004_31ef53c79721] fails exactly when this official requirement is not satisfied: assert friend_ids from removed friendships match exactly to private_data.to_unfriend_user_ids (ignore order).'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: A removed-friend-ID mismatch is a registered native failure.
  - text: '[appworld_test_005_49b444d69c3b] fails exactly when this official requirement is not satisfied: obtain added, updated, removed venmo.Friendship records using models.changed_records, and assert 0 friendships were updated.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Any updated Friendship record makes this registered test fail.
  undecided_if:
  - text: Undecided only if retained evidence cannot determine one or more frozen registered-test outcomes.
    support:
    - case_packet.md::L21-L27
    - official/ground_truth/evaluation.py::evaluate
    rationale: A registered-test outcome must not be inferred when its decisive retained evidence is missing or non-decisive.
stronger:
  additional_conditions: []

schema_version: case_checklist_v1
case_unit_id: '8749218_1'
domain: appworld
task_id: '8749218_1'
native:
  user_goal:
    text: Reset the Spotify queue with all recommended songs, shuffle it, and play it.
    support:
    - official/specs.json::$.instruction
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_882edd61ffe0], [appworld_test_003_afd54e1ef370], [appworld_test_004_39686d2cd487], [appworld_test_005_ea018b6f0cdc], [appworld_test_006_3d58657f7503]'
    support:
    - case_packet.md::L19-L115
    rationale: TestTracker success requires every registered test to pass.
  checked_by:
    text: The official AppWorld evaluation compares the submitted answer and retained Spotify MusicPlayer changes through TestTracker.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - case_packet.md::L19-L27
  decisive_artifacts:
  - artifact: Retained submitted answer and official evaluator comparison result
    question: Does the retained evaluator result show that the registered answer-comparison test passed?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
  - artifact: Retained start/end Spotify MusicPlayer database diff and official TestTracker results
    question: Do the retained diff and evaluator results establish the required changed model, record counts, playing state, queue membership, and queue-order comparison outcomes?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.recommendation_song_ids
  success_if:
  - text: '[appworld_test_001_844d21b309f0] passes exactly when this official requirement is satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
    rationale: The evaluator compares the parsed submitted answer with the official answer.
  - text: '[appworld_test_002_882edd61ffe0] passes exactly when this official requirement is satisfied: assert model changes match spotify.MusicPlayer.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The evaluator requires the changed-model-name set to equal spotify.MusicPlayer.
  - text: '[appworld_test_003_afd54e1ef370] passes exactly when this official requirement is satisfied: assert the updated music player is in the playing state.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The evaluator requires the updated music player's is_playing value to be truthy.
  - text: '[appworld_test_004_39686d2cd487] passes exactly when this official requirement is satisfied: assert set of song_ids in the queue of the updated music player is identical to private_data.recommendation_song_ids.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.recommendation_song_ids
    rationale: The evaluator compares the updated queue's song-ID set with the recommendation song-ID set.
  - text: '[appworld_test_005_ea018b6f0cdc] passes exactly when this official requirement is satisfied: assert the order of song_ids in the queue of the updated music player is not identical or reverse to the order of private_data.recommendation_song_ids.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.recommendation_song_ids
    rationale: The frozen registered test applies the evaluator's explicit identical-or-reverse comparisons.
  - text: '[appworld_test_006_3d58657f7503] passes exactly when this official requirement is satisfied: obtain added, updated, removed spotify.MusicPlayer records using models.changed_records, and assert 0 have been added or removed.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The evaluator requires zero added and zero removed Spotify MusicPlayer records.
  fail_if:
  - text: '[appworld_test_001_844d21b309f0] fails exactly when this official requirement is not satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
    rationale: A failed official answer comparison is a registered-test failure.
  - text: '[appworld_test_002_882edd61ffe0] fails exactly when this official requirement is not satisfied: assert model changes match spotify.MusicPlayer.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: A changed-model-name set other than spotify.MusicPlayer fails this registered test.
  - text: '[appworld_test_003_afd54e1ef370] fails exactly when this official requirement is not satisfied: assert the updated music player is in the playing state.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: A non-playing updated music player fails this registered test.
  - text: '[appworld_test_004_39686d2cd487] fails exactly when this official requirement is not satisfied: assert set of song_ids in the queue of the updated music player is identical to private_data.recommendation_song_ids.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.recommendation_song_ids
    rationale: A queue song-ID set differing from the recommendation set fails this registered test.
  - text: '[appworld_test_005_ea018b6f0cdc] fails exactly when this official requirement is not satisfied: assert the order of song_ids in the queue of the updated music player is not identical or reverse to the order of private_data.recommendation_song_ids.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.recommendation_song_ids
    rationale: Failure of either frozen order-comparison assertion fails this registered test.
  - text: '[appworld_test_006_3d58657f7503] fails exactly when this official requirement is not satisfied: obtain added, updated, removed spotify.MusicPlayer records using models.changed_records, and assert 0 have been added or removed.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Any added or removed Spotify MusicPlayer record fails this registered test.
  undecided_if:
  - text: Undecided only if retained evidence cannot determine one or more frozen registered-test outcomes.
    support:
    - case_packet.md::L19-L38
    rationale: A registered-test outcome must not be inferred when its decisive retained evidence is missing or non-decisive.
stronger:
  additional_conditions:
  - id: verify_actual_queue_shuffle
    text: Require the retained final Spotify queue order itself to be neither identical to nor the reverse of the recommendation order.
    rationale: The user requested a shuffled queue, but the evaluator converts queue song IDs to a set before its order comparisons, so the native check does not directly verify the retained queue order.
    decisive_artifacts:
    - artifact: Retained final Spotify MusicPlayer queue in stored order
      question: Is the retained final queue order neither identical to nor the reverse of the official recommendation order?
      support:
      - official/specs.json::$.instruction
      - official/ground_truth/evaluation.py::evaluate
      - official/ground_truth/private_data.json::$.recommendation_song_ids
    support:
    - official/specs.json::$.instruction
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.recommendation_song_ids

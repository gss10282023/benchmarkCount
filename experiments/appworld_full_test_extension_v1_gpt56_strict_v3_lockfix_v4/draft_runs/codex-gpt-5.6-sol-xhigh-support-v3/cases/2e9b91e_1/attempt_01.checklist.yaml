schema_version: case_checklist_v1
case_unit_id: 2e9b91e_1
domain: appworld
task_id: 2e9b91e_1
native:
  user_goal:
    text: Request Denise money on Venmo for everything in the Amazon cart, excluding tax and delivery fees.
    support:
    - official/specs.json::$.instruction
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_00d86f793d5e], [appworld_test_003_bfc90d2d11fd], [appworld_test_004_124db8b52427], [appworld_test_005_c0398d819d5f]'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
    - case_packet.md::L21-L27
    rationale: TestTracker success requires every registered test to pass.
  checked_by:
    text: The official AppWorld evaluate function registers five TestTracker checks covering the submitted answer and the resulting Venmo state changes.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
  decisive_artifacts:
  - artifact: Retained submitted answer and official evaluator comparison result
    question: Does the retained evaluator result show that the registered answer-comparison test passed?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
  - artifact: Retained start/end Venmo database diff and official TestTracker results
    question: Do the retained diff and evaluator results show only Notification and PaymentRequest changed, exactly one PaymentRequest was added without deletion or update, and its recipient and amount passed the official comparisons?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$
  success_if:
  - text: '[appworld_test_001_844d21b309f0] passes exactly when this official requirement is satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[0].requirement
    rationale: The retained submitted answer and official evaluator comparison result determine this test.
  - text: '[appworld_test_002_00d86f793d5e] passes exactly when this official requirement is satisfied: assert model changes match venmo.Notification, venmo.PaymentRequest.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[1].requirement
    rationale: The retained start/end database diff and evaluator result determine the changed-model set.
  - text: '[appworld_test_003_bfc90d2d11fd] passes exactly when this official requirement is satisfied: assert PaymentRequest has 1 added, 0 deleted and 0 changed records using models.changed_records.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[2].requirement
    rationale: The retained start/end database diff and evaluator result determine PaymentRequest additions, deletions, and updates.
  - text: '[appworld_test_004_124db8b52427] passes exactly when this official requirement is satisfied: assert the recipient_id of this request is private_data.relative_venmo_user_id.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.relative_venmo_user_id
    - official/ground_truth/test_data.json::$[3].requirement
    rationale: The retained added PaymentRequest and evaluator comparison result determine whether the recipient is correct.
  - text: '[appworld_test_005_c0398d819d5f] passes exactly when this official requirement is satisfied: assert the amount of this request is private_data.cart_cost (tolerance of 1.01).'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.cart_cost
    - official/ground_truth/test_data.json::$[4].requirement
    rationale: The retained added PaymentRequest and evaluator comparison result determine whether the amount is within tolerance.
  fail_if:
  - text: '[appworld_test_001_844d21b309f0] fails exactly when this official requirement is not satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[0].requirement
    rationale: A failed retained answer-comparison result is a registered-test failure.
  - text: '[appworld_test_002_00d86f793d5e] fails exactly when this official requirement is not satisfied: assert model changes match venmo.Notification, venmo.PaymentRequest.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[1].requirement
    rationale: Any different changed-model set fails this registered test.
  - text: '[appworld_test_003_bfc90d2d11fd] fails exactly when this official requirement is not satisfied: assert PaymentRequest has 1 added, 0 deleted and 0 changed records using models.changed_records.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[2].requirement
    rationale: Any different PaymentRequest addition, deletion, or update count fails this registered test.
  - text: '[appworld_test_004_124db8b52427] fails exactly when this official requirement is not satisfied: assert the recipient_id of this request is private_data.relative_venmo_user_id.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.relative_venmo_user_id
    - official/ground_truth/test_data.json::$[3].requirement
    rationale: A recipient mismatch in the added PaymentRequest fails this registered test.
  - text: '[appworld_test_005_c0398d819d5f] fails exactly when this official requirement is not satisfied: assert the amount of this request is private_data.cart_cost (tolerance of 1.01).'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.cart_cost
    - official/ground_truth/test_data.json::$[4].requirement
    rationale: An amount outside the official tolerance fails this registered test.
  undecided_if:
  - text: Undecided only if retained evidence cannot determine one or more frozen registered-test outcomes.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
    rationale: A registered-test outcome must not be inferred when its decisive retained evidence is missing or non-decisive.
stronger:
  additional_conditions: []

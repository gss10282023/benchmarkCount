schema_version: case_checklist_v1
case_unit_id: afc4005_2
domain: appworld
task_id: afc4005_2
native:
  user_goal:
    text: Determine, in minutes, how long the user's planned workout was yesterday according to Simple Note.
    support:
    - official/specs.json::$.instruction
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_818d3311397a]'
    support:
    - case_packet.md::L19-L27
    - case_packet.md::L36-L65
    rationale: Native success is the conjunction of the two registered TestTracker outcomes.
  checked_by:
    text: The official case evaluator running under TestTracker, whose success is true when every registered test passes.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - case_packet.md::L19-L27
  decisive_artifacts:
  - artifact: Retained submitted answer and official evaluator comparison result
    question: Does the retained evaluator result show that the registered answer-comparison test passed?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[0].requirement
  - artifact: Retained start/end database diff and official evaluator comparison result
    question: Does the retained evaluator result show that the registered no-model-changes test passed?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[1].requirement
  success_if:
  - text: '[appworld_test_001_844d21b309f0] passes exactly when this official requirement is satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[0].requirement
    rationale: The evaluator directly compares the submitted answer with the official expected value.
  - text: '[appworld_test_002_818d3311397a] passes exactly when this official requirement is satisfied: assert no model changes.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[1].requirement
    rationale: The evaluator requires the set of changed model names to be empty.
  fail_if:
  - text: '[appworld_test_001_844d21b309f0] fails exactly when this official requirement is not satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[0].requirement
    rationale: A failed official answer comparison is a failed registered test.
  - text: '[appworld_test_002_818d3311397a] fails exactly when this official requirement is not satisfied: assert no model changes.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[1].requirement
    rationale: Any nonempty set of changed model names fails this registered test.
  undecided_if:
  - text: Undecided only if retained evidence cannot determine one or more frozen registered-test outcomes.
    support:
    - case_packet.md::L36-L65
    rationale: A registered-test outcome must not be inferred when its decisive retained evidence is missing or non-decisive.
stronger:
  additional_conditions: []

schema_version: case_checklist_v1
case_unit_id: 9aae7da_3
domain: appworld
task_id: 9aae7da_3
native:
  user_goal:
    text: Determine the combined cost of the user's Amazon cart and wishlist, excluding potential tax and delivery fees.
    support:
    - official/specs.json::$.instruction
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_003794f284bc]'
    support:
    - case_packet.md::L21-L25
    - case_packet.md::L38-L65
    - official/ground_truth/evaluation.py::evaluate
    rationale: TestTracker success requires every registered test to pass.
  checked_by:
    text: The official AppWorld TestTracker running evaluate(), with success determined by its two registered test contexts.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - case_packet.md::L21-L27
  decisive_artifacts:
  - artifact: Retained submitted answer and official evaluator comparison result
    question: Does the retained evaluator result show that the registered answer-comparison test passed?
    support:
    - official/ground_truth/evaluation.py::evaluate
  - artifact: Retained start/end database diff and official evaluator no-change result
    question: Does the retained diff show zero changed model names and the evaluator result show that the no-model-changes test passed?
    support:
    - official/ground_truth/evaluation.py::evaluate
  success_if:
  - text: '[appworld_test_001_844d21b309f0] passes exactly when this official requirement is satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[0].requirement
    rationale: The evaluator parses the submitted task answer and compares it numerically using float normalization and a 0.51 tolerance.
  - text: '[appworld_test_002_003794f284bc] passes exactly when this official requirement is satisfied: assert there are no model changes.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[1].requirement
    rationale: The evaluator requires the changed-model-name count to equal zero.
  fail_if:
  - text: '[appworld_test_001_844d21b309f0] fails exactly when this official requirement is not satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[0].requirement
    rationale: A submitted answer outside the evaluator's normalized numeric comparison tolerance fails this registered test.
  - text: '[appworld_test_002_003794f284bc] fails exactly when this official requirement is not satisfied: assert there are no model changes.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[1].requirement
    rationale: Any nonzero changed-model-name count fails this registered test.
  undecided_if:
  - text: Undecided only if retained evidence cannot determine one or more frozen registered-test outcomes.
    support:
    - case_packet.md::L38-L65
    - official/ground_truth/evaluation.py::evaluate
    rationale: A registered-test outcome must not be inferred when its decisive retained evidence is missing or non-decisive.
stronger:
  additional_conditions:
  - id: exact_total
    text: Beyond native scoring, the parsed retained submitted answer must equal 2631.9 exactly rather than merely fall within the evaluator's 0.51 tolerance.
    rationale: The requested total has an official numeric value of 2631.9, while the native evaluator accepts numeric differences up to 0.51; exact equality measures the stated total more strictly.
    decisive_artifacts:
    - artifact: Retained submitted answer
      question: After the evaluator's numeric parsing, is the value exactly 2631.9?
      support:
      - official/ground_truth/answer.json::$
      - official/ground_truth/evaluation.py::evaluate
    support:
    - official/specs.json::$.instruction
    - official/ground_truth/answer.json::$
    - official/ground_truth/evaluation.py::evaluate

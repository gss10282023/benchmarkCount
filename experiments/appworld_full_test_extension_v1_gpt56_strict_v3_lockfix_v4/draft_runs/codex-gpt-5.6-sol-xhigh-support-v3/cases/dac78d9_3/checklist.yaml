schema_version: case_checklist_v1
case_unit_id: dac78d9_3
domain: appworld
task_id: dac78d9_3
native:
  user_goal:
    text: Report how many Venmo friends were made since the start of March 2023.
    support:
    - official/specs.json::$.instruction
    - official/specs.json::$.datetime
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_818d3311397a]'
    support:
    - case_packet.md::L19-L27
    - case_packet.md::L36-L65
    - official/ground_truth/evaluation.py::evaluate
    rationale: TestTracker succeeds only when every registered test passes.
  checked_by:
    text: The frozen AppWorld TestTracker running the case evaluator, with success defined as pass_count equal to num_tests.
    support:
    - case_packet.md::L19-L27
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Retained submitted answer and official evaluator comparison result
    question: Does the retained evaluator result show that the registered answer-comparison test passed?
    support:
    - official/ground_truth/evaluation.py::evaluate
  - artifact: Retained start/end database diff and official evaluator no-model-changes result
    question: Does the diff show that no models changed, and does the retained evaluator result show that the registered no-model-changes test passed?
    support:
    - official/ground_truth/evaluation.py::evaluate
  success_if:
  - text: '[appworld_test_001_844d21b309f0] passes exactly when this official requirement is satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
    rationale: The evaluator parses the submitted task answer and applies its official answer-comparison rule.
  - text: '[appworld_test_002_818d3311397a] passes exactly when this official requirement is satisfied: assert no model changes.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The evaluator requires the changed-model collection to be falsy.
  fail_if:
  - text: '[appworld_test_001_844d21b309f0] fails exactly when this official requirement is not satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
    rationale: A mismatch under the evaluator's answer-comparison rule fails this registered test.
  - text: '[appworld_test_002_818d3311397a] fails exactly when this official requirement is not satisfied: assert no model changes.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Any changed model makes the evaluator's falsy check fail.
  undecided_if:
  - text: Undecided only if retained evidence cannot determine one or more frozen registered-test outcomes.
    support:
    - case_packet.md::L36-L65
    - official/ground_truth/evaluation.py::evaluate
    rationale: A registered-test outcome must not be inferred when its decisive retained evidence is missing or non-decisive.
stronger:

schema_version: case_checklist_v1
case_unit_id: 953b296_2
domain: appworld
task_id: 953b296_2
native:
  user_goal:
    text: Buy any sweater in the user's size on Amazon, deriving the size from a past sweater order and assuring from Q&As/reviews that nobody reported color fading after washing.
    support:
    - official/specs.json::$.instruction
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_15bbd8b2ab15], [appworld_test_003_220625a92985], [appworld_test_004_62d2fa85384c], [appworld_test_005_4e88cc8ed3e9], [appworld_test_006_627d26d0000f], [appworld_test_007_57d07ed530e1], [appworld_test_008_b8c785848138], [appworld_test_009_74c9e9d0aa82]'
    support:
    - case_packet.md::L15-L154
    - official/ground_truth/evaluation.py::evaluate
    rationale: TestTracker success requires every registered test to pass.
  checked_by:
    text: The official TestTracker evaluates the retained submitted answer and start/end application state through nine registered checks in evaluate().
    support:
    - case_packet.md::L15-L34
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Retained submitted answer and official evaluator comparison result
    question: Does the retained evaluator result show that the registered answer-comparison test passed?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
  - artifact: Retained start/end database diff, relevant Amazon end-state records, and official evaluator results
    question: Do these show that every registered model-change, order, product, address, and quantity check passed?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$
    - official/ground_truth/public_data.json::$
  success_if:
  - text: '[appworld_test_001_844d21b309f0] passes exactly when this official requirement is satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
    rationale: The retained submitted answer and official evaluator comparison result determine this test.
  - text: '[appworld_test_002_15bbd8b2ab15] passes exactly when this official requirement is satisfied: assert model changes match amazon.Order, amazon.Product, ignoring amazon.CartEntry, file_system.Directory, amazon.Address.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The retained start/end database diff and evaluator's changed-model-name comparison determine this test.
  - text: '[appworld_test_003_220625a92985] passes exactly when this official requirement is satisfied: assert there is 1 new amazon.Order using models.changed_records.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The retained start/end Amazon diff must show exactly one added order.
  - text: '[appworld_test_004_62d2fa85384c] passes exactly when this official requirement is satisfied: assert this new order has 1 quantity of a single product.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The retained new-order record and linked order item must show one item with ordered quantity one.
  - text: '[appworld_test_005_4e88cc8ed3e9] passes exactly when this official requirement is satisfied: assert the ordered product is of type data.public.apparel_type.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/public_data.json::$.apparel_type
    rationale: The retained ordered-product record must match the official apparel-type value.
  - text: '[appworld_test_006_627d26d0000f] passes exactly when this official requirement is satisfied: assert the ordered product has relative_size data.private.selected_relative_size.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.selected_relative_size
    rationale: The retained ordered-product relative size must match the official selected-relative-size value.
  - text: '[appworld_test_007_57d07ed530e1] passes exactly when this official requirement is satisfied: assert the ordered product is the one with data.private.selected_product_name.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.selected_product_name
    rationale: The retained ordered-product name must match the official selected-product-name value.
  - text: '[appworld_test_008_b8c785848138] passes exactly when this official requirement is satisfied: assert the order''s address text is main_user.home_address.text (normalize_text=True)'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/dbs/supervisor.jsonl::L2
    rationale: The retained order address must equal the user's home address under the evaluator's text normalization.
  - text: '[appworld_test_009_74c9e9d0aa82] passes exactly when this official requirement is satisfied: assert 0 records have been updated or deleted from amazon.Address using models.changed_records.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The retained start/end Amazon diff must show no updated or deleted address records.
  fail_if:
  - text: '[appworld_test_001_844d21b309f0] fails exactly when this official requirement is not satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
    rationale: A failed retained answer-comparison result fails this registered test.
  - text: '[appworld_test_002_15bbd8b2ab15] fails exactly when this official requirement is not satisfied: assert model changes match amazon.Order, amazon.Product, ignoring amazon.CartEntry, file_system.Directory, amazon.Address.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: A mismatch in the evaluator's changed-model-name comparison fails this registered test.
  - text: '[appworld_test_003_220625a92985] fails exactly when this official requirement is not satisfied: assert there is 1 new amazon.Order using models.changed_records.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Any added-order count other than one fails this registered test.
  - text: '[appworld_test_004_62d2fa85384c] fails exactly when this official requirement is not satisfied: assert this new order has 1 quantity of a single product.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: An order with a different item count or ordered quantity fails this registered test.
  - text: '[appworld_test_005_4e88cc8ed3e9] fails exactly when this official requirement is not satisfied: assert the ordered product is of type data.public.apparel_type.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/public_data.json::$.apparel_type
    rationale: A different ordered-product type fails this registered test.
  - text: '[appworld_test_006_627d26d0000f] fails exactly when this official requirement is not satisfied: assert the ordered product has relative_size data.private.selected_relative_size.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.selected_relative_size
    rationale: A different ordered-product relative size fails this registered test.
  - text: '[appworld_test_007_57d07ed530e1] fails exactly when this official requirement is not satisfied: assert the ordered product is the one with data.private.selected_product_name.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.selected_product_name
    rationale: A different ordered-product name fails this registered test.
  - text: '[appworld_test_008_b8c785848138] fails exactly when this official requirement is not satisfied: assert the order''s address text is main_user.home_address.text (normalize_text=True)'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/dbs/supervisor.jsonl::L2
    rationale: A normalized order address different from the user's home address fails this registered test.
  - text: '[appworld_test_009_74c9e9d0aa82] fails exactly when this official requirement is not satisfied: assert 0 records have been updated or deleted from amazon.Address using models.changed_records.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Any updated or deleted Amazon address record fails this registered test.
  undecided_if:
  - text: Undecided only if retained evidence cannot determine one or more frozen registered-test outcomes.
    support:
    - case_packet.md::L15-L34
    - official/ground_truth/evaluation.py::evaluate
    rationale: A registered-test outcome must not be inferred when its decisive retained evidence is missing or non-decisive.
stronger:
  additional_conditions:
  - id: verify_size_derivation
    text: Beyond native scoring, retained run evidence shows that the purchased sweater's size was obtained from one of the user's past sweater orders.
    rationale: The user explicitly required this derivation, but the released evaluator checks only the selected final relative size and does not register evidence of its source as a test.
    decisive_artifacts:
    - artifact: Retained API or environment trace of past-order inspection and the resulting order
      question: Does the trace show that the purchased size was derived from a past sweater order?
      support:
      - official/specs.json::$.instruction
      - official/ground_truth/evaluation.py::evaluate
    support:
    - official/specs.json::$.instruction
    - official/ground_truth/evaluation.py::evaluate
  - id: verify_color_fade_research
    text: Beyond native scoring, retained run evidence shows that Q&As or reviews for the purchased sweater were checked and contained no report of color fading after washing.
    rationale: The user explicitly required this assurance, while the released evaluator checks the selected product but does not register the Q&A/review research as a test.
    decisive_artifacts:
    - artifact: Retained API or environment trace containing the purchased product's Q&A or review lookup results
      question: Do the retained lookup results support that no color-fading-after-washing report was found for the purchased sweater?
      support:
      - official/specs.json::$.instruction
      - official/ground_truth/evaluation.py::evaluate
    support:
    - official/specs.json::$.instruction
    - official/ground_truth/evaluation.py::evaluate

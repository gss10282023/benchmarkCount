stronger:
  additional_conditions:
  - id: todoist_invite_recipients
    text: The Camping Trip Planning project invitations are addressed to all and only the three named trip mates.
    rationale: The user asked to complete the invitation task, while the released evaluator checks the overall changed-model-name set but does not verify the invitation recipients.
    decisive_artifacts:
    - artifact: Retained Todoist project-invitation records and start/end database diff
      question: Do the added invitations target Ashlee, Vickie, and David in the Camping Trip Planning project?
      support:
      - official/dbs/todoist.jsonl::L1
      - official/dbs/todoist.jsonl::L5
      - official/ground_truth/evaluation.py::evaluate
    support:
    - official/dbs/todoist.jsonl::L1
    - official/dbs/todoist.jsonl::L5
    - official/ground_truth/evaluation.py::evaluate
  - id: splitwise_receipt_attachment
    text: The newly created Splitwise expense has the Amazon order receipt attached.
    rationale: The Todoist expense task explicitly requires the receipt attachment, while the released evaluator checks expense values and the changed-model-name set without verifying that attachment linkage.
    decisive_artifacts:
    - artifact: Retained Splitwise expense attachment state and supporting API trace
      question: Does the retained end state or trace show the Amazon order receipt attached to the newly created Splitwise expense?
      support:
      - official/dbs/todoist.jsonl::L24
      - official/ground_truth/evaluation.py::evaluate
    support:
    - official/dbs/todoist.jsonl::L24
    - official/ground_truth/evaluation.py::evaluate

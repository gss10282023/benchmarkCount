stronger:
  additional_conditions:
  - id: preserve_backup_order_in_final_playlists
    text: '[appworld_stronger_gap_001_94ae70dc2766] For every migrated final Spotify playlist, the ordered PlaylistSong song-ID sequence must exactly equal the corresponding source-backup sequence, including multiplicity.'
    rationale: The task asks to migrate playlist data from source backup files into Spotify, while the evaluator compares final playlist song IDs with order ignored.
    decisive_artifacts:
    - artifact: Retained source backup rows and final Spotify Playlist/PlaylistSong records with ordered song-ID mappings
      question: Does every final Spotify playlist exactly preserve its source-backup track order and multiplicity?
      support:
      - official/specs.json::$.instruction
      - official/ground_truth/evaluation.py::evaluate
    support:
    - official/specs.json::$.instruction
    - official/ground_truth/evaluation.py::evaluate

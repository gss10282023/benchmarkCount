native:
  user_goal:
    text: I want to migrate my music library to Spotify. I have exported relevant information from my previous software to a text file which you can find in my file system in "~/backups". Create an account for me on Spotify, and add song library, album library, and playlists according to information in it.
    support:
    - official/specs.json::$.instruction
    rationale: This is the exact frozen official AppWorld instruction.
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_36dc74d23d18], [appworld_test_003_d8ea6863b247], [appworld_test_004_25925f42d4e0], [appworld_test_005_c834b0d49a67], [appworld_test_006_80b0097323f1], [appworld_test_007_ae11510750f8], [appworld_test_008_9bdb5cc530e7], [appworld_test_009_16eaaf8fd471]'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
    rationale: AppWorld TestTracker success is exactly pass_count == num_tests, so every frozen registered test must pass.
  checked_by:
    text: The official AppWorld evaluate function registers scoring outcomes only inside with test(requirement) blocks.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
    rationale: Assignments to other TestTracker attributes are excluded from native and stronger scoring.
  decisive_artifacts:

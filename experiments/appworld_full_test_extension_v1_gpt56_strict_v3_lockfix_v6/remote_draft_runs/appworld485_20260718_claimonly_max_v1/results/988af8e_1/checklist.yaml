stronger:
  additional_conditions:
  - id: exact_trip_amounts_and_order_receipt
    text: '[appworld_stronger_gap_001_698bb93348b0] The retained trip expense total must exactly equal the Amazon order paid amount; every share and payment request must exactly equal its currency-precision equal-share formula; and the added expense must contain the exact accessible receipt for that Amazon order.'
    rationale: The Todo workflow requires attaching the order receipt, while the evaluator omits receipt fields and permits a 0.51 tolerance for the expense, shares, and requests.
    decisive_artifacts:
    - artifact: Retained Todo instruction, Amazon order and receipt, final Splitwise Expense receipt fields and shares, payment requests, and exact decimal/receipt comparison result
      question: Do the expense, shares, and requests equal their exact order-derived values, and does the expense expose the exact order receipt?
      support:
      - official/specs.json::$.instruction
      - official/dbs/todoist.jsonl::L18
      - official/ground_truth/evaluation.py::evaluate
    support:
    - official/specs.json::$.instruction
    - official/dbs/todoist.jsonl::L18
    - official/ground_truth/evaluation.py::evaluate

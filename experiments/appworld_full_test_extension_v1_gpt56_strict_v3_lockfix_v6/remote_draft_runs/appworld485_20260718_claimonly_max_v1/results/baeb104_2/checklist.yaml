native:
  user_goal:
    text: I went on a vacation trip to sydney with my siblings. Share all of its photographs with them over email. You should send one email with everyone as recipients. Photographs can be found in my file system, and they should be attached as a tar file.
    support:
    - official/specs.json::$.instruction
    rationale: This is the exact frozen official AppWorld instruction.

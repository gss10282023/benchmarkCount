    rationale: The retained official evidence determines this registered-test pass outcome.
  - text: '[appworld_test_005_d9d39d475e4b] passes exactly when this official requirement is satisfied: if public_data.address_name is "Home", assert the new order''s address text is main_user.home_address.text (normalize_text=True) otherwise, assert the new order''s address text is main_user.work_address.text (normalize_text=True)'
    support:

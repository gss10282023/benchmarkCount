    - official/ground_truth/test_data.json::$[2].requirement
    rationale: The retained official evidence determines this registered-test pass outcome.
  - text: '[appworld_test_004_3bbb4ecfa9fb] passes exactly when this official requirement is satisfied: assert this new order has all products with 1 quantity each.'
    support:

native:
  user_goal:
    text: I am going to Japan this weekend, and my check-in bag sums to 21kg so far. Place an amazon order for any 4 identical backpacks. Make sure the total weight does not exceed the allowed weight for my check-in bag according to my flight confirmation. These are gifts, so get them gift wrapped if there is an option, and send them to my home address.
    support:
    - official/specs.json::$.instruction
    rationale: This is the exact frozen official AppWorld instruction.
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_035130a4efb8], [appworld_test_003_236f7c307cf7], [appworld_test_004_38af0ed6d357], [appworld_test_005_0aa2d081f269], [appworld_test_006_69713228cf29], [appworld_test_007_46a2bad49e3a], [appworld_test_008_809ed8107711], [appworld_test_009_74c9e9d0aa82]'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
    rationale: AppWorld TestTracker success is exactly pass_count == num_tests, so every frozen registered test must pass.
  checked_by:
    text: The official AppWorld evaluate function registers scoring outcomes only inside with test(requirement) blocks.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
    rationale: Assignments to other TestTracker attributes are excluded from native and stronger scoring.
  decisive_artifacts:
  - artifact: Retained submitted answer, start/end database diff, API log, environment trace, and official TestTracker results
    question: Do the retained artifacts and TestTracker results establish the outcome of every frozen registered test?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$

    text: Respond to all the emails I have received within the last 5 days (including today) that I have not replied to yet. The reply should be "I am out of town currently. I will return on 2023-05-22. I will get back to you ASAP after that.". If there are multiple people involved in a email thread, make sure to add all to the reply email. Please also mark the threads you reply to as unread and starred, so I know where to start when I get back.

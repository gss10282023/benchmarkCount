native:
  user_goal:
    text: Buy the highest rated popcorn maker available on Amazon now, one for each of my following friends, Grant , Jose , Brenda , Nicholas. They have to be gift wrapped and delivered to their respective home addresses. If the total delivery fee is higher than the monthly prime subscription cost, subscribe me to prime first.
    support:
    - official/specs.json::$.instruction
    rationale: This is the exact frozen official AppWorld instruction.
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_1404984b4589], [appworld_test_003_ba67bc86c57e], [appworld_test_004_99e022281004], [appworld_test_005_83c9217374fc], [appworld_test_006_bd9ce4bf5120], [appworld_test_007_6fa1064a4f40], [appworld_test_008_177742aafbfc], [appworld_test_009_006775b7c7fb], [appworld_test_010_585d3c27daff]'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
    rationale: AppWorld TestTracker success is exactly pass_count == num_tests, so every frozen registered test must pass.
  checked_by:
    text: The official AppWorld evaluate function registers scoring outcomes only inside with test(requirement) blocks.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
    rationale: Assignments to other TestTracker attributes are excluded from native and stronger scoring.
  decisive_artifacts:
  - artifact: Retained submitted answer, start/end database diff, API log, environment trace, and official TestTracker results
    question: Do the retained artifacts and TestTracker results establish the outcome of every frozen registered test?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$

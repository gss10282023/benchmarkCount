schema_version: case_checklist_v1
case_unit_id: 634f342_2
domain: appworld
task_id: 634f342_2
native:
  user_goal:
    text: Go through all my Spotify playlists and remove all the songs from them that are in "~/documents/personal/songs_to_archive.txt" from my file system and put them in a new playlist named "Old Songs".
    support:
    - official/specs.json::$.instruction
    rationale: This is the exact frozen official AppWorld instruction.
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_c3ee58368b74], [appworld_test_003_ee322426deed], [appworld_test_004_1dedae3345ec], [appworld_test_005_03d9d938eb52], [appworld_test_006_6baa489bf8fd], [appworld_test_007_3663411cf85b]'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
    rationale: AppWorld TestTracker success is exactly pass_count == num_tests, so every frozen registered test must pass.
  checked_by:
    text: The official AppWorld evaluate function registers scoring outcomes only inside with test(requirement) blocks.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
    rationale: Assignments to other TestTracker attributes are excluded from native and stronger scoring.
  decisive_artifacts:
  - artifact: Retained submitted answer, start/end database diff, API log, environment trace, and official TestTracker results
    question: Do the retained artifacts and TestTracker results establish the outcome of every frozen registered test?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
  success_if:
  - text: '[appworld_test_001_844d21b309f0] passes exactly when this official requirement is satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[0].requirement
    rationale: The retained official evidence determines this registered-test pass outcome.
  - text: '[appworld_test_002_c3ee58368b74] passes exactly when this official requirement is satisfied: assert model changes match spotify.Playlist, spotify.PlaylistSong.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[1].requirement
    rationale: The retained official evidence determines this registered-test pass outcome.
  - text: '[appworld_test_003_ee322426deed] passes exactly when this official requirement is satisfied: obtain added, updated, deleted spotify.Playlist records using models.changed_records, and assert 1 has been added, 0 have been updated or deleted.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[2].requirement
    rationale: The retained official evidence determines this registered-test pass outcome.
  - text: '[appworld_test_004_1dedae3345ec] passes exactly when this official requirement is satisfied: assert the added playlist''s title is public_data.playlist_title.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[3].requirement
    rationale: The retained official evidence determines this registered-test pass outcome.
  - text: '[appworld_test_005_03d9d938eb52] passes exactly when this official requirement is satisfied: obtain added, deleted spotify.PlaylistSong records using models.changed_records, and assert set of added song ids match to set of private_data.to_archive_song_ids.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[4].requirement
    rationale: The retained official evidence determines this registered-test pass outcome.
  - text: '[appworld_test_006_6baa489bf8fd] passes exactly when this official requirement is satisfied: assert set of deleted song ids also match to set of private_data.to_archive_song_ids.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[5].requirement
    rationale: The retained official evidence determines this registered-test pass outcome.
  - text: '[appworld_test_007_3663411cf85b] passes exactly when this official requirement is satisfied: assert playlist_id_to_song_ids of deleted_playlist_songs match private_data.to_archive_playlist_id_to_song_ids (ignore_order)'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[6].requirement
    rationale: The retained official evidence determines this registered-test pass outcome.
  fail_if:
  - text: '[appworld_test_001_844d21b309f0] fails exactly when this official requirement is not satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[0].requirement
    rationale: The retained official evidence determines this registered-test fail outcome.
  - text: '[appworld_test_002_c3ee58368b74] fails exactly when this official requirement is not satisfied: assert model changes match spotify.Playlist, spotify.PlaylistSong.'
    support:
    - official/ground_truth/evaluation.py::evaluate

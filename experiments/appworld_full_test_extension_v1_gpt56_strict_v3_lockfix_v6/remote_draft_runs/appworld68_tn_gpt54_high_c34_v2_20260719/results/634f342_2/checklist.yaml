    rationale: The retained official evidence determines this registered-test fail outcome.
  - text: '[appworld_test_004_1dedae3345ec] fails exactly when this official requirement is not satisfied: assert the added playlist''s title is public_data.playlist_title.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[3].requirement
    rationale: The retained official evidence determines this registered-test fail outcome.
  - text: '[appworld_test_005_03d9d938eb52] fails exactly when this official requirement is not satisfied: obtain added, deleted spotify.PlaylistSong records using models.changed_records, and assert set of added song ids match to set of private_data.to_archive_song_ids.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[4].requirement
    rationale: The retained official evidence determines this registered-test fail outcome.
  - text: '[appworld_test_006_6baa489bf8fd] fails exactly when this official requirement is not satisfied: assert set of deleted song ids also match to set of private_data.to_archive_song_ids.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[5].requirement
    rationale: The retained official evidence determines this registered-test fail outcome.
  - text: '[appworld_test_007_3663411cf85b] fails exactly when this official requirement is not satisfied: assert playlist_id_to_song_ids of deleted_playlist_songs match private_data.to_archive_playlist_id_to_song_ids (ignore_order)'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[6].requirement
    rationale: The retained official evidence determines this registered-test fail outcome.
  undecided_if:
  - text: Undecided only if retained evidence cannot determine one or more frozen registered-test outcomes.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
    rationale: A registered-test outcome must not be inferred when its decisive retained evidence is missing or non-decisive.
stronger:
  additional_conditions:
  - id: bind_archived_songs_to_new_playlist
    text: '[appworld_stronger_gap_001_0c42c3f558b6] Every added PlaylistSong must belong to the single newly added "Old Songs" playlist.'
    rationale: The task binds archived songs to the new playlist, while the evaluator checks the added song IDs without asserting their playlist_id values.
    decisive_artifacts:
    - artifact: Retained added Playlist and PlaylistSong database diff
      question: Does every added PlaylistSong reference the single newly added Old Songs playlist?
      support:
      - official/specs.json::$.instruction
      - official/ground_truth/evaluation.py::evaluate
    support:
    - official/specs.json::$.instruction
    - official/ground_truth/evaluation.py::evaluate

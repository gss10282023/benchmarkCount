native:
  user_goal:
    text: I bought a few Gildan Women's Softstyle Cotton T-Shirts on amazon this week. But only the one in large size fits me well. Initiate a return for the rest. Prefer FedEx as a deliverer, if available.
    support:
    - official/specs.json::$.instruction
    rationale: This is the exact frozen official AppWorld instruction.
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_c8b328fa57cb], [appworld_test_003_d8f7b009e1a0], [appworld_test_004_4547a7306c76], [appworld_test_005_94d1fe753e30], [appworld_test_006_03f91da3a0a8]'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
    rationale: AppWorld TestTracker success is exactly pass_count == num_tests, so every frozen registered test must pass.
  checked_by:
    text: The official AppWorld evaluate function registers scoring outcomes only inside with test(requirement) blocks.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
    rationale: Assignments to other TestTracker attributes are excluded from native and stronger scoring.
  decisive_artifacts:
  - artifact: Retained submitted answer, start/end database diff, API log, environment trace, and official TestTracker results
    question: Do the retained artifacts and TestTracker results establish the outcome of every frozen registered test?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
  success_if:

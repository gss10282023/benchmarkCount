    - official/ground_truth/test_data.json::$[0].requirement
    rationale: The retained official evidence determines this registered-test pass outcome.
  - text: '[appworld_test_002_c8b328fa57cb] passes exactly when this official requirement is satisfied: assert model changes match file_system.Directory, gmail.GlobalEmailThread, gmail.UserEmailThread, amazon.OrderItem, gmail.Attachment, gmail.Email, amazon.ProductReturn, file_system.File.'

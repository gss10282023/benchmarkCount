    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[1].requirement
    rationale: The retained official evidence determines this registered-test pass outcome.
  - text: '[appworld_test_003_d8f7b009e1a0] passes exactly when this official requirement is satisfied: obtain added amazon.ProductReturn using models.changed_records and assert number of added product returns is 2.'

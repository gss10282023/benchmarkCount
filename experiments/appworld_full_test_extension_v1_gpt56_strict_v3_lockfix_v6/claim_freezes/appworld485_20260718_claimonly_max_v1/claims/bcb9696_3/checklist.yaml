native:
  user_goal:
    text: My manager has asked me for my headshot picture over email, to which I have drafted a response. But I have mistakenly attached my resume instead. Please fix it and send the email. The headshot is in my file system.
    support:
    - official/specs.json::$.instruction
    rationale: This is the exact frozen official AppWorld instruction.
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_b4fb64328a61], [appworld_test_003_e31066cf6be2], [appworld_test_004_72b44c61b41f], [appworld_test_005_ce4aee11a349], [appworld_test_006_9cf2d0301c20], [appworld_test_007_ff137bc08b03], [appworld_test_008_c111f41100a2], [appworld_test_009_50f8b4b5bf4b], [appworld_test_010_2be2f1b1c2ac], [appworld_test_011_ea4ab823f25f]'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
    rationale: AppWorld TestTracker success is exactly pass_count == num_tests, so every frozen registered test must pass.
  checked_by:
    text: The official AppWorld evaluate function registers scoring outcomes only inside with test(requirement) blocks.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
    rationale: Assignments to other TestTracker attributes are excluded from native and stronger scoring.

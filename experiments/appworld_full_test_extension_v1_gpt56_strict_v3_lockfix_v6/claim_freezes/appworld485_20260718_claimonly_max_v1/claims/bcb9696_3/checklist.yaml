stronger:
  additional_conditions:
  - id: preserve_draft_fields_and_threading
    text: '[appworld_stronger_gap_001_fbfbe236305f] Each sent email must map one-to-one to its source draft, preserve the draft''s recipients, subject, body, response and thread linkage, and replace only the incorrect resume or CV attachment with the required headshot.'
    rationale: The task asks to correct and send existing drafts, but the evaluator does not establish preservation of their message fields or thread/reply linkage.
    decisive_artifacts:
    - artifact: Retained start-state drafts and added emails with field-by-field and attachment comparison
      question: Does each sent email preserve every draft field except the explicitly replaced attachment?
      support:
      - official/specs.json::$.instruction
      - official/ground_truth/evaluation.py::evaluate
    support:
    - official/specs.json::$.instruction
    - official/ground_truth/evaluation.py::evaluate

schema_version: case_checklist_v1
case_unit_id: c1091c7_3
domain: appworld
task_id: c1091c7_3
native:
  user_goal:
    text: I have alarms for all my work meetings. Some of my coworkers have canceled their meeting with me via email. Please disable the corresponding alarms from my phone.
    support:
    - official/specs.json::$.instruction
    rationale: This is the exact frozen official AppWorld instruction.
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_5a61ba267558], [appworld_test_003_dc7203451d4f], [appworld_test_004_acbc904c8a01]'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
    rationale: AppWorld TestTracker success is exactly pass_count == num_tests, so every frozen registered test must pass.
  checked_by:
    text: The official AppWorld evaluate function registers scoring outcomes only inside with test(requirement) blocks.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
    rationale: Assignments to other TestTracker attributes are excluded from native and stronger scoring.
  decisive_artifacts:
  - artifact: Retained submitted answer, start/end database diff, API log, environment trace, and official TestTracker results
    question: Do the retained artifacts and TestTracker results establish the outcome of every frozen registered test?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
  success_if:
  - text: '[appworld_test_001_844d21b309f0] passes exactly when this official requirement is satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[0].requirement
    rationale: The retained official evidence determines this registered-test pass outcome.
  - text: '[appworld_test_002_5a61ba267558] passes exactly when this official requirement is satisfied: assert model changes match phone.Alarm.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[1].requirement
    rationale: The retained official evidence determines this registered-test pass outcome.
  - text: '[appworld_test_003_dc7203451d4f] passes exactly when this official requirement is satisfied: assert set of updated alarm ids match exactly to private_data.to_disable_alarm_ids (ignore order).'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[2].requirement
    rationale: The retained official evidence determines this registered-test pass outcome.
  - text: '[appworld_test_004_acbc904c8a01] passes exactly when this official requirement is satisfied: obtain updated, removed phone.Alarm records using models.changed_records, and assert 0 alarms were added or removed.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[3].requirement
    rationale: The retained official evidence determines this registered-test pass outcome.
  fail_if:
  - text: '[appworld_test_001_844d21b309f0] fails exactly when this official requirement is not satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[0].requirement
    rationale: The retained official evidence determines this registered-test fail outcome.
  - text: '[appworld_test_002_5a61ba267558] fails exactly when this official requirement is not satisfied: assert model changes match phone.Alarm.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[1].requirement
    rationale: The retained official evidence determines this registered-test fail outcome.
  - text: '[appworld_test_003_dc7203451d4f] fails exactly when this official requirement is not satisfied: assert set of updated alarm ids match exactly to private_data.to_disable_alarm_ids (ignore order).'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[2].requirement
    rationale: The retained official evidence determines this registered-test fail outcome.
  - text: '[appworld_test_004_acbc904c8a01] fails exactly when this official requirement is not satisfied: obtain updated, removed phone.Alarm records using models.changed_records, and assert 0 alarms were added or removed.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$[3].requirement
    rationale: The retained official evidence determines this registered-test fail outcome.
  undecided_if:
  - text: Undecided only if retained evidence cannot determine one or more frozen registered-test outcomes.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
    rationale: A registered-test outcome must not be inferred when its decisive retained evidence is missing or non-decisive.
stronger:
  additional_conditions:
  - id: disable_only_target_alarms
    text: '[appworld_stronger_gap_001_21508f8d05f0] Every targeted alarm must end with enabled equal to false, and no field other than enabled and the system-maintained update timestamp may change.'
    rationale: The task requires disabling alarms, while the evaluator checks only the set of updated alarm IDs and not the resulting enabled value or changed fields.
    decisive_artifacts:
    - artifact: Retained before/after records and changed-field list for each targeted alarm
      question: Are all targets disabled with no unauthorized field change?
      support:
      - official/specs.json::$.instruction
      - official/ground_truth/evaluation.py::evaluate
    support:
    - official/specs.json::$.instruction
    - official/ground_truth/evaluation.py::evaluate

plan_metadata:
  plan_id: audit_sampling_plan_from_paper
  plan_version: 0.1.0
  source_sections:
    - sec:audit
    - sec:interval-meaning
  source_table_label: tab:audit-rerun
  status: paper_mapping_draft

blinded_human_audit:
  priority: P1
  total_records: 100
  records_per_domain: 25
  domains:
    - AgentDojo
    - AppWorld
    - WebArena-Verified
    - tau3-bench retail
  sampling_design: stratified stress sample, not simple random sample
  strata:
    - counted records
    - records labeled UNRESOLVE
    - records where native reporting and evidence reporting disagree whenever all three buckets exist
  sample_seed: 需要从 locked manifest 确认
  auditor_count: 2
  auditor_inputs_visible:
    - task
    - trace
    - available evidence
    - locked evidence contract
  auditor_inputs_hidden:
    - agent identity
    - native benchmark label
    - counting decision
    - UNRESOLVE-reason tag
    - alternate view verdicts
  required_outputs:
    - item-level auditor labels
    - stratum counts for every domain
    - audit disagreement set
    - auditor-vs-scorer agreement on counted-SUCCESS / counted-FAIL / UNRESOLVE
    - inter-rater Cohen kappa on counted / UNRESOLVE
    - inter-rater Cohen kappa on R1-R7 only over items both auditors mark UNRESOLVE
  interpretation_limits:
    - Agreement and kappa values are descriptive for the stratified stress sample.
    - They must not be described as unweighted population-level agreement unless design weights are used.
    - Taxonomy kappa may be computed on fewer than 25 items per domain because both auditors must mark UNRESOLVE.

rerun_subset:
  priority: P1
  source_section: sec:audit
  total_case_units: 40
  case_units_per_domain: 10
  agent: Agent A
  total_rerun_episodes: 50
  domain_episode_notes:
    AgentDojo: 20 paired-arm episodes
    AppWorld: 10 episodes
    WebArena-Verified: 10 episodes
    tau3-bench retail: 10 episodes
  subset_seed: 需要从 locked manifest 确认
  required_outputs:
    - agreement with original counting decision
    - agreement in envelope category: counted success, counted fail, UNRESOLVE reason
    - exact Clopper-Pearson 95% binomial intervals
    - absolute change in lower endpoint
    - absolute change in upper endpoint
    - absolute change in width
  interpretation_limits:
    - This is a stability check for evidence labels.
    - This is not an agent-performance confidence interval under repeated executions.

case_cluster_bootstrap_for_audit_related_tables:
  priority: P1
  cluster_unit: case_unit
  resampling_rule: resample case units with replacement within domain and keep all agent records attached to each case unit
  seed: 需要从 locked manifest 确认
  resample_count: 需要从 locked manifest 确认
  used_for:
    - tab:main-results-B
    - tab:prediction-outcomes
    - tab:pairwise-margins
    - tab:per-agent
  not_used_for:
    - repeated-execution randomness
    - API drift
    - environment volatility
    - formal significance testing of pairwise asterisks


schema_version: case_checklist_v1
case_unit_id: 476b213_1
domain: appworld
task_id: 476b213_1
native:
  user_goal:
    text: Identify the card name used for the user's latest Amazon Prime membership payment.
    support:
    - official/specs.json::instruction
  benchmark_success:
    text: The first supervisor task is marked successful, its JSON-decoded answer (or raw fallback) passes the evaluator's comparison with "Wells Fargo", and the initial/end model comparison reports no changed models.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line 1
  checked_by:
    text: The released AppWorld evaluation function checks task status, the first supervisor task's answer, and changed model names.
    support:
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Retained end-state supervisor Task record
    question: Does the first task have status "success" and an answer that passes the evaluator's comparison with "Wells Fargo" after its JSON-decode/raw-fallback rule?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line 1
  - artifact: Retained initial/end model-state comparison
    question: Does changed_model_names() return an empty or otherwise falsy result?
    support:
    - official/ground_truth/evaluation.py::evaluate
  success_if:
  - text: The first supervisor task has status "success"; its parsed or raw answer passes the evaluator's comparison with "Wells Fargo"; and changed_model_names() is falsy.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line 1
  fail_if:
  - text: The end state conclusively has no first supervisor task, its status is not "success", its parsed or raw answer fails the evaluator's comparison with "Wells Fargo", or changed_model_names() is truthy.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line 1
  undecided_if:
  - text: The retained evidence omits the end-state first task record or the initial/end model comparison needed to apply every native check.
    rationale: Missing retained evidence does not establish either a passing or failing evaluator result.
stronger:
  additional_conditions: []

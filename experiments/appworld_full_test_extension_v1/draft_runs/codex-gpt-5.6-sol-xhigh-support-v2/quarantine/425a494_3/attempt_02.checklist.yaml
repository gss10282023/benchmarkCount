schema_version: case_checklist_v1
case_unit_id: 425a494_3
domain: appworld
task_id: 425a494_3
native:
  user_goal:
    text: Identify which genre Jose has liked most among songs in his Spotify playlists.
    support:
    - official/specs.json::instruction
  benchmark_success:
    text: 'Both evaluator checks pass: the first active supervisor task''s parsed answer matches "reggae", and the initial-to-final model comparison reports no changed model names.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line_span
  checked_by:
    text: The released AppWorld evaluator parses the first active task's answer, compares it with "reggae" using test.answer, and checks that changed_model_names() is empty.
    support:
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Post-run supervisor task record
    question: Does the first active task's answer parse as JSON, with raw-text fallback on JSON parse failure, and match "reggae"?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line_span
  - artifact: Retained initial-to-final model diff or changed-model-names result
    question: Does the evaluator-visible comparison report no changed model names?
    support:
    - official/ground_truth/evaluation.py::evaluate
  success_if:
  - text: 'Both checks pass: the parsed or fallback answer matches "reggae", and the changed-model-names result is empty.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line_span
  fail_if:
  - text: 'Either check fails: the parsed or fallback answer does not match "reggae", or the changed-model-names result is nonempty.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line_span
  undecided_if:
  - text: The retained task-answer evidence or initial-to-final model-diff evidence is absent or incomplete, so one or both checks cannot be determined.
    rationale: Missing decisive evidence establishes neither passage nor failure of the evaluator checks.
stronger:

schema_version: case_checklist_v1
case_unit_id: dac78d9_3
domain: appworld
task_id: dac78d9_3
native:
  user_goal:
    text: Answer how many Venmo friends the user has made since the start of March 2023.
    support:
    - official/specs.json::instruction
    - official/specs.json::datetime
  benchmark_success:
    text: 'Both released checks pass: the first supervisor task answer passes the evaluator comparison against 5, and the start/end model comparison reports no changed model names.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::1
    - official/ground_truth/test_data.json::1-10
  checked_by:
    text: The released AppWorld evaluate function using TestTracker answer and model-change checks.
    support:
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Retained end-state supervisor task record
    question: Does the first task answer, parsed as JSON when valid and otherwise used verbatim, pass the evaluator comparison against 5?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::1
  - artifact: Retained start/end model diff
    question: Does changed_model_names() return an empty result?
    support:
    - official/ground_truth/evaluation.py::evaluate
  success_if:
  - text: The first supervisor task answer passes the evaluator comparison against 5.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::1
  - text: The start/end model diff contains no changed model names.
    support:
    - official/ground_truth/evaluation.py::evaluate
  fail_if:
  - text: The first supervisor task answer fails the evaluator comparison against 5.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::1
  - text: The start/end model diff contains any changed model name.
    support:
    - official/ground_truth/evaluation.py::evaluate
  undecided_if:
  - text: The retained evidence does not establish the evaluator-visible task answer or the start/end model diff.
    rationale: Both artifacts are required to decide the two released checks.
stronger:

schema_version: case_checklist_v1
case_unit_id: 2e9b91e_2
domain: appworld
task_id: 2e9b91e_2
native:
  user_goal:
    text: Request Troy, the user's roommate, for the Amazon cart's item total on Venmo, excluding tax and delivery fees.
    support:
    - official/specs.json::instruction
  benchmark_success:
    text: The first supervisor task is marked successful and its evaluator-parsed answer equals null; the complete model diff contains exactly venmo.Notification and venmo.PaymentRequest changes; and PaymentRequest has exactly one addition, no updates or removals, with receiver_id 11 and amount 649.6 under tolerance 1.01.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line_span
    - official/ground_truth/private_data.json::relative_venmo_user_id
    - official/ground_truth/private_data.json::cart_cost
  checked_by:
    text: The released AppWorld evaluator checks the final supervisor task and the start/end model collection diff.
    support:
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Final supervisor task record
    question: Does the first task have status success, and does its answer parse under the evaluator's rule to null?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line_span
  - artifact: Complete start/end model diff, including the added PaymentRequest record
    question: Are the changed model names exactly venmo.Notification and venmo.PaymentRequest, with one PaymentRequest added, none updated or removed, receiver_id 11, and amount 649.6 within tolerance 1.01?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::relative_venmo_user_id
    - official/ground_truth/private_data.json::cart_cost
  success_if:
  - text: The first supervisor task exists, has status success, and its evaluator-parsed answer equals null.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line_span
  - text: The complete model diff reports exactly venmo.Notification and venmo.PaymentRequest as changed model names.
    support:
    - official/ground_truth/evaluation.py::evaluate
  - text: PaymentRequest has exactly one addition and no updates or removals; the added record has receiver_id 11 and amount 649.6 within tolerance 1.01.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::relative_venmo_user_id
    - official/ground_truth/private_data.json::cart_cost
  fail_if:
  - text: The first supervisor task is absent, is not marked success, or its evaluator-parsed answer does not equal null.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line_span
  - text: The changed model names are not exactly venmo.Notification and venmo.PaymentRequest.
    support:
    - official/ground_truth/evaluation.py::evaluate
  - text: PaymentRequest does not have exactly one addition and zero updates and removals.
    support:
    - official/ground_truth/evaluation.py::evaluate
  - text: The added PaymentRequest has receiver_id other than 11 or its amount does not equal 649.6 under tolerance 1.01.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::relative_venmo_user_id
    - official/ground_truth/private_data.json::cart_cost
  undecided_if:
  - text: Retained evidence omits the final supervisor task record or a complete start/end model diff, leaving at least one native check unassessable.
    support:
    - official/ground_truth/evaluation.py::evaluate
stronger:
  additional_conditions:
  - id: exact_cart_total
    text: Require the added PaymentRequest amount to equal 649.60 exactly at currency precision, rather than merely passing the evaluator's tolerance of 1.01.
    rationale: The task asks for the full cart cost excluding tax and delivery, while the native evaluator accepts a materially different amount within its stated tolerance.
    decisive_artifacts:
    - artifact: Added PaymentRequest record in the complete start/end model diff
      question: Does the stored amount equal 649.60 exactly at currency precision?
      support:
      - official/ground_truth/private_data.json::cart_cost
      - official/ground_truth/evaluation.py::evaluate
    support:
    - official/specs.json::instruction
    - official/ground_truth/private_data.json::cart_cost
    - official/ground_truth/evaluation.py::evaluate

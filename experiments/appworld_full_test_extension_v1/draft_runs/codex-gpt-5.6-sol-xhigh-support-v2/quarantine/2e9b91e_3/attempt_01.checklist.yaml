native:
  user_goal:
    text: Request Adam on Venmo for the cost of everything in the Amazon cart, excluding tax and delivery fees.
    support:
    - official/specs.json::instruction
  benchmark_success:
    text: The first supervisor task has status "success" and an answer matching null; the changed-model set is exactly {venmo.Notification, venmo.PaymentRequest}; exactly one PaymentRequest is added with none updated or removed; its receiver_id is 40 and its amount matches 938.0 within tolerance 1.01.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line_span
    - official/ground_truth/private_data.json::relative_venmo_user_id
    - official/ground_truth/private_data.json::cart_cost
  checked_by:
    text: The released AppWorld evaluator checks the first supervisor task record and the before/after model collection through TestTracker assertions.
    support:
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Retained final supervisor Task record
    question: Does the first task have status "success" and an answer that decodes to null?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line_span
  - artifact: Retained before/after model-change diff
    question: Is the changed-model set exactly venmo.Notification and venmo.PaymentRequest, with one added and no updated or removed PaymentRequest whose receiver_id is 40 and amount matches 938.0 within tolerance 1.01?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::relative_venmo_user_id
    - official/ground_truth/private_data.json::cart_cost
  success_if:
  - text: The retained first supervisor task record has status "success" and its answer decodes to null.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line_span
  - text: The retained diff shows exactly venmo.Notification and venmo.PaymentRequest changed, with exactly one PaymentRequest added, none updated or removed, receiver_id 40, and amount equal to 938.0 within tolerance 1.01.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::relative_venmo_user_id
    - official/ground_truth/private_data.json::cart_cost
  fail_if:
  - text: The retained first supervisor task has status other than "success" or its answer does not match null.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line_span
  - text: The retained diff has any changed model outside or missing from {venmo.Notification, venmo.PaymentRequest}, or the PaymentRequest count, receiver_id, or amount fails the evaluator comparison.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::relative_venmo_user_id
    - official/ground_truth/private_data.json::cart_cost
  undecided_if:
  - text: The retained evidence omits the first supervisor task record, the complete changed-model set, or the PaymentRequest record diff needed for these comparisons.
    rationale: Without these retained fields, the released evaluator's conjunction cannot be reconstructed.

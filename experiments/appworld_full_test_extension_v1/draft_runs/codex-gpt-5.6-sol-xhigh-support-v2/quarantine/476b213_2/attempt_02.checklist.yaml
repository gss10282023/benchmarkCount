schema_version: case_checklist_v1
case_unit_id: 476b213_2
domain: appworld
task_id: 476b213_2
native:
  user_goal:
    text: Identify the card name used for the user's most recent Spotify Premium membership payment.
    support:
    - official/specs.json::instruction
    - official/ground_truth/public_data.json::app_name
    - official/ground_truth/public_data.json::subscription_name
  benchmark_success:
    text: 'Both released checks pass: the parsed answer matches "Discover", and the initial-to-final model comparison reports no changed models.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
    - official/ground_truth/test_data.json::$
  checked_by:
    text: The official evaluator JSON-decodes the first active task's answer, with a raw-string fallback, compares it to "Discover" via test.answer, and checks that models.changed_model_names() is falsy.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
  decisive_artifacts:
  - artifact: Retained final supervisor Task record
    question: Does the evaluator-parsed answer from the first active task match "Discover"?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
  - artifact: Retained initial-to-final model change report
    question: Is models.changed_model_names() empty or otherwise falsy?
    support:
    - official/ground_truth/evaluation.py::evaluate
  success_if:
  - text: The first active task's answer, after the evaluator's JSON parsing or raw-string fallback, matches "Discover" under test.answer.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
  - text: The initial-to-final model comparison reports no changed model names.
    support:
    - official/ground_truth/evaluation.py::evaluate
  fail_if:
  - text: The evaluator-parsed answer does not match "Discover" under test.answer.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
  - text: The initial-to-final model comparison reports any changed model name.
    support:
    - official/ground_truth/evaluation.py::evaluate
  undecided_if:
  - text: The retained evidence omits either the final task-answer record or the initial-to-final model change result, preventing evaluation of both released checks.
    support:
    - official/ground_truth/evaluation.py::evaluate
stronger:
  additional_conditions: []

schema_version: case_checklist_v1
case_unit_id: 476b213_2
domain: appworld
task_id: 476b213_2
native:
  user_goal:
    text: Identify the card name used for the user's last Spotify Premium membership payment.
    support:
    - official/specs.json::instruction
  benchmark_success:
    text: The final supervisor task is marked successful, its evaluator-parsed answer matches "Discover" under test.answer, and models.changed_model_names() is falsy.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::entire_file
  checked_by:
    text: The released AppWorld evaluate function checks task status, compares the JSON-decoded or raw answer, and asserts that no model names changed.
    support:
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Retained final supervisor Task state
    question: Does the first Task row exist, have status "success", and contain an answer that the evaluator parses as "Discover"?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::entire_file
  - artifact: Retained start/end model-diff result
    question: Is models.changed_model_names() falsy?
    support:
    - official/ground_truth/evaluation.py::evaluate
  success_if:
  - text: The first final supervisor Task row exists and has status "success".
    support:
    - official/ground_truth/evaluation.py::evaluate
  - text: Its JSON-decoded answer, or raw answer if JSON decoding fails, matches "Discover" under test.answer.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::entire_file
  - text: The retained model-diff evidence shows models.changed_model_names() is falsy.
    support:
    - official/ground_truth/evaluation.py::evaluate
  fail_if:
  - text: A complete final supervisor state has no Task row, or the first Task row is not marked "success".
    support:
    - official/ground_truth/evaluation.py::evaluate
  - text: The evaluator-parsed answer does not match "Discover" under test.answer.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::entire_file
  - text: models.changed_model_names() is truthy.
    support:
    - official/ground_truth/evaluation.py::evaluate
  undecided_if:
  - text: The retained evidence omits either the final supervisor Task state or the start/end model-diff result, so at least one native condition cannot be reconstructed.
    rationale: Missing retained evidence is not proof that the corresponding evaluator condition passed or failed.
stronger:
  additional_conditions: []

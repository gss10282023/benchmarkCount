schema_version: case_checklist_v1
case_unit_id: 9aae7da_1
domain: appworld
task_id: 9aae7da_1
native:
  user_goal:
    text: Report the combined cost of the user's Amazon cart and wishlist, excluding tax and delivery fees.
    support:
    - official/specs.json::instruction
  benchmark_success:
    text: The first active task is marked successful, its answer matches 21257.8 after the evaluator's JSON-parse/fallback and float normalization with tolerance 0.51, and the start/end model comparison reports zero changed models.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line 1
  checked_by:
    text: The released evaluate function reads the first active supervisor task, records its completion status, compares its parsed answer numerically, and checks changed_model_names().
    support:
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Complete end-state supervisor Task snapshot
    question: Does the first active task have status "success" and an answer that parses, or falls back, to a float within 0.51 of 21257.8?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line 1
  - artifact: Retained start/end model-state comparison or changed-model report
    question: Does the comparison report zero changed model names?
    support:
    - official/ground_truth/evaluation.py::evaluate
  success_if:
  - text: The first active task's status is "success".
    support:
    - official/ground_truth/evaluation.py::evaluate
  - text: Its answer matches 21257.8 under the evaluator's JSON-parse/fallback, float-normalization, and 0.51-tolerance rule.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line 1
  - text: The retained comparison reports no changed models.
    support:
    - official/ground_truth/evaluation.py::evaluate
  fail_if:
  - text: A complete end-state snapshot has no active task, or the first active task's status is not "success".
    support:
    - official/ground_truth/evaluation.py::evaluate
  - text: The first active task's answer cannot satisfy the evaluator's float-normalized comparison to 21257.8 within tolerance 0.51.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line 1
  - text: The retained comparison reports one or more changed models.
    support:
    - official/ground_truth/evaluation.py::evaluate
  undecided_if:
  - text: The retained task evidence is missing or incomplete, or the start/end model comparison needed to determine changed models is unavailable.
    rationale: Without both task-result evidence and model-diff evidence, the released checks cannot all be reconstructed.
stronger:
  additional_conditions:
  - id: exact_total
    text: Require the float-normalized answer to equal 21257.8 exactly, rather than merely fall within the evaluator's 0.51 tolerance.
    rationale: The task asks for the actual combined cost and the official answer supplies an exact value, while the released evaluator accepts nearby values.
    decisive_artifacts:
    - artifact: Complete end-state supervisor Task snapshot
      question: Does the first active task's answer equal 21257.8 after JSON-parse/fallback and float normalization?
      support:
      - official/ground_truth/evaluation.py::evaluate
      - official/ground_truth/answer.json::line 1
    support:
    - official/specs.json::instruction
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line 1

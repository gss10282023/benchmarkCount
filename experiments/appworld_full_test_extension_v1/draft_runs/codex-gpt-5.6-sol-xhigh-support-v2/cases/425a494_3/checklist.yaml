schema_version: case_checklist_v1
case_unit_id: 425a494_3
domain: appworld
task_id: 425a494_3
native:
  user_goal:
    text: Identify the genre with the most liked songs in the user's Spotify playlists.
    support:
    - official/specs.json::instruction
  benchmark_success:
    text: The first supervisor task has status `success`; its evaluator-parsed answer matches `reggae`; and the changed-model set is empty.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line 1
  checked_by:
    text: AppWorld's released `evaluate` function derives completion from task status, parses and compares the answer, and checks `models.changed_model_names()`.
    support:
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Post-run supervisor task record
    question: Does the first active task have status `success`, and does its answer—JSON-decoded when valid, otherwise used raw—equal `reggae`?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line 1
  - artifact: Post-run model-state diff
    question: Does comparison of the retained start and end model states produce an empty changed-model set?
    support:
    - official/ground_truth/evaluation.py::evaluate
  success_if:
  - text: The first active supervisor task has status `success`.
    support:
    - official/ground_truth/evaluation.py::evaluate
  - text: The task answer, JSON-decoded when valid and otherwise used raw, matches `reggae`.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line 1
  - text: The post-run changed-model set is empty.
    support:
    - official/ground_truth/evaluation.py::evaluate
  fail_if:
  - text: The first active supervisor task status is not `success`.
    support:
    - official/ground_truth/evaluation.py::evaluate
  - text: The evaluator-parsed task answer does not match `reggae`.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line 1
  - text: The post-run changed-model set is nonempty.
    support:
    - official/ground_truth/evaluation.py::evaluate
  undecided_if:
  - text: The retained supervisor task record is missing or unreadable, so its status or evaluator-parsed answer cannot be determined.
    rationale: The native completion and answer checks require the first active task's stored status and answer.
  - text: The retained model-state evidence is missing or insufficient to determine the changed-model set.
    rationale: The native no-change check requires a comparison of the run's start and end model states.
stronger:
  additional_conditions: []

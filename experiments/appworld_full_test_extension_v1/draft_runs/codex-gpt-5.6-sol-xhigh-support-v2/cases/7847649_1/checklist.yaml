schema_version: case_checklist_v1
case_unit_id: '7847649_1'
domain: appworld
task_id: '7847649_1'
native:
  user_goal:
    text: Answer how many activities in the user's bucket-list SimpleNote note are completed.
    support:
    - official/specs.json::instruction
  benchmark_success:
    text: The supervisor task is marked successful, the evaluator accepts the submitted answer as matching 7 after its JSON-decode/raw-string fallback, and the start-to-end changed-model-name set is empty.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::1
  checked_by:
    text: The released AppWorld evaluate function checks task completion status, answer matching, and absence of model changes.
    support:
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: End-state supervisor task record
    question: Is the evaluator-selected task marked success, and does its stored answer match 7 under the evaluator's JSON-decode/raw-string fallback and answer comparison?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::1
  - artifact: Start-to-end model-state diff report
    question: Does changed_model_names resolve to the empty set?
    support:
    - official/ground_truth/evaluation.py::evaluate
  success_if:
  - text: The end-state supervisor task status is success.
    support:
    - official/ground_truth/evaluation.py::evaluate
  - text: The evaluator accepts the parsed submitted answer as matching 7.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::1
  - text: The changed-model-name set is empty.
    support:
    - official/ground_truth/evaluation.py::evaluate
  fail_if:
  - text: The end-state supervisor task status is not success.
    support:
    - official/ground_truth/evaluation.py::evaluate
  - text: The evaluator rejects the parsed submitted answer as not matching 7.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::1
  - text: The changed-model-name set is nonempty.
    support:
    - official/ground_truth/evaluation.py::evaluate
  undecided_if:
  - text: Retained evidence does not expose a readable evaluator-selected task status and answer or a conclusive start-to-end model diff.
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: All native components must be observable to decide the benchmark claim.
stronger:
  additional_conditions: []

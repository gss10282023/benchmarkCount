schema_version: case_checklist_v1
case_unit_id: cef9191_3
domain: appworld
task_id: cef9191_3
native:
  user_goal:
    text: Identify the artist the user follows on Spotify who has the most followers.
    support:
    - official/specs.json::instruction
  benchmark_success:
    text: Native success requires the supervisor task status to be "success", its parsed-or-raw answer to match "Zoey James", and changed_model_names() to be falsy.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::L1
  checked_by:
    text: The released evaluate function uses TestTracker to inspect the post-run supervisor task, compare its answer with the official answer, and check the start/end model-change set.
    support:
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Retained post-run supervisor Task record
    question: Does the record have status "success" and an answer that the evaluator parses or reads as "Zoey James"?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::L1
  - artifact: Retained start/end model-change result
    question: Is changed_model_names() falsy?
    support:
    - official/ground_truth/evaluation.py::evaluate
  success_if:
  - text: The supervisor task status is "success".
    support:
    - official/ground_truth/evaluation.py::evaluate
  - text: The parsed-or-raw supervisor task answer matches "Zoey James" under TestTracker.answer.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::L1
  - text: The evaluator's changed_model_names() result is falsy.
    support:
    - official/ground_truth/evaluation.py::evaluate
  fail_if:
  - text: The supervisor task status is not "success".
    support:
    - official/ground_truth/evaluation.py::evaluate
  - text: The parsed-or-raw supervisor task answer does not match "Zoey James" under TestTracker.answer.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::L1
  - text: The evaluator's changed_model_names() result is truthy.
    support:
    - official/ground_truth/evaluation.py::evaluate
  undecided_if:
  - text: The retained evidence omits the supervisor task status or answer, or omits the start/end model-change result.
    rationale: Without all evaluator-read fields, evidence review cannot determine every native component.
stronger:
  additional_conditions: []

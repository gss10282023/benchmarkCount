schema_version: case_checklist_v1
case_unit_id: '7847649_2'
domain: appworld
task_id: '7847649_2'
native:
  user_goal:
    text: Report how many bucket-list activities remain to be done according to the user's SimpleNote note.
    support:
    - official/specs.json::instruction
  benchmark_success:
    text: The first active task is marked successful, its answer matches 3 under the evaluator's JSON-parse/raw-fallback rule, and the evaluator finds no model changes.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
  checked_by:
    text: The released AppWorld evaluator reads the first active supervisor task, records status-based completion, compares its parsed answer with the official answer, and checks that changed_model_names() is empty.
    support:
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Retained final supervisor task record
    question: Is the first active task marked success, and does its answer equal 3 after JSON parsing or the evaluator's raw fallback?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
  - artifact: Retained evaluator-visible pre/post model-state diff
    question: Does changed_model_names() return an empty set?
    support:
    - official/ground_truth/evaluation.py::evaluate
  success_if:
  - text: The first active task's status is success.
    support:
    - official/ground_truth/evaluation.py::evaluate
  - text: The evaluator-parsed answer equals 3.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
  - text: The evaluator-visible changed-model set is empty.
    support:
    - official/ground_truth/evaluation.py::evaluate
  fail_if:
  - text: The first active task's status is not success.
    support:
    - official/ground_truth/evaluation.py::evaluate
  - text: The evaluator-parsed answer does not equal 3.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
  - text: The evaluator-visible changed-model set is nonempty.
    support:
    - official/ground_truth/evaluation.py::evaluate
  undecided_if:
  - text: The retained evidence does not establish the first active task's final status and answer or the evaluator-visible model-state diff.
    rationale: All are needed to determine the native completion and evaluator checks.
stronger:
  additional_conditions: []

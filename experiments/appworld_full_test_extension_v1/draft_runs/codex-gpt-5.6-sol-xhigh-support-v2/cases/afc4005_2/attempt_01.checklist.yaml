schema_version: case_checklist_v1
case_unit_id: afc4005_2
domain: appworld
task_id: afc4005_2
native:
  user_goal:
    text: Report, in minutes, the duration of yesterday's planned workout in Simple Note.
    support:
    - official/specs.json::instruction
  benchmark_success:
    text: 'Both official checks pass: the final task answer, parsed as JSON when possible and otherwise used as raw text, matches 45 under the evaluator''s answer comparison; and changed_model_names() is empty.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
    - official/ground_truth/test_data.json::$
  checked_by:
    text: The released evaluate function using TestTracker, the final supervisor task answer, the official answer value, and the start/end model comparison.
    support:
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Retained final supervisor task record
    question: After the evaluator's JSON-parse-or-raw fallback, does its answer match 45 under test.answer?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
  - artifact: Retained start/end model-change diff or evaluator result for changed_model_names()
    question: Is the changed-model-name set empty?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
  success_if:
  - text: The parsed-or-raw final answer matches 45 under test.answer and the changed-model-name set is empty.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
  fail_if:
  - text: The parsed-or-raw final answer does not match 45 under test.answer.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
  - text: The changed-model-name set is nonempty.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
  undecided_if:
  - text: The retained evidence does not establish either the evaluator-visible final answer or whether the changed-model-name set is empty.
    rationale: Both values are required to decide the native two-check conjunction.
stronger:
  additional_conditions: []

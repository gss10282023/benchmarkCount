schema_version: case_checklist_v1
case_unit_id: dac78d9_3
domain: appworld
task_id: dac78d9_3
native:
  user_goal:
    text: Report how many Venmo friends the user made from the start of March 2023 through the task date.
    support:
    - official/specs.json::instruction
    - official/specs.json::datetime
  benchmark_success:
    text: 'All three evaluator components hold: the task status is success, the evaluator-derived answer equals the official value 5, and changed_model_names() is falsy.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line 1
  checked_by:
    text: The released AppWorld evaluate function using TestTracker.
    support:
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Retained end-state supervisor task record
    question: Does an active task have status success, and does its evaluator-parsed answer equal 5?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line 1
  - artifact: Retained start/end model-state comparison
    question: Is changed_model_names() falsy, showing no model changes?
    support:
    - official/ground_truth/evaluation.py::evaluate
  success_if:
  - text: The end-state active task status is success.
    support:
    - official/ground_truth/evaluation.py::evaluate
  - text: The task answer, JSON-decoded with the evaluator's raw-text fallback, equals 5.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line 1
  - text: The retained model comparison shows changed_model_names() is falsy.
    support:
    - official/ground_truth/evaluation.py::evaluate
  fail_if:
  - text: No active supervisor task exists, or its status is not success.
    support:
    - official/ground_truth/evaluation.py::evaluate
  - text: The evaluator-derived task answer does not equal 5.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line 1
  - text: The model comparison reports any changed model name.
    support:
    - official/ground_truth/evaluation.py::evaluate
  undecided_if:
  - text: Retained evidence omits the end-state task record or the model-change comparison.
    rationale: Without both artifacts, all native evaluator components cannot be reconstructed.
stronger:
  additional_conditions: []

schema_version: case_checklist_v1
case_unit_id: 476b213_2
domain: appworld
task_id: 476b213_2
native:
  user_goal:
    text: Identify the card name used for the user's most recent Spotify Premium membership payment.
    support:
    - official/specs.json::instruction
  benchmark_success:
    text: 'Both released checks pass: the first active supervisor task''s answer, JSON-decoded when possible and otherwise used raw, matches "Discover"; and changed_model_names() is falsy.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line 1
    - official/ground_truth/test_data.json::line 1-10
  checked_by:
    text: The official evaluate function's answer-match and no-model-changes TestTracker checks.
    support:
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Retained evaluator-visible end-state supervisor task records
    question: Is there a first active task whose answer parses, or falls back as raw text, to "Discover"?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line 1
  - artifact: Retained start/end model snapshots or changed-model-name diff
    question: Does changed_model_names() yield no changed models?
    support:
    - official/ground_truth/evaluation.py::evaluate
  success_if:
  - text: The first active supervisor task's parsed-or-raw answer matches "Discover" under the evaluator's comparison.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line 1
  - text: The evaluator-visible start/end state yields a falsy changed-model-name set.
    support:
    - official/ground_truth/evaluation.py::evaluate
  fail_if:
  - text: No first active supervisor task is present, or its parsed-or-raw answer does not match "Discover".
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::line 1
  - text: The evaluator-visible start/end state yields any changed model name.
    support:
    - official/ground_truth/evaluation.py::evaluate
  undecided_if:
  - text: Retained evidence does not expose both the first active task's answer and enough start/end state or diff evidence to determine changed model names.
    support:
    - official/ground_truth/evaluation.py::evaluate
stronger:
  additional_conditions: []

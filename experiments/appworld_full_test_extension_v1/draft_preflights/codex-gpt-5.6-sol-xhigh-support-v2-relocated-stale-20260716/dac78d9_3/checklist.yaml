schema_version: case_checklist_v1
case_unit_id: dac78d9_3
domain: appworld
task_id: dac78d9_3
native:
  user_goal:
    text: Answer how many Venmo friends Katie Simpson made from 2023-03-01 through the task date.
    support:
    - official/specs.json::instruction
    - official/specs.json::datetime
  benchmark_success:
    text: The first end-state supervisor task is marked successful, its answer—JSON-decoded when possible—matches 5 under the evaluator's answer comparison, and the end-state model-change set is falsy.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::L1
  checked_by:
    text: The released AppWorld evaluator reads the first end-state supervisor task, records its success status, compares its parsed answer with 5, and checks models.changed_model_names().
    support:
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Retained end-state supervisor task record
    question: Does the first active task have status success and an answer that parses, or falls back as raw text, to the evaluator-accepted value 5?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::L1
  - artifact: Retained start/end model-diff result
    question: Is models.changed_model_names() falsy?
    support:
    - official/ground_truth/evaluation.py::evaluate
  success_if:
  - text: The first end-state supervisor task has status success.
    support:
    - official/ground_truth/evaluation.py::evaluate
  - text: Its JSON-decoded answer, or raw answer if decoding fails, matches 5 under test.answer.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::L1
  - text: The retained model comparison reports no changed model names.
    support:
    - official/ground_truth/evaluation.py::evaluate
  fail_if:
  - text: The retained end state shows no active supervisor task or the first task is not marked success.
    support:
    - official/ground_truth/evaluation.py::evaluate
  - text: The first task's parsed-or-raw answer does not match 5 under test.answer.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::L1
  - text: The retained model comparison reports any changed model name.
    support:
    - official/ground_truth/evaluation.py::evaluate
  undecided_if:
  - text: The retained evidence omits the end-state task record or start/end model comparison, so one or more native conditions cannot be determined.
    rationale: Missing retained evidence is not proof that the corresponding evaluator condition passed or failed.
stronger:
  additional_conditions: []

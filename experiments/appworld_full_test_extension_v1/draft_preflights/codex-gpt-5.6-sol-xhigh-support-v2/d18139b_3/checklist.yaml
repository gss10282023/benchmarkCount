schema_version: case_checklist_v1
case_unit_id: d18139b_3
domain: appworld
task_id: d18139b_3
native:
  user_goal:
    text: Approve all Venmo payment requests from the user's roommates from the current calendar month.
    support:
    - official/specs.json::instruction
    - official/specs.json::datetime
  benchmark_success:
    text: 'Native success requires task_completed=true and every released check to pass: the answer equals null; changed models are exactly venmo.User, venmo.Notification, venmo.PaymentRequest, and venmo.Transaction; no PaymentRequest is added or removed; updated request senders are all in {16, 37, 81}; updated request IDs equal {6131, 6137, 6138, 6139, 6143, 6145, 6149, 6151, 6168}; every updated request has non-null approved_at; and each changes only approved_at.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
    - official/ground_truth/private_data.json::roommate_venmo_user_ids
    - official/ground_truth/private_data.json::payment_request_ids
  checked_by:
    text: The released AppWorld evaluate function, using TestTracker comparisons over the active supervisor task and evaluator-visible pre/post model state.
    support:
    - official/ground_truth/evaluation.py::evaluate
  decisive_artifacts:
  - artifact: Post-run active supervisor Task record
    question: Is status success, and does the stored answer parse or compare as null?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
  - artifact: Complete evaluator-visible pre/post model diff and Venmo end-state snapshot
    question: Do changed model names, PaymentRequest additions/removals, updated IDs and senders, approved_at values, and changed fields satisfy every released comparison?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::roommate_venmo_user_ids
    - official/ground_truth/private_data.json::payment_request_ids
  success_if:
  - text: The active supervisor Task has status success and its answer equals null under the evaluator's JSON parsing and answer comparison.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
  - text: Changed model names equal exactly {venmo.User, venmo.Notification, venmo.PaymentRequest, venmo.Transaction}, with no PaymentRequest added or removed.
    support:
    - official/ground_truth/evaluation.py::evaluate
  - text: Updated PaymentRequest IDs equal {6131, 6137, 6138, 6139, 6143, 6145, 6149, 6151, 6168}, and every sender ID is in {16, 37, 81}.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::roommate_venmo_user_ids
    - official/ground_truth/private_data.json::payment_request_ids
  - text: Every updated PaymentRequest has non-null approved_at, and approved_at is its only changed field.
    support:
    - official/ground_truth/evaluation.py::evaluate
  fail_if:
  - text: The active supervisor Task status is not success, or its answer does not equal null under the evaluator's comparison.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
  - text: Changed model names differ from the required four-model set, or any PaymentRequest was added or removed.
    support:
    - official/ground_truth/evaluation.py::evaluate
  - text: Updated PaymentRequest IDs differ from the required set, or any updated request sender is outside {16, 37, 81}.
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::roommate_venmo_user_ids
    - official/ground_truth/private_data.json::payment_request_ids
  - text: Any required updated request has null approved_at or changed any field other than approved_at.
    support:
    - official/ground_truth/evaluation.py::evaluate
  undecided_if:
  - text: The retained evidence omits or corrupts the active Task record, complete pre/post model diff, or required Venmo end state, preventing one or more released comparisons from being made.
    support:
    - official/ground_truth/evaluation.py::evaluate
stronger:
  additional_conditions: []

schema_name: experiment_manifest_schema
schema_version: 0.1.0
source_documents:
  - 计划.md
  - revised_agent_benchmark_paper.tex

required_top_level_fields:
  - manifest_metadata
  - controlled_placeholders
  - domains
  - paper_coverage
  - experiments

controlled_placeholders:
  allowed_when_paper_is_silent:
    - 需要从论文确认
    - 需要从 locked manifest 确认
    - 需要从 scored manifest 填充
    - 需要从 benchmark 官方 split 确认
    - 不适用
    - 无
  disallowed_fill_behavior:
    - 不得补造 agent model IDs 或 version pins
    - 不得补造 seed
    - 不得补造成本或 runtime
    - 不得补造 appendix case count
    - 不得使用 TeX fallback plot values 作为实验结果

experiment_entry_required_fields:
  - experiment_id
  - priority
  - paper_section
  - paper_table_label
  - paper_figure_label
  - paper_appendix_label
  - is_appendix
  - domain
  - benchmark_name
  - case_unit_count
  - record_count
  - episode_count
  - agents
  - seeds
  - task_split
  - task_selection_rule
  - native_signal
  - evidence_sources
  - evidence_contract_id
  - evidence_contract_version
  - contract_lock_status
  - contract_lock_time
  - claim_scope
  - unresolve_taxonomy_version
  - result_schema_version
  - required_raw_logs
  - required_intermediate_results
  - required_metrics
  - required_tables
  - required_figures
  - machine_role
  - required_machine
  - estimated_cost
  - estimated_runtime
  - parallelizable
  - preflight_eligible
  - resume_policy
  - retry_policy
  - dedup_key
  - config_hash
  - git_commit_hash
  - agent_probe_rationale

allowed_values:
  priority:
    - P0
    - P1
    - P2
    - P3
  claim_scope:
    - native_aligned
    - stronger_measurement
    - mixed_reported_separately
    - not_applicable
  contract_lock_status:
    - draft_required
    - locked_required_before_scoring
    - locked
    - not_applicable
  machine_role:
    - webarena_vps
    - osworld_vps
    - other_vps
    - local_androidworld
    - analysis
    - release
    - not_applicable

validation_rules:
  paper_labels:
    - Every table reference must use a `tab:` label from `paper_coverage.table_labels`.
    - Every figure reference must use a `fig:` label from `paper_coverage.figure_labels`.
    - Appendix references must use `app:` labels where present; Formal Definitions may use the appendix name.
  p0_contract_gate:
    - Every P0 main case unit must have a locked native-aligned evidence contract before scoring.
    - Contract lock time must be earlier than first scoring time.
    - Native-aligned required artifacts must have source support.
    - Stronger measurement claims must have a separate report or appendix mapping and must not enter the native-aligned main envelope.
  denominator:
    - TOTAL must equal SUCCESS + FAIL + UNRESOLVE.
    - Completed denominator excludes only infrastructure or pre-run failures.
    - Agent-caused invalid actions, tool misuse, timeouts after task start, malformed final answers, and benchmark-facing aborts are not excluded.
  formulas:
    - COVERAGE = (SUCCESS + FAIL) / TOTAL.
    - COUNTED_ONLY_SCORE = SUCCESS / (SUCCESS + FAIL), only if SUCCESS + FAIL > 0.
    - LOWER = SUCCESS / TOTAL.
    - UPPER = (SUCCESS + UNRESOLVE) / TOTAL.
    - WIDTH = UNRESOLVE / TOTAL.
  bootstrap:
    - Cluster unit is case unit.
    - Resampling is within domain and keeps all agent records attached to the sampled case unit.
    - Intervals condition on stored traces and fixed agent versions.
  prediction_outcomes:
    - P1-P4 outcomes must use 95% case-cluster bootstrap intervals.
    - Outcomes are exactly supported, falsified, or inconclusive.
    - Point estimates alone cannot decide prediction outcomes.
  audit:
    - Blinded audit input must not expose agent identity, native benchmark label, counting decision, UNRESOLVE reason, or alternate view verdicts.
    - Audit reports auditor-vs-scorer three-class agreement, countability kappa, and R1-R7 taxonomy kappa.
    - Taxonomy kappa is computed only where both auditors mark UNRESOLVE.
  figures:
    - "`fig:hero` panel (a) data must share provenance with `tab:main-results-A`."
    - "`fig:hero` panel (b) must include only four main-domain rows."
    - "`fig:evidence-counting` must remain consistent with counting and denominator rules."
    - "`fig:case-cards` must have case-level provenance."
  final_macro_contract:
    - Final `outputs/latex/results_macros.tex` must set `\resultdatatrue`.
    - Final LaTeX must not retain `\fillfromdata`, fallback plot values, or placeholder row values.

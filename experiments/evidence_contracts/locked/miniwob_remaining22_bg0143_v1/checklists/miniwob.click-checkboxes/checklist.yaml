schema_version: case_checklist_v1
case_unit_id: miniwob.click-checkboxes
domain: miniwob
task_id: miniwob.click-checkboxes
native:
  user_goal:
    text: Carry out the runtime-issued instruction by selecting the named checkboxes, or selecting none when the query says
      "nothing", then click Submit.
    support:
    - official/install/miniwob/html/miniwob/click-checkboxes.html::genProblem
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_goal.content
  benchmark_success:
    text: The benchmark counts success when the released validator runs on the final page without invalid-page or invalid-URL
      error and returns done true with binary reward 1.0, which is computed as float(RAW_REWARD_GLOBAL > 0).
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
  checked_by:
    text: Checked by `env.unwrapped.task.validate(page, chat_messages)`, which rejects an invalid page or URL, otherwise reads
      WOB final state and returns reward from `RAW_REWARD_GLOBAL > 0` together with `DONE_GLOBAL`.
    support:
    - derived/drafting_context.json::released_evaluator.entrypoint
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
  decisive_artifacts:
  - artifact: native_evaluator_output.json
    question: Does the final validator result show either invalid page/URL error, or else done true with reward 1.0 from positive
      `info.RAW_REWARD_GLOBAL`, or done true with non-success reward?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2].path
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  - artifact: task_artifacts/
    question: If the validator output is missing or ambiguous, do the retained final validation/task-state snapshots preserve
      the same evaluator-visible terminal fields needed to confirm the benchmark-counted outcome?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[3].path
    - derived/drafting_context.json::evaluator_visible_state_schema.fields
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
  success_if:
  - text: Retained evidence shows a valid final validation with done true and reward 1.0, grounded in `info.RAW_REWARD_GLOBAL
      > 0`.
    support:
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  fail_if:
  - text: Retained evidence shows the validator terminated for invalid page or invalid URL.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
  - text: Retained evidence shows a completed task outcome with done true and non-positive `info.RAW_REWARD_GLOBAL`, so the
      validator reward is not 1.0.
    support:
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  - text: Retained evidence establishes another benchmark-counted run failure under the released evaluator wiring.
    support:
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
  undecided_if:
  - text: The retained artifacts do not preserve a concrete final validator result or equivalent evaluator-visible terminal
      state, so benchmark success cannot be verified from stored evidence.
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2].path
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[3].path
    - derived/drafting_context.json::released_evaluator.summary_field_guard
stronger:
  additional_conditions:
  - id: all_checkbox_states_match_requested_selection
    text: Every requested checkbox is selected and every unrequested checkbox remains unselected, rather than only a majority
      of checkbox states being correct.
    rationale: The official query names the requested selection, while the task oracle succeeds whenever the signed count
      of correct checkbox states is merely positive.
    decisive_artifacts:
    - artifact: native_evaluator_output.json
      question: Does `info.RAW_REWARD_GLOBAL` equal 1.0 rather than merely being positive?
      support:
      - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0].decisive_post_run_artifacts[0]
    - artifact: trajectory/steps.json and trajectory/observations/
      question: Do the retained interaction records preserve the submitted checkbox configuration for the final attempt?
      support:
      - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0].decisive_post_run_artifacts[1]
    - artifact: browser_artifacts/page_html/ and browser_artifacts/screenshots/
      question: Do the retained page captures show that every named checkbox is checked and every unnamed checkbox is unchecked
        at submission?
      support:
      - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0].decisive_post_run_artifacts[2]
    support:
    - official/install/miniwob/html/miniwob/click-checkboxes.html::genProblem
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content

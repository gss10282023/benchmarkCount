schema_version: case_checklist_v1
case_unit_id: miniwob.focus-text-2
domain: miniwob
task_id: miniwob.focus-text-2
native:
  user_goal:
    text: Focus the cursor into the specific input textbox named by the runtime task prompt.
    support:
    - official/install/miniwob/html/miniwob/focus-text-2.html::genProblem
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_goal.content
    - derived/official_source_excerpts.json::excerpts.task_class.content
  benchmark_success:
    text: Native success is a valid final call to the released MiniWoB validator that returns `done` true and binary reward
      `1.0`, where that reward is defined as `float(RAW_REWARD_GLOBAL > 0)` from the task's WOB state.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
    - derived/drafting_context.json::released_evaluator.native_semantics
  checked_by:
    text: Checked by `env.unwrapped.task.validate(page, chat_messages)`, which rejects an invalid page or URL; otherwise it
      reads the final WOB state and returns `float(RAW_REWARD_GLOBAL > 0)` together with `DONE_GLOBAL`.
    support:
    - derived/drafting_context.json::released_evaluator.entrypoint
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
  decisive_artifacts:
  - artifact: native_evaluator_output.json
    question: Does the final retained validator output show a valid final validation with `done` true, binary reward `1.0`
      for success or `0.0` for failure, and no `invalid page` or `invalid url` termination error?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2].path
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  - artifact: task_artifacts/
    question: Do the retained final task info/state artifacts show the final WOB values needed to interpret the validator
      result, especially `RAW_REWARD_GLOBAL` and `DONE_GLOBAL`?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[3].path
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
  success_if:
  - text: Retained evidence establishes a valid final validator result with `done` true and binary reward `1.0`, and the retained
      final WOB state shows `RAW_REWARD_GLOBAL > 0` for that completed episode.
    support:
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
  fail_if:
  - text: Retained evidence establishes that the final validator terminated for `invalid page` or `invalid url`.
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
  - text: Retained evidence establishes a completed final validation with non-positive raw reward, yielding binary reward
      `0.0`.
    support:
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.core_reward_wiring.content
  undecided_if:
  - text: The retained artifacts do not preserve enough final validator output or final WOB state to determine whether the
      last official validation was valid, done, and based on positive versus non-positive `RAW_REWARD_GLOBAL`.
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2].path
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[3].path
    - derived/drafting_context.json::released_evaluator.summary_field_guard
stronger:
  additional_conditions: []

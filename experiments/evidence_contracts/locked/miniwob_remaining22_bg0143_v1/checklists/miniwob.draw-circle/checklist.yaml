schema_version: case_checklist_v1
case_unit_id: miniwob.draw-circle
domain: miniwob
task_id: miniwob.draw-circle
native:
  user_goal:
    text: Complete the MiniWoB Draw Circle task by drawing a circle centered around the marked point, then submitting it.
    support:
    - derived/drafting_context.json::task_text.support
    - official/install/miniwob/html/miniwob/draw-circle.html::genProblem
  benchmark_success:
    text: Native benchmark success is a valid final MiniWoB validation with `done` true and binary reward `1.0`; under the
      released validator this means the page and URL are valid and `info.RAW_REWARD_GLOBAL > 0`.
    support:
    - derived/drafting_context.json::released_evaluator.native_semantics
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  checked_by:
    text: Checked by the released MiniWoB validator `env.unwrapped.task.validate(page, chat_messages)`, which rejects invalid
      page/URL, reads WOB state, and returns `float(RAW_REWARD_GLOBAL > 0)` together with `DONE_GLOBAL`.
    support:
    - derived/drafting_context.json::released_evaluator.entrypoint
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
    - derived/official_source_excerpts.json::excerpts.base_validator.methods._get_info.content
  decisive_artifacts:
  - artifact: native_evaluator_output.json
    question: 'Does the final validator output show `done: true`, `reward: 1.0`, no invalid-page/invalid-url error, and `info.RAW_REWARD_GLOBAL
      > 0` for native success, or a native-counted failure condition instead?'
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2].path
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
  - artifact: trajectory/steps.json and trajectory/observations/
    question: Do the retained step/observation records establish that the run reached the final validated task state, especially
      if the final validator record is incomplete or ambiguous?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[4].path
    - derived/drafting_context.json::released_evaluator.summary_field_guard
  - artifact: browser_artifacts/
    question: Do the retained page HTML, screenshots, or video corroborate the terminal page state and help resolve ambiguity
      about page/url validity or whether submission occurred?
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[5].path
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
  - artifact: trajectory/ and run_summary.json
    question: Do concrete action/step records together with run-status metadata establish a benchmark-counted invalid action,
      timeout, tool misuse, abort, or exhausted run budget after task start? Do not use a summary-only success/label field
      by itself.
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[4].path
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[7].path
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
    - derived/drafting_context.json::released_evaluator.summary_field_guard
  success_if:
  - text: '`native_evaluator_output.json` establishes a valid final validation with `done: true`, `reward: 1.0`, no invalid-page/invalid-url
      error, and `info.RAW_REWARD_GLOBAL > 0`.'
    support:
    - derived/drafting_context.json::released_evaluator.success_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  fail_if:
  - text: '`native_evaluator_output.json` shows the validator terminated for invalid page or invalid URL.'
    support:
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  - text: '`native_evaluator_output.json` shows a completed final validation with `done: true` and `reward: 0.0`, including
      the case `info.RAW_REWARD_GLOBAL <= 0`.'
    support:
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content
  - text: Retained run-status together with concrete trace or evaluator-step evidence establishes another benchmark-counted
      run failure, including an agent-caused invalid action, timeout, tool misuse, abort, or exhausted run budget after task
      start.
    support:
    - derived/drafting_context.json::released_evaluator.failure_evidence_rule
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2].path
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[4].path
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[7].path
    - derived/drafting_context.json::released_evaluator.summary_field_guard
  undecided_if:
  - text: The retained artifacts do not preserve a trustworthy final validator record, so final `reward`, `done`, error status,
      and `RAW_REWARD_GLOBAL` cannot be established from post-run evidence.
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[2].path
    - derived/drafting_context.json::released_evaluator.summary_field_guard
  - text: The validator output is missing or materially inconsistent with the retained trajectory/browser evidence, and the
      stored artifacts do not resolve the final validated state.
    support:
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[4].path
    - derived/drafting_context.json::artifact_inventory.retained_artifacts[5].path
    - derived/drafting_context.json::released_evaluator.summary_field_guard
stronger:
  additional_conditions:
  - id: drawing_reaches_official_top_circle_quality_bin
    text: 'The submitted drawing reaches the official top circle-quality bin: raw reward 1.0, which requires radial standard
      deviation below 2 and adequate width and height.'
    rationale: The official goal requests a circle centered around the marked point, while native success accepts any positive
      quality bin, including substantially lower-quality drawings.
    decisive_artifacts:
    - artifact: native_evaluator_output.json
      question: Does the retained final evaluator info show `RAW_REWARD_GLOBAL = 1.0` rather than merely a positive raw reward?
      support:
      - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0].decisive_post_run_artifacts
      - official/install/miniwob/html/miniwob/draw-circle.html::determineReward
      - official/install/miniwob/html/miniwob/draw-circle.html::properlySized
    - artifact: trajectory/steps.json and trajectory/observations/
      question: Do the recorded actions and observations support that the submitted shape was a completed circle attempt consistent
        with the top-quality bin?
      support:
      - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0].decisive_post_run_artifacts
      - official/install/miniwob/html/miniwob/draw-circle.html::genProblem
    - artifact: browser_artifacts/page_html/ and browser_artifacts/screenshots/
      question: Do the retained visuals show a circle around the marked point with adequate width and height, consistent with
        the official top-quality bin?
      support:
      - derived/drafting_context.json::stronger_measurement.required_additional_conditions[0].decisive_post_run_artifacts
      - official/install/miniwob/html/miniwob/draw-circle.html::properlySized
      - official/install/miniwob/html/miniwob/draw-circle.html::genProblem
    support:
    - official/install/miniwob/html/miniwob/draw-circle.html::determineReward
    - official/install/miniwob/html/miniwob/draw-circle.html::properlySized
    - official/install/miniwob/html/miniwob/draw-circle.html::genProblem
    - derived/official_source_excerpts.json::excerpts.base_validator.methods.validate.content

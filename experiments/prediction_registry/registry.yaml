registry_metadata:
  registry_id: prediction_registry_from_paper
  registry_version: 0.1.0
  source_paper_section: sec:predictions
  source_table_label: tab:prediction-outcomes
  lock_status: must_lock_before_first_scoring
  lock_time: 需要从 locked manifest 确认
  manifest_hash_at_lock: 需要从 locked manifest 确认
  contract_hash_set_at_lock: 需要从 locked manifest 确认
  taxonomy_version_at_lock: R1-R7_paper_taxonomy_v0.1.0
  edited_after_first_scoring: must_be_false
  outcome_rule: Outcomes are supported, falsified, or inconclusive using 95% case-cluster bootstrap intervals; point estimates alone cannot determine outcome.

bootstrap_rule:
  cluster_unit: case_unit
  resampling: within domain with replacement
  preserve_records: keep all agent records attached to each sampled case unit
  interval_level: 95%
  seed: 需要从 locked manifest 确认
  resample_count: 需要从 locked manifest 确认
  interpretation_limits:
    - fixed-manifest point estimates are primary finite-manifest descriptions
    - intervals are secondary descriptive case-population diagnostics
    - intervals condition on stored traces and fixed agent versions
    - intervals do not cover repeated-execution randomness, API drift, tool-call nondeterminism, or environment volatility

predictions:
  - prediction_id: P1
    name: negative-control bound + falsification clause
    registered_text: Per-record envelope width on AppWorld and on WebArena-Verified is each below 15%.
    domains:
      - AppWorld
      - WebArena-Verified
    target_metric: envelope width / UNRESOLVE share
    supported_if: both upper 95% case-resampling bounds are below 15%
    falsified_if: either lower 95% case-resampling bound is above 15%
    inconclusive_if: otherwise
    falsification_clause: A falsification indicates evidence contracts are likely over-conservative for strong-evaluator benchmarks.
    observed_quantity_macro: \PoneValue
    outcome_macro: \PoneOutcome
    observed_quantity: 需要从 scored manifest 填充
    outcome: 需要从 scored manifest 填充

  - prediction_id: P2
    name: evidence-sensitive bound
    registered_text: Per-record envelope width on AgentDojo exceeds the maximum of the two negative-control widths by at least 20 percentage points.
    domains:
      - AgentDojo
      - AppWorld
      - WebArena-Verified
    target_metric: AgentDojo width minus max(AppWorld width, WebArena-Verified width)
    supported_if: lower 95% case-resampling bound of the contrast exceeds 20 percentage points
    falsified_if: upper 95% case-resampling bound of the contrast is below 20 percentage points
    inconclusive_if: otherwise
    observed_quantity_macro: \PtwoValue
    outcome_macro: \PtwoOutcome
    observed_quantity: 需要从 scored manifest 填充
    outcome: 需要从 scored manifest 填充

  - prediction_id: P3
    name: residual band
    registered_text: Per-record envelope width on tau3-bench retail is strictly above each negative-control width and strictly below AgentDojo's width.
    domains:
      - tau3-bench retail
      - AppWorld
      - WebArena-Verified
      - AgentDojo
    target_metric: tau3-bench retail width ordering relative to negative controls and AgentDojo
    supported_if: both contrast intervals are entirely in the predicted direction
    falsified_if: either contrast interval is entirely in the opposite direction
    inconclusive_if: otherwise
    observed_quantity_macro: \PthreeValue
    outcome_macro: \PthreeOutcome
    observed_quantity: 需要从 scored manifest 填充
    outcome: 需要从 scored manifest 填充

  - prediction_id: P4
    name: ranking uncertainty concentration
    registered_text: At least 75% of pairwise agent comparisons not identified by the evidence envelope occur on AgentDojo or tau3-bench retail.
    domains:
      - AgentDojo
      - tau3-bench retail
      - AppWorld
      - WebArena-Verified
    target_metric: fraction of non-identified pairwise comparisons on AgentDojo or tau3-bench retail
    denominator: 24 pairwise comparisons; exact zero-width equalities are reported separately and are not counted as evidence-induced non-identification
    supported_if: lower 95% case-resampling bound for the fraction is at least 75%
    falsified_if: upper 95% case-resampling bound for the fraction is below 75%
    inconclusive_if: otherwise
    observed_quantity_macro: \PfourValue
    outcome_macro: \PfourOutcome
    observed_quantity: 需要从 scored manifest 填充
    outcome: 需要从 scored manifest 填充


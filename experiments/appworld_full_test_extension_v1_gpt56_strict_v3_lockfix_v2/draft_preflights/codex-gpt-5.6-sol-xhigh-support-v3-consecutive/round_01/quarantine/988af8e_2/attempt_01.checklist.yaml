schema_version: case_checklist_v1
case_unit_id: 988af8e_2
domain: appworld
task_id: 988af8e_2
native:
  user_goal:
    text: Complete every task in the user's Camping Trip Planning Todoist project and mark them all complete.
    support:
    - official/specs.json::$.instruction
    rationale: This preserves the official user instruction rather than reducing it to evaluator checks.
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_b3cae9b9af9c], [appworld_test_003_ab185f53f07e], [appworld_test_004_1b0d7eb1bc92], [appworld_test_005_77c9a8078f28], [appworld_test_006_4b14e0c8e908], [appworld_test_007_44cacf821749], [appworld_test_008_3c09336da1c6], [appworld_test_009_6bd29e344224], [appworld_test_010_9d41ae7181d2], [appworld_test_011_d2f67fd95c23], [appworld_test_012_a4df04f2e2ea], [appworld_test_013_1029e81b2f6c], [appworld_test_014_71000abc6b64], [appworld_test_015_5b8e91d51ad8], [appworld_test_016_a9cbbdae4679], [appworld_test_017_d663f249f882], [appworld_test_018_2f434bba020d], [appworld_test_019_642b40358fd4], [appworld_test_020_be4374b98823], [appworld_test_021_2d4155603cf8], [appworld_test_022_f983c31c6349], [appworld_test_023_0d4259eb8d2c], [appworld_test_024_d7bf59352100]'
    support:
    - case_packet.md::L15-L31
    - official/ground_truth/evaluation.py::evaluate
    rationale: Frozen TestTracker success requires every registered test to pass.
  checked_by:
    text: The frozen AppWorld TestTracker executes official/ground_truth/evaluation.py against the submitted answer and paired pre-run/post-run model state; its non-stats result records registered passes and failures.
    support:
    - case_packet.md::L15-L31
    - official/ground_truth/evaluation.py::evaluate
    rationale: Only with-test contexts register native scoring outcomes.
  decisive_artifacts:
  - artifact: Retained non-stats TestTracker evaluation result
    question: Does it record every registered requirement as passed, with no registered failures?
    support:
    - case_packet.md::L15-L31
    - official/ground_truth/evaluation.py::evaluate
  - artifact: Retained pre-run and post-run AppWorld application-state snapshots, or an equivalent complete model-change diff
    question: Do the answer and application-record additions, updates, removals, fields, relationships, recipients, quantities, and amounts determine every registered assertion?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$
  success_if:
  - text: '[appworld_test_001_844d21b309f0] passes exactly when this official requirement is satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
    rationale: The retained supervisor answer is compared with the official null answer.
  - text: '[appworld_test_002_b3cae9b9af9c] passes exactly when this official requirement is satisfied: assert model changes match todoist.Task, amazon.Order, splitwise.Group, splitwise.Expense, venmo.PaymentRequest gmail.GlobalEmailThread, gmail.UserEmailThread, gmail.Email, gmail.Attachment, ignoring todoist.SubTask, file_system.Directory, amazon.CartEntry, amazon.Address, file_system.File'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The complete retained model diff determines the evaluator's exact changed-model-name set after its ignore list is applied.
  - text: '[appworld_test_003_ab185f53f07e] passes exactly when this official requirement is satisfied: assert the updated task_ids match private_data.task_ids (ignoring order).'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.task_ids
    rationale: The updated Todoist task identifiers are compared order-insensitively with the official identifier list.
  - text: '[appworld_test_004_1b0d7eb1bc92] passes exactly when this official requirement is satisfied: obtain added amazon.Order records using models.changed_records, and assert 1 is added.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The Amazon Order diff must contain exactly one added record.
  - text: '[appworld_test_005_77c9a8078f28] passes exactly when this official requirement is satisfied: assert the product type to quantity mapping from this order private_data.product_type_to_quantity.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.product_type_to_quantity
    rationale: The added order's item product types and ordered quantities must equal the official mapping.
  - text: '[appworld_test_006_4b14e0c8e908] passes exactly when this official requirement is satisfied: obtain added, updated, removed splitwise.Group records using models.changed_records, and assert 1 is added, 0 is updated, and 0 is removed'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The Splitwise Group diff must show exactly one addition and no updates or removals.
  - text: '[appworld_test_007_44cacf821749] passes exactly when this official requirement is satisfied: asser tall added group members have group_id equal to the added group''s id.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Every added group-member record must reference the newly added group.
  - text: '[appworld_test_008_3c09336da1c6] passes exactly when this official requirement is satisfied: assert the added group members'' user_ids match private_data.splitwise_user_ids.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.splitwise_user_ids
    rationale: The set of added group-member user identifiers must equal the official Splitwise user set.
  - text: '[appworld_test_009_6bd29e344224] passes exactly when this official requirement is satisfied: obtain added, updated, removed splitwise.Expense records using models.changed_records, and assert 1 is added, 0 is updated, and 0 is removed'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The Splitwise Expense diff must show exactly one addition and no updates or removals.
  - text: '[appworld_test_010_9d41ae7181d2] passes exactly when this official requirement is satisfied: assert the added expense''s group_id matches the added group''s id'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The added expense must reference the newly added group.
  - text: '[appworld_test_011_d2f67fd95c23] passes exactly when this official requirement is satisfied: assert the added expense''s amount matches the total cost of the amazon order divided by private_data.num_trip_mates'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.num_trip_mates
    rationale: The retained added expense and order determine the evaluator's tolerance-based amount comparison.
  - text: '[appworld_test_012_a4df04f2e2ea] passes exactly when this official requirement is satisfied: assert the added expense shares'' expense_id match the added expense''s id'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Every added expense-share record must reference the newly added expense.
  - text: '[appworld_test_013_1029e81b2f6c] passes exactly when this official requirement is satisfied: assert the added expense shares'' debtor_ids match private_data.splitwise_user_ids'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.splitwise_user_ids
    rationale: The added expense-share debtor identifiers must match the official Splitwise user list, ignoring order.
  - text: '[appworld_test_014_71000abc6b64] passes exactly when this official requirement is satisfied: assert the added expense shares'' share_amount matches the total cost of the amazon order divided by private_data.num_trip_mates.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.num_trip_mates
    rationale: Each retained share amount must meet the evaluator's rounded, tolerance-based comparison derived from the order cost and trip-mate count.
  - text: '[appworld_test_015_5b8e91d51ad8] passes exactly when this official requirement is satisfied: obtain added, updated, removed venmo.PaymentRequest records using models.changed_records, and assert num_trip_mates are added, 0 are updated, and 0 are removed'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.num_trip_mates
    rationale: The Venmo PaymentRequest diff must show the official number of additions and no updates or removals.
  - text: '[appworld_test_016_a9cbbdae4679] passes exactly when this official requirement is satisfied: assert the added payment requests'' receiver_ids match private_data.venmo_user_ids.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.venmo_user_ids
    rationale: The added payment-request receiver identifiers must equal the official Venmo user list, ignoring order.
  - text: '[appworld_test_017_d663f249f882] passes exactly when this official requirement is satisfied: assert the added payment requests'' amount matches the owed amount for each trip mate'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.num_trip_mates
    rationale: Every added request amount must meet the evaluator's tolerance-based comparison with the derived share amount.
  - text: '[appworld_test_018_2f434bba020d] passes exactly when this official requirement is satisfied: obtain added, updated, removed todoist.Task records using models.changed_records, and assert 0 are added or removed'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The Todoist Task diff must contain no additions or removals.
  - text: '[appworld_test_019_642b40358fd4] passes exactly when this official requirement is satisfied: assert all updated tasks have changed only in is_completed field using models.changed_field_names.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: For every updated Todoist task, the changed-field set must be exactly is_completed.
  - text: '[appworld_test_020_be4374b98823] passes exactly when this official requirement is satisfied: obtain added, updated, removed todoist.SubTask records using models.changed_records, and assert 0 are added or removed.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The Todoist SubTask diff must contain no additions or removals.
  - text: '[appworld_test_021_2d4155603cf8] passes exactly when this official requirement is satisfied: assert the updated subtasks were only updated in is_completed field (if at all) using models.changed_fields.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Any updated Todoist subtask must have a changed-field set exactly equal to is_completed.
  - text: '[appworld_test_022_f983c31c6349] passes exactly when this official requirement is satisfied: obtain added, removed splitwise.GroupMember records using models.changed_records, and assert 0 are removed.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The Splitwise GroupMember diff must contain no removed records.
  - text: '[appworld_test_023_0d4259eb8d2c] passes exactly when this official requirement is satisfied: obtain added, removed venmo.ExpenseShare records using models.changed_records, and assert 0 are removed.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The Splitwise ExpenseShare diff must contain no removed records.
  - text: '[appworld_test_024_d7bf59352100] passes exactly when this official requirement is satisfied: obtain updated, removed gmail.UserEmailThread records using models.changed_records, and assert none are updated or removed.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: The Gmail UserEmailThread diff must contain no updates or removals.
  fail_if:
  - text: '[appworld_test_001_844d21b309f0] fails exactly when this official requirement is not satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
    rationale: A mismatch between the retained supervisor answer and official null answer registers failure.
  - text: '[appworld_test_002_b3cae9b9af9c] fails exactly when this official requirement is not satisfied: assert model changes match todoist.Task, amazon.Order, splitwise.Group, splitwise.Expense, venmo.PaymentRequest gmail.GlobalEmailThread, gmail.UserEmailThread, gmail.Email, gmail.Attachment, ignoring todoist.SubTask, file_system.Directory, amazon.CartEntry, amazon.Address, file_system.File'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Any missing or extra non-ignored changed model name registers failure.
  - text: '[appworld_test_003_ab185f53f07e] fails exactly when this official requirement is not satisfied: assert the updated task_ids match private_data.task_ids (ignoring order).'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.task_ids
    rationale: A missing or extra updated task identifier registers failure.
  - text: '[appworld_test_004_1b0d7eb1bc92] fails exactly when this official requirement is not satisfied: obtain added amazon.Order records using models.changed_records, and assert 1 is added.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: An added-order count other than one registers failure.
  - text: '[appworld_test_005_77c9a8078f28] fails exactly when this official requirement is not satisfied: assert the product type to quantity mapping from this order private_data.product_type_to_quantity.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.product_type_to_quantity
    rationale: Any product-type or ordered-quantity mismatch registers failure.
  - text: '[appworld_test_006_4b14e0c8e908] fails exactly when this official requirement is not satisfied: obtain added, updated, removed splitwise.Group records using models.changed_records, and assert 1 is added, 0 is updated, and 0 is removed'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Incorrect Splitwise Group addition, update, or removal counts register failure.
  - text: '[appworld_test_007_44cacf821749] fails exactly when this official requirement is not satisfied: asser tall added group members have group_id equal to the added group''s id.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Any added group member referencing another group registers failure.
  - text: '[appworld_test_008_3c09336da1c6] fails exactly when this official requirement is not satisfied: assert the added group members'' user_ids match private_data.splitwise_user_ids.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.splitwise_user_ids
    rationale: A mismatch in the added group-member user set registers failure.
  - text: '[appworld_test_009_6bd29e344224] fails exactly when this official requirement is not satisfied: obtain added, updated, removed splitwise.Expense records using models.changed_records, and assert 1 is added, 0 is updated, and 0 is removed'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Incorrect Splitwise Expense addition, update, or removal counts register failure.
  - text: '[appworld_test_010_9d41ae7181d2] fails exactly when this official requirement is not satisfied: assert the added expense''s group_id matches the added group''s id'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: An added expense referencing another group registers failure.
  - text: '[appworld_test_011_d2f67fd95c23] fails exactly when this official requirement is not satisfied: assert the added expense''s amount matches the total cost of the amazon order divided by private_data.num_trip_mates'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.num_trip_mates
    rationale: An expense amount outside the evaluator's comparison tolerance registers failure.
  - text: '[appworld_test_012_a4df04f2e2ea] fails exactly when this official requirement is not satisfied: assert the added expense shares'' expense_id match the added expense''s id'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Any added expense share referencing another expense registers failure.
  - text: '[appworld_test_013_1029e81b2f6c] fails exactly when this official requirement is not satisfied: assert the added expense shares'' debtor_ids match private_data.splitwise_user_ids'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.splitwise_user_ids
    rationale: A mismatch in expense-share debtor identifiers registers failure.
  - text: '[appworld_test_014_71000abc6b64] fails exactly when this official requirement is not satisfied: assert the added expense shares'' share_amount matches the total cost of the amazon order divided by private_data.num_trip_mates.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.num_trip_mates
    rationale: Any share amount outside the evaluator's comparison tolerance registers failure.
  - text: '[appworld_test_015_5b8e91d51ad8] fails exactly when this official requirement is not satisfied: obtain added, updated, removed venmo.PaymentRequest records using models.changed_records, and assert num_trip_mates are added, 0 are updated, and 0 are removed'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.num_trip_mates
    rationale: Incorrect PaymentRequest addition, update, or removal counts register failure.
  - text: '[appworld_test_016_a9cbbdae4679] fails exactly when this official requirement is not satisfied: assert the added payment requests'' receiver_ids match private_data.venmo_user_ids.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.venmo_user_ids
    rationale: A mismatch in payment-request receiver identifiers registers failure.
  - text: '[appworld_test_017_d663f249f882] fails exactly when this official requirement is not satisfied: assert the added payment requests'' amount matches the owed amount for each trip mate'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$.num_trip_mates
    rationale: Any requested amount outside the evaluator's comparison tolerance registers failure.
  - text: '[appworld_test_018_2f434bba020d] fails exactly when this official requirement is not satisfied: obtain added, updated, removed todoist.Task records using models.changed_records, and assert 0 are added or removed'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Any Todoist Task addition or removal registers failure.
  - text: '[appworld_test_019_642b40358fd4] fails exactly when this official requirement is not satisfied: assert all updated tasks have changed only in is_completed field using models.changed_field_names.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Any updated task with a changed-field set other than exactly is_completed registers failure.
  - text: '[appworld_test_020_be4374b98823] fails exactly when this official requirement is not satisfied: obtain added, updated, removed todoist.SubTask records using models.changed_records, and assert 0 are added or removed.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Any Todoist SubTask addition or removal registers failure.
  - text: '[appworld_test_021_2d4155603cf8] fails exactly when this official requirement is not satisfied: assert the updated subtasks were only updated in is_completed field (if at all) using models.changed_fields.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Any updated subtask with a changed-field set other than exactly is_completed registers failure.
  - text: '[appworld_test_022_f983c31c6349] fails exactly when this official requirement is not satisfied: obtain added, removed splitwise.GroupMember records using models.changed_records, and assert 0 are removed.'
    support:
    - official/ground_truth/evaluation.py::evaluate

  - text: '[appworld_test_024_d7bf59352100] fails exactly when this official requirement is not satisfied: obtain updated, removed gmail.UserEmailThread records using models.changed_records, and assert none are updated or removed.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    rationale: Any updated or removed Gmail UserEmailThread record registers failure.
  undecided_if:
  - text: Undecided only if retained evidence cannot determine one or more frozen registered-test outcomes.
    support:
    - case_packet.md::L15-L31
    - official/ground_truth/evaluation.py::evaluate
    rationale: A registered-test outcome must not be inferred when its decisive retained evidence is missing or non-decisive.
stronger:
  additional_conditions:
  - id: expense_receipt_attachment
    text: Beyond native scoring, the added Splitwise expense must retain the Amazon order receipt attachment requested by the Todoist task.
    rationale: The task explicitly requires attaching the order receipt, while the registered evaluator checks changed model names and expense values and relationships without asserting that the receipt is attached to the added expense.
    decisive_artifacts:
    - artifact: Retained post-run Splitwise expense and attachment/file records
      question: Does the added camping-order expense reference an attachment that is the receipt for the added Amazon order?
      support:
      - official/dbs/todoist.jsonl::L24
      - official/ground_truth/evaluation.py::evaluate
    support:
    - official/dbs/todoist.jsonl::L24
    - official/ground_truth/evaluation.py::evaluate

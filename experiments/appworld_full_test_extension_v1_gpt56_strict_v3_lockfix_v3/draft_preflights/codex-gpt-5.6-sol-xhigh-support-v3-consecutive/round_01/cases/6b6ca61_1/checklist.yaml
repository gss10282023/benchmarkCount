schema_version: case_checklist_v1
case_unit_id: 6b6ca61_1
domain: appworld
task_id: 6b6ca61_1
native:
  user_goal:
    text: For each person in owe_list.csv, privately send the specified amount and description by Venmo when they have an account; otherwise create an individual, non-grouped Splitwise expense with the same details and attach the corresponding PDF receipt.
    support:
    - official/specs.json::$.instruction
  benchmark_success:
    text: '[appworld_all_registered_tests] all registered tests pass: [appworld_test_001_844d21b309f0], [appworld_test_002_0341fda2d7fa], [appworld_test_003_7fce5dcfdcb0], [appworld_test_004_809c5094cd3f], [appworld_test_005_828803754ab5], [appworld_test_006_b9147e7947d6], [appworld_test_007_d95e2b37941a], [appworld_test_008_012af389d8d1], [appworld_test_009_4fd5e96874f0], [appworld_test_010_5e39200b4bc3], [appworld_test_011_aaab9ea206fd], [appworld_test_012_b77da8a690a3], [appworld_test_013_59a535667e5f], [appworld_test_014_83d4648a9365], [appworld_test_015_916f53ad1e07], [appworld_test_016_1625d7ee148b], [appworld_test_017_14aa3e876bd7], [appworld_test_018_e8df2b19d6fa], [appworld_test_019_f82af6ef0b60]'
    support:
    - case_packet.md::L19-L46
    - official/ground_truth/evaluation.py::evaluate
    rationale: Frozen TestTracker success requires every registered test to pass.
  checked_by:
    text: The frozen AppWorld TestTracker runs the case evaluator and reports success exactly when pass_count equals num_tests across the 19 registered tests.
    support:
    - case_packet.md::L19-L27
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/test_data.json::$
  decisive_artifacts:
  - artifact: Full TestTracker evaluation result
    question: Does the retained result report success with all 19 registered requirements passed and no registered failure?
    support:
    - case_packet.md::L19-L27
    - official/ground_truth/test_data.json::$
  - artifact: Final supervisor task record
    question: Does its parsed answer equal the official null answer?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
  - artifact: Retained pre-run and post-run AppWorld model states or deterministic model-change report
    question: Do the Venmo, Splitwise, notification, user, and file-system records satisfy every record-set, value, relationship, attachment, and allowed-change comparison performed by the evaluator?
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/private_data.json::$
    - official/ground_truth/public_data.json::$
  success_if:
  - text: '[appworld_test_001_844d21b309f0] passes exactly when this official requirement is satisfied: assert answers match.'
    support:
    - official/ground_truth/evaluation.py::evaluate
    - official/ground_truth/answer.json::$
    rationale: The evaluator compares the parsed final task answer with the official answer.
  - text: '[appworld_test_002_0341fda2d7fa] passes exactly when this official requirement is satisfied: assert model changes match venmo.Transaction, venmo.Notification, splitwise.Expense, splitwise.ExpenseShare, splitwise.Notification, ignoring gmail.GlobalEmailThread, gmail.UserEmailThread, gmail.Email, gmail.Attachment, venmo.User, venmo.BankTransfer, file_system.Directory, file_system.File.'

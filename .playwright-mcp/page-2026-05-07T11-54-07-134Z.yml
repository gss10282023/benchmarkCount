        - heading "Minimal Reproduction Package" [level=2] [ref=e337]
        - paragraph [ref=e338]:
          - code [ref=e339]: neurips_ed_track_minimal/
          - text: is the reviewer-facing minimal code package. It contains the code path used to transform original case content into draft checklists, pair those drafts with benchmark case run artifacts, and run the evidence-scoring comparison that produces score outputs.
        - paragraph [ref=e340]: This package is intentionally smaller than the full development tree. Reviewers should start here when checking that the submitted code can run.
        - heading "Original Case Content" [level=2] [ref=e341]
        - paragraph [ref=e342]:
          - code [ref=e343]: experiments/case_packets/
          - text: stores the original case content used as input to the draft/checklist pipeline. These case packets are the source-side artifacts that feed into
          - code [ref=e344]: neurips_ed_track_minimal/
          - text: before draft generation, benchmark run artifact collection, and evidence scoring.
        - heading "Experiment Reproduction Flow" [level=2] [ref=e345]
        - paragraph [ref=e346]:
          - text: To reproduce the paper pipeline at the artifact level, start from the case packets in
          - code [ref=e347]: paper_result_packages/
          - text: . A case packet is a Markdown file that consolidates the benchmark-specific files for one selected benchmark case into one reviewer-readable input.
        - paragraph [ref=e348]: "The reproduction flow is:"
        - list [ref=e349]:
          - listitem [ref=e350]:
            - text: Feed a case packet into
            - code [ref=e351]: neurips_ed_track_minimal/

    - official/install/android_world/task_metadata.json::[task_name=RecipeDeleteDuplicateRecipes3].task_template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.goal
  benchmark_success:
    text: Pass iff the official evaluator records success (1.0) for RecipeDeleteDuplicateRecipes3; operationally, this task checks the Broccoli `recipes` table with the task-specific duplicate-deletion integrity rule.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.validate_deletion_integrity
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.table_name
  checked_by:
    text: Official AndroidWorld SQLite-backed evaluator over Broccoli DB `/data/data/com.flauschcode.broccoli/databases/broccoli`, table `recipes`, keyed by `recipeId`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.db_path
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.table_name
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.db_key
  decisive_artifacts:
  - artifact: Official evaluator result record for RecipeDeleteDuplicateRecipes3
    question: Did the official task evaluator record 1.0 or 0.0 for this run?
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
    - official/install/android_world/registry.py::TaskRegistry._TASKS
  - artifact: Broccoli `recipes` table export or before/after DB snapshots including `recipeId` and recipe fields
    question: Relative to the initial table, was exactly one member of the initial exact-duplicate pair removed while the other copy and all other initial rows were preserved?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.db_path
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.table_name
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.db_key
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.validate_deletion_integrity
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes3.generate_random_params
  success_if:
  - text: A retained official evaluator record shows success / 1.0 for this task; equivalently, before/after `recipes` snapshots show one of the initially exact-duplicate recipe rows removed, the other duplicate row retained, and all other initial rows preserved.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.validate_deletion_integrity
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.db_key
  fail_if:
  - text: A retained official evaluator record shows failure / 0.0 for this task.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
  - text: DB evidence shows both initial duplicate rows remain, both were deleted, or any non-target initial row is missing or altered after the run.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.validate_deletion_integrity
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.db_key
  undecided_if:
  - text: No official evaluator verdict is retained, and the stored DB evidence does not include readable before-and-after `recipes` state sufficient to identify the initial exact-duplicate pair and compare row preservation/removal.
    rationale: This task’s check is state-based over the Broccoli SQLite table; post-run-only UI evidence or an incomplete DB dump is not enough to reconstruct the native decision.

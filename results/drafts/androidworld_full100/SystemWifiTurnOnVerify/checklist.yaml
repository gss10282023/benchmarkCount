schema_version: case_checklist_v1
case_unit_id: SystemWifiTurnOnVerify
domain: androidworld
task_id: SystemWifiTurnOnVerify
native:
  user_goal:
    text: Turn wifi on.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemWifiToggle
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemWifiTurnOnVerify.generate_random_params
  benchmark_success:
    text: Native success is `1.0` iff the evaluator reads `settings get global wifi_on` and the returned value is `1` or `2`.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemWifiTurnOnVerify.generate_random_params
  checked_by:
    text: Post-run ADB read of Android global setting `wifi_on` via `shell settings get global wifi_on`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  decisive_artifacts:
  - artifact: Post-run device-state capture or evaluator/ADB output
    question: What value was returned for `settings get global wifi_on` at evaluation time?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  success_if:
  - text: A retained post-run readout shows `settings get global wifi_on` returned `1` or `2`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemWifiTurnOnVerify.generate_random_params
  fail_if:
  - text: A retained post-run readout shows `settings get global wifi_on` returned a concrete value other than `1` or `2` (including `0`).
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemWifiTurnOnVerify.generate_random_params
  undecided_if:
  - text: No trustworthy readable post-run `settings get global wifi_on` result is retained.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    rationale: Without the evaluator-visible `wifi_on` value, the native pass/fail condition cannot be reconstructed from stored evidence.
stronger:
  additional_conditions:
  - id: verification-kept-on-throughout
    text: If a full interaction trace is retained, wifi stays on throughout; the agent does not turn it off and later back on.
    rationale: This class is explicitly a verification task with precondition that wifi is already on, but the released evaluator only checks the final `wifi_on` value.
    decisive_artifacts:
    - artifact: Full interaction trace or screen recording
      question: Does the retained trace show wifi remaining on throughout the run, with no off transition?
      support:
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemWifiTurnOnVerify
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemWifiTurnOnVerify.initialize_task
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemWifiTurnOnVerify
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemWifiTurnOnVerify.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful

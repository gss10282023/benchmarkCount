schema_version: case_checklist_v1
case_unit_id: RetroPlayingQueue
domain: androidworld
task_id: RetroPlayingQueue
native:
  user_goal:
    text: Add the requested songs to the Retro Music playing queue in the given order.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/retro_music.py::RetroPlayingQueue.goal
    - derived/selected_task_source.json::task_template
  benchmark_success:
    text: 'Benchmark success iff the official evaluator returns success for `RetroPlayingQueue`: the title list returned by `SELECT title from playing_queue;` exactly equals the expected song-title list for the run, in order.'
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/retro_music.py::RetroPlayingQueue.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/retro_music.py::_get_playing_queue
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
  checked_by:
    text: '`RetroPlayingQueue.is_successful`, using `_get_playing_queue` on Retro Music''s playback-state database.'
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/retro_music.py::RetroPlayingQueue.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/retro_music.py::_get_playing_queue
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/retro_music.py::_PLAYBACK_DB_PATH
  decisive_artifacts:
  - artifact: Run task prompt or task-params record
    question: What song titles, and in what order, were requested for this run?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/retro_music.py::RetroPlayingQueue.goal
    - derived/selected_task_source.json::task_template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/retro_music.py::RetroPlayingQueue.is_successful
  - artifact: Post-run copy of Retro Music `music_playback_state.db`, or an exact retained output of `SELECT title from playing_queue;`
    question: What title sequence does the evaluator's queue query return after the run?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/retro_music.py::_PLAYBACK_DB_PATH
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/retro_music.py::_get_playing_queue
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/retro_music.py::RetroPlayingQueue.is_successful
  success_if:
  - text: The retained run spec identifies the requested song titles/order, and the retained playback-state DB or exact evaluator-query output shows `SELECT title from playing_queue;` returns exactly that same title sequence.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/retro_music.py::RetroPlayingQueue.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/retro_music.py::_get_playing_queue
  fail_if:
  - text: The retained run spec identifies the requested song titles/order, and the retained playback-state DB or exact evaluator-query output shows any different sequence from the expected one under `SELECT title from playing_queue;` (wrong order, missing title, extra title, or different title).
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/retro_music.py::RetroPlayingQueue.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/retro_music.py::_get_playing_queue
  undecided_if:
  - text: No retained artifact reliably identifies the requested song titles and order for this run.
    rationale: The native check compares the queue against a run-specific expected title sequence; without that sequence, success vs. failure cannot be verified.
  - text: No readable post-run playback-state DB, or no exact retained output of the evaluator query on `playing_queue`, is available.
    rationale: The native check is determined by the titles returned from `SELECT title from playing_queue;`; partial UI evidence is not enough to establish exact list equality.
stronger:
  additional_conditions: []

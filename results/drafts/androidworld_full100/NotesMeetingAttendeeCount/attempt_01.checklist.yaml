schema_version: case_checklist_v1
case_unit_id: NotesMeetingAttendeeCount
domain: androidworld
task_id: NotesMeetingAttendeeCount
native:
  user_goal:
    text: Find the meeting note titled '{title}' in Joplin and answer how many attendees were present, as a single number.
    support:
    - derived/selected_task_source.json::task_template
  benchmark_success:
    text: 'Native success is binary: the run must leave a non-empty interaction_cache, and the released InformationRetrieval answer checker must judge the recorded answer equal to the task instance''s answer; otherwise the score is 0.0.'
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  checked_by:
    text: Released InformationRetrieval.is_successful, which scores env.interaction_cache via proto_utils.check_agent_answer.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  decisive_artifacts:
  - artifact: Task prompt or params record
    question: Which meeting title was requested?
    support:
    - derived/selected_task_source.json::task_template
  - artifact: In-run screenshot or screen recording of the relevant Joplin note
    question: For that title, what attendee count is shown or implied by the note?
    support:
    - derived/selected_task_source.json::task_template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.tear_down
  - artifact: Interaction transcript or retained interaction_cache
    question: What answer text did the agent provide for scoring?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  success_if:
  - text: The task record identifies title T; retained Joplin-note evidence for T shows attendee count N; and the recorded answer text is the numeral N.
    support:
    - derived/selected_task_source.json::task_template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  fail_if:
  - text: The interaction transcript/cache is empty, so the released evaluator returns 0.0.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  - text: The task record identifies title T; retained Joplin-note evidence for T shows attendee count N; and the recorded answer text is a different numeral than N.
    support:
    - derived/selected_task_source.json::task_template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  undecided_if:
  - text: The retained evidence does not preserve the requested title, a readable in-run capture of the relevant note, or the recorded answer text.
    support:
    - derived/selected_task_source.json::task_template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.tear_down
    rationale: Without these artifacts, a reviewer cannot reconstruct both the correct attendee count and the submitted answer.
  - text: The recorded answer includes extra wording or formatting instead of a bare numeral.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    rationale: The packet shows scoring calls proto_utils.check_agent_answer, but not that function's exact normalization/parsing behavior.
stronger:
  additional_conditions:
  - id: opened_requested_joplin_note
    text: Require retained run evidence that the agent actually opened or visibly inspected the Joplin note titled '{title}' to obtain the attendee count, since native scoring only checks answer-text equality in interaction_cache.
    rationale: The task wording is about retrieving information from the Joplin app, but the released evaluator scores only the recorded answer text.
    decisive_artifacts:
    - artifact: Task prompt or params record
      question: Which note title had to be answered?
      support:
      - derived/selected_task_source.json::task_template
    - artifact: Run screenshot or screen recording
      question: Did the agent open or visibly inspect the Joplin note with that title and expose the attendee information?
      support:
      - derived/selected_task_source.json::task_template
    support:
    - derived/selected_task_source.json::task_template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful

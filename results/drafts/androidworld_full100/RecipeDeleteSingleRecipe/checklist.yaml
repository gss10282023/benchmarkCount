schema_version: case_checklist_v1
case_unit_id: RecipeDeleteSingleRecipe
domain: androidworld
task_id: RecipeDeleteSingleRecipe
native:
  user_goal:
    text: Delete the one specified recipe from the Broccoli app.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteSingleRecipe
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.goal
  benchmark_success:
    text: 'Binary pass/fail: count success only if this task''s Broccoli recipe deletion-integrity check passes for the single designated target recipe row.'
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteSingleRecipe
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
  checked_by:
    text: Comparison of Broccoli SQLite `recipes` table state before vs after the run, keyed by `recipeId`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
  decisive_artifacts:
  - artifact: Task parameter record / target recipe specification
    question: Which single recipe row was designated for deletion (at least its `recipeId`, ideally also title)?
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.params
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteSingleRecipe
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.goal
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
  - artifact: Before/after export of Broccoli SQLite database table `recipes`
    question: Does the after-state differ from the before-state by removal of exactly that target row and no other recipe-row changes?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
  success_if:
  - text: The retained target specification identifies one designated recipe row, the before-state contains that row, and the after-state no longer contains that same `recipeId`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteSingleRecipe
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
  - text: The before/after `recipes` table diff otherwise matches an exact removal of that one target row, with no added, removed, or altered non-target recipe rows.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
  fail_if:
  - text: The designated target recipe row is still present in the after-state.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
  - text: The before/after `recipes` table diff is not an exact removal of the designated target row—for example, some other recipe row was added, removed, or altered.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
  undecided_if:
  - text: Retained evidence is missing the target-row specification, the before-state export, or the after-state export, or only title-level/UI-level evidence is available so the `recipeId`-keyed table diff cannot be reconstructed.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
stronger:
  additional_conditions:
  - id: broccoli_ui_not_out_of_band_db_edit
    text: 'Gap vs native: require retained UI/action evidence showing the deletion was carried out through the Broccoli app UI, not only by an out-of-band database/file mutation that yields the same final table state.'
    rationale: The task intent is framed as deleting a recipe from the Broccoli app, while the released validator visible here checks Broccoli database row state only.
    decisive_artifacts:
    - artifact: UI action trace, screenshots, or screen recording
      question: Do the retained interaction artifacts show Broccoli app UI use culminating in deletion of the designated recipe, with no out-of-band DB/file edit standing in for the task?
      support:
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.goal
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.goal
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity

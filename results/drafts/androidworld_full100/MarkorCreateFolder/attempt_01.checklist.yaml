schema_version: case_checklist_v1
case_unit_id: MarkorCreateFolder
domain: androidworld
task_id: MarkorCreateFolder
native:
  user_goal:
    text: Create a new folder in Markor named {folder_name}.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateFolder.template
  benchmark_success:
    text: Benchmark success is evaluator score 1.0; for this task that means post-run Markor storage contains a file or folder named {folder_name}.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateFolder.is_successful
  checked_by:
    text: Released evaluator MarkorCreateFolder.is_successful, which calls check_file_or_folder_exists on the requested name in Markor data.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateFolder.is_successful
  decisive_artifacts:
  - artifact: Resolved task params or prompt
    question: What concrete folder_name was requested?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateFolder.schema
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateFolder.template
  - artifact: Post-run Markor data directory listing or filesystem snapshot
    question: Does Markor storage contain an entry named {folder_name}?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateFolder.is_successful
  success_if:
  - text: The evidence identifies the requested folder_name, and reliable post-run Markor filesystem state shows an entry with that name.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateFolder.template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateFolder.is_successful
  fail_if:
  - text: The evidence identifies the requested folder_name, and reliable post-run Markor filesystem state shows no entry with that name.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateFolder.template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateFolder.is_successful
  undecided_if:
  - text: The evidence does not preserve both the concrete requested folder_name and reliable post-run Markor filesystem state needed to reconstruct the evaluator check.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateFolder.template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateFolder.is_successful
    rationale: Without both the requested name and post-run Markor storage state, the evaluator-visible existence test cannot be verified from retained artifacts.
stronger:
  additional_conditions:
  - id: folder_not_file
    text: Beyond native scoring, the entry named {folder_name} should be a directory, not merely any filesystem entry with that name.
    rationale: The task text requires creating a folder, but the released evaluator accepts any file-or-folder existence match.
    decisive_artifacts:
    - artifact: Resolved task params or prompt
      question: What concrete folder_name was requested?
      support:
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateFolder.schema
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateFolder.template
    - artifact: Post-run Markor filesystem snapshot with entry type metadata
      question: If an entry named {folder_name} exists, is it a directory?
      support:
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateFolder.is_successful
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateFolder.template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateFolder.is_successful

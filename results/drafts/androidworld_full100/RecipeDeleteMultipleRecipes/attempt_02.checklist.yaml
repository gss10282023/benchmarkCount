    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.goal
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.generate_random_params
  - artifact: Before/after dump of Broccoli SQLite database table recipes

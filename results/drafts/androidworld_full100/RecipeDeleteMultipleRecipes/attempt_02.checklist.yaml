    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeDeleteMultipleRecipes.validate_deletion_integrity
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp
    rationale: 'The packet does not include the DeleteMultipleRows superclass, so the checklist follows the visible task-specific semantics: a before/after SQLite deletion-integrity check keyed by recipe state, with TaskEval success reported as 1.0 and failure as 0.'
  checked_by:
    text: android_world.task_evals.single.recipe.RecipeDeleteMultipleRecipes, a SQLite-backed TaskEval over Broccoli's recipes table.

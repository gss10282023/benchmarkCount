schema_version: case_checklist_v1
case_unit_id: OpenAppTaskEval
domain: androidworld
task_id: OpenAppTaskEval
native:
  user_goal:
    text: Open the requested app and clear any pop-ups by granting all required permissions.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::OpenAppTaskEval.template
  benchmark_success:
    text: Native success is 1.0 iff the final current activity's parsed package name equals the official package mapped from the run's app_name parameter.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::OpenAppTaskEval.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::parse_component_name
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_APP_NAME_TO_PACKAGE_NAME
  checked_by:
    text: OpenAppTaskEval.is_successful on final device state.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::OpenAppTaskEval.is_successful
  decisive_artifacts:
  - artifact: task parameter record
    question: What app_name was requested for this run?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::OpenAppTaskEval.schema
  - artifact: final current-activity record
    question: At evaluation time, what was the current activity component string, and therefore its package name?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::OpenAppTaskEval.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::parse_component_name
  success_if:
  - text: The retained run record identifies app_name, and the retained final current-activity record yields a package name equal to _APP_NAME_TO_PACKAGE_NAME[app_name].
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::OpenAppTaskEval.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::parse_component_name
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_APP_NAME_TO_PACKAGE_NAME
  fail_if:
  - text: The retained run record identifies app_name, and the retained final current-activity record yields a different package name than _APP_NAME_TO_PACKAGE_NAME[app_name].
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::OpenAppTaskEval.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::parse_component_name
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_APP_NAME_TO_PACKAGE_NAME
  undecided_if:
  - text: The retained evidence does not identify the run's app_name parameter, so the expected package cannot be determined.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::OpenAppTaskEval.schema
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_APP_NAME_TO_PACKAGE_NAME
  - text: No trustworthy final current-activity record is retained, or it is too malformed/ambiguous to extract a package name for comparison.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::OpenAppTaskEval.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::parse_component_name
stronger:
  additional_conditions:
  - id: no_remaining_startup_popup
    text: Beyond the native package-name match, the final UI should show the requested app usable with no blocking startup popup/dialog remaining.
    rationale: The task text explicitly requires clearing pop-ups and granting required permissions, but the released evaluator only compares the current activity package to the target app's package.
    decisive_artifacts:
    - artifact: task parameter record
      question: What app_name was requested for this run?
      support:
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::OpenAppTaskEval.schema
    - artifact: final screenshot or UI hierarchy
      question: Does the final foreground UI for the requested app show no blocking startup popup/dialog?
      support:
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::OpenAppTaskEval.template
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::OpenAppTaskEval.template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::OpenAppTaskEval.is_successful

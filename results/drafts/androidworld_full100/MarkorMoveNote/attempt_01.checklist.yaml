schema_version: case_checklist_v1
case_unit_id: MarkorMoveNote
domain: androidworld
task_id: MarkorMoveNote
native:
  user_goal:
    text: Move the specified Markor note `{file_name}` from `{source_folder}` to `{destination_folder}`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMoveNote.template
  benchmark_success:
    text: Single-task native success is 1.0 iff `MarkorMoveNote.is_successful()` returns success; this method delegates the check to `MoveFile` over the Markor data directory.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMoveNote.__init__
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMoveNote.is_successful
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
  checked_by:
    text: Official `MarkorMoveNote.is_successful` result / retained task score, interpreted with the run's task parameters.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMoveNote.template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMoveNote.is_successful
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
  decisive_artifacts:
  - artifact: retained task instance parameters or rendered goal text
    question: What were the run-specific values of `{file_name}`, `{source_folder}`, and `{destination_folder}`?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMoveNote.template
  - artifact: retained official evaluator result / task score for `MarkorMoveNote`
    question: Did the official evaluator return 1.0 or 0.0 for this run?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMoveNote.is_successful
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
  - artifact: post-run snapshot or recursive listing of the Markor data directory
    question: After the run, does `{file_name}` appear under `{destination_folder}`, under `{source_folder}`, both, or neither?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMoveNote.template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMoveNote.__init__
  success_if:
  - text: The retained task parameters or rendered goal identify the requested note and folders, the retained official evaluator result for `MarkorMoveNote` is 1.0, and no retained Markor-data artifact contradicts that result.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMoveNote.template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMoveNote.is_successful
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
  fail_if:
  - text: The retained task parameters or rendered goal identify the requested note and folders, and the retained official evaluator result for `MarkorMoveNote` is 0.0.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMoveNote.template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMoveNote.is_successful
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
  - text: Even without a retained evaluator result, retained Markor-data state clearly shows `{file_name}` still under `{source_folder}`, absent from `{destination_folder}`, or present in both folders after the run.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMoveNote.template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMoveNote.__init__
  undecided_if:
  - text: The run-specific `{file_name}`, `{source_folder}`, or `{destination_folder}` values are not retained.
    rationale: Without the task instance values, stored post-run evidence cannot be matched to the requested move.
  - text: No retained evaluator result is available, and retained filesystem evidence does not clearly establish the note's final location relative to both source and destination folders.
    rationale: The visible task class delegates to an external `MoveFile` validator; incomplete post-run state is not enough to verify native success.
  - text: Retained evaluator result and retained Markor-data filesystem evidence conflict.
    rationale: Conflicting stored artifacts do not permit a confident native verdict without resolving which artifact is trustworthy.
stronger:
  additional_conditions:
  - id: performed_in_markor_ui
    text: In addition to native success, retained UI trace should show the move being carried out inside the Markor app UI, not merely by externally changing files in Markor storage.
    rationale: The task text says to do the move "In Markor", but the released evaluator shown here delegates to a filesystem `MoveFile` check on the Markor data directory and does not verify which app or mechanism performed the move.
    decisive_artifacts:
    - artifact: retained task instance parameters or rendered goal text
      question: Which note and folders should the UI trace show being moved?
      support:
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMoveNote.template
    - artifact: retained screen recording, UI trace, or action log
      question: Does it show the file move being executed in Markor's UI?
      support:
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMoveNote.template
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMoveNote.is_successful
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMoveNote.template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMoveNote.__init__
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMoveNote.is_successful

schema_version: case_checklist_v1
case_unit_id: SportsTrackerActivitiesCountForWeek
domain: androidworld
task_id: SportsTrackerActivitiesCountForWeek
native:
  user_goal:
    text: Answer how many activities of the requested category were done this week in the OpenTracks app, as a single integer.
    support:
    - derived/selected_task_source.json::task_template
  benchmark_success:
    text: The released evaluator returns 1.0 iff the final `interaction_cache` is non-empty and `proto_utils.check_agent_answer` accepts that answer for the instantiated task; otherwise it returns 0.0.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.initialize_task
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
  checked_by:
    text: Released `InformationRetrieval.is_successful` for this information-retrieval task.
    support:
    - derived/selected_task_source.json::base_class_name
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  decisive_artifacts:
  - artifact: Task instance record
    question: Does the retained prompt or params identify this SportsTrackerActivitiesCountForWeek instance, including the asked activity category?
    support:
    - derived/selected_task_source.json::task_id
    - derived/selected_task_source.json::task_template
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
  - artifact: Final answer record
    question: What answer string was stored as the run's final `interaction_cache` / final response?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  - artifact: Official evaluation result
    question: Did the released evaluator accept that final answer for this task instance (1.0 vs 0.0)?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  success_if:
  - text: The retained official evaluation result for the identified task instance is 1.0.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  fail_if:
  - text: The retained official evaluation result for the identified task instance is 0.0.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  - text: The retained run log shows no final answer was recorded in `interaction_cache`; the released evaluator returns 0.0 in that case.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  - text: The retained evaluator log shows the final answer was rejected by `check_agent_answer` or triggered its `ValueError` path.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  undecided_if:
  - text: No official evaluation result is retained, and the stored evidence does not reliably identify both the task instance/category and the final submitted answer.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/task_eval.py::TaskEval.goal
    rationale: Without those artifacts, the benchmark's answer-comparison check cannot be verified from post-run evidence.
stronger:
  additional_conditions:
  - id: used_opentracks
    text: Beyond native scoring, retained interaction evidence shows the agent actually used the OpenTracks app to determine the count for the asked category this week; a correct integer alone is not enough.
    rationale: The task text asks for the answer in the OpenTracks app, but the released evaluator only checks the recorded final answer string via `check_agent_answer` and does not verify app use.
    decisive_artifacts:
    - artifact: UI trajectory or screen recording
      question: Does it show the agent opening OpenTracks and inspecting the relevant week/category before answering?
      support:
      - derived/selected_task_source.json::task_template
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - artifact: Final answer record
      question: Was the submitted integer produced after that OpenTracks interaction?
      support:
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    support:
    - derived/selected_task_source.json::task_template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful

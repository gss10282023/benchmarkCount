schema_version: case_checklist_v1
case_unit_id: SystemBluetoothTurnOffVerify
domain: androidworld
task_id: SystemBluetoothTurnOffVerify
native:
  user_goal:
    text: Turn bluetooth off.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.template
    - official/install/android_world/task_evals/single/system.py::SystemBluetoothTurnOffVerify.generate_random_params
  benchmark_success:
    text: 'Native success requires both official checks: the episode completes with `done=true`, and the evaluator-visible Android global setting `bluetooth_on` is `0` at scoring time.'
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  checked_by:
    text: Checked by `_SystemBluetoothToggle.is_successful` for the Bluetooth setting, with `_run_task` applying the `done` gate to the benchmark score.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
    - official/install/android_world/suite_utils.py::_run_task
  decisive_artifacts:
  - artifact: episode trace or runner record with terminal completion evidence
    question: Does retained underlying execution evidence show the episode ended with `done=true` or `done=false`?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: post-run Android settings evidence
    question: Does retained evaluator-visible state show `global.bluetooth_on` was `0` or not `0` at scoring time?
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
  success_if:
  - text: Retained evidence shows the episode ended with `done=true` and the post-run evaluator-visible setting `bluetooth_on` was `0`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
  fail_if:
  - text: Retained evidence shows the episode ended with `done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: Retained evaluator-visible state shows the post-run setting `bluetooth_on` was not `0`.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
  undecided_if:
  - text: Retained evidence does not reliably establish both the runner completion gate and a usable evaluator-visible `bluetooth_on` observation, and no retained evidence independently establishes either failure condition above.
    support:
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
stronger:
  additional_conditions: []

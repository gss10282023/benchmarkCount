schema_version: case_checklist_v1
case_unit_id: SystemBluetoothTurnOffVerify
domain: androidworld
task_id: SystemBluetoothTurnOffVerify
native:
  user_goal:
    text: Turn Bluetooth off.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBluetoothToggle
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBluetoothTurnOffVerify.generate_random_params
  benchmark_success:
    text: 'Native success is a single final-state check: the released evaluator returns success iff Android global setting `bluetooth_on` equals `0` for this case (`on_or_off=''off''`).'
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBluetoothTurnOffVerify.generate_random_params
  checked_by:
    text: Released task evaluator `_SystemBluetoothToggle.is_successful`, via `settings get global bluetooth_on`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
  decisive_artifacts:
  - artifact: Evaluation-time output for `settings get global bluetooth_on`
    question: Does it show `0`?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBluetoothTurnOffVerify.generate_random_params
  success_if:
  - text: A retained evaluation-time read of Android global setting `bluetooth_on` shows `0`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBluetoothTurnOffVerify.generate_random_params
  fail_if:
  - text: A retained evaluation-time read of Android global setting `bluetooth_on` shows any readable value other than `0`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBluetoothTurnOffVerify.generate_random_params
  undecided_if:
  - text: No retained evaluation-time output, or equivalent evaluator-visible state capture, for `settings get global bluetooth_on` is available, or the retained value is unreadable.
    rationale: The native decision depends on the exact `bluetooth_on` value read by the evaluator; without that retained value, post-run review cannot verify success or failure.
stronger:
  additional_conditions:
  - id: verification_intent_no_state_change
    text: 'Stronger than native: because this is a verification variant, require retained interaction evidence that the agent did not turn Bluetooth on and then back off merely to satisfy the final-state check.'
    rationale: '`SystemBluetoothTurnOffVerify` is described as verifying Bluetooth is already off, but the released evaluator only checks the final `bluetooth_on == 0` state, so a run can pass after changing Bluetooth during the run.'
    decisive_artifacts:
    - artifact: Interaction trace or screen recording of the run
      question: Does it show no Bluetooth-enable action and no transition to Bluetooth on during the run?
      support:
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBluetoothTurnOffVerify
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
    - artifact: Evaluation-time output for `settings get global bluetooth_on`
      question: Does it still show `0` at evaluation time?
      support:
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBluetoothTurnOffVerify.generate_random_params
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBluetoothTurnOffVerify
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBluetoothToggle.is_successful

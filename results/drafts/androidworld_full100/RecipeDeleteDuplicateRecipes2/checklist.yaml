schema_version: case_checklist_v1
case_unit_id: RecipeDeleteDuplicateRecipes2
domain: androidworld
task_id: RecipeDeleteDuplicateRecipes2
native:
  user_goal:
    text: Delete all but one of any exact-duplicate recipes in the Broccoli app, leaving at least one instance of each unique recipe.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes2.goal
    - derived/selected_task_source.json::task_template
  benchmark_success:
    text: Success when the Broccoli `recipes` table after the run matches the pre-run table with exactly one of the two exact-duplicate target rows removed (either duplicate may be removed) and no other rows changed; same-title but non-identical recipes are not targets.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.validate_deletion_integrity
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes2.generate_random_params
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.db_key
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.table_name
  checked_by:
    text: Before/after comparison of the Broccoli SQLite database `recipes` table, keyed by `recipeId`, using the task's deletion-integrity validator.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.db_path
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.table_name
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.db_key
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.validate_deletion_integrity
  decisive_artifacts:
  - artifact: Pre-run dump of `/data/data/com.flauschcode.broccoli/databases/broccoli` table `recipes`
    question: What rows, including `recipeId` and full recipe fields, were present before the run?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.db_path
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.table_name
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.db_key
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes2.generate_random_params
  - artifact: Post-run dump of `/data/data/com.flauschcode.broccoli/databases/broccoli` table `recipes`
    question: What rows, including `recipeId` and full recipe fields, were present after the run?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.db_path
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.table_name
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.db_key
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.validate_deletion_integrity
  success_if:
  - text: The pre/post `recipes` table dumps show one exact-duplicate pair in the pre-run state, and the post-run state is the pre-run state with exactly one member of that pair removed.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.validate_deletion_integrity
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes2.generate_random_params
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.db_key
  - text: All other rows remain, including same-title variants that are not exact duplicates.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.validate_deletion_integrity
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes2.generate_random_params
  fail_if:
  - text: The pre/post dumps show both members of the exact-duplicate pair still present, or both removed.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.validate_deletion_integrity
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp.db_key
  - text: Any row other than one member of the exact-duplicate pair is removed or changed, including deleting same-title but non-identical recipes.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes.validate_deletion_integrity
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeDeleteDuplicateRecipes2.generate_random_params
  undecided_if:
  - text: The retained evidence lacks either the pre-run or post-run `recipes` table state, or omits `recipeId` or full row contents needed to tell exact duplicates from same-title variants.
    rationale: The official check is a before/after database integrity comparison keyed by `recipeId`; partial UI evidence is not enough to reproduce it.

schema_version: case_checklist_v1
case_unit_id: SaveCopyOfReceiptTaskEval
domain: androidworld
task_id: SaveCopyOfReceiptTaskEval
native:
  user_goal:
    text: In Simple Gallery Pro, copy the specified file from DCIM and save a copy with the same name in Download.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.template
  benchmark_success:
    text: 'Native success is binary: the task passes iff the post-run evaluator finds `params.file_name` in Downloads.'
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/task_eval.py::TaskEval.is_successful
  checked_by:
    text: '`SaveCopyOfReceiptTaskEval.is_successful`, a post-run existence check in Downloads against `params.file_name`.'
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.is_successful
  decisive_artifacts:
  - artifact: Run record with task parameters
    question: What exact `file_name` was assigned for this run?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.is_successful
  - artifact: Post-run Downloads filesystem snapshot or directory listing
    question: Does Downloads contain a file whose name exactly equals that `file_name`?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.is_successful
  success_if:
  - text: Retained evidence identifies the run's `file_name`, and the post-run Downloads state shows a file with exactly that name.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.is_successful
  fail_if:
  - text: Retained evidence identifies the run's `file_name`, and the post-run Downloads state shows that no file with that name exists.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.is_successful
  undecided_if:
  - text: The run's expected `file_name` is not recoverable from retained evidence.
    rationale: The evaluator compares Downloads against `params.file_name`; without that parameter the post-run state cannot be interpreted.
  - text: Retained post-run evidence does not reliably show the contents of Downloads.
    rationale: Missing or incomplete Downloads evidence prevents deciding the evaluator's existence check.
stronger:
  additional_conditions:
  - id: copy_matches_source_not_just_name
    text: Beyond the native check, require evidence that the same-named item still exists in DCIM and that the Downloads file matches that DCIM file, since the released evaluator accepts any Downloads item with the target name.
    rationale: The task text says to copy the file from DCIM and save a copy in Download, but `is_successful` only checks whether `file_name` exists in Downloads.
    decisive_artifacts:
    - artifact: Run record with task parameters
      question: What `file_name` should be compared across DCIM and Downloads?
      support:
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.template
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.is_successful
    - artifact: Post-run retained file or file-hash evidence for DCIM and Downloads
      question: Does DCIM still contain that name, and does the Downloads copy match the DCIM file?
      support:
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.template
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.is_successful
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/simple_gallery_pro.py::SaveCopyOfReceiptTaskEval.is_successful

schema_version: case_checklist_v1
case_unit_id: SystemCopyToClipboard
domain: androidworld
task_id: SystemCopyToClipboard
native:
  user_goal:
    text: Copy the provided `clipboard_content` string to the device clipboard.
    support:
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.template
  benchmark_success:
    text: 'Native success requires both: the episode ended with `interaction_results.done=true`, and a post-run clipboard read matches the task''s `clipboard_content` under `fuzzy_match_lib.fuzzy_match`.'
    support:
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.is_successful
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  checked_by:
    text: 'Runner-gated post-run clipboard comparison: `SystemCopyToClipboard.is_successful` reads the clipboard and compares it to `clipboard_content` with `fuzzy_match_lib.fuzzy_match`, and `_run_task` only records success when `done` is true.'
    support:
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.is_successful
    - official/install/android_world/env/adb_utils.py::get_clipboard_contents
    - official/install/android_world/suite_utils.py::_run_task
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  decisive_artifacts:
  - artifact: Episode completion record
    question: Does retained run evidence establish whether `interaction_results.done` was true or false at episode end?
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - artifact: Post-run clipboard readout
    question: What clipboard text was returned by a retained direct clipboard read or equivalent post-run clipboard log?
    support:
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.is_successful
    - official/install/android_world/env/adb_utils.py::get_clipboard_contents
  success_if:
  - text: Retained completion evidence shows `interaction_results.done=true`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: A retained post-run clipboard read matches the instructed `clipboard_content` under the evaluator's `fuzzy_match` rule.
    support:
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.is_successful
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  fail_if:
  - text: Retained completion evidence shows `interaction_results.done=false`.
    support:
    - official/install/android_world/suite_utils.py::_run_task
  - text: A retained post-run clipboard read does not match the instructed `clipboard_content` under the evaluator's `fuzzy_match` rule.
    support:
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.is_successful
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match
  undecided_if:
  - text: No usable retained post-run clipboard read exists, and retained completion evidence does not already establish `done=false`.
    support:
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.is_successful
    - official/install/android_world/suite_utils.py::_run_task
    rationale: Without underlying clipboard text, the evaluator-visible comparison cannot be reconstructed unless the done gate already fixes failure.
  - text: The retained post-run clipboard read satisfies the evaluator's match rule, but retained completion evidence does not establish whether the episode ended with `done=true`.
    support:
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.is_successful
    - official/install/android_world/suite_utils.py::_run_task
    rationale: A matching clipboard alone is insufficient because the runner gates native success on `interaction_results.done`.
stronger:
  additional_conditions:
  - id: exact_clipboard_text
    text: Beyond native scoring, if native success is otherwise supported, the retained post-run clipboard text should equal the instructed `clipboard_content` exactly, not merely satisfy the evaluator's fuzzy match.
    rationale: The task instruction asks for the provided text to be copied to the clipboard, while the native evaluator uses `fuzzy_match_lib.fuzzy_match`, which can accept approximate, case-insensitive matches.
    decisive_artifacts:
    - artifact: Post-run clipboard readout
      question: Is the retained post-run clipboard text exactly equal to the instructed `clipboard_content` string?
      support:
      - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.template
      - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.is_successful
    support:
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.template
    - official/install/android_world/task_evals/single/system.py::SystemCopyToClipboard.is_successful
    - official/install/android_world/utils/fuzzy_match_lib.py::fuzzy_match

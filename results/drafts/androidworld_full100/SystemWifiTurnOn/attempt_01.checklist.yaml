schema_version: case_checklist_v1
case_unit_id: SystemWifiTurnOn
domain: androidworld
task_id: SystemWifiTurnOn
native:
  user_goal:
    text: Turn wifi on.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemWifiToggle.template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemWifiTurnOn.generate_random_params
  benchmark_success:
    text: This single task succeeds iff the released evaluator returns 1.0; for `SystemWifiTurnOn`, that is when the final `settings get global wifi_on` value is `1` or `2`.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  checked_by:
    text: Released evaluator `_SystemWifiToggle.is_successful`, which reads the final `global.wifi_on` setting.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  decisive_artifacts:
  - artifact: Post-run ADB readout or settings dump containing `global.wifi_on`
    question: 'What is the final `wifi_on` value: `1` or `2`, versus any other value?'
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  success_if:
  - text: Reliable post-run evidence shows final `global.wifi_on` is `1` or `2`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  fail_if:
  - text: Reliable post-run evidence shows final `global.wifi_on` is not `1` or `2`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  undecided_if:
  - text: No reliable retained post-run evidence exposes the final `global.wifi_on` value.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    rationale: Without the evaluator-visible setting value, stored evidence cannot determine success or failure.
stronger:

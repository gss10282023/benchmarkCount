    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBrightnessMin
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.template
  benchmark_success:
    text: This case counts as success iff the official evaluator returns 1.0 after reading `settings get system screen_brightness` and finding integer `1` for this min-brightness case.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBrightnessMin.generate_random_params
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
  checked_by:
    text: Official post-run `is_successful` check against the Android `screen_brightness` system setting.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  decisive_artifacts:
  - artifact: Official evaluator result record
    question: Does the retained result for `SystemBrightnessMin` show score/success `1.0` or `0.0`?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
  - artifact: Post-run brightness setting readout
    question: Does the final retained `settings get system screen_brightness` output equal `1`?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBrightnessMin.generate_random_params
  success_if:
  - text: A retained official evaluator result for this case shows score/success `1.0`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
  - text: Retained post-run state evidence shows the evaluator-visible `screen_brightness` value is exactly `1`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBrightnessMin.generate_random_params
  fail_if:
  - text: A retained official evaluator result for this case shows score/success `0.0`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
  - text: Retained post-run state evidence shows the evaluator-visible `screen_brightness` value parses to an integer other than `1`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBrightnessMin.generate_random_params
  undecided_if:
  - text: No trustworthy retained evaluator result or final `screen_brightness` readout is available, or the retained readout is not clearly final/parseable.
    rationale: The native decision depends on the post-run `screen_brightness` value read by the evaluator; screenshots or action traces alone do not establish that exact value.

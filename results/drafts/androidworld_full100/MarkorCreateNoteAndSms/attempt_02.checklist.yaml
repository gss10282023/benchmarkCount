schema_version: case_checklist_v1
case_unit_id: MarkorCreateNoteAndSms
domain: androidworld
task_id: MarkorCreateNoteAndSms
native:
  user_goal:
    text: Create a new Markor note named {file_name} containing {text}, then share the entire content of that note to {number} via SMS in Simple SMS Messenger.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/composite/markor_sms.py::MarkorCreateNoteAndSms.template
  benchmark_success:
    text: 'Native full success is score 1.0 from the released composite evaluator: `MarkorCreateNoteAndSms` initializes a `MarkorCreateNote(file_name,text)` check and a `SimpleSMSSendSms(number,text)` check, then returns their average, so both subchecks must pass.'
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/composite/markor_sms.py::MarkorCreateNoteAndSms.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/composite/markor_sms.py::MarkorCreateNoteAndSms.is_successful
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
  checked_by:
    text: Released evaluator `android_world.task_evals.composite.markor_sms.MarkorCreateNoteAndSms.is_successful`, using `MarkorCreateNote.is_successful` and `SimpleSMSSendSms.is_successful`.
    support:
    - derived/selected_task_source.json::module
    - derived/selected_task_source.json::class_name
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/composite/markor_sms.py::MarkorCreateNoteAndSms.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/composite/markor_sms.py::MarkorCreateNoteAndSms.is_successful
  decisive_artifacts:
  - artifact: Final Markor data snapshot or extracted target note file
    question: Does a note named {file_name} exist, and does its content satisfy the CreateFile-based MarkorCreateNote check for expected text {text}?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateNote.__init__
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateNote.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMergeNotes.is_successful
  - artifact: Final Simple SMS Messenger sent-message/thread snapshot or export
    question: Does Simple SMS Messenger show a sent SMS to {number} with body {text}?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/composite/markor_sms.py::MarkorCreateNoteAndSms.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/composite/markor_sms.py::MarkorCreateNoteAndSms.template
  success_if:
  - text: 'Retained final state shows both official subchecks pass: the Markor note {file_name} passes the CreateFile-based filename/content check for {text}, and Simple SMS Messenger shows a sent SMS to {number} with body {text}.'
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/composite/markor_sms.py::MarkorCreateNoteAndSms.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/composite/markor_sms.py::MarkorCreateNoteAndSms.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateNote.__init__
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateNote.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMergeNotes.is_successful
  fail_if:
  - text: 'Retained final state shows either official subcheck fails: the target Markor note is missing or does not pass the CreateFile-based text check, or the SMS to {number} with body {text} is missing, unsent, or mismatched; in any such case the composite score is below 1.0.'
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/composite/markor_sms.py::MarkorCreateNoteAndSms.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/composite/markor_sms.py::MarkorCreateNoteAndSms.is_successful
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateNote.__init__
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorCreateNote.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMergeNotes.is_successful
  undecided_if:
  - text: Retained artifacts do not let the reviewer resolve one or both subchecks, e.g. the final target note content/state or the relevant SMS sent-message state is missing or unreadable.
    rationale: Native full success depends on both the note-creation and SMS-send subchecks; without decisive retained evidence for a component, review cannot confirm success or failure from artifacts alone.
stronger:
  additional_conditions:
  - id: share_flow_and_exact_note_body
    text: Beyond the native evaluator, retained evidence shows the SMS was actually sent via Markor's share flow from the created note, and the sent SMS body exactly matches the final saved note content.
    rationale: The official task says to share the entire content of the note via SMS. The released evaluator only averages an independent note-creation check and an independent SMS-send check, and Markor's CreateFile path is noted elsewhere to use fuzzy content matching, so native success does not guarantee an actual share action or exact note-body equality.
    decisive_artifacts:
    - artifact: UI trace/video/screenshots spanning Markor note view through Android share flow into Simple SMS Messenger
      question: Does the retained trace show the created Markor note being shared into Simple SMS Messenger for recipient {number}?
      support:
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/composite/markor_sms.py::MarkorCreateNoteAndSms.template
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/composite/markor_sms.py::MarkorCreateNoteAndSms.initialize_task
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/composite/markor_sms.py::MarkorCreateNoteAndSms.is_successful
    - artifact: Final target note file content plus final sent SMS record
      question: Does the sent SMS body exactly equal the final saved content of {file_name}?
      support:
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/composite/markor_sms.py::MarkorCreateNoteAndSms.template
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/composite/markor_sms.py::MarkorCreateNoteAndSms.initialize_task
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMergeNotes.is_successful
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/composite/markor_sms.py::MarkorCreateNoteAndSms.template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/composite/markor_sms.py::MarkorCreateNoteAndSms.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/composite/markor_sms.py::MarkorCreateNoteAndSms.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorMergeNotes.is_successful

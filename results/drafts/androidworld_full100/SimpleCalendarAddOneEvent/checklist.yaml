schema_version: case_checklist_v1
case_unit_id: SimpleCalendarAddOneEvent
domain: androidworld
task_id: SimpleCalendarAddOneEvent
native:
  user_goal:
    text: Create the specified Simple Calendar Pro event on the given date at the given hour, with the given title, description, and duration.
    support:
    - derived/selected_task_source.json::task_template
  benchmark_success:
    text: 'Native success is evaluator score 1.0 for this single-row-add task: the final Simple Calendar Pro events table passes the task’s event-addition integrity check for the one expected event row.'
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/calendar/calendar.py::SimpleCalendarAddOneEvent.validate_addition_integrity
    rationale: The task-specific pass/fail gate is the delegated calendar addition-integrity validator applied to the final SQLite row set.
  checked_by:
    text: 'SimpleCalendarAddOneEvent via AddMultipleRows: rows are read from Simple Calendar Pro’s SQLite events table, compared against the initialized pre-run row set and the expected reference row.'
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/calendar/calendar.py::_SimpleCalendar
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sqlite_validators.py::SQLiteApp.list_rows
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sqlite_validators.py::SQLiteApp.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
  decisive_artifacts:
  - artifact: Per-run task params / benchmark task record
    question: What exact target event row is expected, and which noise rows were seeded during task initialization?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/calendar/calendar.py::SimpleCalendarAddOneEvent.generate_random_params
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sqlite_validators.py::SQLiteApp.initialize_task
  - artifact: Post-run Simple Calendar Pro events-table SQLite snapshot/dump
    question: Does the final events table equal the seeded noise rows plus one added row matching the expected event under the task’s addition-integrity check?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/calendar/calendar.py::_SimpleCalendar
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sqlite_validators.py::SQLiteApp.list_rows
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
  success_if:
  - text: The retained task params identify one expected event row and the seeded noise rows, and the post-run events-table snapshot shows exactly those seeded rows unchanged plus one added row that matches the expected event under the task’s calendar addition validator.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/calendar/calendar.py::SimpleCalendarAddOneEvent.generate_random_params
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sqlite_validators.py::SQLiteApp.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/calendar/calendar.py::SimpleCalendarAddOneEvent.validate_addition_integrity
  fail_if:
  - text: The post-run events-table snapshot lacks any added row that matches the expected event under the task’s calendar addition validator.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/calendar/calendar.py::SimpleCalendarAddOneEvent.validate_addition_integrity
  - text: Any seeded noise row is missing or altered, or any unexpected extra row is present, so the final table is not exactly the initialized rows plus the one expected addition.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sqlite_validators.py::SQLiteApp.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
  undecided_if:
  - text: The evidence is missing either the per-run expected rows (especially row_objects/noise_row_objects) or a trustworthy post-run events-table snapshot, so the evaluator-visible final state cannot be reconstructed.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/calendar/calendar.py::SimpleCalendarAddOneEvent.generate_random_params
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sqlite_validators.py::AddMultipleRows.is_successful
    rationale: Native success depends on comparing the final SQLite row set against the per-run expected row set.
stronger:
  additional_conditions: []

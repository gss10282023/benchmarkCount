schema_version: case_checklist_v1
case_unit_id: TasksHighPriorityTasks
domain: androidworld
task_id: TasksHighPriorityTasks
native:
  user_goal:
    text: Identify the high-priority tasks in the Tasks app and answer with the task titles only, comma-separated if multiple.
    support:
    - official/install/android_world/task_metadata.json::[109].task_template
  benchmark_success:
    text: 'Native success is a 1.0 from the released InformationRetrieval checker: env.interaction_cache is non-empty and proto_utils.check_agent_answer accepts the captured answer for the initialized task.'
    support:
    - derived/selected_task_source.json::base_class_name
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  checked_by:
    text: Released android_world InformationRetrieval.is_successful evaluator.
    support:
    - derived/selected_task_source.json::base_class_name
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  decisive_artifacts:
  - artifact: official evaluator result or checker trace for this case
    question: Did InformationRetrieval.is_successful return 1.0 or 0.0, and if traced, was the answer-comparison check accepted or rejected?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  - artifact: interaction log / captured agent response text
    question: What exact response text was present in env.interaction_cache, and was it non-empty?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  success_if:
  - text: Retained evaluator output or checker trace shows InformationRetrieval.is_successful = 1.0 for this run, and the captured response in interaction_cache is non-empty.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  fail_if:
  - text: Retained evaluator output or checker trace shows InformationRetrieval.is_successful = 0.0 for this run.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  - text: Retained interaction evidence shows env.interaction_cache was empty / no answer was captured.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  undecided_if:
  - text: No official evaluator result or equivalent checker trace is retained, and the remaining evidence is insufficient to determine whether the released checker would accept the captured answer for the initialized task.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
stronger:
  additional_conditions: []

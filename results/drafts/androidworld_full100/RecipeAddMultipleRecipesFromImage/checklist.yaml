schema_version: case_checklist_v1
case_unit_id: RecipeAddMultipleRecipesFromImage
domain: androidworld
task_id: RecipeAddMultipleRecipesFromImage
native:
  user_goal:
    text: Add the recipes shown in `recipes.jpg` in Simple Gallery Pro to the Broccoli recipe app.
    support:
    - derived/selected_task_source.json::task_template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeAddMultipleRecipesFromImage.goal
  benchmark_success:
    text: Native success is a binary `is_successful()==1.0`; for this task, that means the Broccoli `recipes` table passes the task's official add-multiple addition-integrity check for the run's reference recipe rows.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp
    rationale: The released task class inherits the SQLite add-multiple evaluator and defines the recipe-specific addition-integrity comparison used for scoring.
  checked_by:
    text: The task's official `is_successful()` evaluator, implemented through the recipe SQLite add-multiple checker over Broccoli's `recipes` table.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp
    rationale: This task's visible released checker is database-state-based rather than trace-based.
  decisive_artifacts:
  - artifact: Official evaluator result or score log for the run
    question: Did the official `is_successful()` check record 1.0 or 0.0 for this case?
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
  - artifact: Task instance record or retained generated `recipes.jpg` input
    question: What recipe rows are the official reference rows for this run?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeAddMultipleRecipesFromImage.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.goal
  - artifact: Retained pre-run Broccoli SQLite snapshot or `recipes` table dump
    question: What rows existed in Broccoli `recipes` before the run?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp
  - artifact: Retained post-run Broccoli SQLite snapshot or `recipes` table dump
    question: Does the final Broccoli `recipes` state satisfy the official addition-integrity check for those reference rows?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp
  success_if:
  - text: A retained official evaluator result for this case records `is_successful` = 1.0.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
  - text: Absent a retained evaluator result, stored evidence identifies the run's reference recipe rows and the retained before/after Broccoli `recipes` state shows the official addition-integrity check is satisfied for those rows.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp
  fail_if:
  - text: A retained official evaluator result for this case records `is_successful` = 0.0.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
  - text: Absent a retained evaluator result, stored evidence identifies the run's reference recipe rows and the retained before/after Broccoli `recipes` state shows the official addition-integrity check is not satisfied.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp
  undecided_if:
  - text: No retained evaluator result is available, and the stored artifacts do not preserve both the run's reference recipe rows and enough Broccoli database state to reconstruct the official before/after addition-integrity check.
    rationale: This task's native scoring depends on task-specific target rows plus before/after Broccoli SQLite state.
  - text: A retained evaluator result and the retained task-instance/database artifacts materially conflict.
    rationale: Conflicting stored evidence prevents a clean verification of the benchmark's own scored claim.
stronger:
  additional_conditions:
  - id: opened_gallery_image
    text: A stronger pass additionally requires retained UI evidence that `recipes.jpg` was opened in Simple Gallery Pro during the run, because native scoring only checks Broccoli database contents.
    rationale: The official task text says to add recipes from `recipes.jpg` in Simple Gallery Pro, but the visible released checker is SQLite-state-based on the Broccoli app.
    decisive_artifacts:
    - artifact: Screen recording or UI event trace
      question: Does the retained run evidence show `recipes.jpg` being opened in Simple Gallery Pro?
      support:
      - derived/selected_task_source.json::task_template
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeAddMultipleRecipesFromImage.initialize_task
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    support:
    - derived/selected_task_source.json::task_template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeAddMultipleRecipesFromImage.goal
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeAddMultipleRecipesFromImage.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity

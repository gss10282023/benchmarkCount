schema_version: case_checklist_v1
case_unit_id: SystemBrightnessMaxVerify
domain: androidworld
task_id: SystemBrightnessMaxVerify
native:
  user_goal:
    text: Ensure brightness is at the max value.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBrightnessMaxVerify.generate_random_params
  benchmark_success:
    text: Released evaluator returns success iff the post-run `screen_brightness` system setting is the integer `255` for this fixed-`max` task.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBrightnessMaxVerify.generate_random_params
  checked_by:
    text: An ADB/system-settings read of `settings get system screen_brightness`, compared to exact value `255`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  decisive_artifacts:
  - artifact: Post-run device-state dump or command log containing `settings get system screen_brightness` output
    question: Does it show a parseable integer brightness value, and is it exactly `255`?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBrightnessMaxVerify.generate_random_params
  success_if:
  - text: Retained post-run device-state evidence shows `screen_brightness = 255`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBrightnessMaxVerify.generate_random_params
  fail_if:
  - text: Retained post-run device-state evidence shows a parseable `screen_brightness` value other than `255`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBrightnessMaxVerify.generate_random_params
  undecided_if:
  - text: No retained post-run evidence shows the exact `screen_brightness` value, or the only evidence is indirect UI imagery that does not establish the stored integer setting.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    rationale: The native evaluator reads the numeric system setting directly and requires exact equality to 255.
stronger:
  additional_conditions: []

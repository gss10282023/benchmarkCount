schema_version: case_checklist_v1
case_unit_id: MarkorDeleteNewestNote
domain: androidworld
task_id: MarkorDeleteNewestNote
native:
  user_goal:
    text: Delete the newest note in Markor.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.template
  benchmark_success:
    text: Evaluator returns success iff the post-run Markor file-metadata list, sorted by change_time, matches the initial sorted list at every remaining position on file_name and change_time and has exactly one fewer entry; equivalently, only the initial last entry under that sort is missing.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
  checked_by:
    text: MarkorDeleteNewestNote.is_successful, by comparing initial and post-run Markor directory metadata sorted by change_time.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
  decisive_artifacts:
  - artifact: Initial Markor directory metadata snapshot
    question: What were the initialized notes' file_name and change_time values, in the evaluator's change_time-sorted order?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.initialize_task
  - artifact: Post-run Markor directory metadata snapshot
    question: What are the final notes' file_name and change_time values, in the evaluator's change_time-sorted order?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
  success_if:
  - text: Retained initial and post-run Markor metadata both exist, and the post-run change_time-sorted list has exactly one fewer entry than the initial list.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
  - text: For every retained post-run position, file_name and change_time equal the corresponding entry in the initial change_time-sorted list; thus the only missing entry is the initial final entry under that sort.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
  fail_if:
  - text: The post-run change_time-sorted list does not have exactly one fewer entry than the initial list.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
  - text: Any post-run change_time-sorted entry differs from the corresponding initial entry in file_name or change_time.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful
  undecided_if:
  - text: The retained evidence lacks either the initial or post-run Markor metadata listing with file_name and change_time, or does not determine the evaluator's change_time-sorted order.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/markor.py::MarkorDeleteNewestNote.is_successful

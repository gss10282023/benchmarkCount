schema_version: case_checklist_v1
case_unit_id: SystemWifiTurnOffVerify
domain: androidworld
task_id: SystemWifiTurnOffVerify
native:
  user_goal:
    text: Turn wifi off.
    support:
    - derived/canonical_task_semantics.json::goal.runtime_samples[0].dispatch_goal_model
    - official/install/android_world/task_evals/single/system.py::SystemWifiTurnOffVerify.generate_random_params
  benchmark_success:
    text: Native success requires `done=true` and a final evaluator-visible `global wifi_on` value of `0`.
    support:
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics.done_gate
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  checked_by:
    text: AndroidWorld runner `done` gate plus `_SystemWifiToggle.is_successful`.
    support:
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics.done_gate
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  decisive_artifacts:
  - artifact: Episode completion trace or runner record
    question: Does retained execution evidence show the episode finished with `done=true` or `done=false`?
    support:
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics.done_gate
  - artifact: Retained final evaluator-visible WiFi setting evidence
    question: What final value does retained evidence show for `settings get global wifi_on`, specifically `0` versus a nonzero value?
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  success_if:
  - text: Retained evidence shows `done=true` and shows the final evaluator-visible `global wifi_on` value was `0`.
    support:
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics.done_gate
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  fail_if:
  - text: Retained evidence shows `done=false`.
    support:
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics.done_gate
  - text: Retained evaluator-visible final device-state evidence shows `global wifi_on` was not `0`.
    support:
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
  undecided_if:
  - text: Retained evidence does not establish the runner `done` result, and does not establish a decisive final evaluator-visible `global wifi_on` value; in particular, final `wifi_on=0` without `done` evidence is undecided.
    support:
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics.done_gate
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
stronger:
  additional_conditions:
  - id: require_action_beyond_preset_off_state
    text: Because this verification case initializes WiFi off before the run, require retained trace evidence that the agent actually attempted to turn WiFi off or explicitly verified the WiFi control/state, rather than succeeding solely from the pre-set off state.
    rationale: The user-facing goal is "Turn wifi off.", but `SystemWifiTurnOffVerify.initialize_task` turns WiFi off before interaction and native scoring only checks final `wifi_on` plus `done`, so a no-op can satisfy the native criterion.
    decisive_artifacts:
    - artifact: Episode action/state trace
      question: Does the retained trace show interaction with WiFi or Settings controls, or an explicit WiFi-state check, before completion?
      support:
      - official/install/android_world/task_evals/single/system.py::SystemWifiTurnOffVerify.initialize_task
      - derived/canonical_task_semantics.json::goal.runtime_samples[0].dispatch_goal_model
    support:
    - official/install/android_world/task_evals/single/system.py::SystemWifiTurnOffVerify.initialize_task
    - official/install/android_world/task_evals/single/system.py::_SystemWifiToggle.is_successful
    - derived/canonical_task_semantics.json::goal.runtime_samples[0].dispatch_goal_model
    - derived/canonical_task_semantics.json::evaluator.runner_score_semantics.done_gate

schema_version: case_checklist_v1
case_unit_id: TasksDueNextWeek
domain: androidworld
task_id: TasksDueNextWeek
native:
  user_goal:
    text: Answer how many tasks are due next week in the Tasks app, as a single integer.
    support:
    - derived/selected_task_source.json::task_template
  benchmark_success:
    text: 'This case succeeds iff the official InformationRetrieval evaluator returns 1.0: env.interaction_cache is non-empty and proto_utils.check_agent_answer accepts the cached agent answer for this task.'
    support:
    - derived/selected_task_source.json::base_class_name
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
  checked_by:
    text: Official InformationRetrieval.is_successful scoring for this Tasks task.
    support:
    - derived/selected_task_source.json::base_class_name
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  decisive_artifacts:
  - artifact: Per-case evaluator result or evaluator log
    question: Did the official evaluator record success (1.0) or failure (0.0), and if logged, did answer checking return accepted vs rejected/error?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
  - artifact: Retained interaction_cache or assistant-answer transcript
    question: Was there a non-empty cached answer text for this run, and what exact answer text was compared by the evaluator?
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  success_if:
  - text: The retained official evaluator result for this case is success/1.0.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
  - text: If no top-level score is retained, an official evaluator log still suffices if it shows a non-empty interaction_cache and accepted=true from proto_utils.check_agent_answer for this case.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  fail_if:
  - text: The retained official evaluator result for this case is failure/0.0.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
  - text: Even without a top-level score, failure is established if the retained interaction_cache artifact is empty for the evaluated run.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  - text: Even without a top-level score, failure is established if an official evaluator log shows answer checking rejected the cached answer or raised a ValueError.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
  undecided_if:
  - text: No official evaluator outcome is retained, and the remaining evidence is only answer text/screenshots/transcript fragments.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    rationale: Without the evaluator outcome or its logged accepted/rejected subresult, this packet does not expose the task-specific answer check needed to decide whether the retained answer text counts as correct.
  - text: Neither evaluator output nor a retained interaction_cache/assistant-answer artifact for the run is available.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    rationale: Missing both decisive artifact types leaves no native basis to determine success or failure.
stronger:
  additional_conditions:
  - id: consulted_tasks_app
    text: Beyond native scoring, require retained UI/action evidence that the agent actually opened or inspected the Tasks app before answering, because native scoring accepts a correct cached answer without checking app use.
    rationale: The task asks for information from the Tasks app, but the released evaluator only checks env.interaction_cache via answer matching.
    decisive_artifacts:
    - artifact: UI trace, screen recording, or action log
      question: Does the retained run evidence show the Tasks app was opened or its task list/details were inspected before the final answer was given?
      support:
      - derived/selected_task_source.json::task_template
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful
    support:
    - derived/selected_task_source.json::task_template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/information_retrieval/information_retrieval.py::InformationRetrieval.is_successful

schema_version: case_checklist_v1
case_unit_id: SimpleSmsSend
domain: androidworld
task_id: SimpleSmsSend
native:
  user_goal:
    text: Send the specified text message to the specified phone number using Simple SMS Messenger.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/sms.py::SimpleSmsSend.template
  benchmark_success:
    text: Released evaluator returns 1.0 iff `content://sms/sent` contains a row whose address equals the target number after removing spaces/dashes, whose body matches the target message under the evaluator's fuzzy-match rule, and whose date is within 5 minutes of device time, and the foreground package is `com.simplemobiletools.smsmessenger`; if any UI element text starts with `Sending`, the evaluator raises instead of scoring.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::was_sent
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::_check_if_stuck_at_sending
  checked_by:
    text: Retained evaluator-visible sent-SMS records, retained evaluation-time timestamp/device-time evidence, and final activity/UI state.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.get_sent_messages
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.get_android_time
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::_check_if_stuck_at_sending
  decisive_artifacts:
  - artifact: Sent-SMS query output or equivalent SMS database dump
    question: Does it include address, body, and date fields for a sent row that can satisfy the evaluator's number/body match rule for the target SMS?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.get_sent_messages
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::was_sent
  - artifact: Evaluation-time timestamp or retained device-time reading
    question: Does it allow the reviewer to determine whether a candidate sent row is within the evaluator's 5-minute window?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.get_android_time
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::was_sent
  - artifact: Final activity/UI snapshot
    question: Is the foreground package `com.simplemobiletools.smsmessenger`, and does no visible UI text start with `Sending`?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::_check_if_stuck_at_sending
  success_if:
  - text: Sent-SMS evidence plus retained time evidence show at least one sent row whose address equals the target number after stripping spaces/dashes, whose body matches the target message under the evaluator's fuzzy-match rule, and whose date is within 5 minutes of evaluation time.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::was_sent
  - text: Final activity evidence shows foreground package `com.simplemobiletools.smsmessenger`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
  - text: Final UI evidence shows no element text beginning with `Sending`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::_check_if_stuck_at_sending
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
  fail_if:
  - text: Required sent-SMS and time evidence are present, no sent row satisfies the evaluator's address/body/time rule, and final UI evidence shows no text beginning with `Sending`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::was_sent
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::_check_if_stuck_at_sending
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
  - text: Required activity/UI evidence are present, the foreground package is not `com.simplemobiletools.smsmessenger`, and final UI evidence shows no text beginning with `Sending`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::_check_if_stuck_at_sending
  undecided_if:
  - text: Final UI evidence shows text beginning with `Sending`; the released evaluator would raise `ValueError` instead of returning success or failure.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::_check_if_stuck_at_sending
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
  - text: One or more decisive artifacts are missing or too incomplete to apply the sent-row match, 5-minute window, or foreground-package check.
    rationale: Without retained sent-SMS rows, timing evidence, and final activity/UI state, the evaluator-visible success conditions cannot be reconstructed.
stronger:
  additional_conditions:
  - id: exact_message_body
    text: Beyond native scoring, require the sent row body to equal the target message exactly; native scoring accepts fuzzy body matches.
    rationale: The task text specifies a particular message, but `was_sent` uses fuzzy matching on the SMS body.
    decisive_artifacts:
    - artifact: Sent-SMS query output or equivalent SMS database dump
      question: Does the matching sent row's body equal the target message exactly?
      support:
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/sms.py::SimpleSmsSend.template
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::was_sent
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/sms.py::SimpleSmsSend.template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::was_sent
  - id: sent_from_simple_sms_ui
    text: Beyond native scoring, require retained interaction evidence that the matching SMS was actually sent from Simple SMS Messenger UI; native scoring is otherwise app-agnostic about the send itself and only checks the sent-SMS store plus final foreground app.
    rationale: The task text requires using Simple SMS Messenger, while the validator explicitly uses an app-agnostic SMS-store check and only additionally verifies that Simple SMS Messenger is foreground at evaluation.
    decisive_artifacts:
    - artifact: Interaction trace, screen recording, or step screenshots
      question: Do they show the target number/message being sent from Simple SMS Messenger compose or conversation UI?
      support:
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/sms.py::SimpleSmsSend.template
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/sms.py::SimpleSmsSend.template
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/common_validators/sms_validators.py::SimpleSMSSendSms.is_successful

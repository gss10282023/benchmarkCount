schema_version: case_checklist_v1
case_unit_id: SystemBrightnessMinVerify
domain: androidworld
task_id: SystemBrightnessMinVerify
native:
  user_goal:
    text: Verify that screen brightness is already at minimum.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBrightnessMinVerify
    rationale: The verify variant's class docstring states this intent.
  benchmark_success:
    text: 'Native success is a single binary evaluator check: this task passes iff the released evaluator returns 1.0, which here means the post-run Android setting `screen_brightness` equals `1`.'
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBrightnessMinVerify.generate_random_params
  checked_by:
    text: Released task evaluator `_SystemBrightnessToggle.is_successful`, using an ADB settings query.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  decisive_artifacts:
  - artifact: Evaluator result record for this task
    question: Does retained official evaluator output mark this task successful or unsuccessful?
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  - artifact: Post-run device settings capture containing `screen_brightness`
    question: If recomputing from retained state, does post-run evidence show `settings get system screen_brightness` returned `1`?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBrightnessMinVerify.generate_random_params
  success_if:
  - text: A retained official evaluator result for this task records success.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  - text: Or, absent evaluator output, retained post-run state evidence clearly shows `screen_brightness == 1`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBrightnessMinVerify.generate_random_params
  fail_if:
  - text: A retained official evaluator result for this task records failure.
    support:
    - official/install/android_world/task_evals/task_eval.py::TaskEval.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
  - text: Or, absent evaluator output, retained post-run state evidence clearly shows `screen_brightness` is present and not `1`.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBrightnessMinVerify.generate_random_params
  undecided_if:
  - text: Neither a reliable evaluator result nor a reliable post-run `screen_brightness` value is retained.
    rationale: Without either decisive artifact, the native end-state rule cannot be applied from stored evidence.
stronger:
  additional_conditions:
  - id: verify-no-brightness-change
    text: For the verify variant, retained interaction trace or screen recording shows brightness was not changed during the run; native scoring would still accept any run that ends with `screen_brightness == 1`.
    rationale: The class says this task verifies brightness is already at minimum, and initialization sets brightness to minimum before the run, but the released evaluator checks only the final brightness value.
    decisive_artifacts:
    - artifact: Interaction trace or screen recording
      question: Does retained run evidence show no brightness adjustment was performed during the run?
      support:
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBrightnessMinVerify
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBrightnessMinVerify.initialize_task
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBrightnessMinVerify
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::SystemBrightnessMinVerify.initialize_task
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/system.py::_SystemBrightnessToggle.is_successful

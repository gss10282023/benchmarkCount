schema_version: case_checklist_v1
case_unit_id: RecipeAddSingleRecipe
domain: androidworld
task_id: RecipeAddSingleRecipe
native:
  user_goal:
    text: Add the provided single recipe into the Broccoli app.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.goal
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeAddSingleRecipe
  benchmark_success:
    text: 'Native success is when `RecipeAddSingleRecipe` passes its Broccoli SQLite add-row check: relative to the pre-run `recipes` table, the post-run table satisfies the official addition-integrity check for one reference recipe.'
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeAddSingleRecipe
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
  checked_by:
    text: The released task-specific evaluator, using the Broccoli SQLite `recipes` table before/after the run and the reference recipe.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeAddSingleRecipe
  decisive_artifacts:
  - artifact: Task record or prompt containing the single reference recipe
    question: What recipe was the run supposed to add?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.goal
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_get_rows_as_text
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeAddSingleRecipe
  - artifact: Retained pre/post snapshot of the Broccoli SQLite `recipes` table, or an equivalent diff
    question: Relative to pre-run state, does the post-run table satisfy the official add-row integrity check for that one recipe?
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeAddSingleRecipe
  success_if:
  - text: The retained task record specifies one target recipe, and the retained pre/post Broccoli `recipes` table state satisfies the task's official addition-integrity check for that single reference row.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeAddSingleRecipe
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
  fail_if:
  - text: Given the retained target recipe and pre/post Broccoli `recipes` table state, the official addition-integrity check for the single reference recipe does not pass.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::RecipeAddSingleRecipe
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
  undecided_if:
  - text: The run is undecided if the retained evidence lacks either the reference recipe or comparable pre/post Broccoli `recipes` table state needed to replay the official DB-based check.
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.goal
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    rationale: Native success depends on comparing the intended recipe against before/after SQLite table state.
stronger:
  additional_conditions:
  - id: broccoli_ui_entry_evidence
    text: Beyond native DB-state success, retained UI evidence shows the recipe was added through the Broccoli app UI; the native evaluator only checks the SQLite `recipes` end state.
    rationale: The task goal is framed as adding the recipe into the Broccoli app, while the released evaluator logic in this packet is database-state based.
    decisive_artifacts:
    - artifact: Retained screen recording, screenshots, or interaction log
      question: Does the retained UI evidence show recipe creation/saving in Broccoli rather than out-of-app mutation of Broccoli data?
      support:
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.goal
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp
      - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity
    support:
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.goal
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeApp
    - official/install/.venv311/lib/python3.11/site-packages/android_world/task_evals/single/recipe.py::_RecipeAddMultipleRecipes.validate_addition_integrity

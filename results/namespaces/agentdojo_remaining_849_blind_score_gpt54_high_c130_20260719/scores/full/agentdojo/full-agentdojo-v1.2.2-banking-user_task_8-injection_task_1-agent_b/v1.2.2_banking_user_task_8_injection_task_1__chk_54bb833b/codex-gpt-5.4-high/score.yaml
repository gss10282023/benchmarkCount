  pointers:
  - checklist.yaml::stronger.additional_conditions[0]
  - checklist.yaml::stronger.additional_conditions[1]
  - evidence/native_run/proxy_calls/0002.json::response_payload.choices[0].message.content
  - evidence/native_run/proxy_calls/0006.json::response_payload.choices[0].message.content
